<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="light"/>
<title>Muestreo Quest · Aprende muestreo jugando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Outfit:wght@300..900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   MUESTREO QUEST · Sistema de diseño «Eloise»
   Tinta cálida sobre papel crema · serifas editoriales · bordes
   dibujados · sombras desplazadas · pegatinas · micro-animaciones
   ═══════════════════════════════════════════════════════════════ */

:root{
  --paper:#FAF3E7; --paper-2:#F1E6D2;
  --card:#FFFDF7;
  --ink:#2E2417; --ink-2:#6F5F4B; --ink-3:#BCAB92;
  --terra:#DB7452; --terra-d:#AF5233; --terra-l:#F8DCCF;
  --sage:#7CAD8F;  --sage-d:#547F66;  --sage-l:#DEEDE2;
  --gold:#E2B25B;  --gold-d:#B4872D;  --gold-l:#FAECD0;
  --sky:#7AA6D8;   --sky-d:#4F7BB0;   --sky-l:#DFEBF8;
  --lav:#9A8AC4;   --lav-d:#6F5F9D;   --lav-l:#EAE4F6;
  --rose:#DA7E9C;  --rose-d:#AE5377;  --rose-l:#F8E0E9;
  --line:#E9DCC5; --line-2:#D6C5A8;
  --ok:#3F8A5F; --ok-l:#DCEDE1; --err:#C24B50; --err-l:#F7DDDD;
  --r-lg:22px; --r-md:14px; --r-sm:9px;
  --shadow-hard:5px 6px 0 rgba(46,36,23,.13);
  --shadow-soft:0 14px 34px rgba(46,36,23,.10);
  --f-disp:'Fraunces',Georgia,'Times New Roman',serif;
  --f-ui:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;
  /* acento dinámico por nivel */
  --acc:var(--terra); --accd:var(--terra-d); --accl:var(--terra-l);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--f-ui);
  color:var(--ink);
  background:
    radial-gradient(rgba(46,36,23,.055) 1.1px, transparent 1.1px) 0 0/24px 24px,
    var(--paper);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  line-height:1.55;
}
button{font-family:inherit;color:inherit}
img,svg{display:block}
::selection{background:var(--terra-l)}

/* ── Cabecera ─────────────────────────────────────────────── */
.topbar{
  max-width:1020px;margin:0 auto;padding:18px 20px 6px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.topbar.hidden{visibility:hidden;pointer-events:none;position:absolute}
.brand{
  font-family:var(--f-disp);font-size:1.35rem;font-weight:800;
  background:none;border:none;cursor:pointer;letter-spacing:.01em;
  display:flex;align-items:baseline;gap:.35em;
}
.brand em{font-style:italic;color:var(--terra-d);font-weight:600}
.brand:hover em{color:var(--terra)}
.top-right{display:flex;align-items:center;gap:10px}
.chip{
  display:inline-flex;align-items:center;gap:.45em;
  background:var(--card);border:2px solid var(--ink);border-radius:999px;
  padding:.34em .85em;font-weight:700;font-size:.88rem;
  box-shadow:0 3px 0 rgba(46,36,23,.16);
}
.chip .ic{width:16px;height:16px}
.stars-chip{color:var(--gold-d)}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  border:2px solid var(--ink);background:var(--card);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 rgba(46,36,23,.16);
  transition:transform .12s,box-shadow .12s;
}
.icon-btn:hover{transform:translateY(-1px)}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(46,36,23,.16)}
.icon-btn .ic{width:20px;height:20px}

/* ── Escenario ────────────────────────────────────────────── */
.stage{max-width:1020px;margin:0 auto;padding:10px 20px 70px;position:relative}
.screen{animation:screenIn .45s both}

/* ── Tipografía ───────────────────────────────────────────── */
h1,h2,h3{font-family:var(--f-disp);font-weight:700;line-height:1.12;letter-spacing:-.01em}
h2{font-size:clamp(1.7rem,4vw,2.3rem)}
h3{font-size:clamp(1.25rem,3vw,1.5rem)}
p{color:var(--ink-2)}
.kicker{
  display:inline-flex;align-items:center;gap:.45em;
  font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accd);
}
.kicker::before{content:'';width:18px;height:3px;border-radius:2px;background:var(--acc)}
.lead{font-size:1.08rem;max-width:46ch}
.wavy{text-decoration:underline wavy var(--acc) 2px;text-underline-offset:4px;font-weight:700;color:var(--ink)}
b,strong{color:var(--ink)}
.small{font-size:.85rem;color:var(--ink-3)}

/* ── Tarjetas ─────────────────────────────────────────────── */
.card{
  background:var(--card);border:2.5px solid var(--ink);border-radius:var(--r-lg);
  box-shadow:var(--shadow-hard);padding:1.35rem 1.5rem;position:relative;
}
.card + .card{margin-top:18px}
.card h3{margin:.25em 0 .45em}

/* ── Botones ──────────────────────────────────────────────── */
.btn{
  font-family:var(--f-ui);font-weight:700;font-size:.98rem;
  border:2.5px solid var(--ink);border-radius:999px;
  padding:.68em 1.45em;background:var(--card);color:var(--ink);
  cursor:pointer;box-shadow:0 4px 0 var(--ink);
  transition:transform .13s,box-shadow .13s,background .2s;
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--acc);color:#fff}
.btn.primary:hover{background:var(--accd)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.ghost{background:var(--card)}
.btn.xl{font-size:1.12rem;padding:.85em 2.1em}
.btn.sm{font-size:.84rem;padding:.5em 1.05em;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--ink)}
.btn .ic{width:18px;height:18px}

/* ── Pegatinas y etiquetas ────────────────────────────────── */
.sticker{
  display:inline-block;rotate:-2.5deg;
  background:var(--gold);border:2.5px solid var(--ink);border-radius:12px;
  padding:.22em .75em;font-weight:800;font-size:.8rem;letter-spacing:.04em;
  box-shadow:3px 3px 0 rgba(46,36,23,.18);
}
.sticker.terra{background:var(--terra);color:#fff}
.sticker.sage{background:var(--sage);color:#fff}
.sticker.sky{background:var(--sky);color:#fff}
.sticker.rose{background:var(--rose);color:#fff}
.sticker.lav{background:var(--lav);color:#fff}

/* ── Estrellas ────────────────────────────────────────────── */
.stars-row{display:inline-flex;gap:6px}
.star .ic{width:26px;height:26px;stroke:var(--ink);fill:var(--paper-2);stroke-width:1.6}
.star.on .ic{fill:var(--gold);animation:starPop .5s both;animation-delay:var(--d,0s)}
.star.mini .ic{width:13px;height:13px;stroke-width:2}

/* ── Iconos SVG ───────────────────────────────────────────── */
.ic{width:22px;height:22px;flex:none}
.ic path{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill path{fill:currentColor;stroke:none}

/* ── Búho Dato + burbuja ──────────────────────────────────── */
.owl{overflow:visible}
.owl .lid{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);animation:blink 5.2s infinite}
.owl-bob{transform-box:fill-box;transform-origin:center bottom;animation:bob 3.4s ease-in-out infinite}
.bubble{
  position:relative;background:var(--card);border:2.5px solid var(--ink);
  border-radius:16px;padding:.75em 1.05em;font-size:.95rem;color:var(--ink-2);
  box-shadow:3px 4px 0 rgba(46,36,23,.14);max-width:52ch;
  animation:popIn .45s .1s both;
}
.bubble::before{
  content:'';position:absolute;left:-9px;top:20px;width:13px;height:13px;
  background:var(--card);border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);
  transform:rotate(45deg);
}
.bubble b{color:var(--accd)}

/* ── Listas de resultado ──────────────────────────────────── */
.res-lines{list-style:none;margin-top:.6rem}
.res-lines li{
  display:flex;gap:.6em;align-items:baseline;padding:.42em 0;
  border-bottom:1.5px dashed var(--line);font-size:1.02rem;color:var(--ink-2);
}
.res-lines li:last-child{border-bottom:none}
.res-lines b{font-size:1.08em}
.takeaway ul{list-style:none;margin-top:.5rem}
.takeaway li{display:flex;gap:.65em;align-items:flex-start;padding:.4em 0;color:var(--ink-2)}
.takeaway li .ic{width:19px;height:19px;color:var(--sage-d);margin-top:.18em}

/* ── Controles: slider, stepper, opciones ─────────────────── */
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:12px;border-radius:99px;background:var(--paper-2);border:2px solid var(--ink);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:28px;height:28px;border-radius:50%;
  background:var(--acc);border:2.5px solid var(--ink);margin-top:-10px;
  box-shadow:0 3px 0 rgba(46,36,23,.3);
}
input[type=range]::-moz-range-track{height:12px;border-radius:99px;background:var(--paper-2);border:2px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--acc);border:2.5px solid var(--ink);box-shadow:0 3px 0 rgba(46,36,23,.3)}

.stepper{display:inline-flex;align-items:center;gap:.6em}
.stepper button{
  width:36px;height:36px;border-radius:50%;border:2.5px solid var(--ink);
  background:var(--card);font-size:1.25rem;font-weight:800;cursor:pointer;
  box-shadow:0 3px 0 var(--ink);transition:transform .1s,box-shadow .1s;
  display:flex;align-items:center;justify-content:center;
}
.stepper button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper .stv{font-family:var(--f-disp);font-size:1.5rem;font-weight:800;min-width:1.6em;text-align:center}

/* ── Modal / chuleta ──────────────────────────────────────── */
.modal{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(46,36,23,.45);padding:20px;backdrop-filter:blur(2px);
}
.modal.hidden{display:none}
.sheet{max-width:640px;width:100%;max-height:86vh;overflow:auto;animation:popIn .35s both}
.sheet .close{position:absolute;top:14px;right:14px;font-size:1rem}
.sheet h3{margin-bottom:.2em}
.sheet .sheet-item{padding:.65em 0;border-bottom:1.5px dashed var(--line)}
.sheet .sheet-item:last-child{border-bottom:none}
.sheet .sheet-item b{display:block}
.sheet .sheet-item span{font-size:.92rem;color:var(--ink-2)}

/* ── Lienzo de confeti ────────────────────────────────────── */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:99;pointer-events:none}

/* ── Animaciones base ─────────────────────────────────────── */
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.55)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes starPop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
@keyframes blink{0%,91%,100%{transform:scaleY(0)}94.5%{transform:scaleY(1)}}
@keyframes floatY{0%,100%{transform:translateY(0) rotate(var(--fr,0deg))}50%{transform:translateY(-14px) rotate(var(--fr,0deg))}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes pulseSoft{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes dashMove{to{stroke-dashoffset:-17}}
@keyframes dropIn{0%{opacity:0;transform:translateY(-18px) scale(.7)}70%{transform:translateY(3px) scale(1.05)}100%{opacity:1;transform:none}}
@keyframes crossDraw{to{stroke-dashoffset:0}}
@keyframes ringOut{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes sweepBar{from{width:0}}
@keyframes tagPop{0%{transform:scale(0) rotate(-14deg)}70%{transform:scale(1.2) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
@keyframes riseUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.rise{animation:fadeUp .55s both;animation-delay:calc(var(--i,0)*.1s)}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;transition-delay:0s !important}
}

/* ═══════════════ PANTALLA INICIAL ═══════════════ */
.splash{min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:30px;position:relative}
.splash-badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.splash-badges .sticker{animation:popIn .5s both;animation-delay:calc(var(--i)*.12s + .2s)}
.splash-title{font-size:clamp(3rem,9vw,5.4rem);line-height:.98;margin:.1em 0 .15em}
.splash-title .t1{display:block;animation:fadeUp .6s .15s both}
.splash-title .t2{
  display:block;font-style:italic;font-weight:600;color:var(--terra);
  animation:fadeUp .6s .3s both;
}
.splash-title .t2 span{
  text-decoration:underline wavy var(--gold) 4px;text-underline-offset:10px;
}
.splash-owl{margin:26px 0 8px;position:relative}
.splash-owl .bubble{margin-top:14px;text-align:left}
.splash-sub{max-width:52ch;margin:10px auto 0;font-size:1.06rem}
.splash-cta{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap;justify-content:center}
.splash-foot{margin-top:34px;color:var(--ink-3);font-size:.85rem}
.float-icon{position:absolute;opacity:.5;animation:floatY 5s ease-in-out infinite;animation-delay:var(--fd,0s)}
.float-icon .ic{width:34px;height:34px;color:var(--ink-2)}

/* ═══════════════ MAPA DE LA QUEST ═══════════════ */
.map-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.map-head p{margin-top:.2em}
.map-cta{display:flex;gap:12px;flex-wrap:wrap}
.map-scroll{overflow-x:auto;padding:10px 4px 18px;-webkit-overflow-scrolling:touch}
.map-wrap{position:relative;min-width:660px;height:470px}
.map-path{position:absolute;inset:0;width:100%;height:100%}
.map-path .trail{
  fill:none;stroke:var(--line-2);stroke-width:5;stroke-linecap:round;stroke-dasharray:2 15;vector-effect:non-scaling-stroke;
  animation:dashMove 2.2s linear infinite;
}
.map-path .trail2{fill:none;stroke:transparent;stroke-width:26;pointer-events:none}
.node{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:none;border:none;cursor:pointer;width:150px;z-index:2;
}
.node .ndot{
  width:64px;height:64px;border-radius:50%;
  background:var(--card);border:3px solid var(--ink);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 0 rgba(46,36,23,.22);
  transition:transform .15s;position:relative;color:var(--nc,var(--terra-d));
}
.node .ndot .ic{width:30px;height:30px}
.node:hover .ndot{transform:scale(1.08) rotate(-3deg)}
.node.done .ndot{background:var(--nc,var(--terra));color:#fff}
.node .nlabel{
  font-weight:700;font-size:.86rem;line-height:1.2;background:var(--card);
  border:2px solid var(--ink);border-radius:10px;padding:.18em .55em;
  box-shadow:2px 2px 0 rgba(46,36,23,.15);max-width:150px;
}
.node .nstars{display:flex;gap:2px;height:14px}
.node.locked{cursor:not-allowed}
.node.locked .ndot{background:var(--paper-2);color:var(--ink-3);border-color:var(--ink-3);box-shadow:none}
.node.locked .nlabel{opacity:.55;border-color:var(--line-2);color:var(--ink-2)}
.node .nlock{
  position:absolute;top:-6px;right:-4px;width:26px;height:26px;border-radius:50%;
  background:var(--ink-2);color:var(--paper);border:2px solid var(--card);
  display:flex;align-items:center;justify-content:center;
}
.node .nlock .ic{width:13px;height:13px}
.node.next .ndot::after{
  content:'';position:absolute;inset:-9px;border-radius:50%;
  border:3px dashed var(--nc,var(--terra));animation:ringSpin 9s linear infinite;
}
@keyframes ringSpin{to{transform:rotate(360deg)}}
.node.flag .ndot{background:var(--gold);color:var(--ink)}
.node.flag.locked .ndot{filter:grayscale(1)}
.map-total{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px;flex-wrap:wrap}

/* ═══════════════ NIVEL: ARMAZÓN ═══════════════ */
.level[data-accent="terra"]{--acc:var(--terra);--accd:var(--terra-d);--accl:var(--terra-l)}
.level[data-accent="sky"]{--acc:var(--sky);--accd:var(--sky-d);--accl:var(--sky-l)}
.level[data-accent="sage"]{--acc:var(--sage);--accd:var(--sage-d);--accl:var(--sage-l)}
.level[data-accent="gold"]{--acc:var(--gold);--accd:var(--gold-d);--accl:var(--gold-l)}
.level[data-accent="rose"]{--acc:var(--rose);--accd:var(--rose-d);--accl:var(--rose-l)}
.level[data-accent="lav"]{--acc:var(--lav);--accd:var(--lav-d);--accl:var(--lav-l)}

.lv-head{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.lv-head .back{flex:none}
.lv-titles{flex:1;min-width:0}
.lv-titles h2{margin:.05em 0 0}
.lv-mascot{flex:none;transform:translateY(4px)}
.lv-body{display:flex;flex-direction:column;gap:18px}
.lv-cta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:4px}
.lv-cta .btn{margin-left:auto}
.challenge p{margin:.35em 0 .8em}
.challenge .tool-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:.7em 0}

/* historia */
.story{background:var(--accl);border-color:var(--ink)}
.story-quote{font-family:var(--f-disp);font-size:1.22rem;font-weight:500;font-style:italic;color:var(--ink);line-height:1.4}
.story-by{margin-top:.6em;font-weight:700;font-size:.9rem;color:var(--accd)}

/* figura animada */
.fig-card{overflow:hidden}
.fig{padding:6px 0}
.fig-cap{margin-top:.7rem;font-size:.9rem;color:var(--ink-2);border-top:1.5px dashed var(--line);padding-top:.65rem}
.replay{
  position:absolute;top:12px;right:12px;z-index:3;
}
.fig-row{display:flex;gap:18px;align-items:stretch;flex-wrap:wrap}
.fig-pop,.fig-sample{flex:1;min-width:220px}
.fig-label{font-size:.72rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.fig-label .pill{background:var(--ink);color:var(--paper);border-radius:99px;padding:.15em .6em;letter-spacing:.06em}
.fig-grid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;background:var(--paper);border:2px dashed var(--line-2);border-radius:12px;padding:10px}
.fig-grid.sm{grid-template-columns:repeat(5,1fr);gap:6px;padding:12px}
.fig-grid .dot{
  aspect-ratio:1;border-radius:50%;background:var(--ink-3);opacity:0;
  animation:popIn .3s both;animation-delay:var(--d);
}
.fig-grid .dot.sel{background:var(--terra);scale:1.25;box-shadow:0 0 0 2.5px var(--paper),0 0 0 4.5px var(--terra)}
.fig-grid.sm .dot{background:var(--terra);opacity:0}
.fig-arrow{align-self:center;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--terra-d);font-weight:800;font-size:.78rem}
.fig-arrow .ic{width:34px;height:34px;animation:shake 1.6s ease-in-out infinite}
.fig-census{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap}
.fig-census .cbox{flex:1;min-width:180px;border:2px solid var(--line-2);border-radius:12px;padding:10px 12px;background:var(--paper)}
.fig-census .cbox b{display:block;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.fig-census .cnum{font-family:var(--f-disp);font-size:1.7rem;font-weight:800}
.fig-census .cbar{height:10px;border-radius:99px;background:var(--paper-2);border:2px solid var(--ink);overflow:hidden;margin-top:6px}
.fig-census .cbar i{display:block;height:100%;background:var(--sage);animation:sweepBar 1.6s ease-out both}

/* definiciones */
.defs dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 22px;margin-top:.5rem}
.defs dt{font-weight:800;font-size:.98rem}
.defs dd{font-size:.92rem;color:var(--ink-2)}

/* ═══════════════ NIVEL 1 · PUEBLO ═══════════════ */
.vg-layout{display:flex;gap:18px;align-items:flex-start}
.vg-grid{
  flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(21px,1fr));gap:4.5px;
  background:var(--paper);border:2px dashed var(--line-2);border-radius:14px;padding:12px;
  user-select:none;
}
.villager{
  aspect-ratio:1;border-radius:50%;border:none;background:var(--ink-3);
  cursor:pointer;padding:0;transition:scale .12s,box-shadow .12s;
}
.villager:hover{scale:1.35}
.villager.sel{background:var(--terra);scale:1.3;box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--terra)}
.villager.measured{cursor:default}
.villager.measured:hover{scale:1}
.vg-side{width:225px;flex:none;display:flex;flex-direction:column;gap:10px}
.vg-count{font-weight:800}
.vg-count b{font-family:var(--f-disp);font-size:1.6rem;color:var(--terra-d)}
.vg-out{margin-top:4px}
.cmp{margin-top:12px}
.cmp-row{margin:9px 0}
.cmp-row .cmp-lab{display:flex;justify-content:space-between;font-size:.86rem;font-weight:700;margin-bottom:3px}
.cmp-scale{position:relative;height:18px;border-radius:99px;background:var(--paper-2);border:2px solid var(--ink);overflow:hidden}
.cmp-scale i{position:absolute;top:2px;bottom:2px;width:5px;border-radius:4px;transition:left .8s cubic-bezier(.2,.8,.2,1)}
.cmp-scale i.est{background:var(--terra)}
.cmp-scale i.real{background:var(--sage-d);width:7px}
.vg-legend{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.78rem;color:var(--ink-2)}
.vg-legend .lg{flex:1;height:10px;border-radius:99px;border:1.5px solid var(--ink);background:linear-gradient(90deg,#CFE0D2,#E9C46A,#DB7452)}
.inline-note{background:var(--gold-l);border:2px dashed var(--gold-d);border-radius:12px;padding:.7em .9em;font-size:.9rem;color:var(--ink);margin-top:10px;animation:riseUp .4s both}

/* ═══════════════ NIVEL 2 · LAGO ═══════════════ */
.pond-layout{display:flex;gap:18px;align-items:flex-start}
.pond{
  flex:1;min-height:360px;position:relative;border-radius:18px;overflow:hidden;
  border:3px solid var(--ink);
  background:linear-gradient(180deg,#D8E9F8 0%,#BBD9F0 55%,#A8CDEA 100%);
  user-select:none;
}
.pond .lily{position:absolute;border-radius:50%;background:#9CC49F;border:2px solid #6FA374;opacity:.85}
.pond .lily::after{content:'';position:absolute;inset:22%;border-radius:50%;background:#B7D6B1}
.fish{
  position:absolute;border:none;background:none;cursor:pointer;padding:0;
  transition:transform .15s;z-index:2;
  animation:fishDrift var(--fd,4s) ease-in-out infinite alternate;
}
.fish:hover{transform:scale(1.12)}
.fish svg{width:var(--w,50px);height:auto}
.fish.caught{animation:catchPop .5s both;pointer-events:none}
@keyframes catchPop{0%{transform:scale(1)}40%{transform:scale(1.5) rotate(12deg)}100%{transform:scale(0);opacity:0}}
.fish.flash .fbody{animation:pulseSoft .5s 3}
@keyframes fishDrift{from{translate:0 0;rotate:-2deg}to{translate:9px -7px;rotate:3deg}}
.net{
  position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px 0 0 -95px;
  z-index:3;pointer-events:none;animation:netDrop .8s ease-in both;
}
@keyframes netDrop{0%{transform:scale(1.9);opacity:0}35%{opacity:1}100%{transform:scale(.85);opacity:0}}
.bucket{width:230px;flex:none;display:flex;flex-direction:column;gap:9px}
.bucket-list{display:flex;flex-wrap:wrap;gap:6px;min-height:64px}
.bucket-list .fchip{
  display:inline-flex;align-items:center;gap:.35em;background:var(--sky-l);
  border:2px solid var(--ink);border-radius:9px;padding:.22em .55em;font-weight:800;
  font-size:.85rem;animation:dropIn .35s both;animation-delay:var(--d);
}
.bucket-list .fchip.azar{background:var(--sage-l)}
.bucket-stat{font-weight:800}
.bucket-stat b{font-family:var(--f-disp);font-size:1.45rem;color:var(--sky-d)}
.bucket-stat.net b{color:var(--sage-d)}

/* ═══════════════ NIVEL 3 · BOSQUE ═══════════════ */
.tr-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;
  background:var(--paper);border:2px dashed var(--line-2);border-radius:14px;padding:12px;user-select:none;
}
.tree{
  position:relative;border:none;background:none;cursor:default;padding:3px 0 16px;
  display:flex;align-items:flex-end;justify-content:center;color:var(--sage-d);
  transition:transform .15s;
}
.tree svg{height:var(--h,44px);width:auto}
.tree.hit{color:var(--terra-d);animation:treeBounce .5s}
.tree.hit svg{filter:drop-shadow(0 0 0 transparent)}
@keyframes treeBounce{0%{transform:scale(1)}40%{transform:scale(1.28) rotate(-4deg)}100%{transform:scale(1)}}
.tree .tag{
  position:absolute;bottom:-2px;left:50%;translate:-50% 0;transform:scale(0);
  background:var(--gold);border:2px solid var(--ink);border-radius:7px;
  font-size:.62rem;font-weight:800;padding:.05em .4em;white-space:nowrap;
}
.tree.hit .tag{animation:tagPop .35s .25s both}
.tree .idx{position:absolute;top:-3px;left:50%;transform:translateX(-50%);font-size:.58rem;color:var(--ink-3);font-weight:700}
.tr-ctl{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:.6em 0}
.tr-ctl .kbox{flex:1;min-width:210px}
.tr-ctl label{font-weight:700;font-size:.9rem;display:flex;justify-content:space-between}
.tr-ctl label b{font-family:var(--f-disp);font-size:1.15rem;color:var(--sage-d)}
.tr-info{display:flex;gap:8px;flex-wrap:wrap;margin:.4em 0 .2em}
.tr-est{margin-top:12px}

/* ═══════════════ NIVEL 4 · COLINAS ═══════════════ */
.strata-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:.6em 0}
.stratum{border:2.5px solid var(--ink);border-radius:16px;padding:12px;text-align:center;box-shadow:3px 4px 0 rgba(46,36,23,.12)}
.stratum .sname{font-weight:800;font-size:.95rem}
.stratum .sn{font-size:.78rem;color:var(--ink-2)}
.stratum .sflowers{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:52px;margin:8px 0 6px}
.stratum .sflowers i{width:7px;border-radius:4px 4px 0 0;background:var(--sc);border:1.5px solid var(--ink)}
.alloc{margin:.8em 0}
.alloc-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.alloc-row>span{width:88px;font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);flex:none}
.abar{flex:1;height:26px;border:2.5px solid var(--ink);border-radius:99px;background:var(--paper);display:flex;overflow:hidden}
.abar i{height:100%;transition:width .4s;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:800;color:#fff;overflow:hidden;white-space:nowrap}
.abar i.v{background:var(--sage)} .abar i.c{background:var(--gold)} .abar i.s2{background:var(--lav)}
.str-total{font-weight:800;margin-top:.5em}
.str-total b{font-family:var(--f-disp);font-size:1.3rem;color:var(--gold-d)}
.pool{display:flex;flex-wrap:wrap;gap:6px;min-height:56px;margin-top:.6em}
.pool .pchip{
  width:44px;text-align:center;font-size:.72rem;font-weight:800;color:#fff;
  border:2px solid var(--ink);border-radius:8px;padding:.28em 0;
  animation:dropIn .4s both;animation-delay:var(--d);
}
.pool .pchip.v{background:var(--sage)} .pool .pchip.c{background:var(--gold)} .pool .pchip.s2{background:var(--lav)}

/* ═══════════════ NIVEL 5 · ENCUESTAS ═══════════════ */
.scene-badge{
  position:absolute;top:-16px;left:18px;background:var(--card);border:2.5px solid var(--ink);
  border-radius:12px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;
  color:var(--rose-d);transform:rotate(-6deg);box-shadow:3px 3px 0 rgba(46,36,23,.16);
}
.scene-badge .ic{width:24px;height:24px}
.scene-fig{display:flex;justify-content:center;margin:.9em 0;padding:14px;background:var(--rose-l);border-radius:14px;border:2px dashed var(--rose)}
.scene-fig svg{max-width:330px;width:100%}
.scene-prog{display:flex;gap:7px;margin:.5em 0 .2em}
.scene-prog i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
.scene-prog i.on{background:var(--rose)}
.scene-prog i.ok{background:var(--sage)}
.opts{display:grid;gap:10px;margin-top:.9em}
.opt{
  text-align:left;border:2.5px solid var(--ink);border-radius:14px;background:var(--card);
  padding:.75em 1em;cursor:pointer;font-weight:700;font-size:.95rem;
  box-shadow:0 4px 0 rgba(46,36,23,.15);transition:transform .12s,box-shadow .12s,background .2s;
  display:flex;gap:.6em;align-items:center;
}
.opt:hover{transform:translateY(-2px)}
.opt .otag{
  flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-weight:800;
  background:var(--paper);
}
.opt.right{background:var(--ok-l);border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.right .otag{background:var(--sage);color:#fff;border-color:var(--ink)}
.opt.wrong{background:var(--err-l);border-color:var(--err);box-shadow:0 4px 0 var(--err)}
.opt:disabled{cursor:default;transform:none}
.scene-fb{margin-top:14px;animation:riseUp .4s both}
.scene-fb .fb-box{border-radius:14px;padding:.85em 1em;border:2.5px solid var(--ink)}
.scene-fb .fb-box.good{background:var(--ok-l)}
.scene-fb .fb-box.bad{background:var(--err-l)}
.scene-fb .fb-box b{display:block;margin-bottom:.15em}
.scene-fb .fb-box span{font-size:.92rem;color:var(--ink-2)}
.scene-points{margin-left:auto}

/* ═══════════════ NIVEL 6 · PRECISIÓN ═══════════════ */
.lab-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.chips{display:flex;gap:7px}
.chipbtn{
  border:2px solid var(--ink);background:var(--card);border-radius:99px;padding:.35em .95em;
  font-weight:800;font-size:.85rem;cursor:pointer;box-shadow:0 3px 0 rgba(46,36,23,.15);
  transition:transform .1s;
}
.chipbtn:active{transform:translateY(2px)}
.chipbtn.on{background:var(--lav);color:#fff}
.lab canvas{width:100%;height:auto;border:2.5px solid var(--ink);border-radius:14px;background:#FFFDF7}
.lab-cap{margin-top:.6rem;font-size:.9rem;color:var(--ink-2);min-height:2.6em}
.lab-read{display:flex;gap:16px;flex-wrap:wrap;margin:.4em 0 .6em;font-weight:700}
.lab-read .rd{background:var(--paper);border:2px dashed var(--line-2);border-radius:12px;padding:.5em .9em;flex:1;min-width:150px}
.lab-read .rd b{font-family:var(--f-disp);font-size:1.35rem;color:var(--lav-d);display:block}
.lab-read .rd.warn b{color:var(--err)}
.lab-read .rd.okk b{color:var(--ok)}
.nl{width:100%;max-width:520px;display:block;margin:10px auto 0}
.nl .band{transform-box:fill-box;transform-origin:center;animation:popIn .5s .3s both}
.nl .estmark{transform-box:fill-box;transform-origin:center;animation:dropIn .5s .15s both}
.measure-bar{height:16px;border-radius:99px;border:2px solid var(--ink);background:var(--paper);overflow:hidden;margin:.6em 0}
.measure-bar i{display:block;height:100%;background:var(--lav);transition:width .12s}

/* ═══════════════ RESULTADO Y TAKEAWAY ═══════════════ */
.result{text-align:center;background:var(--accl)}
.score-line{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:.5rem}
.score-big{font-family:var(--f-disp);font-size:2.6rem;font-weight:800;line-height:1}
.score-big small{font-size:1.1rem;color:var(--ink-2)}
.result .res-lines{text-align:left}
.champion{font-size:1.05rem;margin-top:.4em}

/* ═══════════════ DIPLOMA ═══════════════ */
.diploma{
  text-align:center;border-width:3px;position:relative;overflow:hidden;
  background:
    radial-gradient(rgba(46,36,23,.05) 1.1px, transparent 1.1px) 0 0/22px 22px,
    var(--card);
}
.diploma::before{
  content:'';position:absolute;inset:9px;border:2px dashed var(--ink-3);
  border-radius:16px;pointer-events:none;
}
.diploma .d-kicker{margin-top:8px}
.diploma h2{font-size:clamp(2rem,5vw,2.9rem);font-style:italic;font-weight:600;margin:.05em 0}
.diploma .d-for{font-size:.95rem;color:var(--ink-2)}
.diploma .d-rank{margin:16px 0 4px}
.diploma .d-rank .sticker{font-size:1.05rem;padding:.4em 1em}
.diploma .d-date{margin-top:12px;font-size:.85rem;color:var(--ink-3)}
.d-stars{display:flex;justify-content:center;gap:10px;margin:14px 0 4px}
.d-stars .star .ic{width:34px;height:34px}
.recap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-top:.6em}
.recap{border:2px solid var(--ink);border-radius:14px;padding:.8em .9em;background:var(--paper);text-align:left}
.recap .rc-head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;margin-bottom:.2em}
.recap .rc-head .ic{width:19px;height:19px}
.recap span{font-size:.82rem;color:var(--ink-2);display:block}
.finale-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.diploma-owl{display:flex;justify-content:center;margin-bottom:4px}

/* ═══════════════ RESPONSIVE ═══════════════ */
@media (max-width:860px){
  .vg-layout,.pond-layout{flex-direction:column;align-items:stretch}
  .vg-side,.bucket{width:100%}
  .strata-row{grid-template-columns:1fr}
  .fig-row{flex-direction:column}
  .fig-arrow{transform:rotate(90deg)}
  .lv-cta .btn{margin-left:0}
}
@media (max-width:560px){
  .stage{padding:6px 12px 60px}
  .topbar{padding:14px 12px 4px}
  .vg-grid{grid-template-columns:repeat(auto-fill,minmax(15px,1fr));gap:3.5px;padding:8px}
  .tr-grid{grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
  .tree .idx{display:none}
  .float-icon{display:none}
  .node{width:110px}
  .node .nlabel{font-size:.72rem}
  .map-wrap{min-width:560px;height:430px}
}

/* ═══════════════ ANIMACIÓN: BOMBO DE SORTEO (N2) ═══════════════ */
.lottery{display:flex;gap:36px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px 0}
.drum{
  width:172px;height:156px;border:3px solid var(--ink);border-radius:26px;
  background:linear-gradient(180deg,#DFEBF8,#BCD8EF);
  position:relative;box-shadow:var(--shadow-hard);
  animation:drumShake 2.4s ease-in-out infinite;
}
@keyframes drumShake{
  0%,100%{transform:rotate(0)}
  15%{transform:rotate(2.6deg)}30%{transform:rotate(-2.6deg)}
  45%{transform:rotate(1.8deg)}60%{transform:rotate(-1.8deg)}
  75%{transform:rotate(1deg)}
}
.ball{
  position:absolute;width:30px;height:30px;border-radius:50%;
  background:var(--card);border:2.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.8rem;
  transition:transform .55s cubic-bezier(.3,1.5,.4,1),opacity .45s;
}
.ball.out{transform:translate(var(--tx,0px),var(--ty,-140px)) scale(.5);opacity:0}
.tray{display:grid;grid-template-columns:repeat(4,42px);gap:9px}
.tray .slot{
  width:42px;height:42px;border:2.5px dashed var(--ink-3);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink-2);
}
.tray .slot.fill{border-style:solid;border-color:var(--ink);background:var(--gold-l);color:var(--ink);animation:popIn .4s both}

/* ═══════════════ ANIMACIÓN: PASEO SISTEMÁTICO (N3) ═══════════════ */
.walk{position:relative;overflow-x:auto;padding:26px 4px 8px}
.walk-row{display:flex;gap:8px;min-width:600px;align-items:flex-end;position:relative}
.walk-tree{flex:1;color:var(--sage-d);position:relative;text-align:center;transition:color .2s}
.walk-tree svg{height:36px;width:auto;margin:0 auto;transition:transform .25s}
.walk-tree .wtick{
  position:absolute;top:-20px;left:50%;transform:translateX(-50%) scale(0);
  width:16px;height:16px;border-radius:50%;
  background:var(--terra);border:2.5px solid var(--ink);
  transition:transform .3s cubic-bezier(.3,1.6,.4,1);
}
.walk-tree.tagged{color:var(--terra-d)}
.walk-tree.tagged svg{transform:scale(1.32)}
.walk-tree.tagged .wtick{transform:translateX(-50%) scale(1)}
.walker{
  position:absolute;top:-17px;margin-left:-11px;width:22px;height:22px;border-radius:50%;
  background:var(--gold);border:2.5px solid var(--ink);z-index:2;
  transition:left .28s;box-shadow:0 2px 0 rgba(46,36,23,.25);
}
.walker::after{content:'';position:absolute;top:-9px;left:4px;width:12px;height:5px;background:var(--ink);border-radius:2px}

/* ═══════════════ ANIMACIÓN: VIÑETAS DE SESGO (N5) ═══════════════ */
.bias-fig{display:flex;justify-content:center}
.bias-fig svg{width:100%;max-width:360px}
.scene-fig svg text{font-family:'Outfit',sans-serif}
.scene-fig .vgx{
  fill:none;stroke:#C24B50;stroke-width:5;stroke-linecap:round;
  stroke-dasharray:80;stroke-dashoffset:80;animation:crossDraw .7s .5s both;
}
.vgring{animation:ringPulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ringPulse{0%,100%{opacity:.15}50%{opacity:1}}
.vgspin{transform-box:fill-box;transform-origin:center;animation:vgSpin 4s linear infinite}
@keyframes vgSpin{to{transform:rotate(360deg)}}
.vgtilt{transform-box:fill-box;transform-origin:center bottom;animation:wiggle 2.4s ease-in-out infinite}
.vgpop{transform-box:fill-box;transform-origin:center;animation:popIn .6s .4s both}
.vgdrop{transform-box:fill-box;transform-origin:center;animation:dropIn .8s .3s both}


/* ═══════════════ FORMULARIO ═══════════════ */
.fm-ctl{display:flex;flex-direction:column;gap:12px}
.fm-ctl input[type=search]{width:100%;font:inherit;font-weight:600;padding:.65em 1.1em;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink);outline:none}
.fm-ctl input[type=search]:focus{box-shadow:0 0 0 3px var(--lav-l),0 3px 0 var(--lav-d)}
.fm-chips{flex-wrap:wrap}
.fm-chips .chipbtn{padding:.3em .85em}
#fmList{display:flex;flex-direction:column;gap:18px;margin-top:18px}
#fmList .card + .card{margin-top:0}
.fm-row{display:grid;grid-template-columns:minmax(150px,.7fr) 2fr;gap:6px 18px;align-items:center;padding:.7em 0;border-bottom:1.5px dashed var(--line)}
.fm-row:last-child{border-bottom:none}
.fm-c{font-weight:700;font-size:.92rem;color:var(--ink)}
.fm-f{overflow-x:auto;overflow-y:hidden;padding:2px 0;color:var(--ink)}
.fm-f .katex{font-size:1.05em}
.fm-tips{list-style:none}
.fm-tips li{display:flex;gap:.65em;align-items:flex-start;padding:.45em 0;color:var(--ink-2)}
.fm-tips li .ic{width:19px;height:19px;color:var(--lav-d);margin-top:.18em}
.fm-sep{align-self:center;font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 2px 0 8px}
.fm-caphead{font-family:var(--f-disp);font-weight:700;font-size:1.15rem;color:var(--lav-d);margin:14px 2px -6px}
.fm-ex h3{display:flex;align-items:baseline;gap:.55em;font-size:1.08rem}
.fm-exn{flex:none;font-size:.78rem;font-weight:800;background:var(--lav);color:#fff;border:2px solid var(--ink);border-radius:9px;padding:.05em .55em}
.fm-eq{padding:.5em 0;border-bottom:1.5px dashed var(--line)}
.fm-eq:last-child{border-bottom:none}
.fm-also{display:block;font-size:.72rem;color:var(--ink-3);margin-top:1px}

/* ═══════════════════════════════════════════════════════════════

/* ── Utilidades ─────────────────────────────────────────────── */
const $  = (s, c = document) => c.querySelector(s);
const $$ = (s, c = document) => Array.from(c.querySelectorAll(s));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const rand  = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick  = a => a[Math.floor(Math.random() * a.length)];
const mean  = a => a.reduce((x, y) => x + y, 0) / a.length;
const esNum = (x, d = 1) => x.toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  return b;
}
function mulberry32(s) {
  return function () {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const gaussOf = r => {
  let u = 0, v = 0;
  while (u === 0) u = r();
  while (v === 0) v = r();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
};
const gauss = () => gaussOf(Math.random);
const mixHex = (c1, c2, t) => {
  const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const a = p(c1), b = p(c2);
  return `rgb(${Math.round(a[0] + (b[0] - a[0]) * t)},${Math.round(a[1] + (b[1] - a[1]) * t)},${Math.round(a[2] + (b[2] - a[2]) * t)})`;
};

/* ── Sonido (WebAudio, sin ficheros) ────────────────────────── */
const Snd = {
  ctx: null, on: true,
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f0, f1, dur, type = 'sine', vol = .14, delay = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .015);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + .05);
  },
  click() { this.tone(360, 240, .07, 'triangle', .09); },
  pop()   { this.tone(480, 760, .09, 'sine', .11); },
  tick()  { this.tone(880, 880, .035, 'square', .028); },
  ok()    { this.tone(523, 659, .1, 'sine', .12); this.tone(659, 880, .13, 'sine', .12, .09); },
  err()   { this.tone(220, 150, .2, 'sawtooth', .06); },
  win()   { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f, .17, 'sine', .12, i * .11)); }
};
document.addEventListener('pointerdown', () => Snd.ensure());

/* ── Confeti ────────────────────────────────────────────────── */
const FX = (() => {
  const cv = document.getElementById('fx');
  const cx = cv.getContext('2d');
  let parts = [], raf = null, W = 0, H = 0, last = 0;
  const COLS = ['#DB7452', '#7CAD8F', '#E2B25B', '#9A8AC4', '#DA7E9C', '#7AA6D8'];
  function size() {
    const d = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
  }
  size(); addEventListener('resize', size);
  function burst(n = 150) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (let i = 0; i < n; i++) {
      parts.push({
        x: rand(0, W), y: rand(-H * .25, -10),
        vx: rand(-.7, .7), vy: rand(1.4, 3.6), g: .045,
        rot: rand(0, Math.PI * 2), vr: rand(-.12, .12),
        w: rand(6, 12), h: rand(6, 12),
        c: pick(COLS), round: Math.random() < .35, life: rand(160, 260)
      });
    }
    if (!raf) raf = requestAnimationFrame(loop);
  }
  function loop(now) {
    const k = last ? Math.min((now - last) / 16.67, 3) : 1; last = now;
    cx.clearRect(0, 0, W, H);
    parts = parts.filter(p => p.life > 0 && p.y < H + 20);
    for (const p of parts) {
      p.x += p.vx * k; p.y += p.vy * k; p.vy += p.g * k; p.rot += p.vr * k; p.life -= k;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.globalAlpha = clamp(p.life / 60, 0, 1);
      cx.fillStyle = p.c;
      if (p.round) { cx.beginPath(); cx.arc(0, 0, p.w / 2, 0, 7); cx.fill(); }
      else cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * .62);
      cx.restore();
    }
    if (parts.length) raf = requestAnimationFrame(loop);
    else { raf = null; last = 0; cx.clearRect(0, 0, W, H); }
  }
  return { burst };
})();

/* ── Estado y persistencia ──────────────────────────────────── */
const SAVE_KEY = 'muestreo-quest-v1';
const S = (() => {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.stars) return s; } catch (e) { }
  return { stars: {}, sound: true, seen: {} };
})();
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { } }
function totalStars() { return Object.values(S.stars).reduce((a, b) => a + b, 0); }
function allDone() { return LEVELS.every(l => S.stars[l.id]); }

/* ── Router ─────────────────────────────────────────────────── */
const LEVELS = [];
const VIEWS = {};
let live = [];
function clearLive() { live.forEach(t => { clearTimeout(t); clearInterval(t); }); live = []; }
function after(ms, fn) { const t = setTimeout(fn, ms); live.push(t); return t; }
function every(ms, fn) { const t = setInterval(fn, ms); live.push(t); return t; }
function go(name, arg) {
  clearLive();
  const st = $('#stage');
  st.innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'instant' });
  VIEWS[name](arg);
}
function topbar(show) {
  $('#topbar').classList.toggle('hidden', !show);

}
function updateHeader() {
  $('#starsChip').innerHTML = `${icon('star', 'fill')} <span>${totalStars()}/18</span>`;
  $('#btnSound').innerHTML = icon(S.sound ? 'snd' : 'mute');

}

}
function miniStars(n) {
  let s = '';

}

/* ── Mapa de la quest ───────────────────────────────────────── */
const NODE_POS = [[9, 78], [26, 55], [43, 78], [59, 50], [75, 74], [87, 42]];
const FLAG_POS = [87, 13];
VIEWS.map = () => {
  topbar(true);
  let pathD = `M ${NODE_POS[0][0]} ${NODE_POS[0][1]}`;
  for (let i = 1; i < NODE_POS.length; i++) {
    const [x0, y0] = NODE_POS[i - 1], [x1, y1] = NODE_POS[i];
    pathD += ` C ${x0 + 8} ${y0}, ${x1 - 8} ${y1}, ${x1} ${y1}`;
  }
  pathD += ` L ${FLAG_POS[0]} ${FLAG_POS[1]}`;
  const nextId = LEVELS.find(l => !S.stars[l.id])?.id || null;
  let nodes = '';
  for (const L of LEVELS) {
    const [x, y] = NODE_POS[L.id - 1];
    const st = S.stars[L.id];
    const locked = L.id > 1 && !S.stars[L.id - 1];
    const state = locked ? 'locked' : (st ? 'done' : (L.id === nextId ? 'next' : 'open'));
    nodes += `
    <button class="node ${state}" style="left:${x}%;top:${y}%;--nc:var(--${L.color})" data-lv="${L.id}" aria-label="Nivel ${L.id}: ${L.name}">

function phaseResult(L, body, res) {
  const prev = S.stars[L.id] || 0;
  S.stars[L.id] = Math.max(prev, res.stars);
  save(); updateHeader();
  if (res.stars >= 2) { FX.burst(); Snd.win(); } else Snd.ok();

  body.innerHTML = `

      <button class="btn primary" data-next>${nextLabel} ${icon('arrow')}</button>
    </div>`;
  $('[data-retry]').onclick = () => { Snd.click(); clearLive(); L.play(body, r => phaseResult(L, body, r)); };
  $('[data-next]').onclick = () => {
    Snd.click();
    if (L.id < LEVELS.length) go('level', L.id + 1);

const POP1 = (() => { const r = mulberry32(7); const a = []; for (let i = 0; i < 200; i++) a.push(Math.round(clamp(165 + 12 * gaussOf(r), 128, 202))); return a; })();

    let dots = '';

/* ═══════════════ NIVEL 6 · LA TORRE DE LA PRECISIÓN ═══════════════ */
const MU6 = 165, SG6 = 10;
const MOE6 = n => 1.96 * SG6 / Math.sqrt(n);

function cltMachine(mount, { n = 25, auto = false } = {}) {
  let cn = n, running = false, bins, count, means, lastMean = null, finished = false;
  mount.innerHTML = `
    <div class="lab">
      <div class="lab-top">
        <span class="chips">
          ${[5, 25, 50].map(v => `<button class="chipbtn ${v === n ? 'on' : ''}" data-n="${v}">n = ${v}</button>`).join('')}
        </span>
        <button class="btn dark sm" data-run>${icon('dice')} Simular 200 muestras</button>
      </div>
      <canvas aria-label="Máquina de medias muestrales"></canvas>
      <div class="lab-cap" data-cap>Cada tirada toma una muestra y su <b>media</b> cae en el histograma de abajo.</div>
    </div>`;
  const cv = $('canvas', mount), cx = cv.getContext('2d');
  const W = 680, H = 400, dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr; cx.scale(dpr, dpr);
  const half = () => clamp(3.5 * SG6 / Math.sqrt(cn), 1.2, 16);
  const xTop = v => 34 + (v - 150) / 30 * (W - 68);
  const xBot = v => 34 + (v - (MU6 - half())) / (2 * half()) * (W - 68);
  function reset() {
    bins = new Array(30).fill(0); count = 0; means = []; lastMean = null; finished = false;
    draw();
  }
  function draw() {
    cx.clearRect(0, 0, W, H);
    /* población */
    const base = 168, amp = 118;
    cx.beginPath();
    for (let px = 34; px <= W - 34; px++) {
      const v = 150 + (px - 34) / (W - 68) * 30;
      const y = base - Math.exp(-((v - MU6) ** 2) / (2 * SG6 * SG6)) * amp;
      px === 34 ? cx.moveTo(px, y) : cx.lineTo(px, y);
    }
    cx.strokeStyle = '#547F66'; cx.lineWidth = 2.6; cx.stroke();
    cx.lineTo(W - 34, base); cx.lineTo(34, base); cx.closePath();
    cx.fillStyle = 'rgba(124,173,143,.16)'; cx.fill();
    cx.setLineDash([6, 5]); cx.strokeStyle = '#547F66'; cx.lineWidth = 1.6;
    cx.beginPath(); cx.moveTo(xTop(MU6), 34); cx.lineTo(xTop(MU6), base); cx.stroke(); cx.setLineDash([]);
    cx.fillStyle = '#547F66'; cx.font = '700 13px Outfit, sans-serif';
    cx.fillText('Población (alturas)', 40, 24);
    cx.textAlign = 'right'; cx.fillText('μ = 165 cm', W - 40, 24); cx.textAlign = 'left';
    /* flecha media -> histograma */
    if (lastMean != null) {
      const x = xBot(lastMean);
      cx.strokeStyle = 'rgba(111,95,157,.65)'; cx.lineWidth = 2;
      cx.beginPath(); cx.moveTo(xTop(clamp(lastMean, 151, 179)), base + 4); cx.lineTo(x, 246); cx.stroke();
      cx.beginPath(); cx.arc(x, 246, 4.5, 0, 7); cx.fillStyle = '#6F5F9D'; cx.fill();
    }
    /* separador */
    cx.strokeStyle = '#D6C5A8'; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(30, 236); cx.lineTo(W - 30, 236); cx.stroke();
    /* histograma */
    const hb = 380, hTop = 262, maxC = Math.max(...bins, 1);
    const bw = (W - 68) / 30;
    bins.forEach((c, i) => {
      if (!c) return;
      const h = c / maxC * (hb - hTop);
      const x = 34 + i * bw;
      cx.fillStyle = '#DB7452';
      cx.strokeStyle = '#2E2417'; cx.lineWidth = 1.6;
      cx.beginPath(); cx.roundRect(x + 1, hb - h, bw - 2, h, 3); cx.fill(); cx.stroke();
    });
    /* eje histograma */
    cx.beginPath(); cx.moveTo(30, hb + 3); cx.lineTo(W - 30, hb + 3); cx.strokeStyle = '#2E2417'; cx.lineWidth = 2; cx.stroke();
    cx.fillStyle = '#6F5F4B'; cx.font = '700 12px Outfit, sans-serif';
    cx.fillText('Medias de las muestras', 40, hb + 22);
    cx.textAlign = 'right';
    cx.fillText(`muestras: ${count}`, W - 40, hb + 22);
    if (count > 0) {
      cx.textAlign = 'center';
      cx.fillText(`media de medias: ${esNum(mean(means))}`, W / 2, hb + 22);
    }
    cx.textAlign = 'left';
    if (finished) {
      /* curva normal superpuesta */
      const sd = SG6 / Math.sqrt(cn), maxC2 = Math.max(...bins, 1);
      cx.beginPath();
      for (let px = 34; px <= W - 34; px++) {
        const v = MU6 - half() + (px - 34) / (W - 68) * 2 * half();
        const y = hb - Math.exp(-((v - MU6) ** 2) / (2 * sd * sd)) * (hb - hTop) * .92;
        px === 34 ? cx.moveTo(px, y) : cx.lineTo(px, y);
      }
      cx.strokeStyle = '#6F5F9D'; cx.lineWidth = 2.4; cx.setLineDash([7, 5]); cx.stroke(); cx.setLineDash([]);
      /* margen de error */
      const m = MOE6(cn), x1 = xBot(MU6 - m), x2 = xBot(MU6 + m);
      cx.strokeStyle = '#2E2417'; cx.lineWidth = 2;
      cx.beginPath(); cx.moveTo(x1, 250); cx.lineTo(x2, 250); cx.stroke();
      cx.beginPath(); cx.moveTo(x1, 244); cx.lineTo(x1, 256); cx.moveTo(x2, 244); cx.lineTo(x2, 256); cx.stroke();
      cx.fillStyle = '#2E2417'; cx.font = '800 12px Outfit, sans-serif'; cx.textAlign = 'center';
      cx.fillText(`95 % de las medias caen a ± ${esNum(m, 2)} cm de μ`, (x1 + x2) / 2, 240);
      cx.textAlign = 'left';
    }
  }
  function run() {
    if (running) return;
    reset(); running = true;
    let doneN = 0;
    const iv = every(16, () => {
      for (let k = 0; k < 3 && doneN < 200; k++, doneN++) {
        let s = 0;
        for (let i = 0; i < cn; i++) s += MU6 + SG6 * gauss();
        const m = s / cn;
        means.push(m); lastMean = m; count++;
        bins[clamp(Math.floor((m - (MU6 - half())) / (2 * half()) * 30), 0, 29)]++;
        if (doneN % 50 === 0) Snd.tick();
      }
      draw();
      if (doneN >= 200) {
        clearInterval(iv); running = false; finished = true;
        draw(); Snd.ok();
        const m = MOE6(cn);
        $('[data-cap]', mount).innerHTML =
          `Con <b>n = ${cn}</b>, el 95 % de las medias cae a <b>± ${esNum(m, 2)} cm</b> de μ. ` +
          (cn < 25 ? 'Prueba n = 50 y mira cómo se estrecha la puntería.' : 'Ese intervalo es exactamente el margen de error del estudio.');
      }
    });
  }
  $$('[data-n]', mount).forEach(b => b.onclick = () => {
    if (running) return;
    Snd.click();
    cn = +b.dataset.n;
    $$('[data-n]', mount).forEach(x => x.classList.toggle('on', x === b));
    reset();
    $('[data-cap]', mount).innerHTML = `Muestras de <b>n = ${cn}</b>. Pulsa «Simular 200 muestras» y observa la puntería.`;
  });
  $('[data-run]', mount).onclick = () => { Snd.click(); run(); };
  reset();
  if (auto) after(900, run);
}

  const lo = 156, hi = 174;
  const x = v => 16 + (v - lo) / (hi - lo) * 368;
  let ticks = '';
  for (let v = 158; v <= 172; v += 2)

function tex(s) {
  const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return s.split(/(\$[^$]+\$)/).map(p => {
    if (p.length > 2 && p[0] === '$' && p[p.length - 1] === '$') {
      const m = p.slice(1, -1);
      try { if (window.katex) return katex.renderToString(m, { throwOnError: false, trust: true, strict: false }); } catch (e) { }
      return `<code>${esc(m)}</code>`;
    }
    return esc(p);
  }).join('');
}

/* ═══ Motor de explicación paso a paso: monta la fórmula por colores (población → estimación → diseño → datos → operadores) ═══ */
const FX_CATS = {
  pop: ['Población', 'parámetros que se pretenden estimar'], est: ['Estimación', 'lo que se calcula con la muestra'],
  dis: ['Diseño', 'cómo se selecciona la muestra'], obs: ['Datos', 'unidades y valores observados'],
  op: ['Operadores', 'esperanza, varianza de muestreo, sesgo o probabilidad']
};
const FX_RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const plain = t => t.replace(/\\htmlClass\{[^{}]*\}/g, '');
const fxEsc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
let FX_REG = [], fxOpen = null;

function fxw(html, src, li, h) {
  const k = FX_REG.push({ h: h || '', l: (li || []).map(i => FM_G[i]) }) - 1;
  const btn = /htmlClass/.test(src) ? `<button class="fx-btn" data-k="${k}" title="Explicar paso a paso" aria-label="Explicar la fórmula paso a paso">${icon('play', 'fill')}</button>` : '';
  return `<div class="fm-fw"><div class="fm-f">${html}</div>${btn}</div>`;
}
function fxClose() {
  if (!fxOpen) return;
  clearInterval(fxOpen.t);
  fxOpen.host.classList.remove('fx-run', 'fx-done');
  $$('.fx-on,.fx-cur', fxOpen.host).forEach(e => e.classList.remove('fx-on', 'fx-cur'));
  fxOpen.panel.remove(); fxOpen.btn.classList.remove('on'); fxOpen = null;
}
function fxStart(btn, host, info) {
  fxClose();
  const cats = Object.keys(FX_CATS).filter(c => host.querySelector('.sem-' + c));
  const steps = cats.concat('all'), last = steps.length - 1;
  const panel = document.createElement('div');
  panel.className = 'fx-panel';
  panel.innerHTML = `<div class="fx-cap" aria-live="polite"></div><div class="fx-ctl"><button class="icon-btn fx-pp" aria-label="Pausar o reanudar"></button><span class="fx-dots">${steps.map((c, i) => `<button class="fx-dot${c === 'all' ? '' : ' sem-' + c}" data-i="${i}" aria-label="Paso ${i + 1}"></button>`).join('')}</span></div>`;
  btn.closest('.fm-fw').after(panel);
  btn.classList.add('on');
  const st = fxOpen = { host, panel, btn, t: null };
  let cur = 0, playing = false;
  const cap = $('.fx-cap', panel);
  const upd = () => { $('.fx-pp', panel).innerHTML = icon(playing ? 'pause' : cur === last ? 'refresh' : 'play', playing || cur === last ? '' : 'fill'); };
  function show(i) {
    cur = i; const c = steps[i], all = c === 'all';
    host.classList.add('fx-run'); host.classList.toggle('fx-done', all);
    cats.forEach((k, j) => $$('.sem-' + k, host).forEach(e => { e.classList.toggle('fx-on', all || j <= i); e.classList.toggle('fx-cur', !all && j === i); }));
    $$('.fx-dot', panel).forEach((d, j) => d.classList.toggle('on', j === i));
    if (all) cap.innerHTML = `<b>Fórmula completa.</b> ${info.h ? fxEsc(info.h) : 'Cada color es un papel distinto: población, estimación, diseño, datos y operadores.'}`;
    else {
      const L = info.l.filter(x => x[0] === c);
      cap.innerHTML = `<b class="fx-g sem-${c}">${FX_CATS[c][0]}</b> · <span>${FX_CATS[c][1]}</span>` +
        (L.length ? `<ul>${L.map(x => `<li><span class="fx-s sem-${c}">${tex('$' + x[1] + '$')}</span> ${fxEsc(x[2])}</li>`).join('')}</ul>` : '');
    }
    Snd.tick(); upd();
  }
  const pause = () => { clearInterval(st.t); playing = false; upd(); };
  const play = () => {
    clearInterval(st.t); playing = true; upd();
    st.t = every(2800, () => { if (!host.isConnected) return fxClose(); if (cur < last) show(cur + 1); else pause(); });
  };
  $('.fx-pp', panel).onclick = () => { Snd.click(); if (playing) pause(); else { if (cur === last) show(0); play(); } };
  $$('.fx-dot', panel).forEach(d => d.onclick = () => { pause(); show(+d.dataset.i); });
  show(0); if (!FX_RM) play();
}

VIEWS.formulario = () => {
  topbar(true);
  let sec = 'all', q = '';
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const caps = Object.keys(FM_CAPS);
  $('#stage').innerHTML = `
  <section class="screen level formu" data-accent="lav">
    <div class="lv-head">
      <button class="icon-btn back" data-back title="Volver al mapa" aria-label="Volver al mapa">${icon('back')}</button>
      <div class="lv-titles">
        <span class="kicker">Libro de ejercicios · INE</span>
        <h2>Formulario de muestreo</h2>
      </div>
      <div class="lv-mascot">${owlSVG(64)}</div>
    </div>
    <div class="card fm-ctl rise">
      <input type="search" id="fmQ" placeholder="Buscar: Horvitz, Neyman, deff, Midzuno, ejercicio 3.2…" aria-label="Buscar fórmula" autocomplete="off">
      <p class="small fm-hint">Pulsa ${icon('play', 'fill')} junto a una fórmula para verla montarse pieza a pieza, con cada símbolo explicado.</p>
      <div class="chips fm-chips" id="fmChips">
        <button class="chipbtn on" data-s="all">Todo</button>
        <span class="fm-sep">Anexo</span>
        ${FORMULARIO.map((g, i) => `<button class="chipbtn" data-s="a${i}" title="${g.t.replace(/\$/g, '').replace(/"/g, '')}">${g.t[0]}</button>`).join('')}
        <span class="fm-sep">Ejercicios</span>
        ${caps.map(c => `<button class="chipbtn" data-s="c${c}" title="${FM_CAPS[c]}">${c === 'II' ? 'Parte II' : 'Cap. ' + c}</button>`).join('')}
      </div>
    </div>
    <div id="fmList"></div>
    <p class="small fm-src">Fuentes: anexo «Chuleta de fórmulas de muestreo en poblaciones finitas» y fórmulas generales de los 99 ejercicios resueltos · J. L. Sánchez-Crespo y J. de Parada, INE 2007. Los cálculos con números concretos no se incluyen. Los bloques I y J son un complemento (teoría estándar de muestreo) que no figura en el anexo del libro.</p>
  </section>`;
  function fill() {
    fxClose(); FX_REG = [];
    let out = '';
    FORMULARIO.forEach((g, i) => {
      if (sec !== 'all' && sec !== 'a' + i) return;
      if (g.tips) {
        const t = g.tips.filter(x => !q || norm(x).includes(q));
        if (t.length) out += `<div class="card fm-sec"><h3>${tex(g.t)}</h3><ul class="fm-tips">${t.map(x => `<li>${icon('check')}<span>${tex(x)}</span></li>`).join('')}</ul></div>`;
        return;
      }
      const rows = g.rows.filter(r => !q || norm(r[0] + ' ' + plain(r[1])).includes(q));
      if (rows.length) out += `<div class="card fm-sec"><h3>${tex(g.t)}</h3>${rows.map(r =>
        `<div class="fm-row"><div class="fm-c">${tex(r[0])}</div>${fxw(tex(r[1]), r[1], r[2], r[3])}</div>`).join('')}</div>`;
    });
    let lastC = null;
    FM_EJ.forEach(e => {
      if (sec !== 'all' && sec !== 'c' + e.c) return;
      const hit = !q || norm(e.n + ' ' + e.t).includes(q);
      const fs = hit ? e.fs : e.fs.filter(f => norm(plain(f[0])).includes(q));
      if (!fs.length) return;
      if (e.c !== lastC) { lastC = e.c; out += `<div class="fm-caphead">${e.c === 'II' ? '' : 'Capítulo ' + e.c + ' · '}${FM_CAPS[e.c]}</div>`; }
      out += `<div class="card fm-sec fm-ex"><h3><span class="fm-exn">${esc(e.n)}</span> ${esc(e.t)}</h3>${fs.map(f =>
        `<div class="fm-eq">${fxw(tex('$' + f[0] + '$'), f[0], f[2])}${f[1] ? `<span class="fm-also">también en ${f[1]}</span>` : ''}</div>`).join('')}</div>`;
    });
    $('#fmList').innerHTML = out || '<p class="small" style="text-align:center">Ninguna fórmula coincide con la búsqueda.</p>';
  }
  fill();
  $('#fmList').onclick = e => {
    const b = e.target.closest('.fx-btn'); if (!b) return;
    Snd.click(); if (fxOpen && fxOpen.btn === b) return fxClose();
    fxStart(b, $('.fm-f', b.closest('.fm-fw')), FX_REG[+b.dataset.k]);
  };
  if (!window.katex) window.addEventListener('load', () => { if ($('#fmList')) fill(); }, { once: true });
  let tm = null;
  $('#fmQ').oninput = e => { clearTimeout(tm); const v = e.target.value; tm = setTimeout(() => { q = norm(v.trim()); fill(); }, 150); };
  $$('#fmChips .chipbtn').forEach(b => b.onclick = () => {
    Snd.click(); sec = b.dataset.s;
    $$('#fmChips .chipbtn').forEach(x => x.classList.toggle('on', x === b));
    fill(); window.scrollTo({ top: 0, behavior: 'instant' });
  });
  $('[data-back]').onclick = () => { Snd.click(); go('map'); };
};

];
const RECAP = [
  { ic: 'home', t: 'Población → muestra', d: 'De pocos, inferimos mucho (el censo es exacto pero carísimo).' },
  { ic: 'dice', t: 'El azar representa', d: 'El sorteo elimina favoritos: muestras fieles sin mirar nada.' },
  { ic: 'pine', t: 'Cada k-ésimo', d: 'Sistemático: cómodo y regular, con inicio aleatorio.' },
  { ic: 'mount', t: 'Estratos proporcionales', d: 'Cada grupo pesa en la muestra lo que pesa en la población.' },
  { ic: 'mega', t: 'Caza los sesgos', d: 'Selección, no respuesta, pregunta inducida, autoselección, supervivencia.' },
  { ic: 'target', t: 'Error ≈ 1,96·σ/√n', d: 'Cuadruplica la muestra para reducir el error a la mitad.' },
];

VIEWS.finale = () => {
  topbar(true);
  const t = totalStars();
  const rank = RANKS.find(r => t >= r.min);
  const date = new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
  $('#stage').innerHTML = `
  <section class="screen finale">
    <div class="card diploma rise">
      <span class="kicker d-kicker">Estadistilandia certifica</span>
      <h2>Diploma del Muestreo</h2>
      <p class="d-for">Otorgado a quien completó la Quest de los seis territorios</p>
      <div class="diploma-owl">${owlSVG(96, true)}</div>
      <div class="d-rank"><span class="sticker terra">${rank.lab}</span></div>
      <p class="d-for">${rank.msg}</p>
      <div class="d-stars">${starRow(t >= 15 ? 3 : t >= 10 ? 2 : 1)}</div>
      <div class="chip">${icon('star', 'fill')} ${t} / 18 estrellas</div>
      <p class="d-date">${date}</p>
    </div>
    <div class="card rise" style="--i:1">
      <span class="kicker">Lo que te llevas</span>
      <div class="recap-grid">
        ${RECAP.map(r => `<div class="recap"><div class="rc-head">${icon(r.ic)} ${r.t}</div><span>${r.d}</span></div>`).join('')}
      </div>
    </div>
    <div class="finale-cta rise" style="--i:2">
      <button class="btn ghost" id="fnMap">Volver al mapa</button>
      <button class="btn ghost" id="fnSheet">${icon('help')} Ver la chuleta</button>
      <button class="btn ghost" id="fnFormu">${icon('sigma')} Formulario</button>
      <button class="btn dark" id="fnReset">${icon('refresh')} Reiniciar aventura</button>
    </div>
  </section>`;
  FX.burst(230);
  Snd.win();
  $('#fnMap').onclick = () => { Snd.click(); go('map'); };
  $('#fnSheet').onclick = () => { Snd.click(); openCheats(); };
  $('#fnFormu').onclick = () => { Snd.click(); go('formulario'); };
  let armed = false;
  $('#fnReset').onclick = e => {
    if (!armed) {
      armed = true;
      e.currentTarget.innerHTML = `${icon('refresh')} ¿Seguro? Se borra el progreso`;
      Snd.click();
      after(3500, () => { if (armed) { armed = false; $('#fnReset').innerHTML = `${icon('refresh')} Reiniciar aventura`; } });
      return;
    }
    S.stars = {}; save(); updateHeader();
    Snd.pop();
    go('splash');
  };
};

/* ── Arranque ───────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  Snd.on = S.sound !== false;
  updateHeader();
  $('#brand').onclick = () => { Snd.click(); go(totalStars() > 0 ? 'map' : 'splash'); };
  $('#btnSound').onclick = () => {
    S.sound = !S.sound; Snd.on = S.sound; save();
    updateHeader();
    if (S.sound) { Snd.ensure(); Snd.pop(); }
  };
  $('#btnHelp').onclick = () => { Snd.click(); openCheats(); };
  $('#btnFormu').onclick = () => { Snd.click(); go('formulario'); };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeCheats();
  });
  go('splash');
});

</script>
</body>
</html>
