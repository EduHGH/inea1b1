const CD=[['Media en MAS','gram','s','ȳ = (1/n)·Σyᵢ, insesgada para Ȳ. Total: Ŷ = N·ȳ.','Si ȳ = 12 y N = 500, Ŷ = 6 000.'],['Varianza de ȳ en MAS','gram','a','Var(ȳ) = (1 − f)·S²/n, con f = n/N.','S² = 400, n = 100, f = 0,2 → 3,2.'],['Horvitz–Thompson','gram','s','Ŷ = Σ yᵢ/πᵢ. Insesgado si todo πᵢ > 0.','Peso de diseño = 1/πᵢ.'],['Afijación proporcional','voc','v','nₕ = n·Nₕ/N','n = 200 y Nₕ/N = 0,3 → nₕ = 60.'],['Afijación de Neyman','voc','v','nₕ = n·Nₕ·Sₕ / Σ(Nₖ·Sₖ)','Más muestra donde hay más tamaño y dispersión.'],['Efecto de diseño','prac','a','deff = Var(diseño) / Var(MAS)','Tamaño efectivo: n_ef = n/deff.'],['Estimador de razón','prac','d','Ȳ_R = (ȳ/x̄)·X̄. Sesgado, pero consistente.','Útil si y es casi proporcional a x.'],['Sistemático','ruta','v','k = N/n; arranque a entre 1 y k; muestra a, a+k, a+2k…','N = 600, n = 40 → k = 15.']];
const AC=[['Primer acierto','Acierta una pregunta.',()=>P.S.ok>=1],['Racha de 5','Encadena 5 aciertos.',()=>P.S.best>=5],['Racha de 10','Encadena 10 aciertos.',()=>P.S.best>=10],['Nivel III','Llega al nivel III.',()=>lvl()>=2],['Fórmulas al día','Guarda 5 fórmulas.',()=>Object.keys(P.sv).length>=5]];
const KB={vp:[['A–E','Elegir respuesta'],['Intro','Comprobar']],vc:[['←→','Cambiar tarjeta'],['Tab','Moverse']],vl:[['Tab','Moverse'],['Intro','Abrir']],vo:[['Tab','Moverse'],['Intro','Activar']]};
let G={q:[],i:0,hp:100,ok:0,st:0,h:null,done:0},c=0;

/* apariencia (como en RUTA, sin fuente pixel) */
const dk=()=>R.dataset.theme?R.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;
function ap(){if(P.t)R.dataset.theme=P.t;R.toggleAttribute('data-hc',!!P.hc);R.toggleAttribute('data-big',!!P.bg);
$('#th').setAttribute('aria-pressed',dk());$('#hc').setAttribute('aria-pressed',!!P.hc);$('#bg').setAttribute('aria-pressed',!!P.bg);$$('.sw').forEach(s=>s.setAttribute('aria-pressed',s.dataset.accent==(R.dataset.accent||'teja')));save()}
$('#th').onclick=()=>{P.t=dk()?'light':'dark';ap()};$('#hc').onclick=()=>{P.hc=!P.hc;ap()};$('#bg').onclick=()=>{P.bg=!P.bg;ap()};


$('#rs').onclick=function(){if(!this.dataset.s){this.dataset.s=1;this.classList.add('al');this.textContent='¿Seguro? Pulsa otra vez';return}Object.assign(P,{T:0,S:{ok:0,best:0,rt:0},sv:{},rv:{},lg:{},er:{}});save();this.dataset.s='';this.classList.remove('al');this.textContent='Borrar progreso';hud();ts('<h4>Progreso borrado</h4>Empiezas de cero.','in')};

/* estado, avisos y logros */
function hud(pp){const l=lvl(),x=l==5?100:P.T%100,h=$('#hp'),b=$('#xp');$('#lv').textContent='Nv. '+LV[l];h.style.setProperty('--w',G.hp+'%');h.dataset.s=G.hp>50?'h':G.hp>25?'m':'l';b.style.setProperty('--w',x+'%');h.setAttribute('aria-valuenow',G.hp);b.setAttribute('aria-valuenow',x);$('#hpn').textContent='Energía '+G.hp+'/100';$('#pp').textContent=pp||'XP '+x+'/100'}
function ts(h,k){const t=$('#tt'),d=document.createElement('div');d.className='ts '+(k||'');d.innerHTML=h;t.append(d);setTimeout(()=>d.remove(),5500);while(t.children.length>2)t.firstChild.remove()}
function addXp(n){const l=lvl();P.T+=n;if(lvl()>l)ts('<h4>¡Subes de nivel!</h4>Ahora estás en el nivel '+LV[lvl()]+'.','ok')}
function logros(){AC.forEach(a=>{if(!P.lg[a[0]]&&a[2]()){P.lg[a[0]]=1;ts('<h4>Logro conseguido</h4>'+a[0],'ok')}});save()}
function go(v,pp){['vp','vc','vl','vo'].forEach(x=>$('#'+x).hidden=x!=v);mn(0);if(v!='vp')window.speechSynthesis&&speechSynthesis.cancel();
$('#kb').innerHTML=KB[v].map(k=>'<span><kbd>'+k[0]+'</kbd>'+k[1]+'</span>').join('');hud(v=='vp'?'Ejercicio '+(G.i+1):pp);if(v=='vl')lgs();if(v=='vc')cw(0)}

/* menú desplegable */
const MI=[['ruta','Mezcla','ruta'],['gram','Diseños y estimadores','gram'],['voc','Clasificar y unir','voc'],['prac','Cálculo','prac'],['escu','Supuestos','escu'],0,['tarj','Fórmulas','vc'],['logr','Progreso','vl'],['opc','Opciones','vo']];
$('#mu').innerHTML=MI.map(m=>m?'<li><button data-m="'+m[2]+'" aria-current="'+(m[2]=='ruta')+'"><span><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+m[0]+'"/></svg>'+m[1]+'</span></button></li>':'<li role="separator"></li>').join('');
function mn(o){$('#mu').hidden=!o;$('#mn').setAttribute('aria-expanded',!!o);$('#mi').setAttribute('d',o?'M6 6l12 12M18 6L6 18':'M4 7h16M4 12h16M4 17h16');if(o)$('#mu button').focus()}
$('#mn').onclick=()=>mn($('#mu').hidden);
$('#mu').onclick=e=>{const b=e.target.closest('button');if(!b)return;const m=b.dataset.m;$$('#mu button').forEach(x=>x.setAttribute('aria-current',x==b));({vc:()=>go('vc'),vl:()=>go('vl'),vo:()=>go('vo')}[m]||(()=>m==G.md?go('vp'):start(m)))()};
$('#mu').onkeydown=e=>{const a=$$('#mu button'),k=a.indexOf(document.activeElement),d={ArrowDown:1,ArrowUp:-1}[e.key];if(d&&k>-1){e.preventDefault();a[(k+d+a.length)%a.length].focus()}};
document.onkeydown=e=>{if(e.key=='Escape'&&!$('#mu').hidden){mn(0);$('#mn').focus()}};
document.onclick=e=>{if(!$('#mu').hidden&&!e.target.closest('#mu,#mn'))mn(0)};

/* rondas */
const speak=t=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.9;speechSynthesis.speak(u)};
let tm;
function start(md){clearTimeout(tm);G={q:[],i:0,hp:100,ok:0,st:0,h:null,done:0,md};$('#hist').innerHTML='';go('vp');show()}
function adv(){const i=$('#in');i&&i.setAttribute('value',i.value);const h=$('#act').cloneNode(true),H=$('#hist');h.removeAttribute('id');h.dataset.s=G.l?'ok':'er';h.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));h.querySelectorAll('[aria-labelledby]').forEach(x=>x.removeAttribute('aria-labelledby'));H.append(h);while(H.children.length>30)H.firstChild.remove();if(!G.hp)G.hp=100;G.i++;show();$('#act').scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
const pk=r=>e=>{const b=e.target.closest('.op');if(!b)return;const ok=b.dataset.a==1;b.classList.add(ok?'ok':'no');if(!ok)$('#ops .op[data-a="1"]').classList.add('ok');fin(ok,r)};
function show(){if(G.i>=G.q.length)G.q=G.q.concat(shuf(G.md=='ruta'?Object.values(D).flat():D[G.md]));const it=G.q[G.i],[k,t,q,a,o,r,s]=it,ops=$('#ops'),Q=$('#q'),bl=x=>x.replace('___','<i class="bk" role="img" aria-label="hueco"></i>'),
au=s?(window.speechSynthesis?'<div class="fx"><button class="bt" id="sp">Escuchar</button></div>':'<div class="fx">«'+s+'»</div>'):'',
opt=(c,l,x,y)=>'<button class="op '+c+'" data-l="'+l+'" data-a="'+(y?1:0)+'">'+x+'</button>';
G.cur=it;G.done=0;G.h=null;$('#tag').textContent=k=='cl'?'CLASIFICAR':TN[t];$('#tag').className='tg '+(k=='cl'?'':t);$('#fb').textContent='';$('#fb').dataset.s='';ops.className=k=='mt'?'g2':'pl';
if(k=='mc'||k=='tf'){Q.innerHTML=bl(q)+au;ops.innerHTML=(k=='tf'?o:shuf(o)).map((x,j)=>opt('vsac'[j],'ABCD'[j],x,x==a)).join('');G.h=pk(r)}
else if(k=='cl'){Q.innerHTML='¿A qué bloque pertenece <b>'+q+'</b>?';ops.innerHTML=['v','s','a','d','c'].map((x,j)=>opt(x,'ABCDE'[j],cap(TN[x]),x==t)).join('');G.h=pk('«'+q+'» es '+NM[t]+'.')}
else if(k=='er'){Q.textContent='Toca la parte incorrecta.';ops.innerHTML='<div class="fx wide">'+q.split(' ').map(w=>'<button class="bt" data-w="'+w.replace(/[.,;!?¿¡]/g,'')+'">'+w+'</button>').join('')+'</div>';
G.h=e=>{const b=e.target.closest('.bt');if(!b)return;const ok=b.dataset.w==a;b.classList.add(ok?'ok':'no');if(!ok)$('#ops .bt[data-w="'+a+'"]').classList.add('ok');fin(ok,r)}}
else if(k=='ty'){Q.innerHTML=bl(q)+au;ops.innerHTML='<div class="fx wide"><input class="in" id="in" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Tu respuesta"><button class="bt" id="ck">Comprobar</button></div>';
G.h=e=>{if(e.target.id!='ck')return;const i=$('#in'),v=i.value.trim().toLowerCase();if(!v)return i.focus();i.readOnly=true;const nv=parseFloat(v.replace(',','.')),ok=a.includes(v)||(!isNaN(+a[0])&&!isNaN(nv)&&Math.abs(nv-+a[0])<=Math.abs(+a[0])*.005);fin(ok,r+(ok?'':' Respuesta: '+a[0]+'.'))}}
else if(k=='or'){const w=q.split(' '),pl=shuf(w.map((x,j)=>j));let B=[];
const ren=()=>{Q.innerHTML='Ordena la frase.<div class="fx" id="ans">'+B.map(j=>'<button class="bt on" data-j="'+j+'">'+w[j]+'</button>').join('')+'</div>';
ops.innerHTML='<div class="fx wide">'+pl.filter(j=>!B.includes(j)).map(j=>'<button class="bt" data-j="'+j+'">'+w[j]+'</button>').join('')+(B.length==w.length?'<button class="bt" id="ck">Comprobar</button>':'')+'</div>';const f=$('#ck')||$('#ops button');f&&f.focus()};
ren();G.h=e=>{const b=e.target.closest('.bt');if(!b)return;if(b.id=='ck'){const ok=B.map(j=>w[j]).join(' ')==q;return fin(ok,ok?'Frase perfecta.':'Era: «'+q+'».')}const j=+b.dataset.j;B=b.closest('#ans')?B.filter(x=>x!=j):[...B,j];ren()}}
else{const L=shuf(a.map((p,j)=>[p[0],j])),Rr=shuf(a.map((p,j)=>[p[1],j])),col=(arr,s,lab)=>'<ul class="ls" aria-label="'+lab+'">'+arr.map(x=>'<li><button data-s="'+s+'" data-j="'+x[1]+'">'+x[0]+'</button></li>').join('')+'</ul>';
let sel=null,left=a.length;G.mm=0;Q.textContent=q;ops.innerHTML=col(L,'l','Palabras')+col(Rr,'r','Significados');
G.h=e=>{const b=e.target.closest('button[data-s]');if(!b||b.dataset.done)return;if(!sel||sel.dataset.s==b.dataset.s){sel&&sel.removeAttribute('aria-current');sel=b;b.setAttribute('aria-current','true');return}
const ok=sel.dataset.j==b.dataset.j;sel.removeAttribute('aria-current');
if(ok){[sel,b].forEach(x=>{x.dataset.done=1;x.setAttribute('aria-disabled','true')});left--;$('#fb').textContent='¡Pareja!';$('#fb').dataset.s='ok'}else{G.mm++;$('#fb').textContent='Esa pareja no es. Prueba otra.';$('#fb').dataset.s='er'}
sel=null;if(!left)fin(G.mm<2,G.mm?'Con '+G.mm+' fallo(s).':'Sin ningún fallo.')}}
hud('Ejercicio '+(G.i+1));const f=$('#in')||$('#ops button');f&&f.focus({preventScroll:true})}
function fin(ok,msg){G.done=1;if(ok){try{P.er&&delete P.er[String(G.cur[2]).replace(/<[^>]+>/g,'')]}catch(e){}G.ok++;G.st++;P.S.ok++;P.S.best=Math.max(P.S.best,G.st);addXp(10)}else{G.st=0;G.hp=Math.max(0,G.hp-25);try{(P.er=P.er||{})[String(G.cur[2]).replace(/<[^>]+>/g,'')]=msg}catch(e){}}
$$('#ops button,#ops input').forEach(x=>x.setAttribute('aria-disabled','true'));$('#fb').textContent=(ok?'¡Correcto! ':'Casi. ')+msg;$('#fb').dataset.s=ok?'ok':'er';
G.l=ok;hud('Ejercicio '+(G.i+1));if(!G.hp)ts('<h4>Sin energía</h4>Descansas un momento y recuperas la energía.','er');else if(G.hp<=25)ts('<h4>Poca energía</h4>Un fallo más y tendrás que descansar.','al');logros();tm=setTimeout(adv,ok?900:1800)}
$('#sc').onclick=e=>{if(e.target.id=='sp'){speak(G.cur[6]);return}if(G.h&&!G.done&&e.target.closest('#act'))G.h(e)};
$('#sc').onkeydown=e=>{if(e.key=='Enter'&&e.target.id=='in'){$('#ck').click();return}
if($('#vp').hidden||G.done||e.target.tagName=='INPUT'||e.key.length!=1||e.ctrlKey||e.metaKey||e.altKey)return;const b=$$('#ops .op')['abcde'.indexOf(e.key.toLowerCase())];b&&b.click()};

/* tarjetas (carrusel) */
function cw(d){c=(c+d+CD.length)%CD.length;const w=CD[c],n=P.rv[w[0]]||0;$('#fl').setAttribute('aria-pressed','false');$('#tab').innerHTML=w[0]+'<span class="vh">, repasada '+n+' veces</span>';$('#orb').innerHTML='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+w[1]+'"/></svg><b>×'+n+'</b>';$('#cb').textContent='Pulsa «Ver fórmula» para girar la tarjeta.'}
$('#pv').onclick=()=>cw(-1);$('#nxw').onclick=()=>cw(1);$('#vc').onkeydown=e=>{if(e.key=='ArrowLeft')cw(-1);if(e.key=='ArrowRight')cw(1)};
$('#fl').onclick=function(){const w=CD[c],on=this.getAttribute('aria-pressed')!='true';this.setAttribute('aria-pressed',on);if(!on)return($('#cb').textContent='Pulsa «Ver fórmula» para girar la tarjeta.');
if(!P.rv[w[0]])ts('<h4>Fórmula nueva</h4><div class="row"><div><svg class="ic" width="34" height="34" aria-hidden="true"><use href="#i-'+w[1]+'"/></svg><span class="nu">NUEVO</span></div><div><b>'+w[0]+'</b> entra en tu ruta.</div></div>','in');
P.rv[w[0]]=(P.rv[w[0]]||0)+1;$('#cb').innerHTML='<span class="tg '+w[2]+'">'+TN[w[2]]+'</span><br>'+w[3]+'<br><i>'+w[4]+'</i>';$('#orb b').textContent='×'+P.rv[w[0]];save()};
$('#sv').onclick=()=>{const w=CD[c];if(P.sv[w[0]])return ts('<h4>Ya la tienes</h4><b>'+w[0]+'</b> ya está en tu cuaderno.','in');P.sv[w[0]]=w[2];addXp(5);ts('<h4>Guardada</h4>Has guardado «'+w[0]+'» en el cuaderno de <span class="pk">'+CN[w[2]]+'</span>.','ok');hud();logros()};

/* logros y cuaderno (lista) */
const erH=()=>{const E=Object.entries(P.er||{});return '<div class="ts al"><h4>Cuaderno de errores ('+E.length+')</h4>'+(E.length?E.slice(-6).map(([k,v])=>k+'<br><small>'+v+'</small>').join('<hr>'):'Sin errores pendientes.')+'</div>'};
function lgs(){$('#ls').innerHTML=Object.keys(CN).map(k=>'<li><button data-k="'+k+'"><span>'+CN[k]+'</span><span><span class="vh">palabras: </span>'+Object.values(P.sv).filter(x=>x==k).length+'</span></button></li>').join('');
$('#lg').innerHTML='<div class="ts"><h4>Tu ruta</h4>'+P.S.ok+' aciertos, mejor racha de '+P.S.best+' y '+P.T+' XP.</div>'+erH()+AC.map(a=>'<div class="ts"><h4>'+a[0]+'</h4>'+(P.lg[a[0]]?'Conseguido.':'Pendiente: '+a[1])+'</div>').join('')}
$('#ls').onclick=e=>{const b=e.target.closest('button');if(!b)return;$$('#ls button').forEach(x=>x.setAttribute('aria-current',x==b));const w=Object.keys(P.sv).filter(x=>P.sv[x]==b.dataset.k);ts('<h4>'+CN[b.dataset.k]+'</h4>'+(w.length?w.join(', '):'Todavía no has guardado fórmulas. Hazlo desde Fórmulas.'),'in')};

ap();start('ruta');
</script></body></html>
