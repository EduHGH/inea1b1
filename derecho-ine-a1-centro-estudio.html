<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERECHO · INE A1 — Centro de Estudio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

:root{
  --paper:#F4EFE4; --paper2:#EAE3D2;
  --ink:#241F17; --ink2:#6b6252; --ink3:#948a76;
  --line:#dcd4c2; --line2:#cfc5ae;
  --der:#2E5266; --der-deep:#1F3A49; --der-soft:#DCE6EB; --der-glow:rgba(46,82,102,.16);
  --acc:#E88357; --acc-deep:#C96A3B; --acc-soft:#F6D9C4; --acc-ink:#4A2410;
  --hot:#8B3A3A; --hot-soft:#F3DEDE;
  --warm:#966A24; --warm-soft:#F1E4CB;
  --cold:#3E6B4F; --cold-soft:#DEEBE2;
  --ok:#3E6B4F; --ok-soft:#DEEBE2;
  --bad:#8B3A3A; --bad-soft:#F3DEDE;
  --glass:rgba(255,255,255,.58);
  --glass2:rgba(255,255,255,.42);
  --rad:14px;
  --shadow:0 1px 0 rgba(255,255,255,.55) inset, 0 10px 26px -20px rgba(36,31,23,.35);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:
    radial-gradient(circle at 1px 1px, rgba(36,31,23,.06) 1px, transparent 0) 0 0/22px 22px,
    var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;
  font-size:14.5px; line-height:1.6;
  min-height:100vh;
}
::selection{background:var(--acc-soft);}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif; margin:0;}
button{font-family:inherit;}

/* ============ SHELL ============ */
#app{display:grid; grid-template-columns:272px 1fr; min-height:100vh;}
#sidebar{
  position:sticky; top:0; height:100vh; overflow-y:auto;
  background:var(--glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-right:1px solid var(--line);
  padding:22px 18px 28px; z-index:40;
  scrollbar-width:thin;
}
#main{padding:30px 40px 90px; min-width:0;}
.wrap{max-width:920px; margin:0 auto;}

/* ============ SIDEBAR ============ */
.brand{padding:4px 6px 18px; border-bottom:1px solid var(--line); margin-bottom:16px;}
.brand .b1{font-family:'Fraunces',serif; font-weight:900; font-size:25px; line-height:1; letter-spacing:-.01em;}
.brand .b1 span{color:var(--der);}
.brand .b2{font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink2); margin-top:6px;}
.nav{display:flex; flex-direction:column; gap:3px; margin-bottom:18px;}
.nav a{
  display:flex; align-items:center; gap:11px;
  padding:9px 12px; border-radius:10px;
  color:var(--ink); text-decoration:none; font-weight:500; font-size:13.5px;
  border:1px solid transparent; transition:all .15s ease;
}
.nav a:hover{background:var(--glass2); border-color:var(--line);}
.nav a.on{background:var(--der); color:#fff; border-color:var(--der-deep); box-shadow:0 6px 14px -8px var(--der-glow);}
.nav a .ic{width:17px; height:17px; flex:none; opacity:.9;}
.nav a .grow{flex:1;}
.navbadge{
  font-family:'Space Mono',monospace; font-size:10px; font-weight:700;
  background:var(--acc); color:var(--acc-ink);
  border-radius:100px; padding:1px 8px; min-width:22px; text-align:center;
}
.sb-h{
  font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink3); padding:10px 8px 6px;
}
.sb-topics{display:flex; flex-direction:column; gap:2px; margin-bottom:16px;}
.sb-topic{
  display:flex; align-items:center; gap:9px;
  padding:6px 10px; border-radius:8px; text-decoration:none; color:var(--ink);
  font-size:12px; transition:background .15s;
}
.sb-topic:hover{background:var(--glass2);}
.sb-topic .tnum{
  font-family:'Space Mono',monospace; font-size:10px; color:var(--ink2);
  width:18px; text-align:center; flex:none;
}
.sb-topic .tbar{flex:1; height:5px; background:rgba(36,31,23,.08); border-radius:3px; overflow:hidden;}
.sb-topic .tbar i{display:block; height:100%; background:var(--cold); border-radius:3px; transition:width .4s;}
.sb-topic .pdot{width:7px; height:7px; border-radius:50%; flex:none;}
.sb-foot{
  border-top:1px solid var(--line); padding-top:14px; margin-top:6px;
  display:flex; flex-direction:column; gap:8px;
}
.streakline{
  display:flex; align-items:center; gap:9px; padding:9px 12px; border-radius:10px;
  background:var(--glass2); border:1px solid var(--line);
  font-family:'Space Mono',monospace; font-size:11px; color:var(--ink2);
}
.streakline b{color:var(--ink); font-size:14px;}
.mini-btn{
  border:1px solid var(--line); background:var(--glass2); color:var(--ink2);
  font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.04em;
  padding:6px 10px; border-radius:8px; cursor:pointer; text-align:left;
}
.mini-btn:hover{color:var(--ink); border-color:var(--line2);}

/* ============ TOPBAR (móvil) ============ */
.topbar{
  display:none; position:sticky; top:0; z-index:50;
  background:var(--glass); backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
  padding:12px 16px; align-items:center; gap:12px;
}
.topbar .tg{
  border:1px solid var(--line); background:#fff8; border-radius:9px;
  width:38px; height:38px; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.topbar .tt{font-family:'Fraunces',serif; font-weight:700; font-size:16px;}
.backdrop{display:none; position:fixed; inset:0; background:rgba(36,31,23,.35); z-index:35;}

/* ============ GENERIC ============ */
.view{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
.vhead{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.vhead h1{font-size:27px; font-weight:700; letter-spacing:-.01em; line-height:1.12;}
.vhead .sub{color:var(--ink2); font-size:13px; max-width:64ch; margin-top:5px;}
.eyebrow{
  font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--der); margin-bottom:8px; display:flex; align-items:center; gap:8px;
}
.eyebrow::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--der);}

.panel{
  background:var(--glass); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line); border-radius:var(--rad); box-shadow:var(--shadow);
  padding:20px 22px; margin-bottom:16px;
}
.panel h3{font-size:16.5px; font-weight:700; margin-bottom:4px;}
.panel .ph-sub{color:var(--ink2); font-size:12.5px; margin:0 0 12px;}

.btn{
  display:inline-flex; align-items:center; gap:8px; border:none; cursor:pointer;
  background:var(--ink); color:var(--paper);
  font-weight:600; font-size:13.5px; padding:11px 18px; border-radius:100px;
  box-shadow:0 4px 12px -5px rgba(31,27,22,.4); transition:all .15s ease; text-decoration:none;
}
.btn:hover{background:var(--acc-deep); transform:translateY(-1px);}
.btn.der{background:var(--der);}
.btn.der:hover{background:var(--der-deep);}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line2); box-shadow:none;}
.btn.ghost:hover{border-color:var(--der); color:var(--der); background:#fff6;}
.btn.sm{padding:7px 14px; font-size:12px;}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}

.chip{
  display:inline-flex; align-items:center; gap:6px;
  font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:.03em;
  border:1px solid var(--line2); background:var(--glass2); color:var(--ink2);
  padding:5px 11px; border-radius:100px; cursor:pointer; user-select:none;
  transition:all .13s ease;
}
.chip:hover{border-color:var(--der);}
.chip.on{background:var(--der); border-color:var(--der-deep); color:#fff;}
.badge{
  display:inline-flex; align-items:center; gap:5px;
  font-family:'Space Mono',monospace; font-size:9px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase;
  padding:3px 9px; border-radius:100px; white-space:nowrap;
}
.badge.hot{background:var(--hot-soft); color:var(--hot);}
.badge.warm{background:var(--warm-soft); color:var(--warm);}
.badge.cold{background:var(--cold-soft); color:var(--cold);}
.badge.acc{background:var(--acc-soft); color:var(--acc-ink);}
.badge.der{background:var(--der-soft); color:var(--der);}

.bar{height:7px; background:rgba(36,31,23,.08); border-radius:4px; overflow:hidden;}
.bar i{display:block; height:100%; border-radius:4px; background:var(--cold); transition:width .5s ease;}
.bar.acc i{background:var(--acc);}
.bar.der i{background:var(--der);}

.ring{position:relative; display:inline-flex; align-items:center; justify-content:center;}
.ring svg{transform:rotate(-90deg);}
.ring .rv{
  position:absolute; font-family:'Fraunces',serif; font-weight:700; font-size:26px;
  line-height:1;
}
.ring .rv small{display:block; font-family:'Space Mono',monospace; font-size:8.5px; font-weight:400; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2); margin-top:3px; text-align:center;}

.mono{font-family:'Space Mono',monospace;}
.muted{color:var(--ink2);}

/* ============ DASHBOARD ============ */
.dash-grid{display:grid; grid-template-columns:300px 1fr; gap:16px; margin-bottom:16px;}
.hero-stats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; align-content:start;}
.stat{
  background:var(--glass); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; box-shadow:var(--shadow);
}
.stat .sl{font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2);}
.stat .sv{font-family:'Fraunces',serif; font-weight:700; font-size:23px; margin-top:3px; line-height:1.1;}
.stat .sv small{font-size:12px; color:var(--ink2); font-weight:400; font-family:'IBM Plex Sans',sans-serif;}
.stat .sx{font-size:10.5px; color:var(--ink3); margin-top:2px;}
.stat .sv .flame{color:var(--acc-deep);}

.prio-list{display:flex; flex-direction:column; gap:8px;}
.prio-item{
  display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--ink);
  background:var(--glass2); border:1px solid var(--line); border-radius:10px;
  padding:10px 14px; transition:all .15s;
}
.prio-item:hover{border-color:var(--der); transform:translateX(3px);}
.prio-item .pn{font-family:'Fraunces',serif; font-weight:700; font-size:16px; color:var(--der); width:26px; text-align:center; flex:none;}
.prio-item .pt{flex:1; min-width:0;}
.prio-item .pt b{display:block; font-size:13px; line-height:1.3;}
.prio-item .pt span{font-size:11px; color:var(--ink2);}
.prio-item .bar{width:90px; flex:none;}

.mini-bars{display:flex; align-items:flex-end; gap:3px; height:56px; margin-top:6px;}
.mini-bars i{
  flex:1; background:var(--der-soft); border-radius:3px 3px 0 0; min-height:2px; position:relative;
}
.mini-bars i.has{background:var(--der);}
.mini-bars i.today{background:var(--acc);}
.resume-box{
  background:linear-gradient(135deg,var(--der) 0%,var(--der-deep) 100%);
  border:none; color:#fff;
}
.resume-box h3{color:#fff;}
.resume-box .ph-sub{color:rgba(255,255,255,.75);}
.resume-box .btn{background:var(--paper); color:var(--ink); margin-top:4px;}
.resume-box .btn:hover{background:#fff;}
.resume-box .btn.ghost{background:rgba(255,255,255,.14); color:#fff; border-color:rgba(255,255,255,.55); box-shadow:none;}
.resume-box .btn.ghost:hover{background:#fff; color:var(--ink); border-color:#fff;}
.hint{
  border:1px dashed var(--line2); background:transparent; box-shadow:none;
  font-size:12.5px; color:var(--ink2); line-height:1.65;
}
.hint b{color:var(--ink);}

/* ============ TEMARIO ============ */
.searchbox{
  display:flex; align-items:center; gap:10px;
  background:var(--glass); border:1px solid var(--line); border-radius:100px;
  padding:10px 18px; margin-bottom:18px; box-shadow:var(--shadow);
}
.searchbox input{
  border:none; outline:none; background:transparent; flex:1;
  font-family:inherit; font-size:13.5px; color:var(--ink);
}
.searchbox .mono{font-size:10px; color:var(--ink3);}
.topic-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
.topiccard{
  display:flex; flex-direction:column; gap:10px;
  background:var(--glass); border:1px solid var(--line); border-radius:var(--rad);
  box-shadow:var(--shadow); padding:18px 18px 16px; text-decoration:none; color:var(--ink);
  transition:all .18s ease; position:relative; overflow:hidden;
}
.topiccard:hover{transform:translateY(-3px); border-color:var(--der);}
.topiccard .tc-top{display:flex; align-items:flex-start; gap:13px;}
.topiccard .tnum{
  font-family:'Fraunces',serif; font-weight:700; font-size:19px;
  width:42px; height:42px; border-radius:12px; flex:none;
  display:flex; align-items:center; justify-content:center;
}
.topiccard.p1 .tnum{background:var(--hot-soft); color:var(--hot);}
.topiccard.p2 .tnum{background:var(--warm-soft); color:var(--warm);}
.topiccard.p3 .tnum{background:var(--warm-soft); color:var(--warm);}
.topiccard.p4 .tnum{background:var(--cold-soft); color:var(--cold);}
.topiccard h3{font-size:15.5px; line-height:1.28; font-weight:600; flex:1;}
.topiccard .tc-desc{font-size:12px; color:var(--ink2); line-height:1.5; margin:0;}
.topiccard .tc-meta{
  display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:auto;
  padding-top:10px; border-top:1px dashed var(--line);
}
.topiccard .tc-meta .m{
  font-family:'Space Mono',monospace; font-size:9.5px; color:var(--ink2);
  background:var(--glass2); border:1px solid var(--line); border-radius:100px; padding:2px 9px;
}

/* ============ TEMA VIEW ============ */
.crumb{
  display:inline-flex; align-items:center; gap:7px; text-decoration:none;
  font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:.05em;
  color:var(--ink2); margin-bottom:14px;
}
.crumb:hover{color:var(--der);}
.tema-head{
  background:var(--glass); border:1px solid var(--line); border-radius:var(--rad);
  box-shadow:var(--shadow); padding:24px 26px; margin-bottom:16px;
}
.tema-head .th-top{display:flex; align-items:center; gap:14px; margin-bottom:6px;}
.tema-head .th-num{
  font-family:'Fraunces',serif; font-weight:900; font-size:26px;
  width:52px; height:52px; border-radius:14px;
  display:flex; align-items:center; justify-content:center; flex:none;
}
.tema-head.p1 .th-num{background:var(--hot-soft); color:var(--hot);}
.tema-head.p2 .th-num{background:var(--warm-soft); color:var(--warm);}
.tema-head.p3 .th-num{background:var(--warm-soft); color:var(--warm);}
.tema-head.p4 .th-num{background:var(--cold-soft); color:var(--cold);}
.tema-head h1{font-size:23px; line-height:1.15; flex:1;}
.tema-head .norma{font-family:'Space Mono',monospace; font-size:11px; color:var(--ink2); margin:4px 0 12px;}
.tema-head .th-desc{font-size:13px; color:var(--ink2); line-height:1.6; margin:0 0 14px;}
.tema-head .th-actions{display:flex; gap:10px; flex-wrap:wrap;}
.tprog{display:flex; align-items:center; gap:12px; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);}
.tprog .bar{flex:1;}
.tprog .mono{font-size:11px; color:var(--ink2);}

.examq-box{
  background:rgba(46,82,102,.07); border:1px solid rgba(46,82,102,.25); border-radius:var(--rad);
  padding:18px 20px; margin-bottom:16px;
}
.examq-box .eq-h{
  font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--der); font-weight:700; margin-bottom:10px; display:flex; gap:7px; align-items:center;
}
.examq{
  padding:9px 0; border-top:1px dashed rgba(46,82,102,.2); font-size:12.5px; line-height:1.55;
}
.examq:first-of-type{border-top:none;}
.examq .yr{
  display:inline-block; font-family:'Space Mono',monospace; font-size:9.5px; font-weight:700;
  color:var(--der); background:rgba(46,82,102,.12); border-radius:4px; padding:1px 7px; margin-right:8px;
}
.examq .why{display:block; color:var(--ink2); font-size:11.5px; margin-top:3px; padding-left:2px;}

.unit{
  background:var(--glass); border:1px solid var(--line); border-radius:var(--rad);
  box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden;
}
.unit-h{
  display:flex; align-items:center; gap:13px; padding:15px 20px; cursor:pointer; user-select:none;
}
.unit-h .u-idx{
  font-family:'Space Mono',monospace; font-size:10.5px; color:var(--ink2);
  background:var(--paper2); border-radius:7px; padding:3px 8px; flex:none;
}
.unit-h h4{flex:1; font-size:15px; font-weight:600; line-height:1.3;}
.unit-h .u-state{
  font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.06em; text-transform:uppercase;
  border-radius:100px; padding:3px 10px; flex:none;
}
.unit-h .u-state.read{background:var(--cold-soft); color:var(--cold);}
.unit-h .u-state.unread{background:var(--paper2); color:var(--ink3);}
.unit-h .chev{color:var(--ink3); transition:transform .2s; flex:none; font-size:11px;}
.unit.open .chev{transform:rotate(90deg);}
.unit-b{display:none; padding:4px 24px 20px; border-top:1px dashed var(--line);}
.unit.open .unit-b{display:block; animation:fadeIn .2s ease;}
.unit-b p{font-size:13.5px; line-height:1.65; margin:12px 0;}
.unit-b ul{margin:10px 0; padding-left:20px;}
.unit-b li{font-size:13px; line-height:1.6; margin-bottom:5px;}
.unit-b .mark-row{display:flex; gap:10px; align-items:center; margin-top:16px; padding-top:14px; border-top:1px dashed var(--line);}

.ucard{
  background:#FFFEFB; border:1px solid var(--line); border-radius:10px;
  padding:14px 18px; margin:12px 0;
}
.ucard .uhead{display:flex; flex-wrap:wrap; align-items:baseline; gap:9px; margin-bottom:8px;}
.anum{
  font-family:'Space Mono',monospace; font-weight:700; font-size:11.5px;
  color:var(--acc-ink); background:var(--acc-soft); padding:2px 9px; border-radius:5px; white-space:nowrap;
}
.arub{font-family:'Fraunces',serif; font-weight:600; font-size:14.5px;}
.ucard p{font-size:13px; margin:7px 0 !important; line-height:1.62 !important;}
.ucard p b, .unit-b p b{color:var(--ink);}
.ucard ol{margin:8px 0 4px; padding-left:22px;}
.ucard ol li{font-size:12.5px; margin-bottom:4px; line-height:1.55;}

.keybox{
  background:rgba(151,106,36,.06); border:1px solid rgba(151,106,36,.25);
  border-left:3px solid var(--warm); border-radius:0 10px 10px 0;
  padding:13px 18px; margin:14px 0;
}
.klbl{
  font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--warm); font-weight:700; margin-bottom:8px;
}
.keybox ul{margin:0 !important; padding-left:18px !important;}
.keybox li{font-size:12.5px !important; margin-bottom:6px !important;}
.keybox li b{color:var(--ink);}

.notebox{
  background:var(--glass2); border-left:3px solid var(--der);
  border-radius:0 10px 10px 0; padding:12px 18px; margin:14px 0;
}
.notebox .klbl{color:var(--der);}
.notebox p{font-size:12.5px !important; color:var(--ink2); margin:6px 0 !important;}

mark{
  background:linear-gradient(180deg, transparent 58%, var(--acc-soft) 58%);
  color:var(--acc-ink); padding:0 2px; font-weight:600;
}

.tnav{display:flex; justify-content:space-between; gap:12px; margin-top:20px;}
.tnav a{
  display:flex; flex-direction:column; gap:2px; text-decoration:none; color:var(--ink);
  background:var(--glass); border:1px solid var(--line); border-radius:12px;
  padding:12px 16px; max-width:48%; box-shadow:var(--shadow);
}
.tnav a:hover{border-color:var(--der);}
.tnav a.next{text-align:right; margin-left:auto;}
.tnav .dir{font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3);}
.tnav b{font-size:12.5px; line-height:1.35;}

/* ============ FLASHCARDS ============ */
.fc-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px;}
.fc-stat{
  background:var(--glass); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  box-shadow:var(--shadow); text-align:center;
}

/* ============ TOAST ============ */

@keyframes toastIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}

/* ============ FOCO EXAMEN (temario pendiente) ============ */
.pend-summary{display:flex; align-items:center; gap:22px; flex-wrap:wrap; justify-content:space-between;}
.pend-summary .ps-ring{display:flex; align-items:center; gap:14px; flex:none;}

.ps-stat.hot .v{color:var(--hot);} .ps-stat.warm .v{color:var(--warm);} .ps-stat.cold .v{color:var(--cold);} .ps-stat.der-s .v{color:var(--der);}

}

  background:var(--der-soft); border-radius:6px; padding:3px 7px; text-decoration:none; flex:none;
}

}

}

<body>
<div class="topbar">
  <div class="tg" id="menuBtn" aria-label="Menú">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#241F17" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
  </div>
  <div class="tt">DERECHO · INE A1</div>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="b1">Derecho<span>.</span></div>
      <div class="b2">INE A1 · Centro de estudio</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-h">Temario — 14 temas</div>
    <div class="sb-topics" id="sbTopics"></div>
    <div class="sb-foot">
      <div class="streakline" id="streakLine"></div>
      <button class="mini-btn" id="exportBtn">↓ Exportar progreso</button>
      <button class="mini-btn" id="importBtn">↑ Importar progreso</button>
      <button class="mini-btn" id="resetBtn" style="color:var(--hot);">× Reiniciar todo</button>
      <input type="file" id="importFile" accept=".json" style="display:none;">
    </div>

<script>
/* =====================================================================
   DERECHO · INE A1 — Centro de Estudio
   Lectura · Tarjetas (SRS) · Práctica · Examen · Seguimiento
   Todo el progreso se guarda en localStorage (clave: dchIneA1).
===================================================================== */

/* ---------- Utilidades ---------- */
const $  = (s, el) => (el||document).querySelector(s);
const $$ = (s, el) => Array.from((el||document).querySelectorAll(s));
const DAY = 86400000;
const isoDay = (d) => { const x = d?new Date(d):new Date(); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtMin = (m) => { m=Math.round(m); if(m<60) return m+' min'; const h=Math.floor(m/60), r=m%60; return h+' h '+(r?r+' m':'').trim(); };
const shuffle = (a) => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function toast(msg, type){
  const t=document.createElement('div'); t.className='toast '+(type||''); t.innerHTML=msg;
  $('#toasts').appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .4s'; t.style.opacity='0'; setTimeout(()=>t.remove(),400); }, 2600);
}

/* ---------- Estado (localStorage) ---------- */
const LSKEY = 'dchIneA1';
function defaultState(){
  return {
    read:{},          // unidades leídas: {unitId:true}
    pready:{},        // epígrafes pendientes preparados: {pendId:true}
    srs:{},           // tarjetas: {cardId:{d:dueTs,i:intDays,e:ease,r:reps}}
    quiz:{},          // por tema: {topicId:{a:respondidas,c:aciertos}}
    qhist:[],         // historial de tests: [{d,n,ok,mode}]
    time:{},          // minutos por día: {isoDay:min}
    days:{},          // días con actividad: {isoDay:true}
    last:{topic:null,unit:null},
    streak:{c:0,last:null},
    created:Date.now(),
    seen:false        // ya vio la ayuda inicial
  };
}
let S;
try{ S = Object.assign(defaultState(), JSON.parse(localStorage.getItem(LSKEY)||'{}')); }
catch(e){ S = defaultState(); }
function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){} }

/* ---------- Actividad, racha y tiempo ---------- */
function markActivity(){
  const today = isoDay();
  if(S.streak.last === today) return;
  const yest = isoDay(Date.now()-DAY);
  S.streak.c = (S.streak.last === yest) ? S.streak.c+1 : 1;
  S.streak.last = today;
  S.days[today] = true;
  save();
}
setInterval(()=>{
  if(document.visibilityState==='visible'){
    const t = isoDay();
    S.time[t] = (S.time[t]||0)+1;
    S.days[t] = true;
    save();
  }
}, 60000);
window.addEventListener('beforeunload', save);

/* =====================================================================
   DATOS (definidos en bloques posteriores): TOPICS, CARDS, QUIZ
===================================================================== */

/* ---------- Derivados de progreso ---------- */
function unitsOf(t){ return t.units; }
function topicRead(t){ return t.units.filter(u=>S.read[u.id]).length; }
function topicReadPct(t){ return t.units.length ? topicRead(t)/t.units.length : 0; }
function cardsOfTopic(tid){ return CARDS.filter(c=>c.t===tid); }
function cardState(c){
  const s = S.srs[c.id];
  if(!s) return 'new';
  if(s.i>=21) return 'done';
  if(s.i<=0) return 'learn';
  return s.d<=Date.now() ? 'due' : 'rest';
}
function topicCardsPct(t){
  const cs = cardsOfTopic(t.id);
  if(!cs.length) return 0;
  return cs.filter(c=>cardState(c)==='done').length / cs.length;
}
function topicQuizPct(t){
  const q = S.quiz[t.id];
  if(!q || !q.a) return 0;
  const acc = q.c/q.a;
  const cover = Math.min(1, q.a/10);
  return acc*cover;
}
function topicPct(t){ return 0.4*topicReadPct(t) + 0.3*topicCardsPct(t) + 0.3*topicQuizPct(t); }
function globalPct(){ return TOPICS.reduce((s,t)=>s+topicPct(t),0)/TOPICS.length; }
function dueCount(){
  let n=0, news=0;
  CARDS.forEach(c=>{ const st=cardState(c); if(st==='due'||st==='learn') n++; if(st==='new') news++; });
  return n + Math.min(news, 20);
}
function quizAll(){ const q=S.quiz; let a=0,c=0; Object.keys(q).forEach(k=>{a+=q[k].a;c+=q[k].c;}); return {a,c}; }

/* ---------- SRS: programación de tarjetas ---------- */
function scheduleCard(cardId, rating){
  const now = Date.now();
  let s = S.srs[cardId] || {d:now, i:0, e:2.5, r:0};
  s = {d:s.d, i:s.i, e:s.e, r:s.r};
  if(rating===1){ // Otra vez
    s.e = Math.max(1.3, s.e-0.2);
    s.i = 0;
    s.d = now + 10*60*1000; // 10 min
  } else if(rating===2){ // Difícil
    s.e = Math.max(1.3, s.e-0.05);
    s.i = s.i===0 ? 1 : Math.max(1, Math.round(s.i*1.2));
    s.d = now + s.i*DAY;
  } else if(rating===3){ // Bien
    s.i = s.i===0 ? 1 : Math.round(s.i*s.e);
    s.d = now + s.i*DAY;
  } else { // Fácil
    s.e = s.e+0.1;
    s.i = s.i===0 ? 3 : Math.round(s.i*s.e*1.3);
    s.d = now + s.i*DAY;
  }
  s.r++;
  if(s.i>365) s.i=365;
  S.srs[cardId]=s;
  markActivity(); save();
}

/* ---------- Quiz: registro ---------- */
function recordAnswer(topicId, ok){
  if(!S.quiz[topicId]) S.quiz[topicId]={a:0,c:0};
  S.quiz[topicId].a++;
  if(ok) S.quiz[topicId].c++;
  markActivity(); save();
}

/* ---------- Anillo SVG ---------- */
function ringSVG(pct, size, stroke, color){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-pct);
  return '<div class="ring"><svg width="'+size+'" height="'+size+'">'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba(36,31,23,.09)" stroke-width="'+stroke+'"/>'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/>'
    + '</svg><div class="rv">'+Math.round(pct*100)+'%</div></div>';
}

{id:'1.1', t:'Estructura básica y Título Preliminar (arts. 1-9)', html:`
<p>La Constitución de 1978 tiene <b>169 artículos</b> organizados en un preámbulo, un título preliminar y <b>diez títulos</b>, más disposiciones adicionales, transitorias, derogatoria y final. Es una constitución <b>rígida</b>: solo se reforma mediante los procedimientos agravados de los arts. 167 (reforma ordinaria) y 168 (reforma de la parte dogmática o de la Corona).</p>
<div class="ucard"><div class="uhead"><span class="anum">Art. 1</span><span class="arub">— Valores y forma política</span></div>
<p><b>1.</b> España se constituye en un <mark>Estado social y democrático de Derecho</mark> que propugna como valores superiores la <mark>libertad, la justicia, la igualdad y el pluralismo político</mark>. <b>2.</b> La soberanía nacional reside en el <mark>pueblo español</mark>. <b>3.</b> La forma política del Estado es la <mark>Monarquía parlamentaria</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 2</span><span class="arub">— Unidad y autonomía</span></div>
<p>La Constitución se fundamenta en la <mark>indisoluble unidad de la Nación española</mark> y reconoce el derecho a la <mark>autonomía</mark> de las nacionalidades y regiones y la <mark>solidaridad</mark> entre todas ellas.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 3-8</span><span class="arub">— principios del Título preliminar</span></div>
<p><b>3.</b> El castellano es la lengua española oficial del Estado: <mark>deber de conocerlo y derecho a usarlo</mark>; las demás lenguas son oficiales en sus CCAA (solo derecho de uso). <b>4.</b> La bandera tiene tres franjas roja-amarilla-roja con la amarilla de <mark>doble anchura (proporción 1-2-1)</mark>. <b>5.</b> La capital es <mark>la villa de Madrid</mark>. <b>6.</b> Los partidos políticos expresan el pluralismo político; estructura interna y funcionamiento <mark>democráticos</mark>. <b>7.</b> Sindicatos y asociaciones empresariales: libertad de creación y actividad, funcionamiento democrático. <b>8.</b> Las Fuerzas Armadas (Ejército de Tierra, Armada, Ejército del Aire) garantizan la <mark>soberanía e independencia</mark>, defienden la <mark>integridad territorial</mark> y el <mark>ordenamiento constitucional</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 9.3</span><span class="arub">— principios jurídicos</span></div>
<p>La Constitución garantiza: <mark>legalidad, jerarquía normativa, publicidad de las normas, irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales, seguridad jurídica</mark> e <mark>interdicción de la arbitrariedad</mark> de los poderes públicos.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Valores superiores (art. 1.1): <b>libertad, justicia, igualdad, pluralismo político</b>.</li>
<li>El castellano genera <b>deber de conocimiento</b>; las demás lenguas, solo derecho de uso.</li>
<li>La CE dice literalmente «la <b>villa</b> de Madrid».</li>
<li>Los seis principios del art. 9.3 se preguntan <b>en ese orden</b>.</li></ul></div>
`},
{id:'1.2', t:'Los Derechos Fundamentales y Libertades Públicas (Título I)', html:`
<p>El Título I se estructura en <b>cinco capítulos</b>: españoles y extranjeros (I), derechos y libertades (II), principios rectores (III), garantías (IV) y suspensión (V).</p>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 11-13</span><span class="arub">— españoles y extranjeros</span></div>
<p><b>11.</b> Ningún español <mark>de origen</mark> podrá ser privado de su nacionalidad; doble nacionalidad con países iberoamericanos sin perder la española. <b>12.</b> Mayoría de edad a los <mark>18 años</mark>. <b>13.2</b> Solo los españoles son titulares de los derechos del art. 23, <mark>salvo sufragio en elecciones municipales por reciprocidad</mark>. <b>13.3</b> Quedan excluidos de la extradición los delitos políticos: el <mark>terrorismo no es delito político</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Sección 1ª · arts. 15-29</span><span class="arub">— máxima protección (+ art. 14)</span></div>
<p>Gozan de reserva de ley orgánica y recurso de amparo. <b>14</b> igualdad sin discriminación (fuera de la Sección, pero con amparo por 53.2). <b>15</b> vida e integridad: pena de muerte abolida <mark>salvo leyes penales militares en tiempo de guerra</mark>. <b>17</b> detención preventiva máx. <mark>72 horas</mark> + <i>habeas corpus</i>. <b>18.4</b> limitación del uso de la informática — <mark>habilitación de la LOPDGDD</mark>. <b>20</b> expresión, creación, cátedra e información: «veraz» califica solo al derecho a <mark>recibir información (letra d)</mark>. <b>21</b> reunión pacífica sin armas: <mark>sin autorización previa</mark>; en vía pública, comunicación previa. <b>22</b> asociación: disolución solo por <mark>resolución judicial motivada</mark>; prohibidas las secretas y paramilitares. <b>23</b> participación y acceso a cargos públicos. <b>24</b> tutela judicial efectiva y garantías procesales. <b>25</b> legalidad penal y sancionadora. <b>26</b> prohibición de Tribunales de Honor en la Administración civil y organizaciones profesionales. <b>27</b> educación: enseñanza básica obligatoria y gratuita. <b>28</b> libertad sindical y huelga (con servicios esenciales). <b>29</b> petición individual y colectiva (militares: solo individual).</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Sección 2ª · arts. 30-38</span><span class="arub">— derechos y deberes de los ciudadanos</span></div>
<p>Reserva de ley ordinaria, <b>sin amparo directo</b> (excepción: <mark>objeción de conciencia</mark>, art. 30.2). <b>31</b> tributos: capacidad económica, <mark>igualdad y progresividad</mark>, no confiscatorios. <b>33</b> propiedad: expropiación solo por <mark>utilidad pública o interés social + indemnización + ley</mark>. <b>38</b> libertad de empresa en economía de mercado.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Cap. III · arts. 39-52</span><span class="arub">— principios rectores</span></div>
<p>Informan la legislación, la práctica judicial y la actuación de los poderes públicos; <mark>no son directamente exigibles</mark> ante los Tribunales (art. 53.3). Destacan: protección de la familia (39), cultura e investigación científica (44), medio ambiente (45), vivienda (47), personas con discapacidad (49), tercera edad (50), consumidores y usuarios (51) y la tutela de los menores mediante acuerdos internacionales (39.4).</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Amparo: art. <b>14 + Sección 1ª (15-29)</b>, vía 53.2; objeción de conciencia (30.2) es la única excepción de la Sección 2ª.</li>
<li>Las 72 horas de detención y el <i>habeas corpus</i> (17); «veraz» solo para informar (20).</li>
<li>Régimen sancionador: irretroactividad de lo desfavorable (9.3 y 25).</li>
<li>Rectores (39-52): informan pero no son exigibles por sí solos.</li></ul></div>
`},
{id:'1.3', t:'Garantías, suspensión y el Defensor del Pueblo (arts. 53-55 y 54)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 53</span><span class="arub">— niveles de garantía</span></div>
<p><b>53.1</b> Los derechos del Cap. II vinculan a todos los poderes públicos: solo por <mark>ley</mark>, respetando su <mark>contenido esencial</mark>. <b>53.2</b> Tutela ante los Tribunales ordinarios (procedimiento de <mark>preferencia y sumariedad</mark>) y, en su caso, <mark>recurso de amparo ante el TC</mark> para el art. 14 y la Sección 1ª. <b>53.3</b> Los principios rectores solo informan la legislación y solo son alegables en lo que las leyes dispongan.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 55</span><span class="arub">— suspensión de derechos</span></div>
<p><b>55.1</b> Suspensión <mark>general</mark> en estado de excepción o sitio de los derechos de los arts. 17, 18.2 y 3, 19, 20.1.a) y d), 21, 28.2 y 37.2. <b>55.2</b> Suspensión <mark>individual</mark> (17.2 y 18.2-3) para investigaciones de bandas armadas o terroristas, mediante <mark>ley orgánica</mark>, con intervención judicial y control parlamentario.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 54</span><span class="arub">— el Defensor del Pueblo</span></div>
<p>Una ley orgánica regulará el Defensor del Pueblo como <mark>alto comisionado de las Cortes Generales</mark>, designado por éstas para la defensa de los derechos del Título I, pudiendo <mark>supervisar la actividad de la Administración</mark> y dando cuenta a las Cortes.</p></div>
<div class="notebox"><div class="klbl">Claves de comentario</div>
<p>Es <b>comisionado de las Cortes</b>, no del Gobierno: rinde cuentas ante las Cortes. Su ley de desarrollo es la <b>LO 3/1981</b>, que lo legitima para interponer <b>recurso de amparo ante el TC y recurso de inconstitucionalidad</b>, lo convierte en causa de inelegibilidad (art. 70.1.c) CE) y le reconoce inviolabilidad e inmunidad durante su mandato. Encaja con el patrón de pregunta «naturaleza, designación y funciones de un órgano» que este tribunal repite.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Doble garantía del 53.1: <b>reserva de ley + contenido esencial</b>.</li>
<li>Amparo: preferencia y sumariedad (53.2) — arts. 14 y 15-29.</li>
<li>Suspensión general (estados excepción/sitio) vs. individual (LO antiterrorista, 55.2).</li>
<li>Defensor del Pueblo: alto comisionado de las <b>Cortes</b>; LO 3/1981; supervisa la Administración.</li></ul></div>
`}
]},

{id:'2.1', t:'La Corona (arts. 56-65)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 56</span><span class="arub">— el Rey, Jefe del Estado</span></div>
<p>El Rey es el <mark>Jefe del Estado</mark>, símbolo de su unidad y permanencia, arbitra y modera el funcionamiento regular de las instituciones. Su persona es <mark>inviolable y no está sujeta a responsabilidad</mark>; sus actos estarán <mark>siempre refrendados</mark> (art. 64), salvo lo dispuesto en el art. 65.2.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 57</span><span class="arub">— sucesión</span></div>
<p>La Corona es hereditaria. Orden regular de sucesión: <mark>primogenitura y representación</mark>, preferida la <mark>línea anterior a las posteriores</mark>; en la misma línea, el <mark>grado más próximo</mark>; en el mismo grado, <mark>el varón a la mujer</mark>; en el mismo sexo, <mark>la persona de más edad</mark>. Las abdicaciones y renuncias se resolverán mediante <mark>ley orgánica</mark> (57.5).</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 58-60</span><span class="arub">— consorte, Regencia y tutela</span></div>
<p><b>58.</b> El consorte no asume funciones constitucionales, <mark>salvo la Regencia</mark>. <b>59.</b> Regencia si el Rey es <mark>menor de edad</mark> (ejerce el padre o la madre y, en su defecto, el pariente mayor de edad más próximo) o está <mark>inhabilitado</mark> (ejerce el Príncipe heredero si es mayor de edad). Las Cortes pueden nombrar una Regencia de <mark>una, tres o cinco personas</mark>. <b>60.</b> La tutela del Rey menor es distinta de la Regencia: no pueden acumularse ambos cargos <mark>salvo en el padre, la madre o ascendientes directos</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 62-64</span><span class="arub">— funciones y refrendo</span></div>
<p><b>62.</b> Corresponde al Rey: sancionar y promulgar las leyes; convocar y disolver las Cortes y convocar elecciones; <mark>proponer el candidato a Presidente del Gobierno</mark> y nombrarlo; nombrar y separar a los Ministros a propuesta de su Presidente; expedir decretos; el <mark>mando supremo de las Fuerzas Armadas</mark>; ejercer el derecho de gracia <mark>sin que pueda autorizar indultos generales</mark>; el alto patronazgo de las Reales Academias. <b>63.</b> Declarar la guerra y hacer la paz <mark>previa autorización de las Cortes Generales</mark>. <b>64.</b> Refrendo del <mark>Presidente del Gobierno y, en su caso, de los Ministros competentes</mark>; la propuesta y el nombramiento del Presidente del Gobierno y la disolución del art. 99 las refrenda el <mark>Presidente del Congreso</mark>. Son responsables quienes refrendan.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 65</span><span class="arub">— dotación y Casa Real</span></div>
<p>El Rey recibe de los Presupuestos una <mark>cantidad global</mark> y <mark>nombra y releva libremente a los miembros civiles y militares de su Casa</mark> — las dos facultades no regladas excluidas del refrendo (65.2, excepción citada por el 56.3).</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Todas las funciones del Rey son <b>formales y regladas</b>; prohibido el indulto general.</li>
<li>Refrendo excepcional del <b>Presidente del Congreso</b>: propuesta/nombramiento del Presidente y disolución del art. 99.</li>
<li>Regencia: 1, 3 o 5 personas; tutela no acumulable salvo padres/ascendientes.</li>
<li>Sucesión: la preferencia del varón sobre la mujer <b>solo en el mismo grado</b> — sigue vigente en el texto.</li></ul></div>
`},
{id:'2.2', t:'Las Cortes Generales (arts. 66-80)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 66-67</span><span class="arub">— naturaleza</span></div>
<p>Las Cortes representan al <mark>pueblo español</mark> y ejercen la <mark>potestad legislativa</mark>, aprueban los Presupuestos y <mark>controlan la acción del Gobierno</mark>. Son <mark>inviolables</mark>. Nadie puede ser miembro de las dos Cámaras; <mark>no hay mandato imperativo</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 68-69</span><span class="arub">— composición</span></div>
<p><b>Congreso:</b> mínimo <mark>300</mark> y máximo <mark>400</mark> diputados (la LOREG fija <b>350</b>), circunscripción <mark>provincial</mark>, Ceuta y Melilla un diputado cada una, mandato de <mark>4 años</mark>. <b>Senado:</b> cámara de <mark>representación territorial</mark>; <mark>4 senadores por provincia</mark> elegidos por sufragio universal + <mark>1 senador y otro más por cada millón de habitantes</mark> designados por las CCAA.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 70-71</span><span class="arub">— inelegibilidad, inviolabilidad e inmunidad</span></div>
<p><b>70.</b> Incompatibles en todo caso: componentes del Tribunal Constitucional, altos cargos que determine la ley, el <mark>Defensor del Pueblo</mark>, Magistrados, Jueces y Fiscales en activo, militares profesionales y miembros de las Fuerzas y Cuerpos de Seguridad, y miembros de las Juntas Electorales. <b>71.</b> <mark>Inviolabilidad</mark> por las opiniones (permanente) frente a <mark>inmunidad</mark> procesal (solo durante el mandato; detención solo por <mark>flagrante delito</mark>; procesamiento previo <mark>suplicatorio</mark>). Fuero: <mark>Sala de lo Penal del Tribunal Supremo</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 72-80</span><span class="arub">— funcionamiento</span></div>
<p><b>72.</b> Autonomía reglamentaria y presupuestaria; las sesiones conjuntas las preside el <mark>Presidente del Congreso</mark>. <b>73.</b> Dos periodos ordinarios: <mark>septiembre-diciembre</mark> y <mark>febrero-junio</mark>; extraordinarias a petición del Gobierno, de la Diputación Permanente o de la mayoría absoluta de una Cámara. <b>75.</b> Funcionamiento en Pleno y Comisiones; cabe delegar en Comisiones Legislativas Permanentes <mark>excepto</mark>: reforma constitucional, cuestiones internacionales, <mark>leyes orgánicas</mark> y de bases, y <mark>PGE</mark>. <b>76.</b> Comisiones de investigación: sus conclusiones <mark>no vinculan a los Tribunales</mark>. <b>78.</b> Diputación Permanente en cada Cámara (mínimo <mark>21 miembros</mark>) vela por los poderes de la Cámara cuando no está reunida o está disuelta. <b>79.</b> Acuerdos: mayoría de miembros presentes; voto <mark>personal e indelegable</mark>. <b>80.</b> Sesiones plenarias <mark>públicas</mark>, salvo acuerdo en contrario por mayoría absoluta.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>La CE no fija 350 diputados: fija la <b>horquilla 300-400</b> (350 la fija la LOREG).</li>
<li>Inviolabilidad (opiniones, permanente) ≠ inmunidad (procesal, durante el mandato).</li>
<li>Excepciones a la delegación en Comisiones: reforma, internacionales, orgánicas, bases y PGE.</li>
<li>Diputación Permanente: mínimo 21 miembros, una por Cámara.</li></ul></div>
`},
{id:'2.3', t:'El procedimiento legislativo (arts. 81-96)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 81</span><span class="arub">— Leyes Orgánicas</span></div>
<p>Son LO las relativas al <mark>desarrollo de los derechos fundamentales y libertades públicas</mark>, las que aprueben los <mark>Estatutos de Autonomía</mark> y el <mark>régimen electoral general</mark>, y las demás previstas en la CE. Su aprobación, modificación o derogación exige <mark>mayoría absoluta del Congreso</mark>, en votación final sobre el conjunto.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 82-86</span><span class="arub">— decretos legislativos y decretos-leyes</span></div>
<p><b>82-85.</b> Las Cortes pueden delegar en el Gobierno: ley de bases → <mark>texto articulado</mark>; ley ordinaria → <mark>texto refundido</mark>. La delegación ha de ser <mark>expresa, por materia y plazo</mark> (no subdelegable). <b>86.</b> Decretos-leyes solo en <mark>extraordinaria y urgente necesidad</mark>; no pueden afectar a instituciones del Estado, derechos y deberes del Título I, CCAA, Derecho electoral ni Derecho internacional. <mark>Convalidación por el Congreso en 30 días</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 87-92</span><span class="arub">— iniciativa y tramitación</span></div>
<p><b>87.</b> Iniciativa del <mark>Gobierno</mark> (proyectos), del <mark>Congreso y del Senado</mark> (proposiciones), de las <mark>Asambleas de CCAA</mark> (a propuesta de su Gobierno, con acuerdo) y <mark>popular: 500.000 firmas</mark> (excluidas materias orgánicas, tributarias, internacionales y prerrogativa de gracia). <b>88.</b> Los proyectos se aprueban en <mark>Consejo de Ministros</mark>, previo dictamen del Consejo de Estado, y se remiten al Congreso. <b>90.</b> El Senado puede <mark>veto</mark> (mayoría absoluta: el Congreso lo levanta por mayoría absoluta o por mayoría simple tras 2 meses) o enmendar (mayoría simple). Plazo del Senado: <mark>2 meses</mark> (20 días si el Gobierno lo declara urgente). <b>91-92.</b> El Rey <mark>sanciona y promulga</mark> en 15 días; referéndum consultivo a propuesta del Presidente, previa autorización del Congreso.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>LO: 3 materias expresas + mayoría absoluta del Congreso en votación final de conjunto.</li>
<li>Decreto-ley: extraordinaria y urgente necesidad + convalidación en 30 días.</li>
<li>Veto del Senado: mayoría absoluta; se levanta con mayoría absoluta o simple a los 2 meses.</li>
<li>Iniciativa popular: 500.000 firmas, con exclusiones tasadas.</li></ul></div>
`}
]},

norma:'CE arts. 97-107 · Ley 50/1997 · Ley 40/2015 · RD 829/2023, RD 1009/2023 y RD 410/2024',
desc:'Composición y funciones del Gobierno. Organización de la Administración Pública: órganos superiores y directivos. La Administración periférica del Estado. Estructura del Ministerio de Economía, Comercio y Empresa y organismos adscritos.',
exam:[],
units:[
{id:'3.1', t:'El Gobierno (arts. 97-104 CE y Ley 50/1997)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Arts. 97-98</span><span class="arub">— funciones y composición</span></div>
<p><b>97.</b> El Gobierno dirige la política interior y exterior, la Administración civil y militar y la defensa del Estado; ejerce la <mark>función ejecutiva y la potestad reglamentaria</mark>. <b>98.</b> Se compone del <mark>Presidente, de los Vicepresidentes, en su caso, de los Ministros</mark> y de los demás miembros que establezca la ley (la Ley 50/1997 no añade ninguno: los Secretarios de Estado <b>no</b> son miembros del Gobierno). El Presidente <mark>dirige la acción del Gobierno y coordina</mark> sin menoscabo de la competencia directa de los Ministros.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 99-101</span><span class="arub">— investidura y cese</span></div>
<p><b>99.</b> El Rey, previa consulta a los grupos, propone un candidato a través del Presidente del Congreso: investidura por <mark>mayoría absoluta</mark>; si falla, nueva votación <mark>48 horas después</mark> y basta <mark>mayoría simple</mark>; si en <mark>2 meses</mark> nadie logra la confianza, disolución y nuevas elecciones. <b>100.</b> Los Ministros los nombra y separa el Rey <mark>a propuesta del Presidente</mark>. <b>101.</b> El Gobierno cesa por <mark>elecciones generales, pérdida de confianza, dimisión o fallecimiento</mark> del Presidente; el cesante continúa <mark>en funciones</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 103 y 107</span><span class="arub">— principios administrativos y Consejo de Estado</span></div>
<p><b>103.1.</b> La Administración sirve con objetividad los intereses generales con arreglo a: <mark>eficacia, jerarquía, descentralización, desconcentración y coordinación</mark>, con sometimiento pleno a la ley y al Derecho. <b>103.3</b> regula el acceso a la función pública por <mark>mérito y capacidad</mark> — habilitación directa del TREBEP. <b>107.</b> El <mark>Consejo de Estado es el supremo órgano consultivo del Gobierno</mark> (regulado por LO).</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Ley 50/1997</span><span class="arub">— del Gobierno</span></div>
<p>El Gobierno se reúne en <mark>Consejo de Ministros</mark> y en <mark>Comisiones Delegadas</mark>. El Consejo de Ministros aprueba proyectos de ley, los PGE, los RD-leyes y RD legislativos y los reglamentos previo dictamen del Consejo de Estado; sus <mark>deliberaciones son secretas</mark>. El Presidente ejerce la dirección suprema y puede <mark>crear, modificar y suprimir Departamentos y Secretarías de Estado por Real Decreto</mark> (art. 2.1.j).</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Principios del 103.1 <b>en orden</b>: eficacia, jerarquía, descentralización, desconcentración, coordinación.</li>
<li>Descentralización = otro ente con personalidad; <b>desconcentración</b> = órgano inferior del mismo ente.</li>
<li>Responsabilidad penal del Presidente y Ministros: Sala de lo Penal del <b>TS</b> (art. 102).</li>
<li>Fuerzas y Cuerpos de Seguridad (104): dependientes del Gobierno, seguridad ciudadana — distintas de las FAS (8).</li></ul></div>
`},
{id:'3.2', t:'Órganos superiores y directivos de la AGE (Ley 40/2015)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 55 Ley 40/2015</span><span class="arub">— dos niveles de órganos</span></div>
<p><b>Órganos superiores:</b> <mark>Ministros y Secretarios de Estado</mark> — fijan los planes de actuación e impulsan la organización. <b>Órganos directivos:</b> <mark>Subsecretarios, Secretarios Generales, Secretarios Generales Técnicos, Directores Generales y Subdirectores Generales</mark> — desarrollan y ejecutan la acción del Gobierno bajo la dirección de los superiores.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Jerarquía y técnicas</span><span class="arub">— arts. 9, 10, 16</span></div>
<p>La jerarquía ordena los órganos administrativos. La <mark>delegación de competencias</mark> (art. 9) exige publicación y no abarca los asuntos reservados al órgano delegante. La <mark>desconcentración</mark> (art. 10) transfiere funciones a órganos inferiores. Las <mark>instrucciones y órdenes de servicio</mark> (art. 16) dirigen la actividad de los órganos dependientes: su incumplimiento genera responsabilidad disciplinaria pero <b>no invalida por sí solo</b> los actos dictados.</p></div>
<div class="notebox"><div class="klbl">Claves de comentario</div>
<p>El Ministro dirige su departamento y dicta <b>órdenes ministeriales</b>; el Secretario de Estado dirige y coordina el sector que le corresponde; el Subsecretario es el <b>jefe superior de personal</b> del departamento y ejerce su administración ordinaria; los Directores Generales gestionan la ejecución de la política sectorial. El <b>rango</b> de Subsecretario lo comparten los Secretarios Generales y los Delegados del Gobierno.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Superiores = <b>Ministros + Secretarios de Estado</b>; directivos = <b>Subsecretarios, SSGG, SSGG Técnicos, DDGG y Subddires Generales</b>.</li>
<li>Delegación de firma (art. 18): no altera la competencia, no se publica, <b>prohibida en materia sancionadora</b>.</li>
<li>Suplencia (art. 19): vacante, ausencia o enfermedad — tampoco altera la competencia.</li></ul></div>
`},
{id:'3.3', t:'La Administración periférica del Estado', html:`
<div class="ucard"><div class="uhead"><span class="anum">Delegados del Gobierno</span><span class="arub">— en las CCAA</span></div>
<p>Representan al <mark>Gobierno en el territorio de la Comunidad Autónoma</mark> y dirigen la Administración periférica del Estado en dicho territorio. Los nombra y separa el Presidente del Gobierno por Real Decreto, con rango de <mark>Subsecretario</mark>; dependen directamente del Presidente. Dirigen la actividad de los Subdelegados, ejercen la dirección y coordinación de la protección civil en su ámbito y aseguran la cooperación con la Administración autonómica y local (comisiones bilaterales de cooperación).</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Subdelegados del Gobierno</span><span class="arub">— en las provincias</span></div>
<p>Representan a la AGE en la provincia, <mark>bajo la dependencia del Delegado del Gobierno</mark>. Ejercen las competencias que les confiere la legislación del Estado y las que les delegue el Delegado. En las <mark>CCAA uniprovinciales</mark>, el Delegado del Gobierno asume las funciones de los Subdelegados.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Directores Insulares</span><span class="arub">— en las islas</span></div>
<p>En las islas, y donde no existan Subdelegados, el Delegado del Gobierno puede designar un <mark>Director Insular</mark> para ejercer en ese ámbito las competencias provinciales de la Administración periférica.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>El Delegado lo nombra el <b>Presidente del Gobierno</b> por RD, con rango de Subsecretario.</li>
<li>El Subdelegado depende del <b>Delegado</b>; en uniprovinciales no existe (asume el Delegado).</li>
<li>La Administración periférica es la proyección territorial de la AGE — distinta de la Administración institucional.</li></ul></div>
`},
{id:'3.4', t:'El Ministerio de Economía, Comercio y Empresa y sus organismos', html:`
<div class="ucard"><div class="uhead"><span class="anum">RD 829/2023</span><span class="arub">— denominación vigente</span></div>
<p>Creado por el <mark>RD 829/2023, de 20 de noviembre</mark> (reestructuración de departamentos). Es el departamento encargado de la propuesta y ejecución de la política económica y de <mark>comercio</mark>. Ojo: el nombre anterior del temario 2022 era «Ministerio de Asuntos Económicos y Transformación Digital» — para el examen conviene citar <b>siempre el nombre vigente</b> salvo que se pregunte por un momento histórico.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">RD 1009/2023 + RD 410/2024</span><span class="arub">— estructura del departamento</span></div>
<p>El RD 1009/2023 fija los órganos superiores y directivos de todos los ministerios; el <mark>RD 410/2024, de 23 de abril</mark>, desarrolla la estructura de este departamento hasta subdirección general, dictado en aplicación del <mark>art. 59.1 de la Ley 40/2015</mark>. El Ministerio se organiza en <b>dos Secretarías de Estado</b> más la Subsecretaría: la <mark>Secretaría de Estado de Economía y Apoyo a la Empresa</mark> («hacia dentro»: Tesoro, política económica y financiera, supervisión, estadística) y la <mark>Secretaría de Estado de Comercio</mark> («hacia fuera»: comercio exterior, internacionalización, ICEX).</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 2.7 RD 410/2024</span><span class="arub">— organismos adscritos a través de la SE de Economía</span></div>
<p>El organismo autónomo <mark>Instituto Nacional de Estadística (INE)</mark>; la entidad pública empresarial <mark>ICO</mark>; la <mark>CNMC</mark>; la <mark>CNMV</mark>; y el <mark>FROB</mark> (estos tres últimos como autoridades administrativas independientes, arts. 109-110 Ley 40/2015). La <b>Dirección General de Análisis Económico</b> mantiene la interlocución con el INE en el desarrollo del Plan Estadístico Nacional.</p></div>
<div class="notebox"><div class="klbl">Claves de comentario</div>
<p>Encadenado típico de examen: <b>¿A qué Ministerio está adscrito el INE y a través de qué órgano?</b> → Ministerio de <b>Economía, Comercio y Empresa</b>, a través de la <b>Secretaría de Estado de Economía y Apoyo a la Empresa</b>. Error más común: asumir que la CNMV depende de la Secretaría de Estado de Comercio. La estructura ministerial cambia por RD: verificar contra el BOE cerca del examen; lo estable es el <b>esquema organizativo</b>, no el nombre del titular.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Nombre vigente: <b>Economía, Comercio y Empresa</b> (RD 829/2023).</li>
<li>Dos Secretarías de Estado: <b>Economía y Apoyo a la Empresa</b> y <b>Comercio</b>.</li>
<li>INE: organismo autónomo adscrito <b>a través de la SE de Economía y Apoyo a la Empresa</b>.</li>
<li>Compañeros de adscripción: ICO, CNMC, CNMV y FROB.</li></ul></div>
`}
]},

/* ---------------- TEMA 4 · ORGANIZACIÓN TERRITORIAL ---------------- */
{
id:4, t:'La organización territorial del Estado', prio:1,
prioTxt:'Sin ninguna pregunta en 4 convocatorias — el 149.1.31ª es el gancho estadístico',
norma:'CE, Título VIII (arts. 137-159) · Ley 7/1985, LRBRL',
desc:'Delimitación de competencias entre el Estado y las Comunidades Autónomas. La Administración local: competencias de los Municipios y Provincias.',
exam:[],
units:[
{id:'4.1', t:'Estado y Comunidades Autónomas (arts. 137-159 CE)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 137</span><span class="arub">— las entidades territoriales</span></div>
<p>El Estado se organiza territorialmente en <mark>municipios, provincias y Comunidades Autónomas</mark>. Todas gozan de <mark>autonomía para la gestión de sus respectivos intereses</mark> — autonomía de gestión, no soberanía.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 143-147</span><span class="arub">— iniciativas y Estatutos</span></div>
<p><b>143.</b> Iniciativa autonómica de las provincias (acuerdo de las Diputaciones o de 2/3 de los municipios). <b>147.</b> El <mark>Estatuto de Autonomía es la norma institucional básica de cada CA</mark> y se aprueba como <mark>ley orgánica</mark>. Vía lenta (143) frente a vía rápida del <b>151</b> (referéndum y competencias plenas del 148.1 desde el inicio).</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 148-149</span><span class="arub">— el reparto competencial</span></div>
<p><b>148.</b> Materias que las CCAA <mark>pueden asumir</mark> (potestativo): instituciones de autogobierno, ordenación del territorio, sanidad, asistencia social, cultura, agricultura... El 148.2 permite <mark>ampliar competencias a los 5 años</mark> por reforma estatutaria. <b>149.1.</b> Competencias exclusivas del Estado, entre otras: 1.ª regulación de las condiciones básicas que garanticen la igualdad; 2.ª nacionalidad, inmigración, extranjería y asilo; 5.ª Administración de Justicia; 6.ª legislación mercantil, penal y procesal; 14.ª Hacienda general y Deuda; 18.ª bases del régimen jurídico de las AAPP y del régimen estatutario de sus funcionarios; <mark>31.ª Estadística para fines estatales</mark>. <b>149.3.</b> Las materias no atribuidas expresamente al Estado pueden corresponder a las CCAA por sus Estatutos (<mark>cláusula residual</mark>); lo no asumido corresponde al Estado; el <mark>derecho estatal es supletorio</mark> en todo caso.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 150</span><span class="arub">— tres vías de flexibilización</span></div>
<p><b>150.1</b> <mark>Leyes marco</mark>: atribuyen a las CCAA dictar normas legislativas en el marco de principios fijados por ley estatal. <b>150.2</b> <mark>Leyes de transferencia o delegación</mark> (mediante LO) de facultades de titularidad estatal. <b>150.3</b> <mark>Leyes de armonización</mark> cuando lo exija el <mark>interés general</mark> (mayoría absoluta de cada Cámara). El <b>art. 155</b> permite al Gobierno, previo requerimiento y autorización del Senado, adoptar medidas si una CA incumple la Constitución o su actuación perjudique grave el interés general.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li><b>149.1.31ª</b>: «Estadística para fines estatales» — fundamento del INE y de la Ley 12/1989 (su art. 1 lo cita).</li>
<li>149.3: residual para las CCAA vía Estatuto + <b>supletoriedad</b> del derecho estatal.</li>
<li>Estatutos de Autonomía = <b>leyes orgánicas</b> (147.2).</li>
<li>Armonización (150.3): exige <b>interés general</b> y mayoría absoluta — la vía más excepcional.</li></ul></div>
`},
{id:'4.2', t:'La Administración local: Municipios y Provincias (LRBRL)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 140 CE + art. 25 LRBRL</span><span class="arub">— el Municipio</span></div>
<p>Los Concejales se eligen siempre por <mark>sufragio directo</mark>; el Alcalde, por los Concejales o por los vecinos, según la ley. Órganos necesarios: <mark>Alcalde, Tenientes de Alcalde y Pleno</mark>; la <b>Junta de Gobierno Local</b> existe en municipios con población superior a 5.000 habitantes (y en los de régimen especial). Tras la reforma LRSAL (Ley 27/2013), las competencias propias son las que <mark>expresamente atribuyan las leyes estatales o autonómicas</mark> — en todo caso en materias de urbanismo, medio ambiente urbano, abastecimiento de agua, infraestructura viaria, seguridad en espacios públicos, tráfico, protección civil, policía local y servicios sociales, entre otras.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 26 LRBRL</span><span class="arub">— servicios mínimos por escalones</span></div>
<p><b>En todos los municipios:</b> alumbrado público, cementerio, recogida de residuos, limpieza viaria, abastecimiento domiciliario de agua potable, alcantarillado, acceso a los núcleos y pavimentación. <b>Con más de 5.000 hab.:</b> parque público, biblioteca pública, mercado y tratamiento de residuos. <b>Con más de 20.000:</b> protección civil, servicios sociales, prevención y extinción de incendios, instalaciones deportivas públicas. <b>Con más de 50.000:</b> transporte colectivo urbano y protección del medio ambiente.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 141 CE, 31 y 36 LRBRL</span><span class="arub">— la Provincia y la Diputación</span></div>
<p>La Provincia es una <mark>entidad local determinada por la agrupación de municipios</mark>, con personalidad jurídica propia; su gobierno pertenece a la <mark>Diputación</mark>. Sus fines propios son garantizar la <mark>solidaridad y el equilibrio intermunicipales</mark> (art. 31). Competencias propias de la Diputación (art. 36): <mark>coordinación de los servicios municipales</mark>; <mark>asistencia y cooperación jurídica, económica y técnica</mark> a los municipios (garantiza secretaría e intervención en los de menos de 1.000 habitantes); <mark>prestación de servicios supramunicipales</mark>; y soporte a los Ayuntamientos en la tramitación de procedimientos.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Servicios mínimos: se preguntan <b>por escalón de población</b> (5.000 / 20.000 / 50.000).</li>
<li>La Provincia existe para <b>compensar desigualdades entre municipios</b> (solidaridad intermunicipal).</li>
<li>Competencias municipales «propias» post-LRSAL: las que fije la <b>legislación sectorial</b>, no la LRBRL de forma autónoma.</li>
<li>Diputación: coordinación, asistencia y cooperación; garantiza secretaría e intervención en &lt;1.000 hab.</li></ul></div>
`}
]},
