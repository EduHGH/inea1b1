{id:'5.1', t:'Fuentes del Derecho Administrativo', html:`
<p>El sistema de fuentes se articula sobre la <b>jerarquía normativa</b> y el principio de competencia (art. 9.3 CE). Para el Derecho Administrativo: la ley (orgánica y ordinaria), el <mark>reglamento</mark> como fuente propia, la costumbre y los principios generales del Derecho como fuentes subsidiarias, y la jurisprudencia como elemento interpretativo.</p>
<div class="ucard"><div class="uhead"><span class="anum">El reglamento</span><span class="arub">— potestad y límites</span></div>
<p>Norma escrita de rango inferior a la ley dictada por la Administración en ejercicio de la potestad reglamentaria (art. 97 CE). Puede ser <b>de desarrollo</b> (despliega una ley) o <b>ejecutivo</b> (organiza los servicios). Límites del art. 128 Ley 39/2015: no pueden vulnerar la Constitución ni las leyes, ni regular materias reservadas a la ley, y <mark>no pueden tipificar delitos, faltas o infracciones administrativas, establecer penas o sanciones, ni tributos o prestaciones patrimoniales</mark>. El reglamento es <mark>inderogable singularmente</mark>: una norma reglamentaria no puede dejarse sin aplicar para un caso concreto por un acto o norma del mismo o inferior rango.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 127-133 Ley 39/2015</span><span class="arub">— iniciativa legislativa y potestad reglamentaria</span></div>
<p>El Gobierno ejerce la iniciativa legislativa (anteproyectos) y aprueba <mark>reales decretos-leyes y reales decretos legislativos</mark>; la potestad reglamentaria corresponde al Gobierno y a los órganos de gobierno de CCAA y EELL. <b>Principios de buena regulación (art. 129):</b> <mark>necesidad, proporcionalidad, seguridad jurídica, transparencia y eficiencia</mark>. Los reglamentos se publican en el diario oficial (art. 132) y entran en vigor a los <mark>20 días</mark> de su publicación completa, salvo disposición en contrario (art. 133.1). La Ley 50/1997 (art. 23) fija las «arrancadas comunes»: las normas que impongan <b>nuevas obligaciones a actividades económicas o profesionales</b> prevén su entrada en vigor el <mark>2 de enero o el 1 de julio</mark> siguientes.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Jerarquía + competencia (9.3 CE); reserva de ley de sanciones e infracciones (25 CE y 128.2 Ley 39/2015).</li>
<li>Buena regulación (129): <b>necesidad, proporcionalidad, seguridad jurídica, transparencia, eficiencia</b>.</li>
<li>Entrada en vigor: 20 días; arrancadas comunes 2 enero / 1 julio (Ley 50/1997, art. 23).</li>
<li>Inderogabilidad singular: no cabe excepción reglamentaria para un caso concreto.</li></ul></div>
`},
{id:'5.2', t:'El procedimiento administrativo: iniciación (arts. 54-69)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 54</span><span class="arub">— clases de iniciación</span></div>
<p>Los procedimientos pueden iniciarse <mark>de oficio</mark> o <mark>a solicitud del interesado</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 58-63</span><span class="arub">— iniciación de oficio</span></div>
<p>Cuatro vías tasadas (art. 58): <mark>propia iniciativa</mark>, <mark>orden superior</mark> (de un órgano superior jerárquico), <mark>petición razonada</mark> de otro órgano (que <b>no vincula</b> al competente para iniciar) y <mark>denuncia</mark> (cualquier persona; <b>no confiere por sí sola la condición de interesado</b>). Los sancionadores se inician <mark>siempre de oficio</mark> y con <mark>separación entre instrucción y sanción</mark> (art. 63), que se encomiendan a órganos distintos.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 66-69</span><span class="arub">— iniciación a solicitud</span></div>
<p>Los registros electrónicos son válidos (art. 66). <b>Subsanación (68):</b> si falta un requisito, requerimiento por <mark>10 días</mark> bajo apercibimiento de <mark>desistimiento</mark> (siempre mediante resolución expresa). <b>Declaración responsable y comunicación (69):</b> la declaración manifiesta que se cumplen los requisitos y produce efectos <mark>desde el día de su presentación</mark>; la inexactitud determina la imposibilidad de continuar con el ejercicio del derecho, sin perjuicio de responsabilidades.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Denuncia ≠ interesado (62.5); petición razonada <b>no vincula</b> (61.2).</li>
<li>Sancionadores: siempre de oficio + separación de fases (63).</li>
<li>Subsanación: 10 días → desistimiento, nunca inadmisión automática.</li></ul></div>
`},
{id:'5.3', t:'Ordenación e instrucción (arts. 70-82)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Arts. 70-74</span><span class="arub">— expediente y ordenación</span></div>
<p>El expediente es el <mark>conjunto ordenado de documentos y actuaciones</mark> que sirven de antecedente y fundamento a la resolución (art. 70). No forman parte del expediente las notas, borradores y opiniones internas, <mark>salvo los informes preceptivos o facultativos solicitados antes de resolver</mark> (70.4). El procedimiento se impulsa <mark>de oficio</mark> con celeridad (71) y se despacha en <mark>orden riguroso de incoación</mark>. Trámites de los interesados: plazo general de <mark>10 días</mark>, con decaimiento en el trámite (73). Las <mark>cuestiones incidentales no suspenden la tramitación, salvo la recusación</mark> (74).</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 76-81</span><span class="arub">— alegaciones, prueba e informes</span></div>
<p>Alegaciones: en <mark>cualquier momento anterior al trámite de audiencia</mark>; los defectos de tramitación, en todo momento (76). Prueba (77): período ordinario de <mark>10 a 30 días</mark>; extraordinario (a petición del interesado) de hasta <mark>10 días más</mark>; solo se rechazan pruebas <mark>manifiestamente improcedentes o innecesarias</mark>, mediante resolución motivada. Informes (80): regla general <mark>facultativos y no vinculantes</mark>, emitidos en <mark>10 días</mark>; si es preceptivo y no se emite, puede suspenderse el plazo máximo.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 82 vs 83</span><span class="arub">— audiencia vs información pública</span></div>
<p><b>Audiencia:</b> inmediatamente antes de la propuesta de resolución (y antes de pedir el dictamen del Consejo de Estado), plazo <mark>no inferior a 10 días ni superior a 15</mark>; puede omitirse cuando no figuren otros hechos ni alegaciones que las aducidas por el interesado. Omitirla cuando era preceptiva = <mark>prescindir total y absolutamente del procedimiento</mark> → nulidad de pleno derecho (47.1.e). <b>Información pública:</b> abierta a cualquier persona, plazo mínimo <mark>20 días</mark>; comparecer no otorga la condición de interesado.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Audiencia: <b>10-15 días</b>; información pública: <b>mínimo 20 días</b>.</li>
<li>Prueba: 10-30 días + 10 extraordinarios; informes: 10 días, facultativos y no vinculantes.</li>
<li>Incidentes: solo la <b>recusación</b> suspende.</li>
<li>70.4: los borradores no integran el expediente (blindaje deliberativo).</li></ul></div>
`},
{id:'5.4', t:'Terminación del procedimiento y silencio (arts. 84-96, 21-24)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 84</span><span class="arub">— formas de terminación</span></div>
<p>Ponen fin al procedimiento: la <mark>resolución</mark>, el <mark>desistimiento</mark> (por el interesado), la <mark>renuncia al derecho</mark> y la <mark>declaración de caducidad</mark>. También lo produce la <mark>imposibilidad material</mark> de continuar por causas sobrevenidas (84.2) y la <mark>terminación convencional</mark> (86: acuerdos, pactos, convenios, siempre que no sean contrarios al ordenamiento ni versen sobre materias no susceptibles de transacción).</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 21, 24 y 88</span><span class="arub">— obligación de resolver y silencio</span></div>
<p>Obligación de resolución expresa <mark>en todos los procedimientos</mark> (21.1). Plazos: el que fije la norma; en su defecto, <mark>3 meses</mark> (21.3), con tope máximo de 6 salvo ley. Silencio (24): regla general <mark>estimatorio</mark>; desestimatorio en derecho de petición, transferencia de facultades sobre dominio o servicio público y <mark>responsabilidad patrimonial</mark>; en procedimientos sancionadores y de revisión el silencio siempre desestima y no extingue la obligación de resolver. La resolución es motivada y congruente (88) y decide todas las cuestiones planteadas.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 90, 91 y 95</span><span class="arub">— desistimiento, renuncia y caducidad</span></div>
<p><b>Desistimiento</b> (90): lo formula el interesado; requiere resolución expresa. <b>Renuncia</b> (91): al derecho en que se funde la solicitud. <b>Caducidad</b> (95): transcurridos <mark>3 meses</mark> sin actuaciones por causa imputable al interesado, tras requerimiento previo; no produce por sí sola la prescripción de las acciones.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 85, 86 y 91.3</span><span class="arub">— especialidades</span></div>
<p><b>Sancionadores (85):</b> el reconocimiento voluntario de responsabilidad o el pago anticipado permiten terminar con reducción de <mark>al menos el 20%</mark> por cada concepto, acumulables hasta el 40%. <b>Responsabilidad patrimonial (91.3):</b> el silencio es <mark>desestimatorio a los 6 meses</mark>. <b>Convencional (86.3):</b> requieren aprobación expresa del Consejo de Ministros los acuerdos sobre materias de su competencia directa.</p></div>
<div class="keybox"><div class="klbl">Datos de examen — la pregunta repetida 2025 y 2026</div><ul>
<li>Catálogo: resolución, desistimiento, renuncia, caducidad + imposibilidad material + convencional.</li>
<li>Plazo supletorio <b>3 meses</b>; silencio estimatorio como regla con excepciones tasadas.</li>
<li>Caducidad: 3 meses + requerimiento previo; distinta de la prescripción.</li>
<li>Sancionadores: reducciones ≥20% + ≥20% (acumulables, hasta 40%).</li></ul></div>
`},
{id:'5.5', t:'Invalidez y ejecución forzosa (arts. 47-52 y 97-105)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 47</span><span class="arub">— nulidad de pleno derecho</span></div>
<p>Siete letras tasadas: a) lesión de derechos susceptibles de <mark>amparo constitucional</mark>; b) órgano <mark>manifiestamente incompetente</mark> por materia o territorio; c) <mark>contenido imposible</mark>; d) <mark>infracción penal</mark>; e) prescindir <mark>total y absolutamente del procedimiento</mark>; f) adquisición de facultades o derechos <mark>sin los requisitos esenciales</mark>; g) cualquier otro supuesto establecido por ley. El 47.2 extiende la nulidad a las <mark>disposiciones reglamentarias</mark> contrarias a la Constitución o a normas de rango superior.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 48-52</span><span class="arub">— anulabilidad y conservación</span></div>
<p><b>Anulabilidad (48):</b> cualquier infracción del ordenamiento, incluida la <mark>desviación de poder</mark> — es la regla general. Los defectos de forma solo anulan si producen <mark>indefensión</mark>. <b>Límites (49):</b> la invalidez no se contagia a las partes independientes. <b>Convalidación (52):</b> solo actos anulables; produce efectos <mark>ex nunc</mark>; la incompetencia no determinante de nulidad la convalida el superior jerárquico. <mark>Los actos nulos jamás se convalidan</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 97-105</span><span class="arub">— ejecución forzosa</span></div>
<p>Sin resolución previa notificada no hay actuación material de ejecución que limite derechos (título, 97). Los actos son <mark>inmediatamente ejecutivos</mark>, salvo suspensión, disposición en contrario o <mark>resoluciones sancionadoras mientras quepa recurso administrativo</mark>, incluido el potestativo de reposición (98). Medios (100): <b>apremio sobre el patrimonio</b> (101, cantidad líquida, reserva de ley); <b>ejecución subsidiaria</b> (102, actos no personalísimos a costa del obligado); <b>multa coercitiva</b> (103, reiterada para cumplir, no confundir con la sanción); <b>compulsión sobre las personas</b> (104, solo obligaciones personalísimas de no hacer o soportar, con habilitación legal expresa). <b>105:</b> prohibición de acciones posesorias (interdictos) contra actuaciones de la Administración — salvo vía de hecho.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Las 7 letras del 47.1 en orden: amparo, incompetencia manifiesta, imposible, penal, procedimiento, requisitos esenciales, ley.</li>
<li>La anulabilidad es la <b>regla general</b>; solo se convalidan los anulables.</li>
<li>Sanciones: ejecutividad suspendida «ope legis» mientras quepa recurso administrativo.</li>
<li>Compulsión: únicamente obligaciones personalísimas de <b>no hacer o soportar</b>, con ley expresa.</li></ul></div>
`},
{id:'5.6', t:'Revisión de oficio y recursos administrativos (arts. 106-126)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Arts. 106-107</span><span class="arub">— revisión de oficio</span></div>
<p><b>Nulidad (106):</b> los actos nulos de pleno derecho se declaran de oficio por el <mark>Consejo de Ministros u órgano equivalente autonómico</mark> (o por el Ministro en la AGE); plazo de <mark>4 años</mark>, sin perjuicio del derecho del interesado a solicitarla en cualquier momento. <b>Lesividad (107):</b> los actos anulables se revisan mediante declaración de lesividad — plazo de <mark>2 años</mark> para declararla — y posterior recurso contencioso-administrativo.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 121-122</span><span class="arub">— recurso de alzada</span></div>
<p>Contra actos que <mark>no ponen fin a la vía administrativa</mark>, ante el <mark>órgano superior jerárquico</mark>. Plazo: <mark>1 mes</mark> (actos expresos); si no hay resolución, se puede interponer en cualquier momento (o entender desestimado a los 3 meses). Su fundamento admite los motivos de nulidad y anulabilidad (arts. 47 y 48).</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 123-124</span><span class="arub">— recurso potestativo de reposición</span></div>
<p>Contra actos que <mark>ponen fin a la vía administrativa</mark>, ante el <mark>mismo órgano que los dictó</mark>. <b>Potestativo</b>: cabe acudir directamente a la vía contencioso-administrativa. Plazo de interposición: <mark>1 mes</mark> (actos expresos); el plazo para resolver es de <mark>1 mes</mark>, y transcurrido sin notificación se entiende <mark>desestimado</mark>, habilitando el recurso contencioso-administrativo. Interpuesta la reposición, no puede acudirse a lo contencioso hasta que se resuelva o se entienda desestimada.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 125-126</span><span class="arub">— recurso extraordinario de revisión</span></div>
<p>Contra <mark>actos firmes en vía administrativa</mark>, por <b>4 motivos tasados</b>: 1) error de hecho; 2) aparición de documentos esenciales; 3) prevaricación, cohecho, violencia, maquinación o fraude; 4) dictamen emitido por causa penal. Plazos: <mark>4 años</mark> (motivos 1 y 2), <mark>3 meses</mark> desde el conocimiento (motivo 3) y <mark>1 año</mark> desde la notificación (motivo 4). Se interpone ante el órgano que dictó el acto.</p></div>
<div class="keybox"><div class="klbl">Datos de examen — pregunta 2023</div><ul>
<li>Alzada: actos no de fin de vía, superior jerárquico, 1 mes, no potestativo.</li>
<li>Reposición: fin de vía, mismo órgano, <b>potestativo</b>, impide el contencioso hasta resolver.</li>
<li>Revisión: actos firmes, 4 motivos tasados, plazos 4 años / 3 meses / 1 año.</li>
<li>Nulidad de oficio: Consejo de Ministros o Ministro, 4 años; lesividad: 2 años + contencioso.</li></ul></div>
`}
]},

prioTxt:'Preguntado en 2023 y 2024 — el epígrafe de acceso y provisión sigue virgen',
norma:'Real Decreto Legislativo 5/2015, TREBEP · BOE-A-2015-11719',
desc:'Tipos de empleado público. Los derechos y deberes de los funcionarios públicos. Acceso, promoción y provisión de puestos de trabajo.',
exam:[
{y:2023, q:'De conformidad con el RDLeg 5/2015 (TREBEP), exponer al menos tres principios de conducta que deben presidir la actuación de un empleado público.', why:'Pide principios concretos (objetividad, integridad, neutralidad...), no una descripción genérica.'},
{y:2024, q:'Definición de empleado público y enumeración de las clases recogidas en el RDLeg 5/2015 (TREBEP).', why:'Exige las cuatro clases y su definición, no el concepto en abstracto.'}
],
units:[
{id:'6.1', t:'Tipos de empleado público (arts. 1-13)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 8</span><span class="arub">— concepto y clases</span></div>
<p>Son empleados públicos quienes desempeñan funciones retribuidas en las Administraciones Públicas al servicio de los <mark>intereses generales</mark>. Cuatro clases: <mark>funcionarios de carrera, funcionarios interinos, personal laboral</mark> (fijo, por tiempo indefinido o temporal) <mark>y personal eventual</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 9</span><span class="arub">— funcionarios de carrera</span></div>
<p>Vinculados por <mark>nombramiento legal</mark>, relación <mark>estatutaria</mark> regulada por el Derecho Administrativo, para servicios de carácter <mark>permanente</mark>. Las funciones que impliquen participación directa o indirecta en el ejercicio de <mark>potestades públicas</mark> o la salvaguardia de intereses generales corresponden <mark>exclusivamente a funcionarios</mark> — la reserva funcionarial.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 10</span><span class="arub">— funcionarios interinos</span></div>
<p>Nombramiento por <mark>necesidad y urgencia</mark>, por cuatro causas tasadas: a) <mark>plazas vacantes</mark> — máximo <mark>3 años</mark> (transcurridos, fin de la interinidad); b) <mark>sustitución transitoria</mark> de titulares; c) <mark>programas temporales</mark> — máximo 3 años, ampliable 12 meses; d) <mark>exceso o acumulación de tareas</mark> — máximo 9 meses dentro de un período de 18. El nombramiento <b>nunca</b> da la condición de funcionario de carrera.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 11-13</span><span class="arub">— laboral, eventual y directivo</span></div>
<p><b>Laboral (11):</b> mediante <mark>contrato de trabajo</mark>, con selección pública conforme a igualdad, mérito y capacidad. <b>Eventual (12):</b> nombramiento no permanente para funciones de <mark>confianza o asesoramiento especial</mark>; <mark>nombramiento y cese libres</mark> (cese automático con la autoridad); su condición <b>no constituye mérito</b> para el acceso o promoción. <b>Directivo (13):</b> funciones directivas profesionales; designación por mérito y capacidad con publicidad y concurrencia; sometido a evaluación; sus condiciones de empleo <b>quedan excluidas de la negociación colectiva</b>.</p></div>
<div class="notebox"><div class="klbl">Ámbito (arts. 2-7)</div>
<p>El TREBEP se aplica a la AGE, CCAA y Ciudades de Ceuta y Melilla, EELL, organismos públicos y entidades de derecho público, y universidades públicas. El art. 2.3 equipara el personal estatutario de los Servicios de Salud al funcionario de carrera. El art. 4 enumera el personal con legislación específica propia (Cortes, órganos constitucionales, jueces y fiscales, militares, Fuerzas y Cuerpos de Seguridad, arancel, CNI, Banco de España, sociedades estatales): el TREBEP solo se les aplica si su ley lo dice.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Cuatro clases <b>en este orden</b>: carrera, interinos, laboral, eventual (pregunta 2024).</li>
<li>Interinidad por vacante: máximo <b>3 años</b>; exceso de tareas: 9 de 18 meses.</li>
<li>Eventual: libre designación y cese; <b>no es mérito</b>.</li>
<li>Reserva funcionarial: potestades públicas solo a funcionarios (9.2).</li></ul></div>
`},
{id:'6.2', t:'Derechos y deberes: el Código de Conducta (arts. 14-15 y 52-54)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 14</span><span class="arub">— derechos individuales</span></div>
<p>Catálogo de 17 letras (a-q, más j bis): a la <mark>inamovilidad</mark> del funcionario de carrera; al desempeño efectivo; a la carrera y promoción interna por igualdad, mérito y capacidad; a retribuciones e indemnizaciones; a la defensa jurídica de la Administración; a la <mark>formación continua</mark>; a la no discriminación y al respeto a la intimidad; a la conciliación; a vacaciones, permisos y licencias; a la jubilación y Seguridad Social; a la libre asociación; y a la intimidad en el uso de dispositivos digitales y a la <mark>desconexión digital</mark> (j bis).</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 15</span><span class="arub">— derechos ejercidos colectivamente</span></div>
<p>Cinco: <mark>libertad sindical, negociación colectiva, huelga</mark> (con servicios esenciales), <mark>conflicto colectivo y reunión</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 52</span><span class="arub">— principios del Código de Conducta</span></div>
<p>Los empleados actuarán con arreglo a: <mark>objetividad, integridad, neutralidad, responsabilidad, imparcialidad, confidencialidad, dedicación al servicio público, transparencia, ejemplaridad, austeridad, accesibilidad, eficacia y honradez</mark>, con respeto a la igualdad entre mujeres y hombres y promoción del entorno cultural y medioambiental.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 53-54</span><span class="arub">— principios éticos y de conducta</span></div>
<p><b>Éticos (53):</b> satisfacción del interés general sin influencias; abstención en asuntos con interés personal; secreto de las materias clasificadas y discreción sobre lo conocido por razón del cargo. <b>Conducta (54):</b> tratamiento con atención y respeto; desempeño diligente; <mark>obediencia a los superiores salvo infracción manifiesta del ordenamiento</mark> (debiendo ponerlo en conocimiento de los órganos de inspección); y rechazo de regalos, favores o servicios en condiciones ventajosas que excedan los usos habituales de cortesía.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Pregunta 2023: al menos <b>tres principios de conducta</b> — saber seis o siete de memoria.</li>
<li>Límite a la obediencia debida (54.3): infracción <b>manifiesta</b> + deber de comunicar a inspección.</li>
<li>Confidencialidad (52): puente con el secreto estadístico (art. 17 Ley 12/1989).</li>
<li>Derechos colectivos (15): sindicación, negociación, huelga, conflicto, reunión.</li></ul></div>
`},
{id:'6.3', t:'Acceso al empleo público (arts. 55-62)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Arts. 55-56</span><span class="arub">— principios y requisitos</span></div>
<p>Acceso conforme a <mark>igualdad, mérito y capacidad</mark> (23.2 y 103.3 CE), más seis principios del propio Estatuto: <mark>publicidad, transparencia, imparcialidad y profesionalidad, independencia y discrecionalidad técnica, adecuación</mark> entre pruebas y funciones <mark>y agilidad</mark>. Requisitos (56): nacionalidad española (o UE en las condiciones del art. 57); capacidad funcional; <mark>16 años</mark> como mínimo y no exceder la edad de jubilación forzosa; no haber sido separado ni inhabilitado; titulación exigida.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 59-60</span><span class="arub">— discapacidad y órganos de selección</span></div>
<p><b>59:</b> reserva mínima del <mark>7% de las vacantes</mark> para personas con discapacidad (objetivo estructural del 2% de efectivos; al menos el 2% de las plazas del cupo para discapacidad intelectual). <b>60:</b> órganos de selección <mark>colegiados</mark>, con imparcialidad y profesionalidad, tendiendo a la paridad; quedan <mark>excluidos el personal de designación política, los funcionarios interinos y el personal eventual</mark>; la pertenencia es a título individual.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 61-62</span><span class="arub">— sistemas selectivos y adquisición de la condición</span></div>
<p>Sistemas para funcionarios de carrera: <mark>oposición y concurso-oposición</mark>; el <mark>concurso solo por ley</mark> con carácter excepcional. Para laboral fijo: oposición, concurso-oposición o <mark>concurso de valoración de méritos</mark>. La valoración de méritos <mark>nunca puede determinar por sí sola el resultado</mark>. No puede proponerse el acceso de más aprobados que <mark>plazas convocadas</mark>, salvo previsión expresa. La condición de funcionario se adquiere por cumplimiento sucesivo de: <mark>superación del proceso selectivo → nombramiento publicado → acatamiento de la Constitución → toma de posesión</mark>.</p></div>
<div class="keybox"><div class="klbl">Datos de examen — el epígrafe aún sin preguntar</div><ul>
<li>Funcionarios: solo <b>oposición y concurso-oposición</b> (concurso por ley); laboral: también concurso de méritos.</li>
<li>Edad mínima de acceso: <b>16 años</b>.</li>
<li>Cupo de discapacidad: <b>7%</b> de la oferta; 2% de plazas para discapacidad intelectual.</li>
<li>4 pasos sucesivos del art. 62, en ese orden exacto.</li></ul></div>
`},
{id:'6.4', t:'Carrera, retribuciones y provisión de puestos (arts. 16-24 y 78-80)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Arts. 16-20</span><span class="arub">— carrera y evaluación</span></div>
<p>Modalidades: <mark>carrera horizontal</mark> (progresión de grado, categoría o escalón <mark>sin cambiar de puesto</mark>) y <mark>carrera vertical</mark> (ascenso en la estructura de puestos por los procedimientos de provisión), además de la promoción interna. La <b>evaluación del desempeño</b> mide la conducta profesional y el rendimiento, con criterios de transparencia, objetividad, imparcialidad y no discriminación, y produce efectos en la carrera horizontal, la formación, la provisión de puestos y las <mark>retribuciones complementarias</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 22-24</span><span class="arub">— retribuciones</span></div>
<p><b>Básicas</b> (23): <mark>sueldo</mark> asignado al subgrupo, <mark>trienios</mark> y <mark>pagas extraordinarias</mark> (mínimo dos al año). <b>Complementarias</b> (24): <mark>complemento de destino</mark> (nivel del puesto), <mark>complemento específico</mark> (características del puesto: especial dificultad, dedicación, incompatibilidad) y <mark>complemento de productividad</mark> por el desempeño extraordinario. Las cuantías se fijan en cada Ley de Presupuestos (art. 21). Los trienios del interino se reconocen con efectos retributivos solo desde la entrada en vigor del Estatuto (25.2).</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 78-80</span><span class="arub">— provisión de puestos</span></div>
<p>Principios: <mark>igualdad, mérito, capacidad y publicidad</mark>. Solo dos procedimientos: <b>concurso</b> (valoración de méritos y capacidades por <mark>órganos colegiados de carácter técnico</mark>; la antigüedad puede puntuar pero con el máximo que fije la convocatoria) y <b>libre designación con convocatoria pública</b> (apreciación discrecional de la idoneidad, reservada a puestos de especial responsabilidad; <mark>cese discrecional</mark> del titular con reasignación conforme a carrera). No cabe «oposición» para proveer puestos: la oposición es un sistema selectivo, no de provisión.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Horizontal: sin cambio de puesto; vertical: mediante provisión — la distinción más preguntada.</li>
<li>Básicas: sueldo + trienios + pagas; complementarias: destino, específico y productividad.</li>
<li>Provisión: <b>concurso + libre designación con convocatoria pública</b>, nada más.</li>
<li>Libre designación: cese igual de discrecional que el nombramiento.</li></ul></div>
`},
{id:'6.5', t:'Situaciones, pérdida de condición y régimen disciplinario (arts. 63-98)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 63</span><span class="arub">— pérdida de la condición de funcionario</span></div>
<p>Causas: <mark>renuncia</mark>; <mark>pérdida de la nacionalidad</mark>; <mark>pena de inhabilitación absoluta o especial</mark> firme para cargo público; <mark>jubilación</mark> (forzosa a los 65 años, con prórrogas hasta los 70); y <mark>separación del servicio</mark> por sanción disciplinaria firme. La <b>inhabilitación especial</b> solo produce pérdida respecto de los empleos concretos especificados en la sentencia.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Situaciones administrativas</span><span class="arub">— arts. 85-92</span></div>
<p>Activo; <b>servicios especiales</b> (alto cargo, cargos electivos, misiones internacionales); <b>excedencias</b>: voluntaria por interés particular (3 años mínimo de servicios previos), por <mark>agrupación familiar</mark>, por <mark>cuidado de hijos</mark> (hasta 3 años por cada hijo) y de <mark>cuidado de familiares</mark> (hasta 2 años, segundo grado); y <b>suspensión</b> de funciones (firme en expediente disciplinario o preventiva).</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 91-98</span><span class="arub">— régimen disciplinario</span></div>
<p>Principios de la potestad disciplinaria (94): <mark>legalidad y tipicidad, irretroactividad, proporcionalidad, culpabilidad y presunción de inocencia</mark>; exige <b>expediente disciplinario</b> con separación de fases (93) y audiencia del expedientado. <b>Faltas (95-97):</b> muy graves (incumplimiento del deber de respeto a la Constitución, discriminación, abandono del servicio, publicación o utilización indebida de secretos oficiales, notoria falta de rendimiento, acoso y violencia en el trabajo, incumplimiento de las normas de incompatibilidades), graves y leves, determinadas por ley; prescriben a los <mark>6 años, 2 años y 1 año</mark> respectivamente (96). <b>Sanciones (98):</b> <mark>separación del servicio</mark> (solo muy graves; en interinos, revocación del nombramiento), <mark>traslado forzoso</mark>, <mark>suspensión firme de funciones hasta 6 años</mark>, <mark>demérito</mark> y <mark>apercibimiento</mark>.</p></div>
<div class="notebox"><div class="klbl">Claves de comentario</div>
<p>Si un funcionario del INE vulnera el secreto estadístico, no se le aplica el Título V de la Ley 12/1989 (que excluye al personal de las AAPP), sino este régimen disciplinario del TREBEP, enlazando con el principio de confidencialidad del art. 52. La separación del servicio es la única sanción reservada en exclusiva a las faltas muy graves.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Prescripción de faltas: muy graves <b>6 años</b>, graves <b>2</b>, leves <b>1</b>.</li>
<li>Sanciones en orden: separación, traslado forzoso, suspensión (máx. 6 años), demérito, apercibimiento.</li>
<li>Excedencia por cuidado de hijos: hasta <b>3 años por hijo</b>; familiares: 2 años.</li>
<li>Reserva funcionarial del 9.2 aplicada a la coordinación estadística y el secreto (26.e Ley 12/1989).</li></ul></div>
`}
]},

/* ---------------- TEMA 7 · PGE ---------------- */
{
id:7, t:'Los Presupuestos Generales del Estado', prio:1,
prioTxt:'Sin ninguna pregunta en 4 convocatorias — tema corto, muy «listable»',
norma:'Art. 134 CE · Ley 47/2003, General Presupuestaria',
desc:'Estructura del presupuesto: clasificación de los gastos. El control interno: la Intervención General de la Administración del Estado.',

units:[
{id:'7.1', t:'Concepto, principios y clasificación de los gastos', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 134 CE</span><span class="arub">— el ciclo presupuestario</span></div>
<p>El Gobierno <mark>elabora</mark> los PGE y las Cortes Generales los <mark>aprueban</mark>. El proyecto tiene carácter de ley: cabe enmienda a la totalidad, pero no a la devolución. El Senado dispone de <mark>2 meses</mark> para vetarlo o enmendarlo (Congreso puede levantar el veto por mayoría absoluta). Aprobada una ley, el Rey la sanciona y promulga. Si no se aprueban antes del <mark>31 de diciembre</mark>, se <mark>prorrogan automáticamente</mark> los del ejercicio anterior.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 32-34 LGP</span><span class="arub">— definición y anualidad</span></div>
<p>Los PGE son la <mark>expresión cifrada, conjunta y sistemática</mark> de los derechos y obligaciones <mark>a liquidar</mark> durante el ejercicio por los órganos y entidades del sector público estatal (art. 32) — previsión y autorización, no registro de hechos consumados. Contienen los estados de gastos e ingresos. La vigencia es <mark>anual</mark> con carácter general, con excepciones (créditos plurianuales).</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 40 LGP</span><span class="arub">— las tres clasificaciones del gasto</span></div>
<p>El estado de gastos se estructura con tres clasificaciones simultáneas: a) <mark>orgánica</mark> — <b>quién gasta</b>: agrupa por secciones y servicios los créditos de los centros gestores; b) <mark>por programas (funcional)</mark> — <b>para qué se gasta</b>: agrupa los créditos según los objetivos de las políticas públicas; c) <mark>económica</mark> — <b>en qué se gasta</b>: agrupa por capítulos (1 personal; 2 gastos corrientes en bienes y servicios; 3 gastos financieros; 4 transferencias corrientes; 5 Fondo de Contingencia; 6 inversiones reales; 7 transferencias de capital; 8 activos financieros; 9 pasivos financieros).</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Principios</span><span class="arub">— presupuestarios</span></div>
<p><b>Unidad</b> (un solo presupuesto), <b>universalidad</b> (todos los ingresos y gastos), <b>especialidad</b> cualitativa (crédito para su fin específico), cuantitativa (límite máximo) y temporal (ejercicio), y <b>anualidad</b>. Las «adaptaciones» plurianuales para gastos de inversión son la excepción más frecuente.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Pregunta tipo: «explicar las tres clasificaciones y poner un ejemplo de cada una» — orgánica (sección del Ministerio), funcional (programa), económica (capítulo).</li>
<li>Definición literal del art. 32: «expresión <b>cifrada, conjunta y sistemática</b> de derechos y obligaciones <b>a liquidar</b>».</li>
<li>Senado: 2 meses para PGE (frente a 1 mes en leyes ordinarias); prórroga automática si no hay aprobación.</li></ul></div>
`},
{id:'7.2', t:'El control interno: la IGAE', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 140 LGP</span><span class="arub">— control de la gestión económico-financiera</span></div>
<p>La <mark>Intervención General de la Administración del Estado (IGAE)</mark> ejerce el <mark>control interno</mark> de la gestión económico-financiera del sector público estatal, con <mark>plena autonomía</mark> respecto de las autoridades y entidades cuya gestión controla, bajo la dirección del Ministro de Hacienda. El <mark>control externo</mark> corresponde al Tribunal de Cuentas (art. 136 CE), que remite a las Cortes el informe de fiscalización.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Tres modalidades</span><span class="arub">— de control interno</span></div>
<p><b>Función interventora:</b> control <mark>previo</mark> y<mark> pleno</mark> de los actos que den lugar al reconocimiento de derechos o a la realización de gastos, así como de los ingresos y pagos que deriven de aquéllos. Manifestación de disconformidad = <mark>reparo</mark>, con efectos <mark>suspensivos</mark> hasta que se subsane o se mantenga el acto con las responsabilidades del caso. <b>Control financiero permanente:</b> control posterior y continuado de programas, organismos y subvenciones, con informes. <b>Auditoría pública:</b> actuaciones de comprobación programadas (financieras, de cumplimiento y de gestión), que culminan en un informe de auditoría.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>IGAE = control <b>interno</b> (art. 140 LGP); Tribunal de Cuentas = control <b>externo</b> (art. 136 CE, remite a las Cortes).</li>
<li>Reparo: disconformidad con efectos <b>suspensivos</b> — el concepto más preguntado.</li>
<li>Intervención = previo; control financiero permanente = posterior; auditoría = programada.</li>
<li>Sin intervención previa, el acto es <b>ineficaz</b> — no puede ejecutarse.</li></ul></div>
`}
]},

units:[
{id:'8.1', t:'Principios generales y el Plan Estadístico Nacional (arts. 1-9)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 1</span><span class="arub">— objeto y habilitación constitucional</span></div>
<p>La ley regula la función estadística para fines estatales <mark>al amparo del art. 149.1.31ª de la Constitución</mark> — la cadena de habilitación completa.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 4.2</span><span class="arub">— los nueve principios</span></div>
<p>Las estadísticas para fines estatales se ajustarán a los principios de <mark>independencia profesional, imparcialidad, objetividad, fiabilidad, secreto estadístico, rentabilidad, transparencia, especialidad y proporcionalidad</mark> — de memorización literal obligatoria. La producción se rige por la ley, el <mark>Reglamento (CE) 223/2009</mark> y el <b>Código de Buenas Prácticas</b> de las estadísticas europeas.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 8-9</span><span class="arub">— el Plan Estadístico Nacional</span></div>
<p>El PEN es el <mark>principal instrumento ordenador</mark> de la actividad estadística de la Administración del Estado. Se aprueba por <mark>Real Decreto</mark>, tiene vigencia de <mark>cuatro años</mark> y se desarrolla mediante <mark>programas anuales</mark> (también por RD). Son «estadísticas para fines estatales» —a efectos del 149.1.31ª— las incluidas en el PEN; la ley evita una lista cerrada de materias para no dar rigidez al sistema.</p></div>
<div class="keybox"><div class="klbl">Datos de examen — PEN fue pregunta 2024</div><ul>
<li>Definición: principal instrumento ordenador; <b>RD, 4 años, programas anuales</b>.</li>
<li>Nueve principios <b>en orden</b>: independencia profesional, imparcialidad, objetividad, fiabilidad, secreto, rentabilidad, transparencia, especialidad, proporcionalidad.</li>
<li>«Fines estatales» = lo incluido en el PEN (definición operativa del art. 9).</li></ul></div>
`},
{id:'8.2', t:'Recogida de datos y secreto estadístico (arts. 10-20)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Arts. 10-11</span><span class="arub">— la recogida de datos</span></div>
<p>Fuente <mark>prioritaria</mark>: los <mark>registros administrativos</mark> (evita re-preguntar lo que la Administración ya sabe). Deber de los informantes: contestar de forma <mark>veraz, exacta, completa y dentro del plazo</mark>. El art. 11.1 impone informar sobre finalidad, obligatoriedad, protección y sanciones. El art. 11.2 es de los más preguntados: los datos susceptibles de revelar <mark>origen étnico, opiniones políticas, convicciones religiosas o ideológicas</mark> o que afecten a la intimidad son <mark>de aportación estrictamente voluntaria</mark>, incluso en estadísticas obligatorias.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 13</span><span class="arub">— datos confidenciales</span></div>
<p>Son confidenciales los datos que permiten identificar a las unidades estadísticas <mark>directa o indirectamente</mark> (directa: nombre, domicilio o identificador público; indirecta: por combinación de variables). El secreto obliga a <mark>no difundir en ningún caso</mark> los datos confidenciales.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 14-16</span><span class="arub">— alcance y excepciones</span></div>
<p>El secreto rige <mark>frente a todas las Administraciones y organismos públicos</mark> y prohíbe usar los datos para fines no estadísticos (14). La comunicación entre AAPP solo es posible si concurren tres condiciones (15.1): receptor con <mark>funciones fundamentalmente estadísticas</mark>, destino a <mark>estadísticas para fines estatales</mark> y <mark>medios para preservar el secreto</mark>. Acceso a instituciones de investigación (15.3): solo <mark>identificación indirecta</mark>, solo a instituciones (nunca a título personal) y solo para fines científicos de interés público. Excepción (16): los <mark>directorios de empresas</mark> (denominación, emplazamiento, actividad, intervalo de tamaño) no están amparados, salvo disconformidad expresa con el dato de tamaño.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 17 y 19</span><span class="arub">— obligados y plazos</span></div>
<p>El secreto obliga a <mark>todo el personal estadístico</mark>, incluidos los participantes eventuales, y se mantiene <mark>aun después de concluir sus actividades profesionales o su vinculación</mark> — es vitalicio. Plazos de consulta pública (19): no antes de <mark>25 años desde la muerte</mark> (si se conoce) o <mark>50 años desde la obtención</mark> (si no); personas jurídicas: períodos nunca inferiores a <mark>15 años</mark>; acceso por legítimo interés: al menos 25 años desde la recepción.</p></div>
<div class="keybox"><div class="klbl">Datos de examen — pregunta 2023</div><ul>
<li>«¿A quiénes obliga?» → a <b>todo el personal</b>, incluso tras dejar el servicio (17.4).</li>
<li>Directa vs indirecta (13.2): nombre/domicilio/identificador vs combinación de variables.</li>
<li>16: los directorios de empresas son la gran excepción; el dato de tamaño, salvo oposición.</li>
<li>Plazos: 25/50/15 años — no confundir con las prescripciones sancionadoras.</li></ul></div>
`},
{id:'8.3', t:'El INE y los servicios estadísticos (arts. 25-35)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 25</span><span class="arub">— naturaleza jurídica</span></div>
<p>El INE es un <mark>organismo autónomo</mark>, con <mark>personalidad jurídica y patrimonio propio</mark>, adscrito al Ministerio de Economía, Comercio y Empresa (hoy, a través de la SE de Economía y Apoyo a la Empresa). Se rige por la Ley 12/1989, su Estatuto (<mark>RD 803/2022</mark>), la Ley 40/2015 y la Ley 47/2003. Es la <mark>autoridad estadística nacional</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 26, 28 y 46</span><span class="arub">— funciones, órganos y recursos</span></div>
<p><b>Funciones (26):</b> coordinación general de los servicios estadísticos estatales; formulación del <mark>anteproyecto del PEN</mark>; aplicación y vigilancia del secreto estadístico; formación de los <mark>censos generales</mark>; y la formación del <mark>Censo Electoral</mark> conforme a la LOREG. <b>Órganos superiores (28):</b> el <mark>Consejo de Dirección y el Presidente</mark> — nombrado por el Gobierno mediante RD a propuesta del Ministro. <b>Recursos económicos (46):</b> sus <mark>asignaciones presupuestarias</mark>, los ingresos por la <mark>prestación de servicios</mark> a entidades públicas o privadas (convenios), los ingresos de sus <mark>publicaciones y venta de material estadístico</mark>, y las <mark>donaciones, herencias o legados</mark> que reciba.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 30-31 y 34-35</span><span class="arub">— neutralidad operativa y otros servicios</span></div>
<p>El INE goza de la capacidad funcional necesaria para garantizar su <mark>neutralidad operativa</mark> en las competencias técnicas (metodología, publicación y difusión, diseño de normas) y en la preservación del secreto (30). Recursos (31): sus actos se recurren en <mark>alzada ante el Ministro</mark>, salvo materia técnico-estadística o secreto, en que el <mark>Presidente agota la vía administrativa</mark>. Los <b>servicios estadísticos ministeriales</b> (34-35) son unidades con la misma neutralidad operativa, ajustándose su difusión a los criterios del INE.</p></div>
<div class="keybox"><div class="klbl">Datos de examen — recursos económicos fue pregunta 2025</div><ul>
<li>Recursos (46): <b>presupuesto + servicios + publicaciones + donaciones</b>.</li>
<li>Órganos superiores: solo dos — Consejo de Dirección y Presidente.</li>
<li>Neutralidad operativa (30) ≠ independencia orgánica: sigue adscrito al Ministerio.</li>
<li>Alzada ante el Ministro; excepción técnico/secreto: fin de vía y directo a contencioso (31).</li></ul></div>
`},
{id:'8.4', t:'La coordinación estadística: órganos (arts. 36-44)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 36</span><span class="arub">— Comisión Interministerial de Estadística</span></div>
<p>Órgano de <mark>coordinación interna de la AGE</mark>: apoya al Gobierno y a la Comisión Delegada en la elaboración del PEN y en la coordinación de los servicios estadísticos ministeriales.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 37-39</span><span class="arub">— el Consejo Superior de Estadística</span></div>
<p><mark>Órgano consultivo</mark> de los servicios estadísticos estatales. Lo <mark>preside el Ministro</mark> competente en materia de estadística. La <mark>mitad de sus consejeros</mark> pertenecen a organizaciones sindicales y empresariales y demás grupos e instituciones sociales, económicas y académicas; en todo caso están representados todos los Departamentos y el INE. <b>Funciones (38):</b> informar con carácter previo el anteproyecto del PEN, informar los programas anuales y su desarrollo, <mark>proponer la realización de nuevas estadísticas</mark> o la mejora de las existentes e informar los anteproyectos de normas con incidencia en la actividad estadística.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 42-44</span><span class="arub">— el Comité Interterritorial de Estadística</span></div>
<p>Órgano de <mark>coordinación entre la Administración del Estado y las Comunidades Autónomas</mark> en la actividad estadística. Su presidencia corresponde al <mark>Presidente del INE</mark>. Le corresponde, entre otras funciones, <mark>informar el PEN y sus programas anuales</mark> y servir de cauce de cooperación estadística entre administraciones.</p></div>
<div class="notebox"><div class="klbl">Truco de distinción — pregunta 2025</div>
<p>Tres órganos que el tribunal mezcla a propósito: <b>Consejo Superior</b> (consultivo, Estado + sociedad civil, preside el Ministro), <b>Comité Interterritorial</b> (Estado + CCAA, preside el Presidente del INE) y <b>Comisión Interministerial</b> (interna de la AGE). Cada uno coordina un nivel distinto: sociedad civil, territorio, departamentos.</p></div>
<div class="keybox"><div class="klbl">Datos de examen — el hueco pendiente del tema</div><ul>
<li>Consejo Superior: consultivo; preside el <b>Ministro</b>; mitad de consejeros de la sociedad civil.</li>
<li>Comité Interterritorial: preside el <b>Presidente del INE</b>; informa el PEN.</li>
<li>La coordinación general de todos los servicios estadísticos corresponde al <b>INE</b> (art. 26.a).</li></ul></div>
`},
{id:'8.5', t:'Infracciones y sanciones (arts. 48-53)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 48</span><span class="arub">— régimen aplicable</span></div>
<p>El Título V <mark>no se aplica a los funcionarios ni al personal laboral de las AAPP</mark> (48.2): sus infracciones se rigen por el régimen disciplinario específico (TREBEP). La <mark>potestad sancionadora corresponde al INE, a través de su Presidente</mark> (48.3). El Título V está pensado para informantes y terceros.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 50</span><span class="arub">— clasificación de las infracciones</span></div>
<p><b>Muy graves:</b> incumplimiento del <mark>secreto estadístico</mark>; <mark>utilización para fines no estadísticos</mark> de datos personales confidenciales; suministro de <mark>datos falsos</mark> comprometiendo la operación; y <mark>resistencia notoria</mark> o habitual con excusas falsas en el envío de datos. <b>Graves:</b> la no remisión o el retraso en el envío de datos y el envío de datos incompletos o inexactos, <mark>cuando causen grave perjuicio al servicio</mark>. <b>Leves:</b> esas mismas conductas <mark>sin perjuicio grave</mark>. El criterio que separa grave de leve <b>no es la conducta sino el resultado</b>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 51-53</span><span class="arub">— sanciones y prescripción</span></div>
<p>Multas: leves de <mark>60,11 a 300,51 €</mark>; graves de <mark>300,52 a 3.005,06 €</mark>; muy graves de <mark>3.005,07 a 30.050,61 €</mark> (escala aproximada ×10). Prescripción de las infracciones (52): leves a los <mark>6 meses</mark>, graves a los <mark>2 años</mark> y muy graves a los <mark>3 años</mark>. La prescripción de las sanciones (53): 1, 2 y 3 años respectivamente.</p></div>
<div class="keybox"><div class="klbl">Datos de examen — pregunta 2025</div><ul>
<li>Muy graves son <b>siempre</b>: secreto, uso desviado de datos, datos falsos y resistencia notoria.</li>
<li>Grave vs leve: la misma conducta; lo que cambia es el <b>perjuicio</b>.</li>
<li>Funcionarios fuera del Título V → régimen disciplinario del TREBEP.</li>
<li>Prescripción infracciones: <b>6 meses / 2 años / 3 años</b>; sanciones: 1/2/3 años.</li></ul></div>
`}
]},

/* ---------------- TEMA 9 · PROTECCIÓN DE DATOS ---------------- */
{
id:9, t:'Protección de Datos', prio:2,
prioTxt:'Solo preguntado una vez (2023, derechos) — el régimen estadístico sigue sin salir',
norma:'LO 3/2018, LOPDGDD · Reglamento (UE) 2016/679, RGPD',
desc:'Objeto de la ley. Principios. Derechos de las personas y su ejercicio. Régimen especial del tratamiento de datos en la función estadística pública. La AEPD: potestades de investigación y régimen sancionador.',
exam:[
{y:2023, q:'De conformidad con la LO 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, exponer tres derechos de los ciudadanos recogidos en dicha ley.', why:'Nombrar derechos concretos (acceso, rectificación, supresión, portabilidad, derechos digitales...), no describir la ley.'}
],
units:[
{id:'9.1', t:'Marco normativo y principios (RGPD y LO 3/2018)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 1 LO 3/2018</span><span class="arub">— objeto</span></div>
<p>Doble objeto: <mark>adaptar el ordenamiento al RGPD (UE) 2016/679</mark> y completarlo, y <mark>garantizar los derechos digitales</mark> de la ciudadanía. Ambos se anclan en el <mark>art. 18.4 CE</mark>. La ley protege datos de personas físicas <b>vivas</b> (los de fallecidos quedan fuera, salvo el régimen especial de acceso de familiares del art. 3).</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 5 RGPD</span><span class="arub">— principios del tratamiento</span></div>
<p><mark>Licitud, lealtad y transparencia; limitación de la finalidad; minimización de datos; exactitud; limitación del plazo de conservación; integridad y confidencialidad; y responsabilidad proactiva</mark> (accountability). Bases jurídicas del art. 6 RGPD: consentimiento, contrato, obligación legal, protección de intereses vitales, interés público o ejercicio de poderes públicos, e interés legítimo.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 8-9 LO 3/2018</span><span class="arub">— reserva de ley y categorías especiales</span></div>
<p>Las bases de «obligación legal» e «interés público/poderes públicos» exigen <mark>norma con rango de ley</mark> (art. 8) — es la cobertura de la Ley 12/1989 para el INE. En las categorías especiales (art. 9 RGPD + art. 9 LO), el <mark>solo consentimiento no basta</mark>: ideología, afiliación sindical, religión y orientación sexual requieren, además, una norma con rango de ley.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Doble objeto de la LO 3/2018, ambos sobre el art. <b>18.4 CE</b>.</li>
<li>Los siete principios del art. 5 RGPD, en su orden.</li>
<li>Reserva de ley para obligación legal e interés público — habilitación del INE sin consentimiento individual.</li></ul></div>
`},
{id:'9.2', t:'Derechos de las personas (arts. 13-18 LO + 15-22 RGPD)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Arts. 13-18 LO</span><span class="arub">— el catálogo ARSULiP</span></div>
<p>La LOPDGDD remite a los artículos del RGPD: <b>acceso</b> (13 LO / 15 RGPD), <b>rectificación</b> (14/16), <b>supresión</b> u «olvido» (15/17), <b>limitación</b> del tratamiento (16/18), <b>portabilidad</b> (17/20) y <b>oposición y decisiones automatizadas</b> (18/21-22). El solicitante tiene derecho a obtener respuesta en el plazo de <mark>un mes</mark> desde la solicitud.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Título X</span><span class="arub">— derechos digitales</span></div>
<p>Novedad española: <mark>neutralidad de la red, alfabetización digital, seguridad digital, derecho al olvido en redes sociales e intermediarios, protección de menores, identidad digital, testamento digital</mark> y derechos laborales de desconexión digital y privacidad ante dispositivos digitales de las empresas.</p></div>
<div class="keybox"><div class="klbl">Datos de examen — pregunta 2023</div><ul>
<li>Saber al menos 3-4 derechos con su artículo: acceso, rectificación, supresión, portabilidad + un derecho digital.</li>
<li>Correspondencia LO/RGPD: 13→15, 14→16, 15→17, 16→18, 17→20, 18→21-22.</li>
<li>Plazo de respuesta: <b>1 mes</b>.</li></ul></div>
`},
{id:'9.3', t:'Régimen especial: función estadística pública (art. 25 LO + 89 RGPD)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 25.1 LO 3/2018</span><span class="arub">— remisión a la legislación estadística</span></div>
<p>El tratamiento de datos por los organismos con competencias de <mark>función estadística pública</mark> se somete a su <mark>legislación específica</mark> (la Ley 12/1989), además del RGPD y de la LO — la ley estadística actúa como lex specialis.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 25.2</span><span class="arub">— comunicación de datos a órganos estadísticos</span></div>
<p>La comunicación solo se entiende amparada si la estadística viene exigida por <mark>norma de la UE o está incluida en los instrumentos de programación estadística</mark> (el PEN). El propio artículo cita el <mark>art. 11.2 de la Ley 12/1989</mark>: los datos de categorías especiales (arts. 9 y 10 RGPD) siguen siendo de aportación <mark>estrictamente voluntaria</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 25.3</span><span class="arub">— límite a los derechos ARSULiP</span></div>
<p>Los organismos estadísticos pueden <mark>denegar el ejercicio de los derechos de los arts. 15 a 22 RGPD</mark> (acceso, rectificación, supresión, limitación, portabilidad, oposición) <mark>cuando los datos estén amparados por el secreto estadístico</mark>. Es la pieza con más peso para el perfil INE: el secreto estadístico no es solo un deber de confidencialidad, también es una <b>causa legítima de restricción de derechos</b>.</p></div>
<div class="keybox"><div class="klbl">Datos de examen — el cruce que aún no ha salido</div><ul>
<li>Art. 25 = <b>el puente</b> entre LOPDGDD y Ley 12/1989: aparece en casi toda pregunta que cruce datos + estadística.</li>
<li>El secreto estadístico habilita a <b>denegar</b> derechos ARSULiP (25.3).</li>
<li>Datos sensibles en estadística: siempre voluntarios (11.2 Ley 12/1989, citado por 25.2).</li></ul></div>
`},
{id:'9.4', t:'La AEPD: investigación y régimen sancionador (arts. 44-77)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 44</span><span class="arub">— naturaleza</span></div>
<p>La AEPD es una <mark>autoridad administrativa independiente</mark> de ámbito estatal (art. 109.3 Ley 40/2015), con personalidad jurídica propia, que actúa con plena independencia y se relaciona con el Gobierno a través del <mark>Ministerio de Justicia</mark>. Es el <mark>representante común de España ante el Comité Europeo de Protección de Datos</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 51-54</span><span class="arub">— potestades de investigación</span></div>
<p>La investigación se ejerce por funcionarios con la condición de <mark>agentes de la autoridad</mark>. Deber de colaboración de responsables y encargados: su incumplimiento es <mark>resistencia a la actuación investigadora</mark> (infracción autónoma). Facultades (53): acceder a los datos, inspeccionar soportes y equipos y examinar documentación; para entrar en un <mark>domicilio constitucionalmente protegido</mark> se exige <mark>consentimiento del interesado o autorización judicial</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 72-76</span><span class="arub">— infracciones y sanciones</span></div>
<p>Tres niveles calcados del RGPD: muy graves (72 → art. 83.5 RGPD, multa hasta <mark>20 M€ o el 4%</mark> de la facturación anual global), graves (73 → 83.4, hasta <mark>10 M€ o el 2%</mark>) y leves (74, formales). Prescriben a los <mark>3, 2 y 1 años</mark>. <b>Clave para el INE (76):</b> cuando el infractor es una Administración Pública no se imponen multas, sino <mark>medidas del art. 58.2 RGPD</mark>; a la AGE, <mark>apercibimiento</mark> en lugar de multa.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>AEPD: independiente, se relaciona vía <b>Ministerio de Justicia</b>; representante ante el Comité Europeo.</li>
<li>Multas máximas: 20 M€/4% (muy graves) y 10 M€/2% (graves).</li>
<li>Una Administración Pública infractora: <b>apercibimiento</b>, no multa (art. 76).</li>
<li>Domicilio: consentimiento o autorización judicial (53).</li></ul></div>
`}
]},

/* ---------------- TEMA 10 · REGLAMENTO 223/2009 ---------------- */
{
id:10, t:'El Reglamento 223/2009 relativo a la estadística europea', prio:1,
prioTxt:'Sin preguntar en 4 convocatorias — doble rentabilidad: cruza Derecho y Producción Estadística',
norma:'Reglamento (CE) 223/2009, de 11 de marzo · Modificado por el Reglamento (UE) 2015/759',
desc:'Definición de estadísticas europeas. Principios estadísticos. Gobernanza estadística. Elaboración y difusión de estadísticas europeas.',
exam:[],
units:[
{id:'10.1', t:'El SEE y las estadísticas europeas (arts. 1-7)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 3</span><span class="arub">— definiciones clave</span></div>
<p><b>«Estadísticas»</b>: la información cuantitativa y cualitativa, <mark>agregada y representativa</mark>, que caracteriza un fenómeno colectivo en una población dada. <b>«Dato confidencial»</b>: el dato que permite identificar, <mark>directa o indirectamente, a las unidades estadísticas</mark> — el mismo estándar de la Ley 12/1989.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 4-7</span><span class="arub">— el Sistema Estadístico Europeo</span></div>
<p>El <mark>SEE</mark> es la asociación entre la autoridad estadística de la Unión (<mark>Eurostat</mark>) y las <mark>autoridades estadísticas nacionales</mark> (los «INE») de los Estados miembros, junto con los bancos centrales nacionales. Son <mark>estadísticas europeas</mark> las desarrolladas, elaboradas y difundidas por el SEE conforme al <mark>programa estadístico europeo</mark> (marco plurianual que fija ámbitos, objetivos y prioridades). Cada INE actúa como <mark>interlocutor único</mark> ante la Comisión en materia estadística (art. 5.1).</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>SEE = <b>Eurostat + autoridades nacionales (INE) + bancos centrales</b>.</li>
<li>Estadísticas europeas = las producidas conforme al <b>programa estadístico europeo</b>.</li>
<li>El INE español encaja en la figura del art. 5: interlocutor único de cada Estado.</li></ul></div>
`},
{id:'10.2', t:'Principios estadísticos y Código de Buenas Prácticas (art. 2)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 2</span><span class="arub">— seis principios europeos</span></div>
<p>a) <mark>Independencia profesional</mark>: libre de presiones políticas o de interés, nacionales o de la Unión; b) <mark>imparcialidad</mark>: igual trato a todos los usuarios; c) <mark>objetividad</mark>: normas profesionales y éticas transparentes; d) <mark>fiabilidad</mark>: representar la realidad de forma fiel, exacta y coherente; e) <mark>secreto estadístico</mark>: protección de los datos confidenciales con prohibición de uso no estadístico y de revelación ilegal; f) <mark>rentabilidad</mark>: costes proporcionados a la importancia de los resultados.</p></div>
<div class="notebox"><div class="klbl">Trampa clásica de examen</div>
<p>La lista europea tiene <b>seis</b> principios; la española (art. 4.2 Ley 12/1989) tiene <b>nueve</b>: añade <b>transparencia, especialidad y proporcionalidad</b>. Las seis primeras coinciden en sustancia. El <b>Código de Buenas Prácticas de las Estadísticas Europeas</b> desarrolla estos principios en 15 principios con indicadores, y su cumplimiento se evalúa mediante revisiones por pares.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Seis europeos vs nueve españoles — <b>no son listas idénticas</b>.</li>
<li>Independencia profesional: «libre de toda presión», el más citado.</li>
<li>El CBPE es la base del Tema 16 de Producción Estadística: doble rentabilidad.</li></ul></div>
`},
{id:'10.3', t:'Gobernanza, elaboración y secreto (arts. 12-23)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Gobernanza</span><span class="arub">— CSEE y CAE</span></div>
<p>El <b>Comité del Sistema Estadístico Europeo (CSEE)</b> es el órgano que asiste a la Comisión en la coordinación del programa estadístico y en el desarrollo metodológico; lo componen representantes de los Estados miembros. El <b>Comité Asesor Estadística Europea (CAE)</b> asesora a la Comisión desde la perspectiva de los usuarios y de la sociedad civil.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 17 bis + 20</span><span class="arub">— fuentes y secreto</span></div>
<p>Las autoridades nacionales pueden <mark>acceder a registros administrativos y a otras fuentes</mark> para producir estadísticas europeas. Los datos confidenciales obtenidos para la producción de estadísticas europeas se usarán <mark>exclusivamente con fines estadísticos</mark>, salvo consentimiento inequívoco de las unidades. El personal de los INE con acceso a datos confidenciales está obligado a respetar la confidencialidad <mark>incluso después de haber cesado en sus funciones</mark> — paralelo exacto del art. 17 de la Ley 12/1989.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>El secreto europeo también es <b>vitalicio</b> (20.5 ↔ 17.4 Ley 12/1989).</li>
<li>Acceso a registros administrativos para fines estadísticos: 17 bis (mod. 2015/759).</li>
<li>Acceso con fines científicos: solo a microdatos que no permitan identificación directa, con decisión de la Comisión (art. 23).</li></ul></div>
`}
]},

/* ---------------- TEMA 11 · ADMINISTRACIÓN ELECTORAL ---------------- */
{
id:11, t:'La Administración electoral española', prio:4,
prioTxt:'Muy trabajado (2023, 2024, 2026) — queda el acceso a datos censales y padronales',
norma:'LO 5/1985, LOREG · Ley 7/1985, LRBRL (padrón)',
desc:'Organización y competencias de la Oficina del Censo Electoral. El Censo Electoral: inscripción, formación y rectificación. Acceso a los datos censales. El padrón municipal. El Consejo de Empadronamiento. Acceso a los datos del padrón.',
