{t:1,f:'Plazo máximo de detención preventiva (art. 17.2 CE)',b:'<b>72 horas</b>: en ese plazo el detenido debe ser puesto en libertad o a disposición de la autoridad judicial. Complemento: <i>habeas corpus</i> (17.4).'},
{t:1,f:'¿Qué apartado de la CE habilita la legislación de protección de datos?',b:'El <b>art. 18.4</b>: la ley limitará el uso de la informática para garantizar el honor y la intimidad.'},
{t:1,f:'En el art. 20, ¿qué derecho exige información «veraz»?',b:'Solo al derecho a <b>comunicar o recibir información</b> (20.1.d). La libertad de expresión (20.1.a) no exige veracidad.'},
{t:1,f:'¿Qué derechos puede ejercer un extranjero por reciprocidad?',b:'El <b>sufragio activo y pasivo en elecciones municipales</b> (art. 13.2).'},
{t:1,f:'Único derecho de la Sección 2ª del Título I con recurso de amparo',b:'La <b>objeción de conciencia</b> (art. 30.2, por remisión del 53.2).'},
{t:1,f:'¿Qué artículos ampara el recurso de amparo ante el TC (53.2)?',b:'El <b>art. 14</b> y la <b>Sección 1ª del Cap. II (arts. 15-29)</b>.'},
{t:1,f:'El Defensor del Pueblo: naturaleza y ley reguladora',b:'<b>Alto comisionado de las Cortes Generales</b>, designado por éstas; supervisa la Administración. Ley: <b>LO 3/1981</b>.'},
{t:1,f:'Tres materias reservadas a ley orgánica (art. 81.1)',b:'Desarrollo de los <b>derechos fundamentales y libertades públicas</b>, <b>Estatutos de Autonomía</b>, <b>régimen electoral general</b> (+ las demás que la CE prevea). Mayoría absoluta del Congreso.'},

/* --- Tema 2 · Corona y Cortes --- */
{t:2,f:'¿Qué artículo declara al Rey inviolable y no sujeto a responsabilidad?',b:'El <b>art. 56.3</b>: sus actos están siempre refrendados, salvo lo dispuesto en el 65.2.'},
{t:2,f:'Orden regular de sucesión a la Corona (art. 57)',b:'<b>Primogenitura y representación</b>: línea anterior a las posteriores; grado más próximo; en el mismo grado, el varón a la mujer; en el mismo sexo, la mayor edad.'},
{t:2,f:'¿Cuántas personas puede nombrar las Cortes para una Regencia?',b:'<b>Una, tres o cinco</b> personas (art. 59.3) — siempre número impar.'},
{t:2,f:'¿Quién refrenda la propuesta y el nombramiento del Presidente del Gobierno?',b:'El <b>Presidente del Congreso</b> (art. 64.1), junto con la disolución prevista en el art. 99.'},
{t:2,f:'¿Puede el Rey autorizar indultos generales (art. 62.i)?',b:'<b>No</b>: el derecho de gracia se ejerce con arreglo a la ley, que no puede autorizar indultos generales.'},
{t:2,f:'¿Qué se requiere para declarar la guerra (art. 63.3)?',b:'Corresponde al Rey <b>previa autorización de las Cortes Generales</b>.'},
{t:2,f:'Las dos facultades no refrendadas del Rey (art. 65.2)',b:'La <b>distribución de su dotación presupuestaria global</b> y el <b>nombramiento y relevo libre de los miembros civiles y militares de su Casa</b>.'},
{t:2,f:'Composición numérica del Congreso (art. 68)',b:'Mínimo <b>300</b> y máximo <b>400</b> diputados (la LOREG fija 350). Circunscripción: la provincia; Ceuta y Melilla, 1 diputado cada una. Mandato: 4 años.'},
{t:2,f:'Composición del Senado (art. 69)',b:'Cámara de representación territorial: <b>4 senadores por provincia</b> por elección directa + <b>1 por CCAA y otro más por cada millón de habitantes</b> designados por las Asambleas.'},
{t:2,f:'Inviolabilidad vs. inmunidad parlamentarias (art. 71)',b:'<b>Inviolabilidad</b>: por las opiniones, permanente. <b>Inmunidad</b>: procesal, durante el mandato; detención solo por flagrante delito y procesamiento previo suplicatorio. Fuero: Sala de lo Penal del TS.'},
{t:2,f:'Periodos ordinarios de sesiones de las Cámaras',b:'Dos: <b>septiembre a diciembre</b> y <b>febrero a junio</b> (art. 73.1).'},
{t:2,f:'Materias excluidas de la delegación en Comisiones Legislativas (art. 75.3)',b:'Reforma constitucional, cuestiones internacionales, <b>leyes orgánicas y de bases</b>, y <b>Presupuestos Generales del Estado</b>.'},
{t:2,f:'Número mínimo de miembros de la Diputación Permanente',b:'<b>21 miembros</b>, representando a los grupos parlamentarios; existe una por Cámara (art. 78).'},
{t:2,f:'Requisitos del decreto-ley (art. 86 CE)',b:'<b>Extraordinaria y urgente necesidad</b>; excluidas instituciones del Estado, derechos del Título I, CCAA, derecho electoral e internacional; <b>convalidación por el Congreso en 30 días</b>.'},
{t:2,f:'¿Cuántas firmas exige la iniciativa legislativa popular y qué exclusiones tiene?',b:'<b>500.000 firmas</b> (art. 87.3). Excluidas: materias propias de LO, tributarias o internacionales, y prerrogativa de gracia.'},
{t:2,f:'Efectos del veto del Senado a un proyecto de ley (art. 90)',b:'Veto por mayoría absoluta: el Congreso lo levanta por <b>mayoría absoluta</b> o por <b>mayoría simple pasados 2 meses</b>. Las enmiendas se aprueban por mayoría simple.'},
{t:2,f:'Plazo del que dispone el Rey para sancionar y promulgar las leyes',b:'<b>15 días</b> desde su aprobación (art. 91).'},
{t:2,f:'Umbral de investidura fallida que provoca disolución y nuevas elecciones',b:'Si en <b>2 meses</b> desde la primera votación ningún candidato obtiene la confianza del Congreso (art. 99.5). Primera votación: mayoría absoluta; segunda a las 48 h: mayoría simple.'},

/* --- Tema 3 · Gobierno y Administración --- */
{t:3,f:'¿Quiénes componen el Gobierno según la Ley 50/1997?',b:'<b>Presidente, Vicepresidente(s) y Ministros</b> — la ley no añade más miembros: los Secretarios de Estado no son miembros del Gobierno.'},
{t:3,f:'Las cuatro causas de cese del Gobierno (art. 101)',b:'<b>Elecciones generales, pérdida de confianza parlamentaria, dimisión o fallecimiento</b> del Presidente. El cesante continúa en funciones.'},
{t:3,f:'Los cinco principios de actuación de la Administración (art. 103.1 CE, en orden)',b:'<b>Eficacia, jerarquía, descentralización, desconcentración y coordinación</b>.'},
{t:3,f:'Diferencia entre descentralización y desconcentración',b:'Descentralización: transfiere competencias a <b>otro ente con personalidad jurídica propia</b>. Desconcentración: las transfiere a <b>un órgano inferior del mismo ente</b>.'},
{t:3,f:'¿Qué carácter tienen las deliberaciones del Consejo de Ministros?',b:'<b>Secretas</b> (art. 5.3 Ley 50/1997) — no sus acuerdos, que se publican.'},
{t:3,f:'¿Quién puede crear, modificar y suprimir Ministerios y Secretarías de Estado?',b:'El <b>Presidente del Gobierno</b>, por Real Decreto (art. 2.1.j Ley 50/1997).'},
{t:3,f:'Órganos superiores de la AGE (art. 55 Ley 40/2015)',b:'<b>Ministros y Secretarios de Estado</b>.'},
{t:3,f:'Órganos directivos de la AGE (art. 55 Ley 40/2015)',b:'<b>Subsecretarios, Secretarios Generales, Secretarios Generales Técnicos, Directores Generales y Subdirectores Generales</b>.'},
{t:3,f:'¿La delegación de firma requiere publicación? ¿En qué materia está prohibida?',b:'<b>No requiere publicación</b> ni altera la competencia (art. 18). Está <b>prohibida en materia sancionadora</b>.'},
{t:3,f:'Causas de suplencia de un titular de órgano (art. 19 Ley 40/2015)',b:'<b>Vacante, ausencia o enfermedad</b>, y los casos de abstención o recusación declaradas.'},
{t:3,f:'¿Ante quién se recurren en alzada los actos del INE?',b:'Ante el <b>Ministro</b>; pero en materia técnico-estadística o de secreto estadístico, el Presidente del INE <b>agota la vía administrativa</b> (art. 31 Ley 12/1989).'},
{t:3,f:'¿Quién nombra al Delegado del Gobierno y con qué rango?',b:'Lo nombra y separa el <b>Presidente del Gobierno por Real Decreto</b>; tiene <b>rango de Subsecretario</b> y depende directamente del Presidente.'},
{t:3,f:'Las dos Secretarías de Estado del Ministerio de Economía, Comercio y Empresa',b:'<b>Economía y Apoyo a la Empresa</b> («hacia dentro») y <b>Comercio</b> («hacia fuera»). Reglas: RD 829/2023 (creación), RD 1009/2023 y RD 410/2024 (estructura).'},
{t:3,f:'Organismos adscritos a través de la SE de Economía y Apoyo a la Empresa',b:'<b>INE</b> (organismo autónomo), <b>ICO</b> (EPE), <b>CNMC</b>, <b>CNMV</b> y <b>FROB</b> (estos tres como autoridades independientes) — art. 2.7 RD 410/2024.'},

/* --- Tema 4 · Territorial --- */
{t:4,f:'Las tres entidades territoriales del art. 137 CE',b:'<b>Municipios, provincias y Comunidades Autónomas</b> — todas con autonomía para la gestión de sus intereses.'},
{t:4,f:'¿Qué norma es cada Estatuto de Autonomía y quién lo aprueba?',b:'La <b>norma institucional básica</b> de cada CA, aprobada como <b>ley orgánica</b> (art. 147.2).'},
{t:4,f:'El fundamento constitucional del INE como competencia estatal',b:'El <b>art. 149.1.31ª</b>: «Estadística para fines estatales» — citado por el art. 1 de la Ley 12/1989.'},
{t:4,f:'Regla de cierre del reparto competencial (art. 149.3)',b:'Lo no atribuido expresamente al Estado puede corresponder a las CCAA por sus Estatutos (<b>cláusula residual</b>); lo no asumido queda en el Estado; el <b>derecho estatal es supletorio</b> siempre.'},
{t:4,f:'Las tres leyes del art. 150 CE',b:'<b>Leyes marco</b> (150.1, normas estatales de principios), <b>de transferencia o delegación</b> (150.2, mediante LO) y <b>de armonización</b> (150.3, por interés general y mayoría absoluta).'},
{t:4,f:'¿Qué mayoría exige la ley de armonización?',b:'El aprecio de la necesidad se hará por <b>mayoría absoluta de cada Cámara</b> (150.3).'},
{t:4,f:'El artículo del control estatal sobre las CCAA que impone medidas tras un requerimiento',b:'El <b>art. 155</b>: requiere incumplimiento constitucional o grave perjuicio del interés general; autorización previa del <b>Senado</b>.'},
{t:4,f:'Competencias del Municipio «en todo caso» (art. 25 LRBRL)',b:'Entre otras: urbanismo, medio ambiente urbano, abastecimiento de agua, infraestructura viaria, seguridad en espacios públicos, tráfico, protección civil, policía local y servicios sociales.'},
{t:4,f:'Servicios mínimos obligatorios en todos los municipios (art. 26)',b:'Alumbrado público, cementerio, recogida de residuos, limpieza viaria, abastecimiento domiciliario de agua, alcantarillado, acceso a los núcleos y pavimentación de las vías públicas.'},
{t:4,f:'Servicios adicionales a partir de 20.000 habitantes',b:'Protección civil, servicios sociales, prevención y extinción de incendios e instalaciones deportivas de uso público (a los de todos y de 5.000).'},
{t:4,f:'Fines propios de la Provincia (art. 31 LRBRL)',b:'Garantizar los principios de <b>solidaridad y equilibrio intermunicipales</b>: asegurar la prestación integral de los servicios municipales y participar en la coordinación local.'},
{t:4,f:'¿Qué garantiza la Diputación en municipios de menos de 1.000 habitantes?',b:'La prestación de los servicios de <b>secretaría e intervención</b> (art. 36.1.b LRBRL).'},

/* --- Tema 5 · Procedimiento --- */
{t:5,f:'Cuatro vías de iniciación de oficio (art. 58 Ley 39/2015)',b:'<b>Propia iniciativa, orden superior, petición razonada y denuncia</b>.'},
{t:5,f:'¿La denuncia otorga la condición de interesado? ¿Y la petición razonada vincula?',b:'La denuncia <b>no confiere por sí sola la condición de interesado</b> (62.5). La petición razonada <b>no vincula</b> al órgano competente (61.2).'},
{t:5,f:'Reglas de oro del procedimiento sancionador (art. 63)',b:'Se inician <b>siempre de oficio</b> y con <b>separación orgánica entre instrucción y sanción</b>.'},
{t:5,f:'Plazo de subsanación de una solicitud defectuosa y su consecuencia',b:'<b>10 días</b>, bajo apercibimiento de <b>desistimiento</b> — siempre mediante resolución expresa (art. 68).'},
{t:5,f:'Declaración responsable vs. comunicación (art. 69)',b:'La declaración responsable manifiesta el <b>cumplimiento de requisitos</b>; la comunicación solo pone <b>datos en conocimiento</b> de la Administración. Ambas producen efectos desde su presentación.'},
{t:5,f:'¿Qué no forma parte del expediente administrativo (art. 70.4)?',b:'Las notas, borradores, opiniones, resúmenes, comunicaciones e informes internos — <b>salvo los informes preceptivos o facultativos solicitados antes de resolver</b>.'},
{t:5,f:'Plazo del trámite de audiencia (art. 82)',b:'<b>No inferior a 10 días ni superior a 15</b>, antes de la propuesta de resolución y antes del dictamen del Consejo de Estado.'},
{t:5,f:'Plazo mínimo de información pública (art. 83)',b:'<b>20 días</b> — y comparecer no otorga la condición de interesado.'},
{t:5,f:'Período de prueba: ordinario y extraordinario (art. 77)',b:'Ordinario: <b>entre 10 y 30 días</b>. Extraordinario (a petición del interesado): hasta <b>10 días más</b>.'},
{t:5,f:'Régimen general de los informes (art. 80)',b:'<b>Facultativos y no vinculantes</b>, emitidos en <b>10 días</b>, salvo norma en contrario.'},
{t:5,f:'¿Qué cuestiones incidentales suspenden la tramitación? (art. 74)',b:'Ninguna, <b>salvo la recusación</b>.'},
{t:5,f:'Las formas de terminación del procedimiento (art. 84)',b:'<b>Resolución, desistimiento, renuncia y caducidad</b> + imposibilidad material (84.2) y terminación convencional (86).'},
{t:5,f:'Plazo supletorio para resolver y silencio general',b:'Supletorio: <b>3 meses</b> (21.3). Silencio: <b>estimatorio</b> como regla, salvo las excepciones tasadas (24).'},
{t:5,f:'Tres supuestos de silencio desestimatorio',b:'Derecho de petición, transferencia de facultades sobre <b>dominio o servicio público</b>, y <b>responsabilidad patrimonial</b> (también en sancionadores y revisión).'},
{t:5,f:'Plazo y requisitos de la caducidad (art. 95)',b:'<b>3 meses</b> sin actuaciones por causa imputable al interesado, previo <b>requerimiento</b>; se declara por resolución.'},
{t:5,f:'Reducciones en sancionadores por reconocimiento o pago (art. 85)',b:'Al menos <b>20%</b> por reconocimiento de responsabilidad y <b>20%</b> por pago voluntario — <b>acumulables</b> hasta el 40%.'},
{t:5,f:'Las siete letras de la nulidad de pleno derecho (art. 47.1)',b:'a) amparo constitucional; b) incompetencia manifiesta; c) contenido imposible; d) infracción penal; e) prescindir total y absolutamente del procedimiento; f) adquisición de derechos sin requisitos esenciales; g) supuesto previsto por ley.'},
{t:5,f:'¿Qué actos son convalidables y con qué efecto? (art. 52)',b:'Solo los <b>anulables</b>, con efectos <b>ex nunc</b>. La incompetencia la convalida el superior jerárquico. Los nulos nunca.'},
{t:5,f:'Excepción a la ejecutividad inmediata de los actos (art. 98.1.b)',b:'Las <b>resoluciones sancionadoras</b> no son ejecutivas mientras quepa algún recurso administrativo, incluido el potestativo de reposición.'},
{t:5,f:'Los cinco medios de ejecución forzosa (art. 100)',b:'Apremio sobre el patrimonio, ejecución subsidiaria, multa coercitiva, compulsión sobre las personas y prohibición de acciones posesorias (interdictos).'},
{t:5,f:'Plazos de revisión: nulidad de oficio y lesividad',b:'Nulidad de pleno derecho: <b>4 años</b> (la puede pedir el interesado en cualquier momento). Lesividad: <b>2 años</b> para declararla + contencioso.'},
{t:5,f:'Los tres recursos administrativos y su órgano',b:'<b>Alzada</b> (superior jerárquico), <b>reposición potestativa</b> (mismo órgano) y <b>revisión extraordinaria</b> (mismo órgano, actos firmes, 4 motivos tasados).'},
{t:5,f:'Plazos: interponer alzada y reposición',b:'Alzada: <b>1 mes</b> desde la notificación. Reposición: <b>1 mes</b>; resolución en 1 mes y silencio desestimatorio.'},
{t:5,f:'Los cuatro motivos del recurso extraordinario de revisión',b:'Error de hecho; aparición de documentos esenciales; prevaricación, cohecho, violencia, maquinación o fraude; y dictamen emitido por causa penal.'},

/* --- Tema 6 · TREBEP --- */
{t:6,f:'Las cuatro clases de empleado público (art. 8 TREBEP)',b:'<b>Funcionarios de carrera, funcionarios interinos, personal laboral</b> (fijo, indefinido o temporal) <b>y personal eventual</b>.'},
{t:6,f:'Tres notas del funcionario de carrera (art. 9)',b:'<b>Nombramiento legal, relación estatutaria</b> de Derecho Administrativo y carácter <b>permanente</b>. Reserva: potestades públicas solo a funcionarios.'},
{t:6,f:'Causas del nombramiento interino con sus plazos (art. 10)',b:'Vacante: máx. <b>3 años</b>. Sustitución transitoria. Programa temporal: <b>3 años + 12 meses</b>. Exceso de tareas: <b>9 meses dentro de 18</b>.'},
{t:6,f:'Dos rasgos del personal eventual (art. 12)',b:'Funciones de <b>confianza o asesoramiento especial</b>, con <b>nombramiento y cese libres</b>; su condición <b>no es mérito</b> para el acceso ni la promoción.'},
{t:6,f:'¿Pueden los interinos y eventuales formar parte de los órganos de selección?',b:'<b>No</b> (art. 60.2): tampoco el personal de designación política.'},
{t:6,f:'Los cinco derechos individuales ejercidos colectivamente (art. 15)',b:'<b>Libertad sindical, negociación colectiva, huelga, conflicto colectivo y reunión</b>.'},
{t:6,f:'Al menos seis principios del Código de Conducta (art. 52)',b:'Objetividad, integridad, neutralidad, responsabilidad, imparcialidad, confidencialidad, dedicación, transparencia, ejemplaridad, austeridad, accesibilidad, eficacia, honradez.'},
{t:6,f:'Límite a la obediencia jerárquica (art. 54.3)',b:'Se obedecen las órdenes <b>salvo que constituyan infracción manifiesta del ordenamiento</b>, en cuyo caso se ponen en conocimiento de los órganos de inspección.'},
{t:6,f:'Requisitos generales para el acceso al empleo público (art. 56)',b:'Nacionalidad; capacidad funcional; <b>16 años</b> como mínimo (hasta la jubilación forzosa); no haber sido separado ni inhabilitado; titulación exigida.'},
{t:6,f:'Sistemas selectivos para funcionarios de carrera (art. 61)',b:'<b>Oposición y concurso-oposición</b>; el concurso, solo por ley y con carácter excepcional. Los méritos nunca deciden por sí solos el resultado.'},
{t:6,f:'Los cuatro pasos sucesivos para adquirir la condición de funcionario (art. 62)',b:'<b>Superación del proceso selectivo → nombramiento publicado → acatamiento de la Constitución → toma de posesión</b>.'},
{t:6,f:'Cupo de reserva para personas con discapacidad (art. 59)',b:'Mínimo <b>7% de las vacantes</b> ofertadas (al menos el 2% del cupo para discapacidad intelectual); objetivo estructural del 2% de los efectivos.'},
{t:6,f:'Carrera horizontal vs. vertical (art. 16)',b:'Horizontal: progresión de grado o escalón <b>sin cambiar de puesto</b>. Vertical: ascenso en la estructura de puestos <b>mediante provisión</b>.'},
{t:6,f:'Efectos de la evaluación del desempeño (arts. 18 y 20)',b:'Carrera horizontal, formación, provisión de puestos y <b>retribuciones complementarias</b>.'},
{t:6,f:'Las retribuciones básicas y complementarias del funcionario',b:'Básicas: <b>sueldo, trienios y pagas extraordinarias</b>. Complementarias: <b>complemento de destino, específico y de productividad</b>.'},
{t:6,f:'Los dos procedimientos de provisión de puestos de trabajo (art. 78)',b:'<b>Concurso</b> (méritos, órgano colegiado técnico) y <b>libre designación con convocatoria pública</b> (idoneidad, cese discrecional).'},
{t:6,f:'Causas de pérdida de la condición de funcionario (art. 63)',b:'Renuncia, pérdida de nacionalidad, <b>inhabilitación absoluta o especial firme</b>, jubilación y <b>separación del servicio</b> firme.'},
{t:6,f:'Prescripción de faltas disciplinarias (art. 96)',b:'Muy graves: <b>6 años</b>. Graves: <b>2 años</b>. Leves: <b>1 año</b>.'},
{t:6,f:'Las cinco sanciones disciplinarias (art. 98)',b:'<b>Separación del servicio</b> (solo muy graves), <b>traslado forzoso, suspensión firme hasta 6 años, demérito y apercibimiento</b>.'},
{t:6,f:'Vacaciones anuales del funcionario (art. 50)',b:'<b>22 días hábiles</b> por año completo de servicio; los <b>sábados no son días hábiles</b> a estos efectos.'},

/* --- Tema 7 · PGE --- */
{t:7,f:'¿Quién elabora y quién aprueba los PGE?',b:'Los <b>elabora el Gobierno</b> y los <b>aprueban las Cortes Generales</b> (art. 134.1 CE).'},
{t:7,f:'¿Qué ocurre si los PGE no se aprueban antes del 31 de diciembre?',b:'Se <b>prorrogan automáticamente</b> los del ejercicio anterior (art. 134.2 CE).'},
{t:7,f:'Definición de los PGE (art. 32 LGP)',b:'La <b>expresión cifrada, conjunta y sistemática</b> de los derechos y obligaciones <b>a liquidar</b> durante el ejercicio por el sector público estatal.'},
{t:7,f:'Las tres clasificaciones del gasto y su pregunta',b:'<b>Orgánica</b> (quién gasta: secciones y servicios), <b>por programas/funcional</b> (para qué: objetivos) y <b>económica</b> (en qué: capítulos).'},
{t:7,f:'Plazo del Senado para tramitar los PGE',b:'<b>2 meses</b> para vetar (mayoría absoluta) o enmendar — frente al mes de las leyes ordinarias.'},
{t:7,f:'¿Puede presentarse una enmienda a la devolución de los PGE?',b:'<b>No</b>: solo cabe enmienda a la totalidad (de aumento o disminución) y enmiendas parciales.'},
{t:7,f:'¿Qué control ejerce la IGAE y con qué autonomía?',b:'El <b>control interno</b> de la gestión económico-financiera del sector público estatal, con <b>plena autonomía</b> respecto de las entidades que controla (art. 140 LGP).'},
{t:7,f:'¿Quién ejerce el control externo del sector público?',b:'El <b>Tribunal de Cuentas</b>, que remite a las Cortes una relación justificada (art. 136 CE).'},
{t:7,f:'¿Qué es el reparo de la intervención?',b:'La manifestación formal de disconformidad del interventor con un acto, con <b>efectos suspensivos</b> hasta su subsanación o mantenimiento con responsabilidades.'},
{t:7,f:'Las tres modalidades de control interno de la IGAE',b:'<b>Función interventora</b> (previa), <b>control financiero permanente</b> (posterior y continuo) y <b>auditoría pública</b> (comprobación programada).'}
];
/* ================= DATOS: FLASHCARDS (temas 8-14) ================= */
