/* --- Tema 8 · Ley 12/1989 --- */
{t:8,f:'Habilitación constitucional de la Ley 12/1989',b:'El <b>art. 149.1.31ª</b> CE: «Estadística para fines estatales» — citado literalmente por su art. 1.'},
{t:8,f:'Los nueve principios de la función estadística pública (art. 4.2)',b:'<b>Independencia profesional, imparcialidad, objetividad, fiabilidad, secreto estadístico, rentabilidad, transparencia, especialidad y proporcionalidad</b>.'},
{t:8,f:'¿Qué aprueba el PEN, con qué instrumento y qué vigencia tiene?',b:'Es el <b>principal instrumento ordenador</b>; se aprueba por <b>Real Decreto</b> y dura <b>4 años</b>, con desarrollo por programas anuales (también por RD).'},
{t:8,f:'Cuándo es una estadística «para fines estatales» (art. 9)',b:'Cuando está <b>incluida en el PEN</b> — no hay lista cerrada de materias (la ley evita la rigidez).'},
{t:8,f:'Fuente prioritaria de información estadística (art. 10.1)',b:'Los <b>registros administrativos</b>, para reducir la carga sobre los informantes.'},
{t:8,f:'Deber de los informantes al suministrar datos (art. 10.4)',b:'Contestar de forma <b>veraz, exacta, completa y dentro del plazo</b>.'},
{t:8,f:'¿Qué datos son de aportación estrictamente voluntaria? (art. 11.2)',b:'Los que revelen <b>origen étnico, opiniones políticas, convicciones religiosas o ideológicas</b> o afecten a la intimidad — incluso en estadísticas obligatorias.'},
{t:8,f:'Identificación directa vs. indirecta (art. 13.2)',b:'Directa: por <b>nombre, domicilio o número de identificación públicamente accesible</b>. Indirecta: por cualquier otro medio (combinación de variables).'},
{t:8,f:'¿Frente a quién rige el secreto estadístico? (art. 14)',b:'Frente a <b>todas las Administraciones y organismos públicos</b>, con prohibición de usar los datos para fines no estadísticos.'},
{t:8,f:'Las tres condiciones para comunicar datos entre AAPP (art. 15.1)',b:'Receptor con <b>funciones fundamentalmente estadísticas</b>, destino a <b>estadísticas para fines estatales</b> y <b>medios para preservar el secreto</b>.'},
{t:8,f:'Condiciones del acceso a datos con fines de investigación (art. 15.3)',b:'Solo <b>identificación indirecta</b>, solo a <b>instituciones</b> (no a título personal) y solo para <b>fines científicos de interés público</b>.'},
{t:8,f:'¿Qué directorios no están amparados por el secreto? (art. 16)',b:'Las relaciones de <b>establecimientos y empresas</b>: denominación, emplazamiento, actividad e intervalo de tamaño (salvo disconformidad expresa con el dato de tamaño).'},
{t:8,f:'¿Cuándo caduca el deber de secreto del personal estadístico?',b:'<b>Nunca</b>: se mantiene aun después de concluir sus actividades profesionales o su vinculación (art. 17.4).'},
{t:8,f:'Plazos de consulta pública de datos individuales (art. 19)',b:'Personas físicas: <b>25 años desde la muerte</b> (conocida) o <b>50 años desde la obtención</b> (desconocida). Personas jurídicas: nunca inferior a <b>15 años</b>.'},
{t:8,f:'Naturaleza jurídica del INE (art. 25)',b:'<b>Organismo autónomo</b> con personalidad jurídica y patrimonio propio, adscrito hoy al Ministerio de Economía, Comercio y Empresa. Es la <b>autoridad estadística nacional</b>. Estatuto: RD 803/2022.'},
{t:8,f:'Los dos órganos superiores del INE (art. 28)',b:'El <b>Consejo de Dirección y el Presidente</b> (nombrado por el Gobierno mediante RD a propuesta del Ministro).'},
{t:8,f:'¿Qué garantiza la «neutralidad operativa» del INE? (art. 30)',b:'La capacidad funcional en las competencias técnicas (metodología, publicación y difusión, diseño de normas) y en la preservación del secreto — no es independencia orgánica.'},
{t:8,f:'Recursos económicos del INE (art. 46)',b:'<b>Asignaciones presupuestarias, prestación de servicios</b> (convenios y encargos), <b>publicaciones y venta de material estadístico</b>, y <b>donaciones, herencias o legados</b>.'},
{t:8,f:'Los tres órganos de coordinación estadística y quién los preside',b:'<b>Consejo Superior de Estadística</b> (consultivo; preside el Ministro), <b>Comité Interterritorial</b> (Estado-CCAA; preside el Presidente del INE) y <b>Comisión Interministerial</b> (interna de la AGE).'},
{t:8,f:'Criterio que separa las infracciones graves de las leves (art. 50)',b:'No la conducta, sino el <b>resultado</b>: la misma conducta es grave si causa grave perjuicio al servicio y leve si no.'},
{t:8,f:'Cuatro infracciones muy graves (art. 50.2)',b:'Incumplimiento del <b>secreto estadístico</b>, <b>uso de datos para fines no estadísticos</b>, <b>suministro de datos falsos</b> y <b>resistencia notoria</b> con excusas falsas.'},
{t:8,f:'Multas por infracciones muy graves, graves y leves (art. 51)',b:'Muy graves: 3.005,07 a 30.050,61 €. Graves: 300,52 a 3.005,06 €. Leves: 60,11 a 300,51 €.'},
{t:8,f:'Prescripción de las infracciones estadísticas (art. 52)',b:'Leves: <b>6 meses</b>. Graves: <b>2 años</b>. Muy graves: <b>3 años</b> (las sanciones: 1, 2 y 3 años).'},
{t:8,f:'¿Se aplica el Título V de la Ley 12/1989 a los funcionarios?',b:'<b>No</b> (art. 48.2): su régimen es el disciplinario del TREBEP. La potestad sancionadora corresponde al INE a través de su Presidente.'},

/* --- Tema 9 · Protección de datos --- */
{t:9,f:'Doble objeto de la LO 3/2018 y su base constitucional',b:'Adaptar y completar el <b>RGPD</b> + garantizar los <b>derechos digitales</b>. Base: <b>art. 18.4 CE</b>.'},
{t:9,f:'Los siete principios del art. 5 RGPD',b:'Licitud, lealtad y transparencia; limitación de la finalidad; minimización; exactitud; limitación del plazo de conservación; integridad y confidencialidad; responsabilidad proactiva.'},
{t:9,f:'Las seis bases jurídicas del tratamiento (art. 6 RGPD)',b:'Consentimiento, contrato, obligación legal, protección de intereses vitales, interés público/poderes públicos e interés legítimo.'},
{t:9,f:'¿Qué exige la LO 3/2018 para las bases de obligación legal e interés público?',b:'Una <b>norma con rango de ley</b> (art. 8) — la cobertura de la Ley 12/1989 para el tratamiento estadístico.'},
{t:9,f:'Los seis derechos ARSULiP y su correspondencia RGPD',b:'Acceso (15), rectificación (16), supresión (17), limitación (18), portabilidad (20) y oposición/decisiones automatizadas (21-22). Plazo de respuesta: 1 mes.'},
{t:9,f:'¿Qué regula el Título X de la LO 3/2018?',b:'Los <b>derechos digitales</b>: neutralidad de la red, seguridad digital, olvido en redes, desconexión digital, testamento digital, protección de menores...'},
{t:9,f:'¿Qué dice el art. 25 LO 3/2018 sobre la función estadística?',b:'El tratamiento por organismos estadísticos se rige por su <b>legislación específica</b> (Ley 12/1989) además del RGPD; la comunicación de datos exige norma UE o inclusión en el PEN; y el secreto estadístico permite <b>denegar los derechos ARSULiP</b>.'},
{t:9,f:'Naturaleza de la AEPD y su relación con el Gobierno',b:'<b>Autoridad administrativa independiente</b>; se relaciona con el Gobierno a través del <b>Ministerio de Justicia</b>; representa a España ante el Comité Europeo de Protección de Datos.'},
{t:9,f:'¿Cuándo es «resistencia a la actuación investigadora» de la AEPD?',b:'Cuando el responsable o encargado <b>no colabora</b> facilitando la información requerida — infracción autónoma (art. 52).'},
{t:9,f:'Límite para entrar en un domicilio en una investigación de la AEPD',b:'Se exige <b>consentimiento del interesado o autorización judicial</b> (art. 53, en relación con el 18.2 CE).'},
{t:9,f:'Multas máximas del RGPD para infracciones muy graves',b:'Hasta <b>20 millones de euros o el 4%</b> de la facturación anual global (cesta del art. 83.5; la del 83.4: 10 M€ o 2%).'},
{t:9,f:'¿Qué se impone a la AGE si infringe la normativa de protección de datos?',b:'<b>Apercibimiento</b> u otras medidas del art. 58.2 RGPD, <b>no multa</b> (art. 76 LO 3/2018).'},

/* --- Tema 10 · Reglamento 223/2009 --- */
{t:10,f:'¿Quiénes integran el Sistema Estadístico Europeo?',b:'<b>Eurostat</b> (autoridad de la Unión), las <b>autoridades estadísticas nacionales (los INE)</b> y los <b>bancos centrales nacionales</b>.'},
{t:10,f:'¿Qué son las estadísticas europeas?',b:'Las <b>desarrolladas, elaboradas y difundidas</b> por el SEE conforme al <b>programa estadístico europeo</b> (marco plurianual).'},
{t:10,f:'Los seis principios estadísticos europeos (art. 2)',b:'<b>Independencia profesional, imparcialidad, objetividad, fiabilidad, secreto estadístico y rentabilidad</b>.'},
{t:10,f:'Diferencia entre los principios europeos y los de la Ley 12/1989',b:'La europea tiene <b>6</b>; la española <b>9</b> — añade <b>transparencia, especialidad y proporcionalidad</b>.'},
{t:10,f:'¿Qué papel tiene cada INE ante la Comisión (art. 5)?',b:'Es el <b>interlocutor único</b> de cada Estado miembro ante Eurostat en materia estadística.'},
{t:10,f:'¿Qué desarrolla el Código de Buenas Prácticas de las estadísticas europeas?',b:'Los principios del SEE en <b>15 principios con indicadores</b>; su cumplimiento se evalúa mediante revisiones por pares (conexión con Producción Estadística).'},
{t:10,f:'Funciones del CSEE',b:'Asistir a la Comisión en la <b>coordinación del programa estadístico europeo</b> y en el desarrollo de metodologías y estándares.'},
{t:10,f:'Uso de datos confidenciales obtenidos para estadísticas europeas (art. 20)',b:'<b>Exclusivamente con fines estadísticos</b>, salvo consentimiento inequívoco de la unidad; el personal queda obligado <b>incluso tras cesar</b> en sus funciones.'},
{t:10,f:'¿Pueden las autoridades nacionales acceder a registros administrativos?',b:'Sí: para producir estadísticas europeas (art. 17 bis, incorporado por el Reglamento (UE) 2015/759).'},
{t:10,f:'Definición de «dato confidencial» en el Reglamento 223/2009',b:'El dato que permite identificar, <b>directa o indirectamente, a las unidades estadísticas</b> — el mismo estándar del art. 13 de la Ley 12/1989.'},

/* --- Tema 11 · Electoral --- */
{t:11,f:'Composición de la Junta Electoral Central',b:'<b>13 miembros</b>: 8 magistrados del Tribunal Constitucional (designados por el TC) y 5 catedráticos de Derecho, CC. Políticas o Sociología o juristas de reconocida competencia (designados por el Congreso).'},
{t:11,f:'Composición de las Juntas Electorales Provinciales y de Zona',b:'JEP: <b>2 jueces o magistrados + 3 doctores o licenciados</b> (Derecho, CC. Políticas o Sociología). JZC: <b>2 jueces + 2 doctores o licenciados</b>.'},
{t:11,f:'¿Dónde está encuadrada la Oficina del Censo Electoral?',b:'En el <b>INE</b> (dependencia orgánica), bajo la <b>dirección y supervisión de la JEC</b> (dependencia funcional). Tiene Delegaciones Provinciales.'},
{t:11,f:'Tres competencias de la OCE (art. 30 LOREG)',b:'Coordinar y supervisar la elaboración del censo; elaborar las listas provisionales y definitivas; y resolver las reclamaciones censales (sus resoluciones agotan la vía administrativa).'},
{t:11,f:'¿Es obligatoria la inscripción en el Censo Electoral?',b:'<b>Sí</b>: es <b>de oficio</b>, a partir del padrón y otros registros (arts. 31-32 LOREG); condición para ejercer el derecho de sufragio.'},
{t:11,f:'Vigencia y actualización del censo electoral',b:'Es <b>permanente</b> y se actualiza <b>mensualmente</b> (referencia al día 1 de cada mes); para cada proceso se cierra la fotografía del 2º mes anterior a la convocatoria.'},
{t:11,f:'¿Qué carácter tiene el padrón municipal y qué acredita?',b:'Registro administrativo donde constan los <b>vecinos</b>; sus datos son <b>prueba de la residencia y del domicilio habitual</b> (arts. 15-16 LBRL).'},
{t:11,f:'¿Quién gestiona el padrón y quién lo coordina?',b:'Lo gestiona el <b>Ayuntamiento</b>; lo coordina el <b>INE</b>. El <b>Presidente del INE</b> resuelve las discrepancias y eleva al Gobierno la propuesta de cifras oficiales de población.'},
{t:11,f:'¿Qué es y dónde está el Consejo de Empadronamiento?',b:'Órgano colegiado de <b>colaboración AGE-EELL en materia padronal, adsorbido al INE</b> (art. 17.4 LBRL).'},
{t:11,f:'Composición del Consejo de Empadronamiento',b:'Un <b>presidente y seis vocales</b>: presidente + 3 vocales funcionarios del INE, 2 vocales de la <b>FEMP</b> y 1 vocal de la <b>DG de Cooperación con la Administración Local</b>.'},
{t:11,f:'Funciones del Consejo de Empadronamiento',b:'Informar las propuestas de resolución de discrepancias (que resuelve el Presidente del INE), elevar anualmente al Gobierno un informe sobre la gestión del padrón y proponer criterios técnicos padronales.'},
{t:11,f:'¿Quiénes pueden obtener copias del censo electoral y para qué?',b:'Los <b>partidos, federaciones, coaliciones y agrupaciones de electores</b>, para <b>fines exclusivamente electorales</b> (primera copia gratuita).'},
{t:11,f:'Cada cuánto deben renovar su inscripción padronal los extranjeros sin residencia permanente',b:'Cada <b>2 años</b> (los nacionales de fuera de la UE sin autorización de residencia permanente).'},

/* --- Tema 12 · Igualdad --- */
{t:12,f:'Fundamento constitucional de la LO 3/2007',b:'Los <b>arts. 9.2 y 14 CE</b>: igualdad formal ante la ley + mandato de promover la igualdad real y efectiva.'},
{t:12,f:'¿Qué es la composición equilibrada en la LO 3/2007?',b:'Una presencia de mujeres y hombres <b>no inferior al 40% ni superior al 60%</b>, aplicable a órganos, cargos y candidaturas.'},
{t:12,f:'¿Qué impone el art. 20 LO 3/2007 a las estadísticas públicas?',b:'Incluir sistemáticamente la <b>variable de sexo</b>, crear indicadores de discriminación múltiple, diseñar <b>muestras amplias</b> y desagregar por sexo — obligación legal para el INE.'},
{t:12,f:'¿Qué regla gobierna los tribunales de selección de la AGE? (art. 53)',b:'El principio de <b>presencia equilibrada</b> de mujeres y hombres, salvo razones fundadas y objetivas <b>debidamente motivadas</b>.'},
{t:12,f:'¿Cuándo se aprueba el Plan de Igualdad de la AGE? (art. 64)',b:'Al <b>inicio de cada legislatura</b>, previa negociación con la representación de los empleados públicos.'},
{t:12,f:'¿Qué empresas están obligadas a tener plan de igualdad?',b:'Las de <b>más de 50 personas trabajadoras</b> (arts. 45-48 LO 3/2007, tras el RDL 6/2019).'},
{t:12,f:'¿Qué ley regula la violencia de género y con qué enfoque?',b:'La <b>LO 1/2004</b>: enfoque integral — prevención, tutela institucional, sanitaria, laboral, judicial y penal.'},
{t:12,f:'Tres derechos laborales de las víctimas de violencia de género',b:'Reducción o reordenación de jornada, <b>movilidad geográfica</b>, y <b>suspensión con reserva del puesto</b> (o extinción con indemnización).'},
{t:12,f:'¿Qué protege la Ley 4/2023 y respecto de qué causas?',b:'La igualdad real y efectiva de <b>personas trans y LGTBI</b>: no discriminación por <b>orientación sexual, identidad de género, expresión de género o características sexuales</b>.'},
{t:12,f:'¿Desde qué edad puede cambiarse la mención registral del sexo sin requisitos adicionales?',b:'Desde los <b>16 años</b> (14-16 con asistencia; 12-14 mediante decisión judicial).'},
{t:12,f:'Duración del permiso por nacimiento para cada progenitor',b:'<b>16 semanas iguales</b> para ambos progenitores (reformas 2019-2021, art. 49 TREBEP) — la conciliación como corresponsabilidad (art. 44 LO 3/2007).'},

/* --- Tema 13 · Gobernanza --- */
{t:13,f:'Los cuatro principios del gobierno abierto',b:'<b>Transparencia, participación, colaboración y rendición de cuentas</b> (accountability).'},
{t:13,f:'Los tres objetos de la Ley 19/2013 (art. 1)',b:'Ampliar la <b>transparencia</b> de la actividad pública, garantizar el <b>derecho de acceso</b> a la información y establecer las obligaciones de <b>buen gobierno</b>.'},
{t:13,f:'Diferencia entre publicidad activa y derecho de acceso',b:'Publicidad activa: la Administración publica <b>de oficio</b> en su sede electrónica. Derecho de acceso: la ciudadanía lo solicita <b>a instancia de parte</b>, sin motivar.'},
{t:13,f:'¿Qué titularidad tiene el derecho de acceso y sobre qué base constitucional?',b:'<b>Todas las personas</b> («titularidad universal»), en desarrollo del <b>art. 105.b) CE</b>.'},
{t:13,f:'¿Está obligado el solicitante a motivar su petición de acceso?',b:'<b>No</b> (art. 17.3): la ausencia de motivación nunca es causa de rechazo.'},
{t:13,f:'Plazo de resolución del derecho de acceso',b:'<b>1 mes</b>, ampliable otro mes por el volumen o complejidad (art. 20).'},
{t:13,f:'¿Qué recurso cabe contra la denegación de acceso?',b:'<b>Reclamación ante el Consejo de Transparencia y Buen Gobierno</b> (art. 24), previa a la vía contencioso-administrativa.'},
{t:13,f:'¿Qué información debe publicarse por ser «estadística»?',b:'El art. 8 incluye la <b>información económica, presupuestaria y estadística</b> entre la publicidad activa obligatoria.'},
{t:13,f:'Naturaleza del Consejo de Transparencia y Buen Gobierno',b:'<b>Organismo público independiente</b>, con personalidad jurídica propia, adscrito administrativamente a un departamento; estatuto: <b>RD 919/2014</b>.'},
{t:13,f:'Los cuatro fines del CTBG (art. 34)',b:'<b>Promover la transparencia, velar por las obligaciones de publicidad, salvaguardar el derecho de acceso y garantizar el buen gobierno</b>.'},
{t:13,f:'¿Qué órgano del CTBG resuelve las reclamaciones?',b:'La <b>Comisión de Transparencia y Buen Gobierno</b> — órgano colegiado, junto a la Presidencia.'},
{t:13,f:'¿Qué prohíbe la Ley 37/2007 respecto de la reutilización?',b:'Los convenios con terceros <b>no pueden otorgar derechos exclusivos</b> — nadie monopoliza los datos públicos.'},

/* --- Tema 14 · TIC --- */
{t:14,f:'¿Para quiénes es obligatoria la relación electrónica con la Administración? (art. 14)',b:'AAPP y sus representantes, <b>profesionales que actúen por cuenta de terceros</b>, personas jurídicas, empleados públicos, notarios y registradores, y titulares de actividades sujetas a autorización previa.'},
{t:14,f:'Disponibilidad del registro electrónico',b:'<b>24 horas, todos los días del año</b> (art. 27.2), con efectos de oficina integral.'},
{t:14,f:'¿Cuándo se entiende rechazada una notificación electrónica?',b:'Cuando transcurren <b>10 días naturales</b> desde la puesta a disposición sin acceder al contenido (art. 41.2).'},
{t:14,f:'¿Qué es el expediente electrónico y qué elemento garantiza su integridad?',b:'El conjunto ordenado de documentos y actuaciones en formato electrónico; el <b>índice electrónico autentificado</b> garantiza su integridad y permite su recuperación (art. 70).'},
{t:14,f:'Requisitos de remisión de un expediente electrónico',b:'Se envía <b>completo, foliado, autentificado y con índice autentificado</b>, conforme al ENI y a las NTI (art. 70.3).'},
{t:14,f:'¿Qué son las NTI y quién las aprueba?',b:'Normas Técnicas de Interoperabilidad que desarrollan el <b>RD 4/2010 (ENI)</b>, de <b>obligado cumplimiento</b>: catálogo de estándares, política de firma, digitalización, documento, expediente e intercambio de asientos.'},
{t:14,f:'Valor de un documento digitalizado con garantías',b:'Copia con <b>la misma validez y eficacia que el documento original</b> (NTI de digitalización).'},
{t:14,f:'¿Qué RD aprueba el ENS vigente y qué ley lo habilita?',b:'El <b>RD 311/2022</b> (sustituye al RD 3/2010), al amparo del <b>art. 156.2 de la Ley 40/2015</b>.'},
{t:14,f:'Las cinco dimensiones de la seguridad del ENS',b:'<b>Disponibilidad, autenticidad, integridad, confidencialidad y trazabilidad</b>.'},
{t:14,f:'Las tres categorías de los sistemas en el ENS',b:'<b>Básica, media y alta</b>, según el impacto de un incidente sobre las dimensiones — determinan las medidas exigibles.'},
{t:14,f:'Los tres bloques de medidas del ENS',b:'<b>Marco organizativo, marco operacional y medidas de protección</b>.'},
{t:14,f:'¿Cómo se aplica el ENS a un organismo estadístico?',b:'Inventariar sistemas → analizar riesgos (confidencialidad de datos individuales crítica) → categorizar (alta en confidencialidad) → implantar medidas (accesos, cifrado, trazabilidad, copias) → auditar. Enlaza con el secreto estadístico.'},
{t:14,f:'Órgano de cúpula de la gobernanza TIC de la AGE (RD 806/2014)',b:'La <b>Comisión de Estrategia TIC</b>: fija las líneas estratégicas, informa las normas TIC y decide los medios compartidos.'}
);
/* ================= DATOS: QUIZ (temas 1-7) ================= */
const QUIZ = [
/* --- Tema 1 --- */
{t:1,q:'Según el art. 1.1 CE, España se constituye en:',o:['Estado social y democrático de Derecho','Estado federal de Derecho','Monarquía absoluta parlamentaria','Estado de autonomías descentralizado'],c:0,e:'Art. 1.1 CE: Estado social y democrático de Derecho, con libertad, justicia, igualdad y pluralismo político como valores superiores.'},
{t:1,q:'La soberanía nacional reside en:',o:['El Rey, como Jefe del Estado','El pueblo español','Las Cortes Generales','El pueblo español y las CCAA conjuntamente'],c:1,e:'Art. 1.2 CE: la soberanía reside en el pueblo español, del que emanan los poderes del Estado.'},
{t:1,q:'La bandera de España tiene la franja amarilla con anchura:',o:['Igual a cada roja','Doble que cada roja','Triple que cada roja','Mitad de la roja'],c:1,e:'Art. 4.1: proporción 1-2-1 — la amarilla dobla en anchura a cada una de las rojas.'},
{t:1,q:'El plazo máximo de detención preventiva sin puesta a disposición judicial es de:',o:['24 horas','48 horas','72 horas','5 días'],c:2,e:'Art. 17.2 CE: en todo caso, dentro del plazo máximo de 72 horas el detenido será puesto en libertad o a disposición de la autoridad judicial.'},
{t:1,q:'¿Cuál de estos derechos NO goza de recurso de amparo ante el Tribunal Constitucional?',o:['Derecho a la vida (art. 15)','Derecho de reunión (art. 21)','Derecho al trabajo (art. 35)','Objeción de conciencia (art. 30.2)'],c:2,e:'El amparo cubre el art. 14 y la Sección 1ª (15-29) más la objeción de conciencia (30.2). El derecho al trabajo es un derecho de la Sección 2ª (arts. 30-38), sin amparo.'},
{t:1,q:'El adjetivo «veraz» en el art. 20.1.d) CE califica al derecho a:',o:['Expresar y difundir pensamientos e ideas','La producción científica y técnica','Comunicar o recibir libremente información','La libertad de cátedra'],c:2,e:'Solo la información (20.1.d) exige veracidad; la expresión de opiniones (20.1.a) no está sujeta a ella.'},
{t:1,q:'¿Qué artículo de la Constitución habilita la legislación de protección de datos?',o:['Art. 18.2 (inviolabilidad del domicilio)','Art. 18.3 (secreto de las comunicaciones)','Art. 18.4 (limitación del uso de la informática)','Art. 20.4 (libertad de información)'],c:2,e:'El art. 18.4 es la habilitación expresa citada por el art. 1 de la LOPDGDD — y por la Ley 12/1989 en su exposición de motivos.'},
{t:1,q:'La única excepción constitucional a la abolición de la pena de muerte es:',o:['Delitos de terrorismo','Leves penales militares en tiempo de guerra','Delitos de traición en tiempo de guerra','No existe ninguna excepción'],c:1,e:'Art. 15 CE: queda abolida la pena de muerte, salvo lo que puedan disponer las leyes penales militares para tiempos de guerra.'},
{t:1,q:'El Defensor del Pueblo es:',o:['Un alto cargo del Gobierno','El supremo órgano consultivo del Gobierno','Un alto comisionado de las Cortes Generales','Un magistrado del Tribunal Constitucional'],c:2,e:'Art. 54 CE: alto comisionado de las Cortes Generales, designado por éstas; supervisa la Administración y da cuenta a las Cortes. Ley: LO 3/1981.'},
{t:1,q:'¿Cuál NO es una materia reservada a ley orgánica (art. 81.1)?',o:['Desarrollo de los derechos fundamentales','Estatutos de Autonomía','Régimen electoral general','Los Presupuestos Generales del Estado'],c:3,e:'Los PGE son ley ordinaria (art. 134 CE); las orgánicas son: derechos fundamentales, Estatutos, régimen electoral general y las demás previstas por la CE.'},
{t:1,q:'Los derechos reconocidos en el Capítulo III del Título I (principios rectores):',o:['Son directamente exigibles ante los Tribunales','Informan la legislación pero no son exigibles por sí solos','Gozan de reserva de ley orgánica','Tienen recurso de amparo'],c:1,e:'Art. 53.3: informan la legislación positiva, la práctica judicial y la actuación de los poderes públicos; solo son alegables en lo que dispongan las leyes que los desarrollen.'},

/* --- Tema 2 --- */
{t:2,q:'¿Cuál de estas funciones del Rey NO aparece en el art. 62 CE?',o:['Sancionar y promulgar las leyes','El mando supremo de las Fuerzas Armadas','Proponer el candidato a Presidente del Gobierno','Aprobar los Presupuestos Generales del Estado'],c:3,e:'Los PGE los aprueban las Cortes (134 CE). Todas las funciones del Rey son formales y refrendadas.'},
{t:2,q:'La propuesta y el nombramiento del Presidente del Gobierno las refrenda:',o:['El Presidente del Gobierno saliente','El Presidente del Congreso','El Rey, sin refrendo','El Consejo de Ministros'],c:1,e:'Art. 64.1 CE: junto con la disolución prevista en el art. 99, las refrenda el Presidente del Congreso — lógico, porque el Gobierno puede estar cesante.'},
{t:2,q:'En la sucesión a la Corona, la preferencia del varón sobre la mujer opera:',o:['Siempre','Solo en el mismo grado de parentesco','Solo en la línea directa','Nunca: la precedencia es de la mayor edad siempre'],c:1,e:'Art. 57.1: en el mismo grado, el varón a la mujer; pero antes prevalecen la línea y el grado más próximo, y en el mismo sexo la edad.'},
{t:2,q:'Las Cortes Generales pueden nombrar una Regencia de:',o:['Una o dos personas','Una, tres o cinco personas','Tres o cinco personas','Cinco personas como máximo'],c:1,e:'Art. 59.3 CE: Regencia de una, tres o cinco personas — siempre número impar.'},
{t:2,q:'El Congreso se compone de un mínimo y máximo de diputados de:',o:['250 y 350','300 y 400','300 y 350','350 y 400'],c:1,e:'Art. 68.1: entre 300 y 400 (la LOREG fija 350). Circunscripción provincial; mandato de 4 años.'},
{t:2,q:'Los senadores designados por las CCAA son:',o:['Uno por CCAA y otro más por cada millón de habitantes','Dos por CCAA','Uno por cada millón de habitantes','Cuatro por CCAA'],c:0,e:'Art. 69.5: una designación fija más una por cada millón de habitantes; se suman a los 4 senadores electos por provincia.'},
{t:2,q:'El voto de diputados y senadores es:',o:['Delegable en el grupo parlamentario','Personal e indelegable','Delegable solo por enfermedad grave','Telemático en todo caso'],c:1,e:'Art. 79.3 CE: el voto es personal e indelegable (los supuestos de voto telemático tasados en los reglamentos no son delegación técnica).'},
{t:2,q:'¿Cuál de estas materias SÍ puede delegarse en una Comisión Legislativa Permanente?',o:['Leyes orgánicas','Presupuestos Generales del Estado','Reforma constitucional','Una ley ordinaria de régimen local'],c:3,e:'Art. 75.3: quedan exceptuadas la reforma constitucional, las cuestiones internacionales, las leyes orgánicas y de bases y los PGE.'},
{t:2,q:'Las conclusiones de una comisión de investigación parlamentaria:',o:['Vinculan a los Tribunales','No vinculan a los Tribunales ni afectan a las resoluciones judiciales','Anulan las resoluciones judiciales contradictorias','Obligan al Gobierno a dimitir'],c:1,e:'Art. 76.1 CE: relevancia política, nunca jurisdiccional.'},
{t:2,q:'Un decreto-ley debe ser convalidado por el Congreso en un plazo de:',o:['15 días','30 días','2 meses','48 horas'],c:1,e:'Art. 86.2 CE: el Congreso se pronuncia en 30 días desde su promulgación, sobre convalidación o derogación.'},
{t:2,q:'Para levantar un veto del Senado a un proyecto de ley ordinario, el Congreso puede aprobarlo por:',o:['Mayoría simple solo en primera votación','Mayoría absoluta, o mayoría simple transcurridos dos meses','Dos tercios siempre','Mayoría de 3/5'],c:1,e:'Art. 90.2 CE: mayoría absoluta inicialmente, o mayoría simple pasados dos meses desde el veto.'},

/* --- Tema 3 --- */
{t:3,q:'Según la Ley 50/1997, el Gobierno se compone de:',o:['Presidente, Vicepresidentes, Ministros y Secretarios de Estado','Presidente, Vicepresidente(s) y Ministros','Presidente y Ministros exclusivamente','Presidente, Ministros y Subsecretarios'],c:1,e:'Art. 1.2 Ley 50/1997: no incluye a los Secretarios de Estado pese a que la CE (98.1) permitía añadir otros miembros por ley.'},
{t:3,q:'¿Cuál de estas NO es una causa de cese del Gobierno?',o:['La celebración de elecciones generales','La pérdida de confianza parlamentaria','La disolución del Congreso por el Rey a propuesta del Presidente','El fallecimiento del Presidente'],c:2,e:'Art. 101.1: elecciones, pérdida de confianza, dimisión o fallecimiento del Presidente. La disolución del Congreso no es causa autónoma de cese.'},
{t:3,q:'Los principios de actuación de la Administración Pública del art. 103.1 CE, en orden, son:',o:['Eficacia, jerarquía, descentralización, desconcentración y coordinación','Jerarquía, eficacia, coordinación, desconcentración y descentralización','Legalidad, jerarquía, eficacia, coordinación y control','Objetividad, eficacia, jerarquía, planificación y coordinación'],c:0,e:'Son cinco y se preguntan en este orden exacto. La objetividad abre el artículo pero como fin, no como principio enumerado.'},
{t:3,q:'El supremo órgano consultivo del Gobierno es:',o:['El Consejo Económico y Social','El Consejo de Estado','La Abogacía General del Estado','El Tribunal de Cuentas'],c:1,e:'Art. 107 CE: el Consejo de Estado, regulado por ley orgánica (LO 3/1980).'},
{t:3,q:'Los Secretarios de Estado son, conforme al art. 55 de la Ley 40/2015:',o:['Órganos directivos','Órganos superiores','Órganos colegiados','Personal eventual'],c:1,e:'Los órganos superiores son los Ministros y los Secretarios de Estado; los directivos, los Subsecretarios y asimilados, DDGG y Subdirectores.'},
{t:3,q:'La delegación de firma:',o:['Altera la competencia del delegante y se publica','No altera la competencia y no requiere publicación','Requiere acuerdo del Consejo de Ministros','Es posible en materia sancionadora'],c:1,e:'Art. 18 Ley 40/2015: no altera la competencia, no se publica, y está prohibida en resoluciones de carácter sancionador.'},
{t:3,q:'El Delegado del Gobierno en una Comunidad Autónoma es nombrado por:',o:['El Ministro de la Presidencia','El Presidente del Gobierno, por Real Decreto','El Consejo de Ministros a propuesta del Delegado','El Rey a propuesta del Ministro del Interior'],c:1,e:'Se nombra y separa por RD del Presidente del Gobierno (Ley 40/2015), con rango de Subsecretario y dependencia directa del Presidente.'},
{t:3,q:'En las CCAA uniprovinciales:',o:['Hay Subdelegado y Director Insular','No hay Subdelegados: sus funciones las asume el Delegado del Gobierno','El Subdelegado asume las funciones del Delegado','El Gobierno designa un Coordinador provincial'],c:1,e:'La figura del Subdelegado no existe en las uniprovinciales: el Delegado asume sus funciones provinciales.'},
{t:3,q:'El INE está adscrito al Ministerio de Economía, Comercio y Empresa:',o:['Directamente al Ministro','A través de la Secretaría de Estado de Comercio','A través de la Secretaría de Estado de Economía y Apoyo a la Empresa','A través de la Subsecretaría'],c:2,e:'RD 410/2024, art. 2.7: adscripción a través de la SE de Economía y Apoyo a la Empresa, junto con ICO, CNMC, CNMV y FROB.'},
{t:3,q:'¿Cuál de estos organismos NO está adscrito a la Secretaría de Estado de Economía y Apoyo a la Empresa?',o:['La CNMV','El ICO','El ICEX','El FROB'],c:2,e:'El ICEX depende de la Secretaría de Estado de Comercio, que además ostenta su presidencia.'},
{t:3,q:'La estructura del Ministerio de Economía, Comercio y Empresa se fija en el RD 410/2024, dictado en aplicación de:',o:['El art. 97 CE','El art. 59.1 de la Ley 40/2015','El art. 62 CE','La Ley 50/1997'],c:1,e:'El art. 59.1 Ley 40/2015 es la habilitación general para fijar por RD la estructura ministerial hasta subdirección general.'},

/* --- Tema 4 --- */
{t:4,q:'El art. 149.1.31ª CE reserva al Estado la competencia sobre:',o:['Estadística en general','Estadística para fines estatales','Estadística oficial','Coordinación estadística'],c:1,e:'La literalidad importa: «Estadística para fines estatales» — las CCAA tienen sus propias oficinas estadísticas para sus fines.'},
{t:4,q:'Los Estatutos de Autonomía se aprueban mediante:',o:['Ley ordinaria de las Cortes','Ley orgánica','Real Decreto','Referéndum autonómico vinculante'],c:1,e:'Art. 147.2 CE: el Estatuto es norma institucional básica de la CA y se aprueba como ley orgánica.'},
{t:4,q:'La cláusula residual del art. 149.3 CE establece que:',o:['Las competencias no asumidas corresponden siempre al Estado','Toda competencia no atribuida al Estado puede asumirse por las CCAA vía Estatuto; lo no asumido corresponde al Estado','Las competencias se reparten por mitades','El TC reparte las competencias dudosas'],c:1,e:'Además, el derecho estatal es en todo caso supletorio del derecho de las Comunidades Autónomas.'},
{t:4,q:'Las leyes de armonización del art. 150.3 CE requieren:',o:['Interés general y mayoría absoluta de cada Cámara','Referéndum previo','Acuerdo de todas las CCAA afectadas','Solo la iniciativa gubernamental'],c:0,e:'Es la vía más excepcional: el interés general se aprecia por mayoría absoluta de cada Cámara.'},
{t:4,q:'El art. 155 CE permite al Gobierno adoptar medidas sobre una CA:',o:['Directamente, en cualquier momento','Previo requerimiento y autorización del Senado','A petición de la propia CA y con aprobación del Congreso','Mediante ley orgánica'],c:1,e:'Requiere requerimiento previo al Presidente autonómico y autorización del Senado; es el mecanismo de coerción estatal.'},
{t:4,q:'¿Cuál de estos es un servicio mínimo obligatorio en TODOS los municipios?',o:['Biblioteca pública','Parque público','Cementerio','Transporte colectivo urbano'],c:2,e:'Art. 26.1.a LRBRL: alumbrado, cementerio, residuos, limpieza, agua, alcantarillado, acceso y pavimentación. Biblioteca y parque: desde 5.000 hab.; transporte: desde 50.000.'},
{t:4,q:'A partir de 20.000 habitantes, los municipios deben prestar además:',o:['Transporte colectivo urbano y medio ambiente','Protección civil, servicios sociales, extinción de incendios y deportes','Solo biblioteca y mercado','Gestión de residuos y agua potable'],c:1,e:'Es el tercer escalón del art. 26. Transporte y medio ambiente corresponden al escalón de 50.000 habitantes.'},
{t:4,q:'Los fines propios de la Provincia son garantizar:',o:['La unidad de mercado provincial','La solidaridad y el equilibrio intermunicipales','La coordinación de las diputaciones','La prestación de servicios estatales en el territorio'],c:1,e:'Art. 31.2 LRBRL: asegurar la prestación integral de los servicios municipales en todo el territorio provincial y coordinar la Administración local.'},
{t:4,q:'En los municipios de menos de 1.000 habitantes, la Diputación garantiza:',o:['El transporte escolar','Los servicios de secretaría e intervención','La recaudación tributaria','La policía local'],c:1,e:'Art. 36.1.b LRBRL: garantiza la prestación de los servicios de secretaría e intervención, además de la asistencia y cooperación general.'},

/* --- Tema 5 --- */
{t:5,q:'¿Cuál de estas vías de iniciación de oficio SÍ puede activar cualquier persona?',o:['Propia iniciativa','Orden superior','Petición razonada','Denuncia'],c:3,e:'La denuncia (art. 62) puede presentarla cualquier persona; pero no le confiere por sí sola la condición de interesado.'},
{t:5,q:'El plazo del trámite de audiencia es de:',o:['5 a 10 días','10 a 15 días','15 a 20 días','20 a 30 días'],c:1,e:'Art. 82.2: no inferior a diez días ni superior a quince, antes de la propuesta de resolución. No confundir con los 20 días de la información pública.'},
{t:5,q:'El período ordinario de prueba tiene una duración de:',o:['5 a 15 días','10 a 30 días','30 a 60 días','Siempre 30 días exactos'],c:1,e:'Art. 77.2: entre 10 y 30 días; el extraordinario, a petición del interesado, hasta 10 días adicionales.'},
{t:5,q:'¿Qué trámite puede omitirse cuando no figuren en el procedimiento más hechos ni alegaciones que los del interesado?',o:['La prueba','El trámite de audiencia','Las alegaciones','Los informes preceptivos'],c:1,e:'Art. 82.4: si el expediente no contiene más hechos ni otras alegaciones y pruebas que las aducidas por el interesado, puede prescindirse de la audiencia.'},
{t:5,q:'Las notas, borradores y opiniones internas:',o:['Forman parte del expediente siempre','Forman parte solo si son firmadas','No forman parte del expediente, salvo los informes preceptivos o facultativos solicitados antes de resolver','Nunca pueden existir en soporte electrónico'],c:2,e:'Art. 70.4: la exclusión blinda el proceso deliberativo interno frente al derecho de acceso.'},
{t:5,q:'¿Cuál NO es una forma de terminación del procedimiento del art. 84?',o:['La resolución','El desistimiento','La renuncia al derecho','La anulación'],c:3,e:'Las formas son: resolución, desistimiento, renuncia y caducidad (+ imposibilidad material y terminación convencional). La anulación es una operación de revisión.'},
{t:5,q:'El plazo supletorio para resolver un procedimiento cuando la norma no fija otro es de:',o:['1 mes','3 meses','6 meses','1 año'],c:1,e:'Art. 21.3: tres meses; el techo de seis meses solo puede fijarlo una norma con rango de ley.'},
{t:5,q:'El silencio administrativo tiene efecto desestimatorio, entre otros, en:',o:['Las solicitudes de licencias de actividad','Los procedimientos de responsabilidad patrimonial','Las solicitudes de subvención a particulares','Las solicitudes de becas'],c:1,e:'Art. 24.1: regla general estimatoria; desestimatorio en derecho de petición, transferencia de facultades sobre dominio o servicio público, y responsabilidad patrimonial.'},
{t:5,q:'La caducidad del procedimiento se declara tras:',o:['3 meses sin actuaciones imputables al interesado, con requerimiento previo','6 meses sin actuaciones cualesquiera','1 mes desde la última notificación','12 meses desde la iniciación'],c:0,e:'Art. 95: tres meses de inactividad imputable al interesado, previo requerimiento; se declara mediante resolución y no produce la prescripción de las acciones.'},
{t:5,q:'En los procedimientos sancionadores, el reconocimiento de responsabilidad comporta una reducción de:',o:['Al menos el 10%','Al menos el 20%','Al menos el 30%','El 50% siempre'],c:1,e:'Art. 85.3: reducciones de al menos el 20% por reconocimiento y otras del 20% por pago voluntario, acumulables entre sí.'},
{t:5,q:'¿Cuál de estas NO es causa de nulidad de pleno derecho (art. 47.1)?',o:['Contenido imposible del acto','Vicio de forma que no produce indefensión','Prescindir total y absolutamente del procedimiento legalmente establecido','Dictado por órgano manifiestamente incompetente por razón de la materia'],c:1,e:'El defecto de forma que no produce indefensión ni siquiera es anulable (art. 48.2) — mucho menos nulidad radical.'},
{t:5,q:'Los actos anulables:',o:['Nunca pueden convalidarse','Pueden convalidarse con efectos desde su fecha de convalidación','Pueden convalidarse, y la incompetencia la convalida el superior jerárquico','Se convalidan automáticamente al año'],c:2,e:'Art. 52: solo los anulables son convalidables; efectos ex nunc (desde la convalidación, no retroactivos).'},
{t:5,q:'Las resoluciones sancionadoras son ejecutivas:',o:['Inmediatamente en todo caso','Nunca mientras quepa recurso administrativo, incluido el potestativo de reposición','Solo tras la firmeza en vía contenciosa','Solo si el interesado no paga'],c:1,e:'Art. 98.1.b: excepción «ope legis» a la ejecutividad inmediata mientras quepa recurso en vía administrativa.'},
{t:5,q:'La ejecución subsidiaria:',o:['Aplica a obligaciones personalísimas','Aplica a obligaciones de hacer no personalísimas, a costa del obligado','Es una multa reiterada','Exige siempre autorización judicial'],c:1,e:'Art. 102: un tercero designado por la Administración ejecuta el acto a costa del obligado; el coste se exige por el procedimiento de apremio.'},
{t:5,q:'La declaración de lesividad de un acto anulable debe producirse en el plazo de:',o:['1 año','2 años','4 años','3 meses'],c:1,e:'Art. 107.2: dos años desde que la Administración tuvo conocimiento del acto; después se acude a lo contencioso.'},
{t:5,q:'¿Contra qué actos procede el recurso de alzada?',o:['Contra los que ponen fin a la vía administrativa','Contra los que no ponen fin a la vía administrativa','Solo contra actos de trámite','Contra actos firmes'],c:1,e:'Art. 121: actos no definitivos, ante el órgano superior jerárquico. La reposición y la revisión son para actos de fin de vía o firmes.'},
{t:5,q:'El recurso extraordinario de revisión se interpone:',o:['Ante el Tribunal Supremo','Ante el superior jerárquico','Ante el mismo órgano que dictó el acto','Ante el Tribunal Constitucional'],c:2,e:'Art. 125.2: ante el órgano que dictó el acto, por cuatro motivos tasados, con plazos de 4 años, 3 meses o 1 año según el motivo.'},

/* --- Tema 6 --- */
{t:6,q:'¿Cuál de estas NO es una clase de empleado público del art. 8 TREBEP?',o:['Personal eventual','Personal directivo','Personal laboral','Funcionario interino'],c:1,e:'El personal directivo (art. 13) es una categoría funcional transversal, no una quinta clase: la clasificación es cuatripartita.'},
{t:6,q:'El nombramiento de funcionario interino por vacante tiene un máximo de:',o:['6 meses','1 año','3 años','Sin límite'],c:2,e:'Art. 10.1.a y 10.4: transcurridos 3 años finaliza la relación de interinidad y la vacante solo puede cubrirse por funcionario de carrera.'},
{t:6,q:'El exceso o acumulación de tareas permite un nombramiento interino de:',o:['3 meses','6 meses','9 meses dentro de un período de 18','12 meses'],c:2,e:'Art. 10.1.d: máximo 9 meses dentro de un período de dieciocho meses.'},
{t:6,q:'La condición de personal eventual:',o:['Es mérito para el acceso a la función pública','Es mérito solo para la promoción interna','No puede constituir mérito para el acceso ni la promoción','Se computa como antigüedad'],c:2,e:'Art. 12.4: garantía anti-clientelismo explícita en el TREBEP.'},
{t:6,q:'¿Quiénes NO pueden formar parte de los órganos de selección?',o:['Funcionarios de carrera','Funcionarios interinos','Catedráticos de universidad','Personal eventual'],c:3,e:'Art. 60.2: no pueden ser miembros el personal de elección o designación política, los interinos y el personal eventual. La catedrática de universidad sí puede (si cumple los requisitos).'},
{t:6,q:'La edad mínima para participar en procesos selectivos es:',o:['16 años','18 años','21 años','No hay mínimo'],c:0,e:'Art. 56.1.c: tener cumplidos dieciséis años y no exceder de la edad de jubilación forzosa — dato muy preguntado.'},
{t:6,q:'El sistema selectivo de concurso puro para funcionarios de carrera:',o:['Es el ordinario junto a la oposición','Solo puede aplicarse en virtud de ley','Está prohibido en todo caso','Aplica solo a la promoción interna'],c:1,e:'Art. 61.6: solo en virtud de ley, con carácter excepcional. Para laboral fijo, en cambio, sí es una vía ordinaria (61.7).'},
{t:6,q:'¿Cuál es el último requisito para adquirir la condición de funcionario de carrera?',o:['Superar el proceso selectivo','El nombramiento publicado','El acatamiento de la Constitución','La toma de posesión dentro del plazo'],c:3,e:'Art. 62.1: los cuatro pasos son sucesivos; la toma de posesión cierra el ciclo — aprobar la oposición no equivale a ser funcionario.'},
{t:6,q:'La carrera horizontal consiste en:',o:['El ascenso a un puesto superior mediante concurso','La progresión de grado sin cambiar de puesto de trabajo','La promoción interna a otro cuerpo','La movilidad entre Administraciones'],c:1,e:'Art. 16.2.a: progresión de grado, categoría o escalón sin necesidad de cambiar de puesto — gran novedad del EBEP 2007.'},
{t:6,q:'¿Cuál de estas NO es una retribución básica?',o:['El sueldo','Los trienios','Las pagas extraordinarias','El complemento de destino'],c:3,e:'El complemento de destino es complementaria (ligada al nivel del puesto), junto al específico y a la productividad (arts. 23-24).'},
{t:6,q:'Los procedimientos de provisión de puestos de trabajo son:',o:['Concurso, libre designación y oposición','Solo el concurso','Concurso y libre designación con convocatoria pública','Concurso, libre designación y comisión de servicio'],c:2,e:'Art. 78.2: solo dos. La oposición es un sistema selectivo de acceso, no de provisión.'},
{t:6,q:'Las faltas disciplinarias muy graves prescriben a los:',o:['6 meses','2 años','3 años','6 años'],c:3,e:'Art. 96: muy graves 6 años, graves 2 años y leves 1 año — no confundir con las infracciones de la Ley 12/1989.'},
{t:6,q:'¿Qué sanción está reservada en exclusiva a las faltas muy graves?',o:['La suspensión de funciones','El traslado forzoso','La separación del servicio','El demérito'],c:2,e:'Art. 98.1.a: la separación del servicio solo puede sancionar faltas muy graves (en interinos, revocación del nombramiento).'},
{t:6,q:'Las vacaciones anuales de los funcionarios son de:',o:['21 días naturales','22 días hábiles','30 días naturales','22 días laborables incluyendo sábados'],c:1,e:'Art. 50: 22 días hábiles por año completo de servicio; el sábado no se computa como día háble a estos efectos.'},

/* --- Tema 7 --- */
{t:7,q:'Los Presupuestos Generales del Estado los elabora:',o:['Las Cortes Generales','El Gobierno','El Tribunal de Cuentas','El Banco de España'],c:1,e:'Art. 134.1 CE: el Gobierno los elabora y las Cortes los aprueban, enmiendan o desestiman.'},
{t:7,q:'Si la Ley de PGE no se aprueba antes del inicio del ejercicio:',o:['Se prorrogan automáticamente los anteriores','El Gobierno gestiona sin presupuesto','Se aprueban por decreto-ley','Se convoca un referéndum'],c:0,e:'Prórroga automática del presupuesto del ejercicio anterior, en los términos del art. 134.2 CE.'},
{t:7,q:'La clasificación que responde a «quién gasta» es:',o:['La económica','La funcional o por programas','La orgánica','La temporal'],c:2,e:'La orgánica agrupa por secciones y servicios (centros gestores); la funcional, para qué; la económica, en qué (capítulos).'},
{t:7,q:'¿Cuál de estos es un capítulo de la clasificación económica del gasto?',o:['Secciones','Áreas de gasto','Transferencias corrientes','Servicios'],c:2,e:'Capítulo 4: transferencias corrientes. Secciones y servicios son orgánicas; áreas de gasto, funcionales.'},
{t:7,q:'El control interno de la gestión económico-financiera del sector público estatal corresponde a:',o:['Al Tribunal de Cuentas','A la IGAE','Al Congreso de los Diputados','A la Abogacía General del Estado'],c:1,e:'Art. 140 LGP: la IGAE, con plena autonomía. El Tribunal de Cuentas ejerce el control externo (136 CE).'},
{t:7,q:'El reparo de la intervención:',o:['Anula el acto recurrido','Suspende la tramitación del expediente hasta subsanar el defecto','Es una mera advertencia sin efectos','Traslada el acto al Tribunal de Cuentas'],c:1,e:'Es la manifestación formal de disconformidad, con efectos suspensivos; si se mantiene el acto, se abren las responsabilidades del caso.'},
{t:7,q:'¿Cuál de estas modalidades de control interno es posterior y continuada?',o:['La función interventora','El control financiero permanente','La autorización del gasto','La fiscalización previa'],c:1,e:'La función interventora es previa; el control financiero permanente opera después, sobre programas y organismos, mediante informes.'},
{t:7,q:'El Tribunal de Cuentas remite a las Cortes:',o:['El anteproyecto de PGE','Una relación de las cuentas y rentas generales del Estado','El informe trimestral de ejecución','Los dictámenes de los proyectos de ley'],c:1,e:'Art. 136.1 CE: fiscaliza las cuentas y remite a las Cortes una relación justificada de ellas.'}
];
/* ================= DATOS: QUIZ (temas 8-14) ================= */
QUIZ.push(
/* --- Tema 8 --- */
{t:8,q:'La Ley 12/1989 se dicta al amparo de:',o:['El art. 149.1.18ª CE','El art. 149.1.31ª CE','El art. 148.1.19ª CE','El art. 103 CE'],c:1,e:'Art. 1: «Estadística para fines estatales» — la cadena de habilitación completa que sostiene toda la ley.'},
{t:8,q:'¿Cuántos principios rigen las estadísticas para fines estatales (art. 4.2)?',o:['Seis','Siete','Nueve','Diez'],c:2,e:'Independencia profesional, imparcialidad, objetividad, fiabilidad, secreto estadístico, rentabilidad, transparencia, especialidad y proporcionalidad.'},
{t:8,q:'El Plan Estadístico Nacional:',o:['Se aprueba por ley y dura 4 años','Se aprueba por Real Decreto y dura 4 años','Se aprueba por Real Decreto y dura 2 años','Se aprueba por el Consejo de Ministros anualmente'],c:1,e:'Art. 8.1: RD y vigencia cuatrienal; se desarrolla con programas anuales, también aprobados por RD.'},
{t:8,q:'Son «estadísticas para fines estatales» (art. 9):',o:['Las que produce el INE en exclusiva','Las incluidas en el PEN','Las de competencias estatales estrictamente','Las de todas las AAPP'],c:1,e:'La definición es operativa: lo incluido en el PEN; la ley evita deliberadamente una lista cerrada de materias.'},
{t:8,q:'La fuente prioritaria de las estadísticas para fines estatales son:',o:['Las encuestas propias','Los registros administrativos','Los datos europeos de Eurostat','Las declaraciones voluntarias'],c:1,e:'Art. 10.1: prioridad de los registros administrativos — reducción de la carga sobre los informantes.'},
{t:8,q:'En una estadística obligatoria, los datos sobre origen étnico u opiniones políticas:',o:['Son exigibles con la colaboración obligatoria','Son de aportación estrictamente voluntaria','No pueden recogerse en ningún caso','Pueden imponerse con sanción'],c:1,e:'Art. 11.2: exigen consentimiento expreso, incluso en estadísticas obligatorias — la excepción dentro de la obligatoriedad.'},
{t:8,q:'La identificación «indirecta» de una unidad estadística se produce:',o:['Por su nombre o apellidos','Por su domicilio','Por un número de identificación público','Por otros medios, combinando variables'],c:3,e:'Art. 13.2: directa = nombre, domicilio o identificador público; indirecta = cualquier otro medio (p. ej., única empresa de un sector en un municipio).'},
{t:8,q:'El secreto estadístico rige:',o:['Solo frente a particulares','Solo frente a otras Administraciones','Frente a todas las Administraciones y organismos públicos','Frente a los jueces únicamente'],c:2,e:'Art. 14: ninguna Administración puede exigir datos individuales para fines no estadísticos — lo que hace único a este secreto.'},
{t:8,q:'El acceso de instituciones de investigación a datos confidenciales exige:',o:['Identificación directa y fines comerciales','Identificación indirecta, instituciones y fines científicos de interés público','Consentimiento de todas las unidades','Autorización judicial'],c:1,e:'Art. 15.3: nunca identificación directa, nunca investigadores a título personal, siempre fines científicos de interés público.'},
{t:8,q:'¿Qué directorios NO están amparados por el secreto estadístico?',o:['Los de hogares','Los de establecimientos y empresas (denominación, emplazamiento, actividad, intervalo de tamaño)','Los ficheros de datos fiscales','Los censos de población'],c:1,e:'Art. 16: excepción expresa; el dato del intervalo de tamaño solo se difunde si la unidad no manifiesta disconformidad.'},
{t:8,q:'El deber de secreto estadístico del personal:',o:['Caduca al extinguirse la relación laboral','Caduca a los 10 años','Se mantiene aun después de concluir sus actividades profesionales','Solo aplica al personal funcionario'],c:2,e:'Art. 17.4: es vitalicio y alcanza a cualquier participante eventual en el proceso estadístico.'},
{t:8,q:'El INE es:',o:['Un organismo autónomo y la autoridad estadística nacional','Una entidad pública empresarial','Un órgano directivo del Ministerio','Una agencia estatal'],c:0,e:'Art. 25: organismo autónomo con personalidad y patrimonio propios; autoridad estadística nacional (conexión con el SEE). Estatuto: RD 803/2022.'},
{t:8,q:'La potestad sancionadora en materia estadística corresponde:',o:['Al Ministro de Economía','Al INE, a través de su Presidente','Al Consejo Superior de Estadística','A los juzgados'],c:1,e:'Art. 48.3 — y el Título V excluye a los funcionarios, que se rigen por el TREBEP (48.2).'},
{t:8,q:'¿Qué diferencia una infracción grave de una leve en materia estadística?',o:['La conducta cometida','La intención del infractor','El perjuicio causado al servicio','La reincidencia'],c:2,e:'Art. 50: la misma conducta (no remitir, datos incompletos) es grave con grave perjuicio y leve sin él; secreto y uso desviado son siempre muy graves.'},
{t:8,q:'Las infracciones muy graves en materia estadística prescriben a los:',o:['6 meses','1 año','2 años','3 años'],c:3,e:'Art. 52: leves 6 meses, graves 2 años, muy graves 3 años — las sanciones impuestas prescriben a 1, 2 y 3 años (art. 53).'},
{t:8,q:'¿Quién preside el Consejo Superior de Estadística?',o:['El Presidente del INE','El Ministro competente en materia de estadística','El Director del Gabinete del Ministro','El Presidente del Comité Interterritorial'],c:1,e:'Art. 37.2: el Ministro; el órgano es consultivo y la mitad de sus consejeros proviene de organizaciones sociales y económicas.'},
{t:8,q:'El Comité Interterritorial de Estadística es el órgano de coordinación:',o:['Interna de la AGE','Entre el Estado y las CCAA','Con la sociedad civil','Con Eurostat'],c:1,e:'Arts. 42-44: Estado + CCAA; lo preside el Presidente del INE e informa el PEN y sus programas anuales.'},

/* --- Tema 9 --- */
{t:9,q:'El derecho a la protección de datos está amparado por:',o:['El art. 18.1 CE','El art. 18.4 CE','El art. 20.1 CE','El art. 103 CE'],c:1,e:'Art. 18.4: la ley limitará el uso de la informática — es la cláusula citada por el art. 1 de la LO 3/2018.'},
{t:9,q:'¿Cuál de estos NO es un principio del art. 5 RGPD?',o:['Minimización de datos','Exactitud','Licitud, lealtad y transparencia','Confidencialidad de las deliberaciones'],c:3,e:'La confidencialidad de las deliberaciones es un límite de la Ley 19/2013, no un principio del RGPD. Los siete: licitud/lealtad/transparencia, finalidad, minimización, exactitud, conservación, integridad/confidencialidad y responsabilidad proactiva.'},
{t:9,q:'Las bases jurídicas de «obligación legal» e «interés público» exigen, según la LO 3/2018:',o:['Consentimiento del afectado','Norma con rango de ley','Autorización de la AEPD','Contrato con el encargado'],c:1,e:'Art. 8: la reserva de ley es la cobertura de la Ley 12/1989 para el tratamiento estadístico sin consentimiento individual.'},
{t:9,q:'El derecho de supresión («al olvido») se regula en:',o:['Art. 14 LO 3/2018 y 17 RGPD','Art. 13 LO 3/2018 y 15 RGPD','Art. 17 LO 3/2018 y 20 RGPD','Art. 18 LO 3/2018 y 21 RGPD'],c:0,e:'Correspondencias: acceso 13/15, rectificación 14/16, supresión 15/17, limitación 16/18, portabilidad 17/20, oposición 18/21-22.'},
{t:9,q:'Los derechos digitales se regulan en:',o:['El Título Preliminar de la LO 3/2018','El Título X de la LO 3/2018','El RGPD','La Ley 19/2013'],c:1,e:'Título X: neutralidad de la red, seguridad digital, olvido en redes, desconexión digital, testamento digital, menores...'},
{t:9,q:'Según el art. 25.3 LO 3/2018, los organismos estadísticos pueden denegar los derechos ARSULiP:',o:['Nunca','Cuando el interesado no motive la solicitud','Cuando los datos estén amparados por el secreto estadístico','Cuando existan categorías especiales de datos'],c:2,e:'Es el punto de mayor cruce con el perfil INE: el secreto estadístico como causa legítima de restricción de los derechos del RGPD.'},
{t:9,q:'La AEPD se relaciona con el Gobierno a través de:',o:['El Ministerio de Economía','El Ministerio de Justicia','El Ministerio de Presidencia','Ningún ministerio: depende del Congreso'],c:1,e:'Art. 44: relación de coordinación administrativa (no de dependencia) con el Ministerio de Justicia.'},
{t:9,q:'Para entrar en un domicilio en una investigación de la AEPD se requiere:',o:['Solo autorización del Director de la AEPD','Consentimiento del interesado o autorización judicial','Una orden administrativa motivada','Nada: la potestad de entrada es plena'],c:1,e:'Art. 53, en conexión con el art. 18.2 CE: los domicilios constitucionalmente protegidos están fuera del alcance directo de la inspección.'},
{t:9,q:'La multa máxima por infracción muy grave del RGPD alcanza:',o:['10 millones de euros o el 2%','20 millones de euros o el 4%','30 millones de euros','El 10% de la facturación'],c:1,e:'Cesta del art. 83.5 RGPD (la del 83.4 llega a 10 M€ o el 2%).'},
{t:9,q:'Si la AGE incumple la normativa de protección de datos, se le impone:',o:['Una multa del 4%','Un apercibimiento u otras medidas del art. 58.2 RGPD','La disolución del órgano responsable','Responsabilidad penal directa'],c:1,e:'Art. 76 LO 3/2018: en lugar de multa, apercibimiento y medidas correctoras — coherente con su condición de sujeto público.'},

/* --- Tema 10 --- */
{t:10,q:'El Sistema Estadístico Europeo está formado por:',o:['Eurostat y solo los INE','Eurostat, las autoridades estadísticas nacionales y los bancos centrales nacionales','Solo Eurostat y la Comisión','Los INE y los ministerios sectoriales'],c:1,e:'El SEE es la asociación de la autoridad estadística de la Unión con las nacionales, incluidos los BCN (Reglamento 223/2009).'},
{t:10,q:'Los principios estadísticos del art. 2 del Reglamento 223/2009 son:',o:['Seis','Nueve','Diez','Cinco'],c:0,e:'Independencia profesional, imparcialidad, objetividad, fiabilidad, secreto estadístico y rentabilidad. La lista española añade transparencia, especialidad y proporcionalidad (nueve).'},
{t:10,q:'Las «estadísticas europeas» son las elaboradas:',o:['Solo por Eurostat','Por cualquier organismo europeo','Por el SEE conforme al programa estadístico europeo','Por los bancos centrales'],c:2,e:'Definición del Reglamento: desarrolladas, elaboradas y difundidas por el SEE conforme al programa estadístico plurianual.'},
{t:10,q:'El CSEE (Comité del Sistema Estadístico Europeo):',o:['Es el órgano ejecutivo de Eurostat','Asiste a la Comisión en la coordinación del programa estadístico','Sustituye a las autoridades nacionales','Depende del Parlamento Europeo'],c:1,e:'Comité de asesoramiento profesional integrado por representantes de los Estados miembros.'},
{t:10,q:'Cada INE actúa ante la Comisión (Eurostat) como:',o:['Un interlocutor más entre varios','El interlocutor único del Estado miembro','Un observador sin voto','Delegado permanente'],c:1,e:'Art. 5.1 del Reglamento: coordinación nacional e interlocución única sobre las cuestiones estadísticas.'},
{t:10,q:'El deber de confidencialidad del personal de los INE según el art. 20 del Reglamento:',o:['Existe solo en servicio activo','Persiste incluso después de haber cesado en sus funciones','Aplica solo a los datos de personas físicas','Se limita a los datos europeos clasificados'],c:1,e:'Mismo paralelismo que el art. 17.4 de la Ley 12/1989 — secreto vitalicio en ambas normas.'},
{t:10,q:'El acceso a registros administrativos para producir estadísticas europeas:',o:['Está prohibido','Está permitido a las autoridades estadísticas nacionales','Exige el consentimiento de cada ciudadano','Solo es posible mediante convenio bilateral'],c:1,e:'Art. 17 bis (introducido por el Reglamento (UE) 2015/759): acceso para fines estadísticos.'},
{t:10,q:'Un «dato confidencial» según el Reglamento 223/2009:',o:['Solo permite identificación directa','Permite identificar directa o indirectamente a la unidad estadística','Es cualquier dato agregado','Es el dato publicado por Eurostat'],c:1,e:'Mismo estándar del art. 13.2 de la Ley 12/1989: el riesgo de reidentificación indirecta también confidencializa.'},

/* --- Tema 11 --- */
{t:11,q:'La Junta Electoral Central se compone de:',o:['8 magistrados del TC y 5 juristas o catedráticos designados por el Congreso','5 magistrados del TC y 8 juristas','Solo magistrados del Tribunal Supremo','13 miembros elegidos por las Cortes'],c:0,e:'Trece miembros: 8 magistrados del TC designados por el propio TC y 5 catedráticos de Derecho, CC. Políticas o Sociología o juristas de reconocida competencia designados por el Congreso.'},
{t:11,q:'La Oficina del Censo Electoral está encuadrada:',o:['En el Ministerio del Interior','En el INE, bajo la dirección de la JEC','En la Junta Electoral Central físicamente','En cada Ayuntamiento'],c:1,e:'Art. 29.1 LOREG: dependencia orgánica del INE y funcional de la JEC — el matiz dual clásico de examen.'},
{t:11,q:'Las resoluciones de la OCE en materia censal:',o:['Son recurribles en alzada ante el INE','Agotan la vía administrativa','Se recurren ante la JEC','Se recurren ante el Ministro'],c:1,e:'Art. 30.f: agotan la vía administrativa; contra ellas, contencioso-administrativo en el brevísimo plazo de 5 días.'},
{t:11,q:'La inscripción en el Censo Electoral es:',o:['Voluntaria','Obligatoria y de oficio','Obligatoria solo en año electoral','Obligatoria a petición del interesado'],c:1,e:'Arts. 31-32 LOREG: se realiza de oficio a partir del padrón; es la condición para ejercer el derecho de sufragio (pregunta 2023).'},
{t:11,q:'El censo electoral se actualiza:',o:['Cada año','Mensualmente, con referencia al día primero','Cada 5 años','Solo en procesos electorales'],c:1,e:'Art. 34: censo permanente con actualización mensual; para cada proceso se toma la fotografía del segundo mes anterior a la convocatoria.'},
{t:11,q:'La formación, mantenimiento, revisión y custodia del padrón corresponde a:',o:['Al INE','Al Ayuntamiento','A la Diputación Provincial','A la FEMP'],c:1,e:'Art. 17.1 LBRL: al Ayuntamiento, bajo la coordinación del INE.'},
{t:11,q:'La propuesta de cifras oficiales de población al Gobierno corresponde a:',o:['Al Pleno del Ayuntamiento','Al Presidente del INE','Al Consejo de Empadronamiento','Al Ministro de Política Territorial'],c:1,e:'Art. 17.3 LBRL: el Presidente del INE también resuelve las discrepancias de empadronamiento.'},
{t:11,q:'El Consejo de Empadronamiento está adsorbido a:',o:['La FEMP','El Ministerio de Política Territorial','El INE','La JEC'],c:2,e:'Art. 17.4 LBRL: órgano de colaboración AGE-EELL en materia padronal, adsorbido al INE (pregunta 2026: adscripción, composición y funciones).'},
{t:11,q:'¿Cuántos vocales del Consejo de Empadronamiento representa a la FEMP?',o:['Uno','Dos','Tres','Cuatro'],c:1,e:'Composición: presidente + 3 vocales del INE, 2 de la FEMP y 1 de la DG de Cooperación con la Administración Local (7 en total).'},
{t:11,q:'Las copias del censo electoral para partidos y candidaturas:',o:['Son gratuitas e ilimitadas','La primera es gratuita y sirve solo para fines electorales','Exigen autorización de la AEPD','Se venden a precio de mercado'],c:1,e:'LOREG: primera copia gratuita, uso exclusivamente electoral (envío de propaganda y comprobación de inscripción).'},
{t:11,q:'Los datos del padrón municipal son:',o:['Públicos y libremente accesibles','Confidenciales, con cesión reglada a AAPP y fines estadísticos','Solo accesibles al Ayuntamiento','De acceso previo pago'],c:1,e:'La confidencialidad padronal limita el acceso; el INE los recibe para la explotación estadística y las cifras oficiales de población.'},

/* --- Tema 12 --- */
{t:12,q:'La LO 3/2007 se dicta en desarrollo de los artículos:',o:['14 y 15 CE','9.2 y 14 CE','1.1 y 103 CE','15 y 27 CE'],c:1,e:'Igualdad formal (14) + mandato de promoción de la igualdad real y efectiva (9.2).'},
{t:12,q:'La «composición equilibrada» en órganos y candidaturas supone:',o:['50% exacto','Entre el 40% y el 60% de cada sexo','Al menos un 30% de mujeres','Un tercio para cada sexo'],c:1,e:'Definición legal del art. 2 bis LO 3/2007.'},
{t:12,q:'El art. 20 de la LO 3/2007 obliga a las estadísticas públicas a:',o:['Publicar datos solo de mujeres','Incluir sistemáticamente la variable de sexo','Excluir los datos de género por privacidad','Encuestar solo cada cinco años'],c:1,e:'Además: indicadores de discriminación múltiple, muestras amplias y desagregación por sexo — obligación para el INE.'},
{t:12,q:'Los tribunales de selección de la AGE deben responder al principio de:',o:['Igualdad salarial','Presencia equilibrada','Paridad estricta del 50%','Rotación anual'],c:1,e:'Art. 53 LO 3/2007: presencia equilibrada, salvo razones fundadas y objetivas debidamente motivadas.'},
{t:12,q:'El Plan para la Igualdad en la AGE se aprueba:',o:['Cada cuatro años','Al inicio de cada legislatura','Anualmente con los PGE','A propuesta del Congreso'],c:1,e:'Art. 64 LO 3/2007: al inicio de cada legislatura, previa negociación con la representación de los empleados públicos.'},
{t:12,q:'La norma monográfica sobre violencia de género es:',o:['La LO 3/2007','La LO 1/2004','La Ley 4/2023','La LO 3/2018'],c:1,e:'La LO 1/2004, de medidas de protección integral; la LO 3/2007 la incorpora solo transversalmente.'},
{t:12,q:'La Ley 4/2023 protege frente a la discriminación por:',o:['Solo orientación sexual','Orientación sexual, identidad y expresión de género y características sexuales','Solo identidad de género','Edad, sexo y discapacidad'],c:1,e:'Es la ley para la igualdad real y efectiva de las personas trans y para la garantía de los derechos de las personas LGTBI.'},
{t:12,q:'El cambio de la mención registral del sexo sin requisitos adicionales es posible desde:',o:['12 años','14 años','16 años','18 años'],c:2,e:'Desde los 16; de 14 a 16 con asistencia; de 12 a 14 mediante decisión judicial.'},
{t:12,q:'El permiso por nacimiento para cada progenitor es de:',o:['12 semanas','16 semanas','8 semanas','20 semanas'],c:1,e:'16 semanas iguales e intransferibles tras las reformas de 2019-2021 — la conciliación como corresponsabilidad.'},

/* --- Tema 13 --- */
{t:13,q:'¿Cuál NO es un principio informador del gobierno abierto?',o:['Transparencia','Rendición de cuentas','Jerarquía administrativa','Colaboración'],c:2,e:'Los cuatro son: transparencia, participación, colaboración y rendición de cuentas (accountability).'},
{t:13,q:'Los tres objetos de la Ley 19/2013 son:',o:['Transparencia, acceso y buen gobierno','Publicidad, sanción y control','Acceso, datos abiertos y gobierno electrónico','Transparencia, igualdad y eficacia'],c:0,e:'Art. 1 — estructuran los títulos de la ley: publicidad activa (I), derecho de acceso (II) y buen gobierno (III).'},
{t:13,q:'El derecho de acceso a la información pública es titularidad de:',o:['Solo los interesados en un procedimiento','Solo los españoles','Todas las personas','Los residentes en España'],c:2,e:'Art. 12: titularidad universal, en desarrollo del art. 105.b) CE — distinto del acceso al expediente propio de la Ley 39/2015.'},
{t:13,q:'¿Debe el solicitante motivar su petición de acceso a la información?',o:['Siempre','Solo si pide datos personales','No: la ausencia de motivación nunca es causa de rechazo','Solo ante el CTBG'],c:2,e:'Art. 17.3 Ley 19/2013: puede exponer motivos, pero no está obligado — clave de diseño de la ley.'},
{t:13,q:'El plazo de resolución de una solicitud de acceso es de:',o:['15 días','1 mes','3 meses','10 días'],c:1,e:'Un mes desde la recepción, ampliable por otro mes si el volumen o complejidad lo justifica.'},
{t:13,q:'¿Cuál de estos NO es un límite tasado del art. 14 de la Ley 19/2013?',o:['Seguridad nacional','Intereses económicos y comerciales','Protección del medio ambiente','El interés particular del solicitante'],c:3,e:'El interés del solicitante no es un límite; los límites son públicos (seguridad, defensa, relaciones exteriores, etc.) y se aplican con proporcionalidad.'},
{t:13,q:'Contra la denegación de un acceso cabe:',o:['Recurso de alzada ante el Ministro','Reclamación ante el CTBG, previa a la contenciosa','Recurso de reposición','Queja ante el Defensor del Pueblo como única vía'],c:1,e:'Art. 24: reclamación de alzada ante el propio órgano y, si se mantiene, reclamación ante el Consejo de Transparencia y Buen Gobierno.'},
{t:13,q:'El CTBG es:',o:['Un organismo público independiente','Un órgano dependiente del Ministerio de Justicia','Una comisión de las Cortes','Una autoridad administrativa independiente'],c:0,e:'RD 919/2014: organismo público con personalidad propia, con adscripción administrativa pero plena independencia funcional.'},
{t:13,q:'El art. 8 de la Ley 19/2013 impone publicar como publicidad activa:',o:['Solo los contratos públicos','Información económica, presupuestaria y estadística','Solo las subvenciones','Los expedientes electorales'],c:1,e:'La mención expresa de la información «estadística» conecta esta ley con los principios de transparencia de la Ley 12/1989.'},

/* ================= ROUTER ================= */
let CURRENT = '';
function route(){
  const h = (location.hash||'#/inicio').replace('#/','');
  const parts = h.split('/');
  const view = parts[0]||'inicio';
  const arg = parts[1];
  closeSidebar();
  window.scrollTo({top:0});
  const V = $('#view');
  CURRENT = view;
  if(view==='tema' && arg && topicById(arg)){
    setActiveNav('temario');
    viewTema(topicById(arg), parts[2]||null);
  } else if(view==='temario'){ setActiveNav('temario'); viewTemario(); }
  else if(view==='pendientes'){ setActiveNav('pendientes'); viewPendientes(); }
  else if(view==='tarjetas'){ setActiveNav('tarjetas'); viewTarjetas(); }
  else if(view==='practica'){ setActiveNav('practica'); viewPractica(); }
  else if(view==='examen'){ setActiveNav('examen'); viewExamen(); }
  else if(view==='seguimiento'){ setActiveNav('seguimiento'); viewSeguimiento(); }
  else { setActiveNav('inicio'); viewInicio(); }
  const db = $('#dueBadge'); if(db) db.textContent = dueCount();
  const pbn = $('#pendBadge'); if(pbn) pbn.textContent = PENDING.filter(p=>!S.pready[p.id]).length;
}

  const idx = TOPICS.indexOf(t);

  const firstUnread = t.units.find(u=>!S.read[u.id]);
  const forced = forcedUnit ? t.units.find(u=>u.id===forcedUnit) : null;

  V.innerHTML = `

    ${t.exam.length? `<div class="examq-box"><div class="eq-h">◉ Así lo ha preguntado el tribunal</div>${t.exam.map(e=>'<div class="examq"><span class="yr">'+e.y+'</span>'+esc(e.q)+'<span class="why">↳ '+esc(e.why)+'</span></div>').join('')}</div>`:''}

let FC = {active:false, filter:0, queue:[], idx:0, flipped:false, log:{}};
let pendingCardTopic = 0;

function goCards(topicId){ pendingCardTopic = topicId||0; location.hash = '#/tarjetas'; }
function cardCounts(){
  let nuevo=0, learn=0, due=0, done=0;
  CARDS.forEach(c=>{ const s=cardState(c); if(s==='new')nuevo++; else if(s==='learn')learn++; else if(s==='due')due++; else if(s==='done')done++; });
  return {nuevo, learn, due, done};
}
function buildQueue(){
  const f = FC.filter;
  const pool = CARDS.filter(c=>f===0||c.t===f);
  const dueCards = pool.filter(c=>{const s=cardState(c);return s==='due'||s==='learn';});
  const newCards = shuffle(pool.filter(c=>cardState(c)==='new'));
  let q = dueCards.slice().sort((a,b)=>(S.srs[a.id]?S.srs[a.id].d:0)-(S.srs[b.id]?S.srs[b.id].d:0));
  const slots = Math.max(0, 15-q.length);
  q = q.concat(newCards.slice(0, Math.min(slots, 10)));
  return q;
}

function qToggleAll(){ QZ.topics=[]; pendingQuizTopic=0; viewPractica(); }
function startQuiz(){
  const pool = QUIZ.filter(q=>QZ.topics.length===0||QZ.topics.includes(q.t));
  if(!pool.length){ toast('Selecciona al menos un tema'); return; }
  const n = QZ.n==='todas'? pool.length : Math.min(QZ.n, pool.length);
  QZ.queue = shuffle(pool).slice(0,n);

function renderQuestion(V){
  const q = QZ.queue[QZ.idx];
  if(!q){ renderQuizResults(V); return; }
  const t = topicById(q.t);
  const answered = QZ.sel!==null;
  const showFb = QZ.mode==='practica' && answered;
  const letters = ['A','B','C','D'];
  let opts = q.o.map((o,i)=>{

    if(showFb){ if(i===q.c) cls='ok'; else if(i===QZ.sel) cls='bad'; else cls='dim'; }
    else if(QZ.mode==='examen' && QZ.sel===i) cls='ok';
    return '<button class="qopt '+cls+'" onclick="qAnswer('+i+')" '+((answered&&(QZ.mode==='practica'))?'disabled':'')+'>'
      + '<span class="ol">'+letters[i]+'</span><span>'+esc(o)+'</span></button>';
  }).join('');
  V.innerHTML = `

      <div style="margin-top:14px;"><button class="btn der" onclick="qNext()">Siguiente →</button> <span class="mono muted" style="font-size:10px;margin-left:8px;">o pulsa Enter</span></div>`:''}
      ${(QZ.mode==='examen'&&answered)?'<div style="margin-top:14px;"><button class="btn der" onclick="qNext()">Siguiente →</button></div>':''}
    </div>
  </div>`;
}
function qAnswer(i){
  if(QZ.sel!==null && QZ.mode==='practica') return;
  const q = QZ.queue[QZ.idx];
  QZ.sel=i;
  QZ.answers.push({q, sel:i, ok:i===q.c});

  viewPractica();
}
function qNext(){
  QZ.idx++; QZ.sel=null;

  viewPractica();
}

          <p class="muted" style="margin:4px 0 10px;font-size:13px;">${pct>=0.85?'Excelente dominio.':pct>=0.7?'Buen nivel — afina los fallos.':'Repasa las unidades implicadas y reintenta las falladas.'}</p>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">

            <a class="btn ghost sm" href="#/practica">Cambiar configuración</a>
          </div>
        </div>
      </div>
    </div>
    ${wrong.length? `<div class="panel"><h3>Repaso de fallos</h3>${wrong.map(a=>{
      const t=topicById(a.q.t);
      return '<div class="review-item"><div class="rq"><span class="badge der" style="margin-right:6px;">T'+t.id+'</span>'+esc(a.q.q)+'</div>'
      + '<div class="ra">Tu respuesta: <span class="bad">'+esc(a.q.o[a.sel])+'</span> · Correcta: <span class="good">'+esc(a.q.o[a.q.c])+'</span></div>'
      + '<div class="re">'+esc(a.q.e)+'</div></div>';
    }).join('')}</div>`:''}
  </div>`;
  renderSidebar();

function retryWrong(){

function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});

  a.download = 'progreso-derecho-ine-a1-'+isoDay()+'.json';

  toast('Respaldo descargado ✓','ok');
}
function importData(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(!data || typeof data!=='object' || !('read' in data)) throw 0;
      S = Object.assign(defaultState(), data);
      save(); renderSidebar(); route();
      toast('Progreso importado ✓','ok');
    }catch(e){ toast('Archivo no válido','err'); }
  };
  r.readAsText(file);
}
function resetAll(){
  if(!confirm('¿Seguro que quieres borrar TODO tu progreso (lecturas, tarjetas, tests, tiempo)? Esta acción no se puede deshacer.')) return;
  localStorage.removeItem(LSKEY);
  S = defaultState();

}
