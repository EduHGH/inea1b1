/* ---------- Simulacro de enunciados ---------- */
function startPendDrill(prob){
  let pool = PENDING.filter(p=>prob===0 || p.prob===prob);
  // sin preparar primero; dentro de cada grupo, orden aleatorio
  const noReady = shuffle(pool.filter(p=>!pendReady(p)));
  const ready = shuffle(pool.filter(p=>pendReady(p)));
  PD.queue = noReady.concat(ready);
  if(!PD.queue.length){ toast('No quedan epígrafes en ese filtro'); return; }
  PD.active = true; PD.idx = 0; PD.shown = false;
  PD.log = {ok:0, mid:0, bad:0};
  viewPendientes();
}
function pdReveal(){ PD.shown = true; const V=$('#view'); renderPendDrill(V); }
function pdRate(r){
  const p = PD.queue[PD.idx];
  if(r===3){ PD.log.ok++; S.pready[p.id] = true; }
  else if(r===2){ PD.log.mid++; }
  else { PD.log.bad++; delete S.pready[p.id]; }
  markActivity(); save();
  PD.idx++; PD.shown = false;
  if(PD.idx>=PD.queue.length){ pdEnd(); return; }
  const V=$('#view'); renderPendDrill(V);
}
function pdEnd(){
  const n = PD.idx;
  const ok = PD.log.ok;
  PD.active = false;
  S.qhist.push({d:Date.now(), n, ok, mode:'enunciados'});
  if(S.qhist.length>60) S.qhist = S.qhist.slice(-60);
  save();
  const st = pendStats();
  const V=$('#view');
  V.innerHTML = `
  <div class="view">
    <div class="vhead"><div><div class="eyebrow">Simulacro finalizado</div><h1>Enunciados trabajados</h1></div></div>
    <div class="panel" style="text-align:center;">
      <div class="fc-stats" style="max-width:520px;margin:0 auto 8px;">
        <div class="fc-stat done"><div class="fv">${ok}</div><div class="fl">lo sabía</div></div>
        <div class="fc-stat learn"><div class="fv">${PD.log.mid}</div><div class="fl">a medias</div></div>
        <div class="fc-stat due"><div class="fv">${PD.log.bad}</div><div class="fl">no lo sabía</div></div>
      </div>
      <p class="muted" style="font-size:13px;">${n} enunciados trabajados. Los valorados como «lo sabía» quedan marcados como preparados en el temario pendiente (${st.ready}/${st.total}).</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;">
        <button class="btn der" onclick="startPendDrill(1)">Otra ronda (ALTA) →</button>
        <a class="btn ghost" href="#/pendientes">Volver al temario pendiente</a>
      </div>
    </div>
  </div>`;
  renderSidebar();
}
function renderPendDrill(V){
  const p = PD.queue[PD.idx];
  if(!p){ pdEnd(); return; }
  const t = topicById(p.t);
  const done = PD.idx, total = PD.queue.length;
  const m = PROB_META[p.prob];
  V.innerHTML = `
  <div class="view">
    <div class="vhead">
      <div>
        <div class="eyebrow">Simulacro de enunciados · T${t.id} · ${esc(t.t)}</div>
        <h1>Responde como en el examen</h1>
      </div>
      <button class="btn ghost sm" onclick="PD.active=false;viewPendientes()">Terminar</button>
    </div>
    <div class="fc-progress"><div class="bar der"><i style="width:${Math.round(done/total*100)}%"></i></div><span class="mono">${done+1}/${total}</span></div>
    <div class="drill-card">
      <div class="drill-top">
        <span class="pn">${p.t+'·'+p.u}</span>
        ${pendBadge(p)}
        <span class="pq-pat">${esc(p.pat)}</span>
      </div>
      <p class="drill-q">«${p.pq}»</p>
      ${PD.shown
        ? `<div class="planbox open" style="margin-top:18px;">
             <div class="pq-head"><span class="pq-lbl">Guion de respuesta — lo que el tribunal espera</span></div>
             <div class="plan-body">${p.plan}</div>
           </div>
           <div class="rate-row" style="margin-top:20px;">
             <button class="ratebtn again" onclick="pdRate(1)"><span class="rk">1 · No lo sabía</span><span class="ri">siguiente</span></button>
             <button class="ratebtn" onclick="pdRate(2)"><span class="rk">2 · A medias</span><span class="ri">siguiente</span></button>
             <button class="ratebtn good" onclick="pdRate(3)"><span class="rk">3 · Lo sabía</span><span class="ri">marca preparado ✓</span></button>
           </div>`
        : `<div class="drill-hint">
             Piensa tu respuesta por escrito o en voz alta <b>antes de girar</b>: el primer ejercicio se responde por escrito.
             <button class="btn der" style="margin-top:14px;" onclick="pdReveal()">Ver guion de respuesta →</button>
             <span class="mono muted" style="display:block;font-size:10px;margin-top:8px;">espacio / Enter para girar · 1-3 para valorar</span>
           </div>`}
    </div>
    <div class="panel" style="margin-top:16px;">
      <div class="mono muted" style="font-size:10.5px;">Sesión: ${PD.log.ok} sabidas · ${PD.log.mid} a medias · ${PD.log.bad} falladas &nbsp;·&nbsp; quedan ${total-done-1} enunciados tras este</div>
    </div>
  </div>`;
}

/* ================= ATAJOS DE TECLADO ================= */
document.addEventListener('keydown', (e)=>{
  if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  if(CURRENT==='tarjetas' && FC.active){
    if(e.code==='Space'||e.key==='Enter'){ e.preventDefault(); flipCard(); }
    else if(FC.flipped && ['1','2','3','4'].includes(e.key)){ rateCard(Number(e.key)); }
  } else if(CURRENT==='practica' && QZ.active){
    if(['1','2','3','4'].includes(e.key)){ const i=Number(e.key)-1; if(i<4) qAnswer(i); }
    else if(e.key==='Enter' && QZ.sel!==null){ qNext(); }
  } else if(CURRENT==='pendientes' && PD.active){
    if(!PD.shown){ if(e.code==='Space'||e.key==='Enter'){ e.preventDefault(); pdReveal(); } }
    else if(['1','2','3'].includes(e.key)){ pdRate(Number(e.key)); }
  }
});

/* ================= ARRANQUE ================= */
window.addEventListener('hashchange', route);

/* menú móvil */
function closeSidebar(){ $('#sidebar').classList.remove('show'); $('#backdrop').classList.remove('show'); }
(function(){
  const mb=$('#menuBtn');
  if(mb) mb.addEventListener('click', ()=>{ $('#sidebar').classList.toggle('show'); $('#backdrop').classList.toggle('show'); });
  const bd=$('#backdrop');
  if(bd) bd.addEventListener('click', closeSidebar);
})();

/* botones laterales */
(function(){
  const eb=$('#exportBtn'); if(eb) eb.addEventListener('click', exportData);
  const ib=$('#importBtn'); if(ib) ib.addEventListener('click', ()=>$('#importFile').click());
  const rb=$('#resetBtn'); if(rb) rb.addEventListener('click', resetAll);
  const fi=$('#importFile'); if(fi) fi.addEventListener('change', ()=>{ if(fi.files[0]) importData(fi.files[0]); fi.value=''; });
})();

renderSidebar();
route();
</script>
</body>
</html>
