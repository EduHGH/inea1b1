{y:2023, q:'De conformidad con la LO 5/1985 (LOREG), ¿es obligatoria la inscripción en el Censo Electoral? Razonar la respuesta.', why:'Sí/no razonado: hay que citar el fundamento legal exacto de la obligatoriedad (arts. 32 y 31 LOREG).'},
{y:2024, q:'Competencias de la Oficina del Censo Electoral previstas en el artículo 30 de la LOREG.', why:'Enumerar competencias concretas del artículo, no la organización general.'},
{y:2026, q:'El Consejo de Empadronamiento. Adscripción, composición y funciones.', why:'Tres apartados obligatorios (a qué está adscrito, quién lo compone, qué hace) que suelen olvidarse.'}
],
units:[
{id:'11.1', t:'Las Juntas Electorales (LOREG)', html:`
<div class="ucard"><div class="uhead"><span class="anum">JEC</span><span class="arub">— Junta Electoral Central</span></div>
<p>Órgano superior de la Administración electoral, con funcionamiento permanente. Se compone de <mark>8 magistrados del Tribunal Constitucional designados por éste y 5 catedráticos de Derecho, Ciencias Políticas o Sociología o juristas de reconocida competencia designados por el Congreso</mark> (13 miembros). Interpreta la normativa electoral, unifica criterios, resuelve reclamaciones y censura la actividad de los partidos durante la campaña.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">JEP y JZC</span><span class="arub">— juntas provinciales y de zona</span></div>
<p><b>Juntas Electorales Provinciales:</b> <mark>dos jueces o magistrados y tres doctores o licenciados</mark> en Derecho, Ciencias Políticas o Sociología. <b>Juntas de Zona:</b> <mark>dos jueces o magistrados y dos doctores o licenciados</mark> en las mismas disciplinas. Proclaman candidaturas (JEP) y resuelven reclamaciones censales y de escrutinio en su ámbito.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>JEC: <b>8 magistrados TC + 5 catedráticos/juristas del Congreso = 13</b>.</li>
<li>La Administración electoral garantiza transparencia y objetividad de los procesos: JEC → JEP → JZC.</li>
<li>La OCE trabaja bajo la dirección de la JEC.</li></ul></div>
`},
{id:'11.2', t:'El Censo Electoral y la Oficina del Censo Electoral (arts. 29-40)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 29</span><span class="arub">— la OCE</span></div>
<p>La Oficina del Censo Electoral está <mark>encuadrada en el INE</mark> — dependencia orgánica — y ejerce sus competencias bajo la <mark>dirección y supervisión de la Junta Electoral Central</mark> — dependencia funcional. Tiene Delegaciones Provinciales; Ayuntamientos y Consulados actúan como colaboradores.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 30</span><span class="arub">— competencias (pregunta 2024)</span></div>
<p>a) <mark>Coordinar y supervisar la elaboración del censo</mark>; b) controlar y revisar de oficio altas y bajas y elaborar el <mark>fichero nacional de electores</mark>; c) elaborar las <mark>listas electorales provisionales y definitivas</mark>; d) <mark>resolver las reclamaciones</mark> contra las actuaciones de los órganos censales — sus resoluciones <mark>agotan la vía administrativa</mark>; e) expedir <mark>certificaciones censales</mark> y remitir datos a las Juntas.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 31-39</span><span class="arub">— inscripción, vigencia y rectificación</span></div>
<p>El censo contiene la inscripción de quienes reúnen los requisitos para ser electores. La inscripción es <mark>obligatoria y de oficio</mark> (art. 32), a partir del padrón y otros registros. El censo es <mark>permanente y de actualización mensual</mark> (art. 34), con referencia al día primero de cada mes. Para cada proceso se toma la <mark>fotografía del censo vigente</mark> correspondiente al segundo mes anterior a la convocatoria. Rectificación: <mark>reclamación ante la Delegación Provincial de la OCE</mark>; contra su resolución, contencioso-administrativo en 5 días.</p></div>
<div class="keybox"><div class="klbl">Datos de examen — la de 2023 y la de 2024</div><ul>
<li>¿Es obligatoria la inscripción? <b>Sí</b>: arts. 31 y 32 LOREG (inscripción de oficio a partir del padrón; el censo es la condición para ejercer el sufragio).</li>
<li>OCE: encuadrada en el <b>INE</b>, dirigida por la <b>JEC</b>; resoluciones que agotan vía administrativa.</li>
<li>Censo permanente + actualización <b>mensual</b>; cierre: 2º mes anterior a la convocatoria.</li></ul></div>
`},
{id:'11.3', t:'El padrón municipal y el Consejo de Empadronamiento (LBRL)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Arts. 15-16 LBRL</span><span class="arub">— el padrón</span></div>
<p>Toda persona que viva en España está <mark>obligada a inscribirse en el padrón</mark> del municipio de residencia habitual; los inscritos son los <mark>vecinos</mark>. El padrón es un <mark>registro administrativo</mark> donde constan los vecinos; sus datos constituyen <mark>prueba de la residencia y del domicilio habitual</mark>. Su explotación estadística produce las <mark>cifras oficiales de población</mark> (referidas al 1 de enero de cada año).</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 17 LBRL</span><span class="arub">— gestión y Consejo de Empadronamiento</span></div>
<p>La formación, mantenimiento, revisión y custodia del padrón corresponde al <mark>Ayuntamiento</mark>, con la <mark>coordinación del INE</mark>. El <mark>Presidente del INE</mark> resuelve las discrepancias en materia de empadronamiento entre Ayuntamientos, Diputaciones y el propio INE, y <mark>eleva al Gobierno la propuesta de cifras oficiales de población</mark>. El <b>Consejo de Empadronamiento</b> es un <mark>órgano colegiado de colaboración entre la AGE y las Entidades Locales</mark> en materia padronal, <mark>adsorbido al INE</mark>: lo preside un funcionario del INE designado por su Presidente y lo integran tres vocales del INE, dos de la <b>FEMP</b> y uno de la Dirección General de Cooperación con la Administración Local. <b>Funciones:</b> informar las propuestas de resolución de discrepancias, elevar anualmente al Gobierno un informe sobre la gestión y funcionamiento del padrón y proponer criterios técnicos de gestión padronal.</p></div>
<div class="keybox"><div class="klbl">Datos de examen — pregunta 2026</div><ul>
<li>Consejo de Empadronamiento: <b>adsorbido al INE</b>; Presidencia + 6 vocales (4 INE, 2 FEMP, 1 DG Cooperación Local).</li>
<li>Funciones: informa discrepancias (que resuelve el <b>Presidente del INE</b>), informe anual al Gobierno, criterios técnicos.</li>
<li>Cifras oficiales de población: fundamento en el 17.3 — con efectos jurídicos (fondos, concejales).</li>
<li>Los extranjeros sin residencia permanente deben renovar su inscripción padronal cada 2 años.</li></ul></div>
`},
{id:'11.4', t:'Acceso a los datos censales y padronales', html:`
<div class="ucard"><div class="uhead"><span class="anum">LOREG</span><span class="arub">— cesión de copias del censo</span></div>
<p>Los <mark>partidos, federaciones, coaliciones y agrupaciones de electores</mark> pueden obtener <mark>copias del censo electoral</mark> (relación de electores por secciones) para <mark>fines exclusivamente electorales</mark>: envío de propaganda y comprobación de la inscripción. La primera copia es gratuita; las adicionales, abonando su coste. Los datos de los electores no pueden ser utilizados para otras finalidades, bajo la normativa de protección de datos.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">LBRL + LOPDGDD</span><span class="arub">— datos padronales</span></div>
<p>Los datos del padrón son <mark>confidenciales</mark>: el acceso a ellos queda limitado a la Administración, a los propios interesados y a los fines estadísticos. Su comunicación a otras Administraciones solo procede cuando deban usarlos para el ejercicio de sus competencias (con prohibición de cesión posterior). Cualquier interesado puede obtener <mark>certificación o volante de empadronamiento</mark> acreditativo de su residencia. La remisión periódica de datos padronales al INE ampara el tratamiento estadístico en el marco de la Ley 12/1989.</p></div>
<div class="keybox"><div class="klbl">Datos de examen — el hueco pendiente</div><ul>
<li>Copias del censo: solo <b>fines electorales</b>; primera copia gratuita.</li>
<li>Padrón: confidencial; cesión reglada a AAPP y a fines estadísticos.</li>
<li>Conexión con la LO 3/2018 (Tema 9): el uso desviado de datos censales/padronales es infracción de protección de datos.</li></ul></div>
`}
]},

/* ---------------- TEMA 12 · IGUALDAD ---------------- */
{
id:12, t:'Políticas de Igualdad de Género', prio:1,
prioTxt:'Sin preguntar en 4 convocatorias — LO 4/2023 reciente, candidata a «estrenarse»',
norma:'LO 3/2007 · LO 1/2004 · Ley 4/2023',
desc:'La incorporación de la mujer al mercado de trabajo. Especial referencia a las Administraciones Públicas. Políticas de promoción de la igualdad. Conciliación. Violencia de género. Igualdad de trato de las personas LGTBI.',
exam:[],
units:[
{id:'12.1', t:'La LO 3/2007 y la igualdad en el empleo público', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 1</span><span class="arub">— objeto y fundamento</span></div>
<p>Hacer efectivo el derecho de <mark>igualdad de trato y de oportunidades</mark> entre mujeres y hombres, en particular mediante la eliminación de la discriminación, en desarrollo de los <mark>arts. 9.2 y 14 CE</mark>. El <b>principio de transversalidad</b> (art. 3) incorpora la igualdad en todas las políticas públicas. Se prevén <mark>acciones positivas</mark> y el concepto de <mark>composición equilibrada</mark> (entre 40% y 60%) para órganos, cargos y candidaturas.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Art. 20</span><span class="arub">— adecuación de las estadísticas (conexión INE)</span></div>
<p>Los poderes públicos, en la elaboración de estudios y estadísticas, deberán: incluir sistemáticamente la <mark>variable de sexo</mark>; establecer <mark>indicadores</mark> de discriminación múltiple; diseñar <mark>muestras suficientemente amplias</mark> para explotar por sexo; y ofrecer <mark>información desagregada por sexo</mark>. Es una obligación legal que condiciona el diseño metodológico de las operaciones del INE.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Título V</span><span class="arub">— igualdad en el empleo público</span></div>
<p><b>Criterios de actuación (51):</b> remover obstáculos en el acceso y la carrera, facilitar la <mark>conciliación</mark>, fomentar la formación en igualdad, promover la <mark>presencia equilibrada en órganos de selección y valoración</mark>, proteger frente al acoso y eliminar la discriminación retributiva. <b>Órganos de selección (53):</b> los tribunales de la AGE y sus organismos <mark>responderán al principio de presencia equilibrada</mark>, salvo razones fundadas y objetivas debidamente motivadas. <b>Plan de Igualdad de la AGE (64):</b> aprobado al <mark>inicio de cada legislatura</mark> y negociado con la representación de los empleados públicos. En el sector privado, los <mark>planes de igualdad</mark> son obligatorios para las empresas de más de 50 personas trabajadoras (arts. 45-48).</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Fundamento doble: <b>14 CE</b> (igualdad formal) + <b>9.2 CE</b> (igualdad real y efectiva).</li>
<li>Composición equilibrada: <b>40-60%</b>.</li>
<li>Art. 20: la variable de sexo es obligatoria en las estadísticas públicas — el artículo con más conexión con el INE.</li></ul></div>
`},
{id:'12.2', t:'Violencia de género, personas LGTBI y conciliación', html:`
<div class="ucard"><div class="uhead"><span class="anum">LO 1/2004</span><span class="arub">— protección integral contra la violencia de género</span></div>
<p>Enfoque integral: <mark>prevención y sensibilización, tutela institucional, tutela sanitaria, derechos laborales y de Seguridad Social, tutela judicial</mark> (juzgados de violencia sobre la mujer; orden de protección) y disuasión penal. Derechos laborales de las víctimas: reducción o reordenación de jornada, movilidad geográfica, suspensión con reserva de puesto y extinción con indemnización.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Ley 4/2023</span><span class="arub">— igualdad real y efectiva de personas trans y LGTBI</span></div>
<p>Garantiza la no discriminación por <mark>orientación sexual, identidad de género, expresión de género o características sexuales</mark>, en el empleo público, el acceso a bienes y servicios, la salud y la educación. Regula el <mark>cambio de la mención registral del sexo</mark> (desde los 16 años con requisitos; de 14 a 16 con asistencia; de 12 a 14 mediante decisión judicial) y crea la <mark>autoridad estatal LGTBI</mark> y el Consejo Estatal LGTBI.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Conciliación</span><span class="arub">— LO 3-12/2012 + TREBEP</span></div>
<p>La conciliación se concibe como <mark>corresponsabilidad</mark> de ambos progenitores (art. 44 LO 3/2007): permiso de paternidad como derecho autónomo. Tras las reformas de 2019-2021, los permisos por <mark>nacimiento</mark> son iguales para ambos progenitores (16 semanas), también en el empleo público (art. 49 TREBEP). Las excedencias por cuidado de hijos (hasta 3 años) y de familiares (hasta 2) están protegidas frente a la discriminación por su ejercicio.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>LO 3/2007 = ley código de igualdad; la <b>LO 1/2004</b> es la norma monográfica de violencia de género — no confundir.</li>
<li>Ley 4/2023: cambio registral desde los <b>16 años</b>; 14-16 con asistencia; 12-14 judicial.</li>
<li>Permisos por nacimiento: <b>16 semanas iguales</b> para ambos progenitores.</li></ul></div>
`}
]},

/* ---------------- TEMA 13 · GOBERNANZA ---------------- */
{
id:13, t:'La Gobernanza Pública', prio:2,
prioTxt:'Solo 1 pregunta (2023, CTBG) — la Ley 19/2013 completa sigue sin explorarse',
norma:'Ley 19/2013 · RD 919/2014 · Ley 37/2007',
desc:'Gobernanza pública y gobierno abierto: colaboración, participación, transparencia y rendición de cuentas. Datos abiertos y reutilización. La Ley 19/2013. El Consejo de Transparencia y Buen Gobierno: funciones.',
exam:[
{y:2023, q:'Explicar cuáles son los principales objetivos del Consejo de Transparencia y Buen Gobierno.', why:'Objetivos/funciones del órgano concreto, no una descripción de la Ley 19/2013.'}
],
units:[
{id:'13.1', t:'Gobernanza pública, gobierno abierto y datos abiertos', html:`
<div class="ucard"><div class="uhead"><span class="anum">Conceptos</span><span class="arub">— gobernanza y gobierno abierto</span></div>
<p>La <b>gobernanza pública</b> es la forma de dirección de los asuntos públicos basada en la interacción entre <mark>Estado, mercado y sociedad civil</mark>, más allá de la jerarquía administrativa. El <b>gobierno abierto</b> se apoya en cuatro principios: <mark>transparencia, participación, colaboración y rendición de cuentas</mark> (accountability). España pertenece desde su fundación a la <b>Alianza para el Gobierno Abierto (OGP)</b>, cuyos compromisos se concretan en los <mark>Planes de Gobierno Abierto</mark> plurianuales, elaborados con grupos de participación ciudadana.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Ley 37/2007</span><span class="arub">— reutilización de la información del sector público</span></div>
<p>Regula la <mark>reutilización</mark> de documentos del sector público <mark>con fines comerciales o no comerciales</mark> (excluida la actividad administrativa pública), con dos claves: los datos abiertos se ofrecen en <mark>formatos abiertos y reutilizables</mark> (datos.gob.es), y los convenios con terceros <mark>no pueden otorgar derechos exclusivos</mark> — nadie puede monopolizar la explotación de los datos estadísticos oficiales.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Los 4 principios: <b>colaboración, participación, transparencia, rendición de cuentas</b>.</li>
<li>Transparencia (de oficio) ≠ derecho de acceso (a petición) — complementarios.</li>
<li>Reutilización: sin <b>derechos exclusivos</b>; la INE habilita productos de valor añadido sobre datos publicados.</li></ul></div>
`},
{id:'13.2', t:'La Ley 19/2013: transparencia, acceso y buen gobierno', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 1</span><span class="arub">— tres objetos</span></div>
<p>Ampliar la <mark>transparencia</mark> de la actividad pública, regular y garantizar el <mark>derecho de acceso</mark> a la información y establecer las obligaciones de <mark>buen gobierno</mark> de los responsables públicos. Publicidad activa = empuje de oficio; acceso = solicitud de la ciudadanía.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Título I</span><span class="arub">— publicidad activa (arts. 6-12)</span></div>
<p>Obligación periódica de publicar en las sedes electrónicas: actividad institucional y organizativa, planificación, <mark>información de relevancia jurídica</mark>, <mark>económica, presupuestaria y estadística</mark> (art. 8: contratos, subvenciones, convenios...). Sujetos obligados: todas las AAPP y su sector público institucional, y también partidos, sindicatos y organizaciones empresariales por lo que respecta a las aportaciones públicas que reciben.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Título II</span><span class="arub">— derecho de acceso (arts. 12-24)</span></div>
<p>Titularidad <mark>universal</mark> («todas las personas»), sobre la base del <mark>art. 105.b) CE</mark>. La solicitud <mark>no requiere motivación</mark> (17.3); plazo de resolución <mark>1 mes</mark> (+1 ampliable). Límites tasados (14): seguridad nacional, defensa, relaciones exteriores, seguridad pública, ilícitos, igualdad de las partes, inspección, <mark>intereses económicos y comerciales</mark>, política económica, secreto profesional, confidencialidad de la deliberación y medio ambiente — siempre con juicio de proporcionalidad. Protección de datos de terceros (15): se requiere consentimiento o interés público prevalente. Contra la denegación: <mark>reclamación ante el CTBG</mark> (24), previa a la vía contenciosa.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Título III</span><span class="arub">— buen gobierno</span></div>
<p>Principios éticos y de conducta de los <mark>altos cargos</mark> (rectitud, objetividad, integridad, transparencia, rendición de cuentas, austeridad...), con obligaciones de declaración de actividades y bienes y régimen de conflicto de intereses, respaldado por un régimen sancionador de infracciones muy graves, graves y leves.</p></div>
<div class="keybox"><div class="klbl">Datos de examen — el hueco pendiente</div><ul>
<li>Los «tres títulos» de la ley: <b>publicidad activa, derecho de acceso, buen gobierno</b> — pregunta tipo probable.</li>
<li>Acceso: universal, sin motivar, 1 mes; reclamación previa al CTBG.</li>
<li>El art. 8 incluye la información <b>estadística</b> en la publicidad activa — conexión directa con el INE.</li></ul></div>
`},
{id:'13.3', t:'El Consejo de Transparencia y Buen Gobierno (RD 919/2014)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 34 L-19/2013</span><span class="arub">— fines</span></div>
<p>El CTBG tiene por finalidad <mark>promover la transparencia de la actividad pública, velar por el cumplimiento de las obligaciones de publicidad, salvaguardar el derecho de acceso a la información y garantizar la observancia de las disposiciones de buen gobierno</mark> — cuatro fines que resumen la ley entera (pregunta 2023).</p></div>
<div class="ucard"><div class="uhead"><span class="anum">RD 919/2014</span><span class="arub">— naturaleza y organización</span></div>
<p>Es un <mark>organismo público independiente, con personalidad jurídica propia y plena capacidad de obrar</mark>, que actúa con plena independencia aunque esté adscrito administrativamente a un departamento (a través de la Secretaría de Estado de Función Pública según su Estatuto). Sus órganos: la <mark>Presidencia</mark> y la <mark>Comisión de Transparencia y Buen Gobierno</mark> — órgano colegiado que resuelve las reclamaciones de acceso y los expedientes sancionadores por incumplimiento de las obligaciones de publicidad.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Independiente + personalidad propia + adscripción administrativa (patrón AEPD/IGAE).</li>
<li>Resuelve <b>reclamaciones</b> (art. 24), recomienda, inspecciona la publicidad activa y promueve códigos de buenas prácticas.</li>
<li>La reclamación al CTBG es <b>previa</b> a la vía contencioso-administrativa.</li></ul></div>
`}
]},

/* ---------------- TEMA 14 · ADMINISTRACIÓN TIC ---------------- */
{
id:14, t:'La administración TIC de la AGE', prio:4,
prioTxt:'Tema nuevo: debutó en 2026 con el ENS — el expediente electrónico y las NTI son el ángulo virgen',
norma:'Ley 39/2015 · Ley 40/2015 (Cap. V) · RD 4/2010 (ENI) · RD 311/2022 (ENS) · RD 806/2014',
desc:'Modelos de gobernanza TIC. La transformación digital de la AGE. El expediente electrónico. Normas Técnicas de Interoperabilidad. El Esquema Nacional de Seguridad.',
exam:[
{y:2026, q:'Explicar cómo se aplica el Esquema Nacional de Seguridad (ENS) a la producción estadística oficial y qué medidas deben adoptarse para garantizar la integridad, confidencialidad y disponibilidad de los datos de un organismo estadístico.', why:'Cruce ENS + secreto estadístico: hay que aplicar el ENS al caso concreto, no describirlo en abstracto.'}
],
units:[
{id:'14.1', t:'Administración electrónica (Ley 39/2015, Título II)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 14</span><span class="arub">— relación electrónica: derecho y obligación</span></div>
<p>La relación por medios electrónicos es <mark>obligatoria</mark> para las Administraciones y para: interesados y representantes de AAPP, <mark>profesionales que actúen por cuenta de terceros</mark> ante la Administración, personas jurídicas, sus representantes y sus empleados públicos, notarios y registradores, y las personas que ejerzan actividades sujetas a autorización administrativa previa. Para el resto de ciudadanos es un <mark>derecho</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 9, 27 y 40-43</span><span class="arub">— identificación, registro y notificaciones</span></div>
<p>Identificación mediante <mark>sistemas de firma electrónica</mark> admitidos (certificados, DNIe, Cl@ve). El <b>registro electrónico</b> está disponible <mark>24 horas todos los días del año</mark> (27). Las <b>notificaciones electrónicas</b> se practican por comparecencia en la sede electrónica o a través de la <mark>dirección electrónica habilitada única (DEHú)</mark>; se entienden practicadas al acceder al contenido, y <mark>rechazadas si transcurren 10 días naturales</mark> sin acceder, con efectos de notificación denegada; el solo aviso en la DEHú ya cumple el deber de notificar dentro del plazo.</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>Obligatoriedad electrónica: AAPP + profesionales, personas jurídicas y empleados públicos (14.2-14.3).</li>
<li>Registro: 24h/365. Notificación: 10 días sin acceso = <b>rechazada</b>.</li>
<li>Punto de Acceso General electrónico como portal único de acceso a notificaciones.</li></ul></div>
`},
{id:'14.2', t:'El expediente electrónico y las NTI (RD 4/2010, ENI)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 70 Ley 39/2015</span><span class="arub">— el expediente electrónico</span></div>
<p>El expediente es el <mark>conjunto ordenado de documentos y actuaciones</mark> que sirven de antecedente y fundamento a la resolución. Desde la Ley 39/2015 <mark>el formato electrónico es la regla</mark>: se forma por agregación ordenada de documentos y un <mark>índice numerado</mark>. Cuando deba remitirse a otra Administración, se envía <mark>completo, foliado, autentificado y con índice autentificado</mark>, conforme al <mark>Esquema Nacional de Interoperabilidad y a las NTI</mark>. El <b>índice electrónico</b> es la pieza que <mark>garantiza la integridad del expediente y permite su recuperación</mark>.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">RD 4/2010</span><span class="arub">— el ENI y sus NTI</span></div>
<p>El ENI fija los criterios de interoperabilidad entre AAPP. Se desarrolla en <mark>Normas Técnicas de Interoperabilidad de obligado cumplimiento</mark>: <mark>catálogo de estándares</mark>, <mark>política de firma electrónica</mark>, <mark>digitalización de documentos</mark> (el documento digitalizado tiene la validez del original, con garantías de autenticidad e integridad), <mark>documento electrónico</mark> (metadatos y ciclo de vida), <mark>expediente electrónico</mark> e <mark>intercambio de asientos en registros electrónicos</mark>.</p></div>
<div class="keybox"><div class="klbl">Datos de examen — el ángulo aún sin preguntar</div><ul>
<li>Pregunta tipo probable: «qué es el expediente electrónico y qué garantiza el índice electrónico».</li>
<li>Remisión: <b>completo, foliado, autentificado + índice autentificado</b>.</li>
<li>NTI: catálogo de estándares, firma, digitalización, documento, expediente, intercambio de asientos — obligatorias.</li>
<li>Digitalización con garantías = copia con validez del documento original.</li></ul></div>
`},
{id:'14.3', t:'El Esquema Nacional de Seguridad (RD 311/2022)', html:`
<div class="ucard"><div class="uhead"><span class="anum">Art. 1</span><span class="arub">— objeto y habilitación</span></div>
<p>El ENS (RD 311/2022, que <mark>sustituye al RD 3/2010</mark>) establece los <mark>principios básicos y requisitos mínimos</mark> para la protección adecuada de la información y los servicios de las entidades del sector público, al amparo del <mark>art. 156.2 de la Ley 40/2015</mark>. Su finalidad última es que la organización <mark>pueda cumplir sus objetivos y ejercer sus competencias</mark> usando sistemas de información.</p></div>
<div class="ucard"><div class="uhead"><span class="anum">Arts. 5 y 19-26</span><span class="arub">— principios, dimensiones y categorización</span></div>
<p><b>Principios básicos (5):</b> seguridad integral, gestión de riesgos, prevención-detección-respuesta, <mark>líneas de defensa</mark>, vigilancia continua y diferenciación de responsabilidades. <b>Dimensiones de la seguridad:</b> <mark>disponibilidad, autenticidad, integridad, confidencialidad y trazabilidad</mark>. Cada sistema se <b>categoriza</b> (básica, media o alta) según el impacto de un incidente sobre cada dimensión, y la categoría determina las medidas exigibles del <b>marco organizativo, el marco operacional y las medidas de protección</b>.</p></div>
<div class="notebox"><div class="klbl">Aplicación a la producción estadística — la pregunta de 2026</div>
<p>Un organismo estadístico que maneja datos amparados por el secreto estadístico debe: <b>1)</b> inventariar sus sistemas (recogida, producción y difusión de datos); <b>2)</b> analizar los riesgos sobre las cinco dimensiones — la <mark>confidencialidad</mark> de los datos individuales y la <mark>integridad</mark> de las cifras publicadas son críticas; <b>3)</b> categorizar (muy probablemente <b>alta</b> en confidencialidad); <b>4)</b> implantar las medidas de su categoría (control de accesos, cifrado, registro de trazabilidad, copias de seguridad); y <b>5)</b> auditar y mantener. El ENS existe, en último término, para que el INE pueda seguir produciendo estadística fiable preservando el secreto estadístico (cierre del círculo con el art. 4.2 de la Ley 12/1989).</p></div>
<div class="keybox"><div class="klbl">Datos de examen</div><ul>
<li>ENS vigente: <b>RD 311/2022</b> (habilitado por el 156.2 Ley 40/2015) — no confundir con el RD 3/2010 derogado.</li>
<li>5 dimensiones: <b>disponibilidad, autenticidad, integridad, confidencialidad, trazabilidad</b>.</li>
<li>Categorías de sistemas: <b>básica, media, alta</b> → determinan las medidas.</li>
<li>Los proveedores de servicios (p. ej., nube) también quedan sometidos a requisitos del ENS.</li></ul></div>
`}
]}
];

<li>Sucesión (57): <b>primogenitura y representación</b>; línea anterior a las posteriores, grado más próximo, el varón a la mujer en el mismo grado, la persona de más edad en el mismo sexo; abdicaciones y renuncias mediante <b>ley orgánica</b>.</li>
<li>Regencia (59): Rey menor de edad → padre o madre; inhabilitado → Príncipe heredero mayor de edad; las Cortes pueden nombrar una Regencia de <b>una, tres o cinco personas</b>.</li>
<li>Funciones (62): sancionar y promulgar las leyes; convocar y disolver las Cortes y convocar elecciones; <b>proponer el candidato a Presidente del Gobierno</b> y nombrarlo; mando supremo de las Fuerzas Armadas; derecho de gracia <b>sin indultos generales</b>; declarar la guerra y hacer la paz <b>previa autorización de las Cortes</b> (63).</li>
<li>Refrendo (64): del <b>Presidente del Gobierno y, en su caso, de los Ministros competentes</b>; la propuesta y el nombramiento del Presidente y la disolución del art. 99 las refrenda el <b>Presidente del Congreso</b>; son responsables quienes refrendan.</li>
<li>Excepciones sin refrendo (65.2): <b>dotación global</b> de los Presupuestos y <b>libre nombramiento y relevo de los miembros civiles y militares de su Casa</b>.</li>
</ul>`},

{id:'p02', t:2, u:'2.2', prob:1, epi:'Cortes Generales: composición y funcionamiento',
 ine:'Nunca preguntado y muy «citable» con cifras exactas (300-400 diputados, 4 senadores por provincia). Las Cortes aprueban la Ley 12/1989 y controlan la acción estadística del Gobierno.',
 pat:'«Exponer… y diferencias» — comparación exigida',
 pq:'Exponer la composición y el funcionamiento de las Cámaras, indicando las principales diferencias entre el Congreso de los Diputados y el Senado.',
 plan:`<ul class="pd-list">
<li>Naturaleza (66): representan al <b>pueblo español</b>, ejercen la <b>potestad legislativa</b>, aprueban los Presupuestos y <b>controlan la acción del Gobierno</b>; son <b>inviolables</b>; sin mandato imperativo.</li>
<li>Congreso (68): <b>mínimo 300 y máximo 400 diputados</b> (la LOREG fija 350), circunscripción <b>provincial</b>, mandato de <b>4 años</b>.</li>
<li>Senado (69): cámara de <b>representación territorial</b>; <b>4 senadores por provincia</b> por sufragio universal + <b>1 por CCAA y otro más por cada millón de habitantes</b> designados por las CCAA.</li>
<li>Inviolabilidad (opiniones, permanente) ≠ inmunidad (procesal, solo durante el mandato; detención solo por <b>flagrante delito</b>; procesamiento previo <b>suplicatorio</b>; fuero en la Sala de lo Penal del <b>TS</b>) (71).</li>
<li>Funcionamiento: Pleno y Comisiones; delegación prohibida en <b>reforma constitucional, cuestiones internacionales, leyes orgánicas y de bases, y PGE</b> (75); Diputación Permanente con mínimo <b>21 miembros</b> (78); voto personal e indelegable (79).</li>
<li>Diferencia clave: el Congreso <b>inviste</b> al Presidente, tramita en primer lugar y levanta los vetos; el Senado solo puede <b>veto (mayoría absoluta)</b> o enmendar — el Congreso lo levanta por mayoría absoluta o por mayoría simple transcurridos <b>2 meses</b> (90).</li>
</ul>`},

{id:'p03', t:4, u:'4.1', prob:1, epi:'Reparto competencial Estado-CCAA y la competencia estadística (149.1.31ª)',
 ine:'El gancho estadístico perfecto para un tribunal de estadísticos: el art. 149.1.31ª es la base constitucional del INE y de la Ley 12/1989. El tribunal ya cruza temas en un solo enunciado (patrón 2025-2026).',
 pat:'«De conformidad con…» + cruce de temas',
 pq:'De conformidad con el art. 149.1.31ª CE, explicar la competencia exclusiva del Estado en materia de estadística para fines estatales y su relación con las estadísticas de las Comunidades Autónomas.',
 plan:`<ul class="pd-list">
<li>Entidades territoriales (137): <b>municipios, provincias y CCAA</b>, con autonomía para la gestión de sus respectivos intereses — autonomía de gestión, no soberanía.</li>
<li>Estatutos de Autonomía (147): <b>norma institucional básica de cada CA</b>, aprobados como <b>leyes orgánicas</b>.</li>
<li>Art. 148: materias que las CCAA <b> pueden asumir</b> (potestativo): sanidad, asistencia social, cultura… El 149.1 fija las competencias <b>exclusivas</b> del Estado (31 epígrafes).</li>
<li><b>149.1.31ª: «Estadística para fines estatales»</b> — habilitación del INE y de la Ley 12/1989 (su art. 1 la cita); «fines estatales» = lo incluido en el <b>Plan Estadístico Nacional</b> (art. 9 LFEP).</li>
<li>Cláusula residual (149.3): las materias no atribuidas al Estado pueden corresponder a las CCAA por sus Estatutos; lo no asumido corresponde al Estado; el derecho estatal es <b>supletorio</b>.</li>
<li>Puente con el INE: la <b>coordinación general</b> de todos los servicios estadísticos corresponde al INE (art. 26.a LFEP) a través del <b>Comité Interterritorial de Estadística</b> (preside el Presidente del INE) y las comisiones bilaterales de cooperación.</li>
</ul>`},

{id:'p04', t:7, u:'7.1', prob:1, epi:'Estructura del presupuesto: las tres clasificaciones del gasto',
 ine:'Tema corto y nunca preguntado: cuando salga, probablemente sea el epígrafe completo. El INE se financia con cargo a los PGE (sección presupuestaria propia): la clasificación orgánica lo sitúa en el mapa del gasto.',
 pat:'«Exponer» con mínimo + un ejemplo cada una',
 pq:'Exponer las clasificaciones del gasto público conforme al art. 40 de la Ley 47/2003, explicando cada una de ellas con un ejemplo.',
 plan:`<ul class="pd-list">
<li>PGE (art. 134 CE): los elabora el <b>Gobierno</b> y los aprueban las <b>Cortes</b>; si no se aprueban antes del <b>31 de diciembre</b>, se <b>prorrogan automáticamente</b> los del año anterior.</li>
<li>Definición (32 LGP): <b>expresión cifrada, conjunta y sistemática</b> de los derechos y obligaciones <b>a liquidar</b> durante el ejercicio; vigencia <b>anual</b>.</li>
<li><b>Orgánica</b> — quién gasta: agrupa por secciones y servicios los créditos de los centros gestores (ej.: la sección del Ministerio de Economía, Comercio y Empresa, donde figura el INE).</li>
<li><b>Funcional o por programas</b> — para qué se gasta: según los objetivos de las políticas públicas (ej.: el programa de estadística).</li>
<li><b>Económica</b> — en qué se gasta: por capítulos (I personal; II bienes corrientes y servicios; III gastos financieros; IV transferencias corrientes; V Fondo de Contingencia; VI inversiones reales; VII transferencias de capital; VIII activos financieros; IX pasivos financieros).</li>
<li>Principios presupuestarios: <b>unidad, universalidad, especialidad</b> (cualitativa, cuantitativa y temporal) <b>y anualidad</b>. El Senado dispone de <b>2 meses</b> para PGE (frente a 1 mes en leyes ordinarias).</li>
</ul>`},

{id:'p05', t:10, u:'10.2', prob:1, epi:'Principios estadísticos del Reglamento 223/2009 y Código de Buenas Prácticas',
 ine:'Nunca preguntado y de «doble rentabilidad»: cruza Derecho con el Código de Buenas Prácticas del bloque de Producción Estadística — exactamente el ángulo que este tribunal ha empezado a explotar en 2025-2026.',
 pat:'«De conformidad con… exponer»',
 pq:'De conformidad con el Reglamento (CE) 223/2009, exponer los principios de las estadísticas europeas y explicar cómo los desarrolla el Código de Buenas Prácticas.',
 plan:`<ul class="pd-list">
<li>Seis principios (art. 2.1): <b>independencia profesional, imparcialidad, objetividad, fiabilidad, secreto estadístico y rentabilidad</b>.</li>
<li><b>Independencia profesional</b>: libre de presiones políticas o de interés, nacionales o de la Unión — el más citado.</li>
<li><b>Imparcialidad</b> (igual trato a todos los usuarios); <b>objetividad</b> (normas profesionales y éticas transparentes).</li>
<li><b>Fiabilidad</b>: representar la realidad de forma fiel, exacta y coherente; <b>rentabilidad</b>: costes proporcionados a la importancia de los resultados.</li>
<li>Trampa de examen: la lista europea tiene <b>6</b> principios; la española (art. 4.2 Ley 12/1989) tiene <b>9</b>: añade <b>transparencia, especialidad y proporcionalidad</b>.</li>
<li>Código de Buenas Prácticas: <b>15 principios con indicadores</b>; su cumplimiento se evalúa mediante <b>revisiones por pares</b> (peer reviews).</li>
</ul>`},

{id:'p06', t:6, u:'6.3', prob:1, epi:'Acceso al empleo público y provisión de puestos',
 ine:'Único epígrafe virgen de un tema preguntado dos años seguidos (2023 y 2024). Muy «enumerable» (oposición / concurso-oposición / provisión) y de lectura directa para quien se examina: es la teoría de la propia oposición del INE.',
 pat:'«De conformidad con… exponer… al menos tres»',
 pq:'De conformidad con el RDLeg 5/2015 (TREBEP), exponer los sistemas de acceso al empleo público y los procedimientos de provisión de puestos de trabajo, indicando al menos tres diferencias entre ellos.',
 plan:`<ul class="pd-list">
<li>Acceso (art. 61): <b>oposición</b>, <b>concurso-oposición</b> y —solo por ley, con carácter excepcional— <b>concurso</b>. También la <b>promoción interna</b> desde el mismo cuerpo o de cuerpos del mismo o superior nivel de adscripción.</li>
<li>Personal laboral fijo: oposición, concurso-oposición o <b>concurso de valoración de méritos</b>; los méritos <b>nunca pueden determinar por sí solos el resultado</b>.</li>
<li>No puede proponerse el acceso de más aprobados que <b>plazas convocadas</b>, salvo previsión expresa.</li>
<li>Condición de funcionario (62.1), por cumplimiento sucesivo: <b>superación del proceso selectivo → nombramiento publicado → acatamiento de la Constitución → toma de posesión</b>.</li>
<li>Provisión de puestos (78.2): <b>solo concurso y libre designación con convocatoria pública</b> — la oposición es un sistema selectivo de acceso, NO de provisión (error clásico).</li>
<li>Carrera: <b>horizontal</b> (progresión de grado sin cambiar de puesto) vs <b>vertical</b> (provisión de puestos); la <b>evaluación del desempeño</b> produce efectos retributivos y de carrera.</li>
</ul>`},

{id:'p07', t:8, u:'8.3', prob:1, epi:'El INE y los demás servicios estadísticos (el hueco del tema estrella)',
 ine:'El tema más preguntado del bloque (5 preguntas) tiene un único epígrafe sin pregunta propia: la coordinación general de los servicios estadísticos. Es el hueco más evidente de todo el análisis y el núcleo del perfil del cuerpo.',
 pat:'«Explicar… y…»',
 pq:'Explicar la coordinación de los servicios estadísticos conforme a la Ley 12/1989, indicando la naturaleza jurídica y funciones del INE y de los servicios estadísticos ministeriales.',
 plan:`<ul class="pd-list">
<li>INE (art. 25): <b>organismo autónomo</b> con personalidad jurídica y patrimonio propio, adscrito al <b>Ministerio de Economía, Comercio y Empresa</b> a través de la <b>SE de Economía y Apoyo a la Empresa</b>; Estatuto por RD 803/2022; es la <b>autoridad estadística nacional</b>.</li>
<li>Funciones (26): <b>coordinación general de los servicios estadísticos estatales</b>; anteproyecto del PEN; aplicación y vigilancia del secreto estadístico; formación de los <b>censos generales</b>; formación del <b>Censo Electoral</b> conforme a la LOREG.</li>
<li>Órganos superiores (28): solo dos — <b>Consejo de Dirección y Presidente</b> (nombrado por el Gobierno por RD a propuesta del Ministro).</li>
<li>Neutralidad operativa (30): metodología, publicación y difusión, diseño de normas técnicas y preservación del secreto. Recursos (31): <b>alzada ante el Ministro</b>, salvo materia técnico-estadística o secreto (el Presidente <b>agota la vía administrativa</b>).</li>
<li>Servicios estadísticos ministeriales (34-35): unidades con la misma neutralidad operativa; su difusión se ajusta a los <b>criterios del INE</b>.</li>
<li>No confundir: coordinación general = <b>INE</b> (26.a); órgano consultivo = <b>Consejo Superior</b> (preside el Ministro); Estado-CCAA = <b>Comité Interterritorial</b> (preside el Presidente del INE).</li>
</ul>`},

{id:'p08', t:9, u:'9.3', prob:1, epi:'Régimen especial de protección de datos en la función estadística pública',
 ine:'El cruce Derecho + función estadística por excelencia, aún sin preguntar: el secreto estadístico como causa legítima de restricción de los derechos ARSULiP es LA pieza del perfil INE — el mismo tipo de cruce que el tribunal ya hizo con el ENS en 2026.',
 pat:'«Explicar… y su relación con…» — cruce de temas',
 pq:'Explicar el régimen especial del tratamiento de datos personales en el ámbito de la función estadística pública conforme al art. 25 de la LO 3/2018, y su relación con el secreto estadístico de la Ley 12/1989.',
 plan:`<ul class="pd-list">
<li>Art. 25.1 LO 3/2018: los tratamientos de los organismos con competencias de <b>función estadística pública</b> se someten a su <b>legislación específica</b> (la Ley 12/1989), además del RGPD y de la LO — es la <b>lex specialis</b>.</li>
<li>Art. 25.2: la comunicación de datos solo está amparada si la estadística la exige una <b>norma de la UE</b> o está incluida en los <b>instrumentos de programación estadística</b> (el PEN).</li>
<li>Datos de categorías especiales (arts. 9-10 RGPD: ideología, religión, origen étnico, orientación sexual…): siempre de aportación <b>estrictamente voluntaria</b> (art. 11.2 Ley 12/1989, citado por el 25.2).</li>
<li>Art. 25.3 — la pieza clave: los organismos estadísticos pueden <b>denegar los derechos ARSULiP</b> (arts. 15-22 RGPD: acceso, rectificación, supresión, limitación, portabilidad, oposición) <b>cuando los datos estén amparados por el secreto estadístico</b>.</li>
<li>RGPD art. 89: garantías y excepciones para los tratamientos con fines de investigación, incluidos los <b>fines estadísticos</b>.</li>
<li>Cierre conceptual: el secreto estadístico no es solo un deber de confidencialidad — también es una <b>causa legítima de restricción de derechos</b> fundada en norma con rango de ley.</li>
</ul>`},

{id:'p09', t:13, u:'13.2', prob:1, epi:'La Ley 19/2013: publicidad activa, acceso y buen gobierno',
 ine:'Del tema solo se preguntó el órgano (CTBG, 2023); la ley entera sigue sin explorarse. El art. 8 incluye expresamente la información <b>estadística</b> en la publicidad activa — conexión directa con la difusión de resultados del INE.',
 pat:'Enunciado nominal «tres títulos» — cada sustantivo, un apartado',
 pq:'La Ley 19/2013, de transparencia, acceso a la información pública y buen gobierno: exponer sus tres títulos y explicar el derecho de acceso a la información pública y sus límites.',
 plan:`<ul class="pd-list">
<li>Tres objetos (art. 1): ampliar la <b>transparencia</b> de la actividad pública, regular y garantizar el <b>derecho de acceso</b>, y establecer las obligaciones de <b>buen gobierno</b>.</li>
<li>Título I — publicidad activa (arts. 6-12): publicación <b>de oficio</b> en sedes electrónicas; el art. 8 incluye la información <b>económica, presupuestaria y estadística</b>. Obligados: todas las AAPP y su sector público, y partidos, sindicatos y organizaciones empresariales por las aportaciones públicas que reciben.</li>
<li>Título II — derecho de acceso (arts. 12-24): titularidad <b>universal</b> (todas las personas, art. 105.b CE); solicitud <b>sin motivación</b> (17.3); resolución en <b>1 mes</b> (+1 ampliable); <b>límites tasados y proporcionales</b> (14); protección de datos de terceros (15); <b>reclamación previa al CTBG</b> (24) antes del contencioso.</li>
<li>Título III — buen gobierno: principios éticos de los altos cargos, declaración de actividades y bienes, conflicto de intereses y régimen sancionador.</li>
<li>Distinción estructural: transparencia (de oficio) ≠ derecho de acceso (a petición) — son complementarios, no sustitutivos.</li>
</ul>`},

{id:'p10', t:14, u:'14.2', prob:1, epi:'El expediente electrónico y las Normas Técnicas de Interoperabilidad',
 ine:'Tema nuevo que debutó en 2026 con una pregunta compleja sobre el ENS: lo esperable es que siga explotándose por el ángulo virgen. La recogida electrónica de datos del INE (cuestionarios web) convierte el expediente electrónico en material aplicado.',
 pat:'«Definición de…» — concepto legal exacto',
 pq:'Definición de expediente electrónico conforme a la Ley 39/2015 e índice electrónico, indicando qué garantiza y qué Normas Técnicas de Interoperabilidad lo desarrollan.',
 plan:`<ul class="pd-list">
<li>Expediente (art. 70 Ley 39/2015): <b>conjunto ordenado de documentos y actuaciones</b> que sirven de antecedente y fundamento de la resolución; desde la Ley 39/2015 <b>el formato electrónico es la regla</b>.</li>
<li>Se forma por <b>agregación ordenada de documentos</b> con un <b>índice numerado</b>.</li>
<li>Remisión a otra Administración: <b>completo, foliado, autentificado y con índice autentificado</b>, conforme al Esquema Nacional de Interoperabilidad y a las NTI.</li>
<li><b>Índice electrónico</b>: garantiza la <b>integridad del expediente y permite su recuperación</b> — la pieza clave del enunciado.</li>
<li>ENI (RD 4/2010) + NTI de obligado cumplimiento: <b>catálogo de estándares, política de firma electrónica, digitalización de documentos</b> (copia con validez del original), <b>documento electrónico, expediente electrónico e intercambio de asientos en registros electrónicos</b>.</li>
<li>Trampa: el ENS es el RD 311/2022 (ya preguntado en 2026); el ENI es el RD 4/2010 — no mezclarlos.</li>
</ul>`},

/* ---------- PROBABILIDAD MEDIA (11) ---------- */
{id:'p11', t:4, u:'4.2', prob:2, epi:'Administración local: competencias de Municipios y Provincias',
 ine:'Muy reglado y con escalones de población «citables» (5.000 / 20.000 / 50.000). El padrón municipal —gestionado por los Ayuntamientos bajo la coordinación del INE— conecta el epígrafe con la actividad del Instituto.',
 pat:'«Exponer» con escalones de población',
 pq:'Exponer las competencias propias de los Municipios y los servicios mínimos que deben prestar conforme a la LRBRL, indicando los escalones de población.',
 plan:`<ul class="pd-list">
<li>Municipio (140 CE + 25 LRBRL): Concejales por sufragio directo; órganos necesarios: <b>Alcalde, Tenientes y Pleno</b>; Junta de Gobierno Local en municipios de <b>más de 5.000</b> habitantes. Competencias propias post-LRSAL: las que fije la <b>legislación sectorial</b> (urbanismo, medio ambiente urbano, agua, vía pública, tráfico, protección civil, policía local, servicios sociales…).</li>
<li>Servicios mínimos (26): <b>en todos</b> — alumbrado, cementerio, residuos, limpieza viaria, agua domiciliaria, alcantarillado, acceso a núcleos y pavimentación; <b>&gt;5.000</b> — parque, biblioteca, mercado, tratamiento de residuos; <b>&gt;20.000</b> — protección civil, servicios sociales, extinción de incendios, instalaciones deportivas; <b>&gt;50.000</b> — transporte colectivo urbano y medio ambiente.</li>
<li>Provincia (141 CE): entidad local por <b>agrupación de municipios</b>, con personalidad propia; su gobierno es la <b>Diputación</b>.</li>
<li>Fines provinciales (31): <b>solidaridad y equilibrio intermunicipales</b>.</li>
<li>Competencias de la Diputación (36): coordinación de servicios municipales; asistencia y cooperación jurídica, económica y técnica (garantiza secretaría e intervención en municipios <b>de menos de 1.000 habitantes</b>); prestación de servicios supramunicipales.</li>
</ul>`},

{id:'p12', t:7, u:'7.2', prob:2, epi:'El control interno: la IGAE, función interventora y reparo',
 ine:'Conceptos técnicos que pueden salir en solitario («explicar la función interventora»). Todo el gasto del INE, como el del resto de la AGE, pasa por la intervención previa de la IGAE.',
 pat:'«Explicar… y…»',
 pq:'Explicar la función interventora ejercida por la IGAE y el reparo como manifestación de disconformidad, indicando sus efectos.',
 plan:`<ul class="pd-list">
<li>IGAE (140 LGP): ejerce el <b>control interno</b> de la gestión económico-financiera del sector público estatal con <b>plena autonomía</b>, bajo la dirección del <b>Ministro de Hacienda</b>. Control externo = <b>Tribunal de Cuentas</b> (136 CE), que informa a las Cortes.</li>
<li>Tres modalidades: <b>función interventora</b> (control <b>previo y pleno</b> de reconocimiento de derechos, gastos, ingresos y pagos); <b>control financiero permanente</b> (posterior y continuado); <b>auditoría pública</b> (comprobaciones programadas: financiera, de cumplimiento y de gestión).</li>
<li><b>Reparo</b>: manifestación de disconformidad en la intervención previa, con efectos <b>suspensivos</b> hasta su subsanación o el mantenimiento del acto con las responsabilidades correspondientes.</li>
<li>Sin intervención previa, el acto es <b>ineficaz</b>: no puede ejecutarse.</li>
<li>No confundir: interventora = previa; financiero permanente = posterior continuado; auditoría = programada y cierra en informe.</li>
</ul>`},

{id:'p13', t:10, u:'10.3', prob:2, epi:'Gobernanza estadística europea: Eurostat, CSEE y elaboración',
 ine:'Sigue el patrón «órganos y funciones» que el tribunal ya usó con el Consejo Superior de Estadística (2025). El INE es el interlocutor único de España ante la Comisión (art. 5) — gobernanza europea con nombre español.',
 pat:'«Exponer… y funciones»',
 pq:'Exponer la gobernanza del Sistema Estadístico Europeo conforme al Reglamento 223/2009, indicando la composición y funciones del Comité del Sistema Estadístico Europeo.',
 plan:`<ul class="pd-list">
<li>SEE (arts. 4-5): asociación entre <b>Eurostat</b> (autoridad estadística de la Unión) y las <b>autoridades estadísticas nacionales</b> (los INE), junto con los <b>bancos centrales</b> nacionales.</li>
<li>Estadísticas europeas: las desarrolladas, elaboradas y difundidas por el SEE conforme al <b>programa estadístico europeo</b>.</li>
<li><b>CSEE</b>: asiste a la Comisión en la coordinación del programa estadístico y en el desarrollo metodológico; lo componen <b>representantes de los Estados miembros</b>.</li>
<li><b>Comité Asesor (CAE)</b>: asesora a la Comisión desde la perspectiva de los <b>usuarios y la sociedad civil</b>.</li>
<li>Cada INE es <b>interlocutor único</b> de su Estado ante la Comisión en materia estadística (5.1).</li>
<li>Fuentes y secreto: acceso a <b>registros administrativos</b> (17 bis); uso exclusivamente estadístico de los datos confidenciales; confidencialidad <b>vitalicia</b> del personal (20.5 ↔ 17.4 LFEP); microdatos con fines científicos solo con <b>identificación indirecta</b> (23).</li>
</ul>`},

{id:'p14', t:12, u:'12.1', prob:2, epi:'La LO 3/2007 y la igualdad (con el art. 20 de las estadísticas)',
 ine:'Norma marco de más recorrido que la LO 4/2023. Su art. 20 ordena adecuar las estadísticas oficiales con la variable de sexo: una obligación legal que condiciona el diseño metodológico de las operaciones del INE.',
 pat:'«De conformidad con… exponer»',
 pq:'De conformidad con la LO 3/2007, exponer las políticas públicas de promoción de la igualdad de mujeres y hombres, con mención a la adecuación de las estadísticas oficiales.',
 plan:`<ul class="pd-list">
<li>Objeto (art. 1): hacer efectivo el derecho de <b>igualdad de trato y de oportunidades</b>, en desarrollo de los <b>arts. 9.2 y 14 CE</b>.</li>
<li>Principio de <b>transversalidad</b> (3): la igualdad se incorpora en todas las políticas públicas; se prevén <b>acciones positivas</b>.</li>
<li><b>Composición equilibrada</b>: entre el <b>40% y el 60%</b> por cada sexo en órganos, cargos y candidaturas.</li>
<li><b>Art. 20 — estadísticas</b>: incluir sistemáticamente la <b>variable de sexo</b>, establecer indicadores de <b>discriminación múltiple</b>, diseñar <b>muestras suficientemente amplias</b> para explotar por sexo y ofrecer <b>información desagregada por sexo</b>.</li>
<li>Empleo público: criterios de actuación (51), <b>presencia equilibrada en órganos de selección</b> (53) y <b>Plan de Igualdad de la AGE</b> al inicio de cada legislatura (64).</li>
<li>Sector privado: planes de igualdad obligatorios en empresas de <b>más de 50 personas trabajadoras</b> (45-48).</li>
</ul>`},

{id:'p15', t:12, u:'12.2', prob:2, epi:'Ley 4/2023: igualdad real y efectiva de personas trans y LGTBI',
 ine:'La norma más reciente del temario completo: los tribunales suelen «estrenar» pronto las normas recién aprobadas para comprobar que el candidato está al día — el otro epígrafe del tema (LO 3/2007) comparte prioridad.',
 pat:'«Explicar contenido esencial… y…»',
 pq:'Explicar el contenido esencial de la Ley 4/2023, para la igualdad real y efectiva de las personas trans y de la diversidad sexual en España, indicando el ámbito de la no discriminación y el régimen del cambio de la mención registral del sexo.',
 plan:`<ul class="pd-list">
<li>Prohibición de discriminación por <b>orientación sexual, identidad de género, expresión de género o características sexuales</b>.</li>
<li>Ámbitos garantizados: <b>empleo público</b>, acceso a bienes y servicios, salud y educación.</li>
<li>Cambio de la <b>mención registral del sexo</b>: desde los <b>16 años</b> con requisitos; de <b>14 a 16</b> con asistencia; de <b>12 a 14</b> mediante decisión judicial.</li>
<li>Crea la <b>Autoridad Estatal LGTBI</b> y el Consejo Estatal LGTBI.</li>
<li>Marco complementario: <b>LO 1/2004</b> (protección integral contra la violencia de género) y <b>conciliación corresponsable</b> — permisos por nacimiento de <b>16 semanas iguales</b> para ambos progenitores.</li>
</ul>`},

{id:'p16', t:9, u:'9.4', prob:2, epi:'La AEPD: naturaleza, investigación y régimen sancionador',
 ine:'Copia el patrón «naturaleza y funciones de un órgano concreto» ya usado por el tribunal con el Consejo Superior de Estadística (2025) y el CTBG (2023). Con el INE, además: cuando la infractora es una Administración, apercibimiento en lugar de multa (art. 76).',
 pat:'Enunciado nominal de órgano',
 pq:'La Agencia Española de Protección de Datos: naturaleza, potestades de investigación y régimen sancionador.',
 plan:`<ul class="pd-list">
<li>Naturaleza (44): <b>autoridad administrativa independiente</b> de ámbito estatal (109.3 Ley 40/2015), con personalidad propia; se relaciona con el Gobierno a través del <b>Ministerio de Justicia</b>; <b>representante común de España</b> ante el Comité Europeo de Protección de Datos.</li>
<li>Investigación: funcionarios con condición de <b>agentes de la autoridad</b>; el incumplimiento del deber de colaboración es <b>resistencia a la actuación investigadora</b> (infracción autónoma).</li>
<li>Facultades (53): acceso a los datos, inspección de soportes y equipos y examen de documentación; en <b>domicilio constitucionalmente protegido</b>: consentimiento del interesado o <b>autorización judicial</b>.</li>
<li>Infracciones calcadas del RGPD: <b>muy graves</b> (hasta 20 M€ o el 4% de la facturación anual global), <b>graves</b> (hasta 10 M€ o el 2%) y <b>leves</b>; prescriben a los <b>3, 2 y 1 años</b>.</li>
<li>Clave INE (76): si la infractora es una <b>Administración Pública</b>, no hay multas sino medidas del art. 58.2 RGPD; a la AGE, <b>apercibimiento</b>.</li>
</ul>`},

{id:'p17', t:13, u:'13.1', prob:2, epi:'Gobernanza pública, gobierno abierto y datos abiertos',
 ine:'El componente internacional (OGP) lo hace apto como pregunta de «cultura general» del bloque. La reutilización de la información del sector público conecta con la difusión de resultados estadísticos: nadie puede monopolizar la explotación de los datos del INE.',
 pat:'«Explicar… y…»',
 pq:'Explicar qué se entiende por gobierno abierto y cuáles son sus principios, indicando el marco español de la reutilización de la información del sector público.',
 plan:`<ul class="pd-list">
<li><b>Gobernanza pública</b>: dirección de los asuntos públicos basada en la interacción entre <b>Estado, mercado y sociedad civil</b>, más allá de la jerarquía administrativa.</li>
<li><b>Gobierno abierto</b> — cuatro principios: <b>transparencia, participación, colaboración y rendición de cuentas</b> (accountability).</li>
<li>España pertenece desde su fundación a la <b>Alianza para el Gobierno Abierto (OGP)</b>: compromisos que se concretan en <b>Planes de Gobierno Abierto</b> plurianuales con participación ciudadana.</li>
<li><b>Ley 37/2007</b>, de reutilización de la información del sector público: reutilización con fines comerciales o no comerciales; documentos en <b>formatos abiertos y reutilizables</b> (datos.gob.es); los convenios con terceros <b>no pueden otorgar derechos exclusivos</b>.</li>
<li>Distinción: transparencia (de oficio) ≠ derecho de acceso (a petición) — complementarios.</li>
</ul>`},

{id:'p18', t:1, u:'1.3', prob:2, epi:'El Defensor del Pueblo',
 ine:'El único hueco con recorrido del tema troncal: encaja exactamente con el patrón «naturaleza, designación y funciones de un órgano» que este tribunal repite. Puede supervisar la actividad de la Administración — también la estadística.',
 pat:'Enunciado nominal de órgano («adscripción, composición y funciones»)',
 pq:'El Defensor del Pueblo: adscripción, designación y funciones.',
 plan:`<ul class="pd-list">
<li>Naturaleza (art. 54 CE): <b>alto comisionado de las Cortes Generales</b>, designado por éstas para la <b>defensa de los derechos del Título I</b> — es órgano de las Cortes, no del Gobierno.</li>
<li>Supervisa la <b>actividad de la Administración</b> y <b>da cuenta a las Cortes</b>; ley de desarrollo: <b>LO 3/1981</b>.</li>
<li>Legitimación procesal: <b>recurso de amparo ante el TC</b> y <b>recurso de inconstitucionalidad</b>.</li>
<li>Estatuto personal: <b>inviolabilidad e inmunidad</b> durante el mandato; causa de <b>inelegibilidad</b> (70.1.c CE).</li>
<li>Presenta informe anual a las Cortes y puede iniciar de oficio sus actuaciones.</li>
</ul>`},

{id:'p19', t:3, u:'3.3', prob:2, epi:'La Administración periférica del Estado',
 ine:'Lo estable del tema sin registro directo: Delegados y Subdelegados no dependen de la estructura ministerial de la legislatura, por lo que es contenido «seguro» de preguntar. Las delegaciones provinciales del INE son el espejo estadístico de esta organización.',
 pat:'«Exponer… indicando designación y funciones»',
 pq:'Exponer la organización de la Administración periférica del Estado, indicando la designación y funciones de los Delegados y Subdelegados del Gobierno.',
 plan:`<ul class="pd-list">
<li><b>Delegados del Gobierno</b> (en las CCAA): representan al <b>Gobierno en el territorio de la Comunidad</b> y dirigen la Administración periférica estatal en dicho territorio.</li>
<li>Designación: los nombra y separa el <b>Presidente del Gobierno por Real Decreto</b>, con rango de <b>Subsecretario</b>; dependen <b>directamente del Presidente</b>.</li>
<li>Funciones: dirigen la actividad de los Subdelegados; <b>dirección y coordinación de la protección civil</b>; cooperación con la Administración autonómica y local (comisiones bilaterales).</li>
<li><b>Subdelegados del Gobierno</b> (en las provincias): representan a la AGE bajo la <b>dependencia del Delegado</b>; en las <b>CCAA uniprovinciales no existen</b> (asume sus funciones el Delegado).</li>
<li><b>Directores Insulares</b>: en islas sin Subdelegados, designados por el Delegado, ejercen las competencias provinciales de la periférica.</li>
</ul>`},

{id:'p20', t:5, u:'5.1', prob:2, epi:'Fuentes del Derecho Administrativo y potestad reglamentaria',
 ine:'Único epígrafe sin pregunta directa del tema más preguntado (3 preguntas): el hueco lógico si el tribunal decide «completar» el tema. Conecta con el INE: el PEN y los programas anuales se aprueban por Real Decreto (potestad reglamentaria).',
 pat:'«Exponer… y explicar…»',
 pq:'Exponer las fuentes del Derecho Administrativo y su jerarquía, explicando la potestad reglamentaria y sus límites.',
 plan:`<ul class="pd-list">
<li>Sistema sobre la <b>jerarquía normativa</b> y el principio de <b>competencia</b> (9.3 CE).</li>
<li>Fuentes: <b>ley</b> (orgánica y ordinaria), <b>reglamento</b> (fuente propia de la Administración, art. 97 CE), <b>costumbre y principios generales</b> (subsidiarios) y <b>jurisprudencia</b> (interpretativa).</li>
<li>Reglamento: <b>de desarrollo</b> (despliega una ley) o <b>ejecutivo</b> (organiza los servicios).</li>
<li>Límites (128 Ley 39/2015): no vulnerar la CE ni las leyes, no invadir la reserva de ley; <b>no pueden tipificar delitos, faltas o infracciones, ni establecer penas, sanciones, tributos o prestaciones patrimoniales</b>.</li>
<li><b>Inderogabilidad singular</b>: una norma reglamentaria no puede dejarse sin aplicar para un caso concreto.</li>
<li>Buena regulación (129): <b>necesidad, proporcionalidad, seguridad jurídica, transparencia y eficiencia</b>; entrada en vigor a los <b>20 días</b> de la publicación completa; «arrancadas» 2 de enero / 1 de julio (23 Ley 50/1997).</li>
</ul>`},

{id:'p21', t:11, u:'11.4', prob:2, epi:'Acceso a los datos censales y padronales',
 ine:'El único bloque del tema electoral sin pregunta directa, y el que mejor cruza con la LO 3/2018 (T9): el uso desviado de datos censales o padronales es infracción de protección de datos — cruce típico del estilo 2025-2026.',
 pat:'«Explicar… y…» + cruce de temas',
 pq:'Explicar el régimen de cesión de copias del censo electoral y el régimen de protección de los datos padronales, indicando su conexión con la normativa de protección de datos.',
 plan:`<ul class="pd-list">
<li>Copias del <b>censo electoral</b> (LOREG): solo a <b>partidos, federaciones, coaliciones y agrupaciones de electores</b>, para <b>fines exclusivamente electorales</b> (envío de propaganda y comprobación de la inscripción).</li>
<li>La <b>primera copia es gratuita</b>; las adicionales, abonando su coste. Cualquier otro uso es <b>uso desviado</b> y infringe la normativa de protección de datos.</li>
<li>Datos <b>padronales</b> (LBRL): <b>confidenciales</b>; el acceso queda limitado a la Administración, a los propios interesados y a los <b>fines estadísticos</b>.</li>
<li>Comunicación a otras AAPP: solo para el <b>ejercicio de sus competencias</b>, con prohibición de <b>cesión posterior</b> a terceros.</li>
<li>Cualquier interesado puede obtener <b>certificación o volante de empadronamiento</b> acreditativo de su residencia.</li>
<li>La remisión periódica de ficheros padronales al INE ampara el tratamiento estadístico en el marco de la <b>Ley 12/1989</b>; el uso desviado conecta con la <b>LO 3/2018</b>.</li>
</ul>`},

{id:'p22', t:10, u:'10.1', prob:3, epi:'Definiciones del SEE y «estadísticas europeas»',
 ine:'Contenido introductorio y descriptivo: rara vez se pregunta en solitario; suele ser el prólogo de una pregunta más amplia sobre principios o gobernanza.',
 pat:'«Definición de…»',
 pq:'Definición de «estadísticas» y «dato confidencial» conforme al Reglamento (CE) 223/2009.',
 plan:`<ul class="pd-list">
<li><b>Estadísticas</b> (3): información cuantitativa y cualitativa, <b>agregada y representativa</b>, que caracteriza un fenómeno colectivo en una población dada.</li>
<li><b>Dato confidencial</b>: el que permite identificar, <b>directa o indirectamente, a las unidades estadísticas</b> — el mismo estándar del art. 13 de la Ley 12/1989.</li>
<li>Estadísticas europeas: las desarrolladas, elaboradas y difundidas por el SEE conforme al <b>programa estadístico europeo</b> (marco plurianual de ámbitos, objetivos y prioridades).</li>
</ul>`},

{id:'p23', t:12, u:'12.2', prob:3, epi:'Violencia de género y conciliación (LO 1/2004)',
 ine:'El contenido más «operativo» del tema (permisos, excedencias): menos probable como pregunta autónoma de desarrollo frente a las dos normas de igualdad.',
 pat:'«Exponer»',
 pq:'Exponer la tutela integral que la LO 1/2004 dispensa a las víctimas de violencia de género, indicando al menos tres derechos laborales reconocidos.',
 plan:`<ul class="pd-list">
<li>LO 1/2004 — enfoque <b>integral</b>: prevención y sensibilización, tutela institucional, sanitaria, <b>laboral y de Seguridad Social</b>, y judicial (<b>juzgados de violencia sobre la mujer</b>; orden de protección), más disuasión penal.</li>
<li>Derechos laborales: <b>reducción o reordenación de jornada</b>, <b>movilidad geográfica</b>, <b>suspensión con reserva de puesto</b> y <b>extinción con indemnización</b>.</li>
<li>Conciliación corresponsable (44 LO 3/2007): permisos por nacimiento de <b>16 semanas iguales</b> para ambos progenitores, también en el empleo público.</li>
<li>Excedencias protegidas: por cuidado de hijos <b>hasta 3 años</b> y de familiares <b>hasta 2</b> — protegidas frente a la discriminación por su ejercicio.</li>
</ul>`},

{id:'p24', t:1, u:'1.2', prob:3, epi:'Derechos fundamentales como pregunta autónoma',
 ine:'Contenido troncal que suele quedar embebido en preguntas de otros temas aplicados; poco probable en solitario, pero es la base transversal del bloque.',
 pat:'«Exponer… estructura y niveles»',
 pq:'Exponer la estructura del Título I de la Constitución y los niveles de garantía de los derechos que reconoce.',
 plan:`<ul class="pd-list">
<li>Título I en <b>cinco capítulos</b>: españoles y extranjeros; derechos y libertades; principios rectores; garantías; suspensión.</li>
<li><b>Sección 1ª (14, 15-29)</b>: reserva de <b>ley orgánica</b> y <b>recurso de amparo</b> ante el TC (53.2) — máxima protección.</li>
<li><b>Sección 2ª (30-38)</b>: reserva de ley ordinaria, <b>sin amparo directo</b> (única excepción: la <b>objeción de conciencia</b>, 30.2).</li>
<li><b>Capítulo III (39-52)</b>: principios rectores — <b>informan la legislación pero no son directamente exigibles</b> (53.3).</li>
<li>Garantías: preferencia y sumariedad ante los tribunales ordinarios (53.2); suspensión general (estados de excepción y sitio) vs. individual (55.2, ley orgánica antiterrorista).</li>
</ul>`},

{id:'p25', t:3, u:'3.4', prob:3, epi:'Estructura del Ministerio de Economía y organismos adscritos',
 ine:'Contenido inestable: la denominación y estructura ministeriales cambian por Real Decreto entre legislaturas, y el tribunal probablemente evita preguntarlo literalmente. El dato estable que sobrevive es la adscripción del INE.',
 pat:'Enunciado nominal',
 pq:'El INE y su adscripción: estructura del departamento al que está adscrito el Instituto Nacional de Estadística.',
 plan:`<ul class="pd-list">
<li>Denominación vigente: <b>Ministerio de Economía, Comercio y Empresa</b> (RD 829/2023); estructura orgánica por el RD 1009/2023 y el RD 410/2024.</li>
<li>Dos Secretarías de Estado: <b>Economía y Apoyo a la Empresa</b> (Tesoro, política económica, supervisión, estadística) y <b>Comercio</b> (internacionalización, ICEX).</li>
<li>El INE: organismo autónomo adscrito <b>a través de la SE de Economía y Apoyo a la Empresa</b> (art. 2.7 RD 410/2024).</li>
<li>Compañeros de adscripción: <b>ICO, CNMC, CNMV y FROB</b> (estos tres últimos como autoridades administrativas independientes).</li>
<li>Verificar el nombre del departamento contra el BOE cerca del examen: lo estable es el <b>esquema organizativo</b>, no la denominación.</li>
</ul>`},

{id:'p26', t:6, u:'6.2', prob:3, epi:'Derechos y deberes de los empleados públicos (resto del epígrafe)',
 ine:'Los principios de conducta —la mitad de este epígrafe— ya fueron pregunta en 2023; queda el resto (derechos individuales y colectivos, régimen disciplinario), menos prioritario que el acceso y la provisión.',
 pat:'«Exponer… al menos tres de cada tipo»',
 pq:'Exponer los derechos individuales y colectivos de los empleados públicos conforme al TREBEP, indicando al menos tres de cada tipo.',
 plan:`<ul class="pd-list">
<li><b>Derechos individuales</b> (art. 17): retribución justa y puntual, <b>carrera profesional</b>, evaluación del desempeño, formación, vacaciones y permisos, igualdad de género y no discriminación, y el de huelga — este último reservado al <b>personal laboral</b>.</li>
<li><b>Derechos colectivos</b>: información y participación, <b>negociación colectiva</b>, reunión y acción sindical.</li>
<li><b>Deberes</b> (art. 54): servir con <b>objetividad</b> a los intereses generales, actuar con plena dedicación, <b>eficiencia y economía</b>, rendimiento y puntualidad, guardar secreto de las materias reservadas, y conducta digna, imparcial y neutral.</li>
<li>Los <b>principios éticos y de conducta</b> (52-53) ya fueron pregunta 2023: repásalos, pero el hueco real está en el acceso y la provisión.</li>
</ul>`},

{id:'p27', t:9, u:'9.1', prob:3, epi:'Marco normativo y principios de protección de datos',
 ine:'Muy solapado con la pregunta de 2023 sobre derechos de la LO 3/2018: el tribunal rara vez repite un ángulo tan cercano dos veces. Queda como base conceptual del tema, dominada mejor vía tarjetas.',
 pat:'«Exponer»',
 pq:'Exponer los principios del tratamiento de datos personales conforme al art. 5 del RGPD y el doble objeto de la LO 3/2018.',
 plan:`<ul class="pd-list">
<li>LO 3/2018, doble objeto (art. 1): <b>adaptar el ordenamiento al RGPD (UE) 2016/679</b> y <b>garantizar los derechos digitales</b> — ambos anclados en el <b>art. 18.4 CE</b>.</li>
<li>Siete principios del art. 5 RGPD: <b>licitud, lealtad y transparencia; limitación de la finalidad; minimización de datos; exactitud; limitación del plazo de conservación; integridad y confidencialidad; y responsabilidad proactiva</b> (accountability).</li>
<li>Bases jurídicas del art. 6 RGPD: consentimiento, contrato, obligación legal, intereses vitales, interés público o ejercicio de poderes públicos, e interés legítimo.</li>
<li>Reserva de ley (art. 8 LO) para las bases de <b>obligación legal</b> e <b>interés público</b>: es la cobertura de la Ley 12/1989 — el INE trata datos <b>sin consentimiento individual</b> gracias a ella.</li>
</ul>`}

function pendById(id){ return PENDING.find(p=>p.id===id); }
function pendOfTopic(tid){ return PENDING.filter(p=>p.t===tid); }
function pendReady(p){ return !!S.pready[p.id]; }
function pendStats(){
  const st = {total:PENDING.length, ready:0, by:{1:{t:0,r:0},2:{t:0,r:0},3:{t:0,r:0}}};
  PENDING.forEach(p=>{
    st.by[p.prob].t++;
    if(pendReady(p)){ st.ready++; st.by[p.prob].r++; }
  });
  return st;
}
/* Temas con epígrafes pendientes de probabilidad ALTA — para el test de prioridad */
function altaTopics(){
  const ids = [...new Set(PENDING.filter(p=>p.prob===1).map(p=>p.t))];
  return ids.sort((a,b)=>a-b);
}
