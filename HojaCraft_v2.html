/* Fórmulas en inglés (Excel) al pegar: =SUM(A1,1.5) → =SUMA(A1;1.5). Solo si hay un nombre inequívocamente inglés y no hay «;».
   Ojo: el punto decimal se conserva, porque en las fórmulas de HojaCraft la coma es separador de argumentos. */
const xlFI={};for(const k in AL)xlFI[k]=AL[k];Object.assign(xlFI,{CONCATENATE:'CONCATENAR',TRUE:'VERDADERO',FALSE:'FALSO',ABS:'ABS',EXP:'EXP',LN:'LN',MAX:'MAX',MIN:'MIN',PI:'PI',FACT:'FACT'});
function xlF(v){if(typeof v!=='string'||v[0]!=='=')return v;
 const b=v.slice(1),plain=b.split(/("(?:[^"]|"")*")/).filter((_,i)=>i%2===0).join('');
 const ns=[...plain.matchAll(/([A-Za-z][\w.]*)\s*\(/g)].map(m=>m[1].toUpperCase());
 if(!ns.some(n=>xlFI[n]&&!FN[n])||plain.includes(';'))return v;
 const o=b.split(/("(?:[^"]|"")*")/).map((p,i)=>i%2?p:
  p.replace(/([A-Za-z][\w.]*)\s*\(/g,(m,n)=>{const e=xlFI[n.toUpperCase()];return e?e+'(':m})
   .replace(/,/g,';')
   .replace(/\bTRUE\b/gi,'VERDADERO').replace(/\bFALSE\b/gi,'FALSO'));
 return'='+o.join('')}

function csv(t,d){const o=[];let row=[],f='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch==='"')q=true;else if(ch===d){row.push(f);f=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);o.push(row);row=[];f=''}else f+=ch}

irmación de partida que se intenta desmentir.'],['confianza','Nivel de confianza','porcentaje de veces que el método acierta si se repitiera muchas veces.'],['grados de libertad|\\bgl\\b','Grados de libertad','datos que quedan «libres» tras usar algunos para calcular otros.'],['chi-?cuad|χ','Chi-cuadrado (χ²)','mide cuánto se aleja lo observado de lo que se esperaría.'],['esperanza de vida','Esperanza de vida','años que, de media, le quedan por vivir a una persona de esa edad.'],['cohorte','Cohorte','grupo de personas nacidas el mismo año.'],['isf|sintetico de fecundidad','ISF','hijos que tendría una mujer en toda su vida con las tasas de hoy.'],['tbr|tnr|reproduccion','TBR y TNR','hijas por mujer; la «neta» descuenta las que mueren antes. Con 1, la población se repone.'],['rme|estandariz','Estandarización','igualar la estructura por edades de dos poblaciones para poder compararlas.'],['vab|valor anadido','Valor añadido','lo que un sector suma al valor de lo que compró para producir.'],['laspeyres|paasche|fisher','Índices de precios','comparan lo que cuesta una cesta; Laspeyres usa la de antes, Paasche la de ahora y Fisher mezcla ambas.'],['residuo','Residuo','lo que el modelo no explica de cada dato.'],['calibracion|post-estrat','Reponderar','ajustar los pesos para que la muestra reproduzca datos conocidos de la población.'],['\\betc\\b','ETC','empleo equivalente a tiempo completo.'],['\\bsec\\b','SEC','Sistema Europeo de Cuentas: las reglas de la contabilidad nacional.'],['estimador','Estimador','fórmula que, con los datos de la muestra, da un valor aproximado del dato real.']];

mkis:cnT('Muestreo · Efecto de diseño (Kish)','El efecto de diseño mide cuánto se pierde frente a un MAS. Cada fuente de pérdida se calcula aparte y se combinan multiplicándolas.',[['B4:C7','Tamaño y peso de cada grupo']],
[['Pesos','deff_w = nΣw²/(Σw)² = 1 + CV²','Pesos desiguales sin ganancia de precisión: pierden.','B9:B14',''],['Conglomerados','1 + (M−1)ρ','Pérdida por parecido interno.','B16:B18',''],['Total','deff_w × deff_c','Aproximación al combinar los dos efectos.','B19:B20',''],['Otros','1−η² (estratificado), 1+(n−1)ρ (sistemático)','El estratificado proporcional gana; el sistemático puede perder.','B22:B26','']],
['n efectivo = n/deff.','Pesos iguales → deff_w = 1.','El estratificado proporcional nunca pierde.'],['Aplicar deff_w si los pesos se deben a calibración útil.','Sumar en vez de multiplicar.'],'deff_w = nΣw²/(Σw)²\nn_ef = n/deff','Pon todos los pesos en 1 y comprueba que deff_w = 1.'),

[['Pesos','w_k = d(1+λx_k)','Se parte de d = N/n y se ajusta con λ.','B13:B16',''],['Calibración','Σ w_k x_k = T_x','Los nuevos pesos reproducen el total conocido.','B20',''],['GREG','T̂_y + b(T_x − T̂_x)','Se corrige el HT con la discrepancia en x.','B18:B19',''],['Varianza','N²(1−n/N)s²_e/n','Con residuos e = y − bx, no con y.','B21:B24','']],
['Gana si y está muy relacionada con x.','Los pesos pueden salir negativos si λ es grande.','Post-estratificación es un caso especial.'],['Calibrar con x que no explica y.','Calcular la varianza con y en lugar de e.'],'w_k = d(1+λx_k)\nT̂_GREG = T̂_y + b(T_x − T̂_x)\nV̂ ≈ N²(1−n/N)s²_e/n','Cambia T_x (B11) a 540: λ = 0 y el GREG coincide con el HT.'),
ilrt:cnT('Inferencia · Razón de verosimilitudes','Compara la verosimilitud en H0 con la máxima posible: si H0 la reduce mucho, se rechaza. Wilks da la distribución asintótica.',[['B3:B6','Datos, H0 y α']],
[['Razón','Λ = −2 ln(L0/L1)','Cuánta verosimilitud se pierde al imponer H0.','B7:B10',''],['Wilks','Λ ≈ χ²(g.l.)','Los g.l. son los parámetros libres que quita H0.','B11:B13',''],['Wald','n(p̂−p0)²/(p̂(1−p̂))','Varianza evaluada en el EMV.','B15',''],['Score','n(p̂−p0)²/(p0(1−p0))','Varianza evaluada en H0.','B16:B17','']],

<script>
/* ---------- Visualizaciones explicativas del tutorial: librería ---------- */
const TVBAD={};/* centinela: celda sin número */
const TVN=a=>{const v=val(a,cur);if(typeof v!=='number'||!isFinite(v))throw TVBAD;return v};
const TVR=r=>tuCells(r).map(TVN);
const TVL=a=>{const v=val(a,cur);return tvesc(v instanceof Er?'?':String(v==null?'':v))};
const tvsum=a=>a.reduce((s,x)=>s+x,0);
const tvnf=(v,d)=>{if(!isFinite(v))return'—';const a=Math.abs(v);if(d==null)d=a>=1000?0:a>=100?1:a>=1?2:a>=.01?3:a===0?0:4;let s=a.toFixed(d);if(s.indexOf('.')>=0)s=s.replace(/\.?0+$/,'');const p=s.split('.');return(v<0&&+s!==0?'−':'')+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(p[1]?','+p[1]:'')};
const tvpc=(v,d)=>tvnf(v*100,d==null?1:d)+' %';
const tvsg=(v,d)=>(v<0?'−':'+')+tvnf(Math.abs(v),d);
const tvesc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TVPAL=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];
const tvfig=(body,cap)=>`<figure class="tv" role="group" aria-label="${tvesc(cap.replace(/<[^>]+>/g,''))}">${body}<figcaption>${cap}</figcaption></figure>`;
const tvkey=(its)=>`<div class="tvk">${its.map(([c,t])=>`<span><s style="background:${c}"></s>${t}</span>`).join('')}</div>`;

/* barras horizontales comparables; rows=[etiqueta,valor,clase] */
function tvbars(rows,o={}){
 const vs=rows.map(r=>r[1]),ref=o.ref;let lo=Math.min(0,...vs),hi=Math.max(0,...vs,ref==null?0:ref);if(hi===lo)hi=lo+1;
 const X=v=>(v-lo)/(hi-lo)*100,f=o.fmt||(v=>tvnf(v));
 return rows.map(([l,v,c])=>{const a=X(Math.min(v,0)),b=X(Math.max(v,0));
  return`<div class="tvr"><span class="l">${tvesc(l)}</span><span class="tvt">${lo<0?`<u class="tvz o" style="left:${X(0).toFixed(2)}%"></u>`:''}<i class="tvb ${c||'a'}" style="left:${a.toFixed(2)}%;width:${Math.max(b-a,.8).toFixed(2)}%"></i>${ref!=null?`<u class="tvz" style="left:${X(ref).toFixed(2)}%"></u>`:''}</span><span class="tvv">${f(v)}</span></div>`}).join('')
  +(ref!=null&&o.refl?`<div class="tvk"><span>┆ ${o.refl}</span></div>`:'')}

/* cascada: st=[etiqueta,valor,'t'(nivel)|'d'(variación)]; o.z → eje desde 0 */
function tvwf(st,o={}){
 let lv=0;const rs=st.map(([l,v,k])=>{if(k==='t'){lv=v;return{l,v,k:'t',a:null,b:v}}const a=lv;lv+=v;return{l,v,k:'d',a,b:lv}});
 const pts=rs.flatMap(r=>r.a==null?[r.b]:[r.a,r.b]);if(o.z)pts.push(0);
 let lo=Math.min(...pts),hi=Math.max(...pts);if(hi===lo)hi=lo+1;if(!o.z){const p=(hi-lo)*.12;lo-=p;hi+=p}
 const X=v=>(v-lo)/(hi-lo)*100;
 return rs.map(r=>{let l,w,c;if(r.k==='t'){const base=o.z?Math.min(0,r.b):lo;l=X(Math.min(base,r.b));w=Math.abs(X(r.b)-X(base));c='a'}else{l=X(Math.min(r.a,r.b));w=Math.abs(X(r.b)-X(r.a));c=r.v>=0?'c':'r'}
  return`<div class="tvr"><span class="l${r.k==='t'?' t':''}">${tvesc(r.l)}</span><span class="tvt"><i class="tvb ${c}" style="left:${l.toFixed(2)}%;width:${Math.max(w,.8).toFixed(2)}%"></i></span><span class="tvv">${r.k==='t'?tvnf(r.b):tvsg(r.v)}</span></div>`}).join('')
  +(o.z?'':'<div class="tvk"><span>Eje recortado: las barras de nivel no parten de cero, para que se vean las variaciones</span></div>')}

/* composición: una o varias barras apiladas al 100 %; lab=etiquetas de segmentos, rows=[[titulo,[valores]]] */
function tvstack(lab,rows,o={}){

 return rows.map(([t,vs])=>(multi?`<div class="tvpl">${tvesc(t)}</div>`:'')+bar(vs)).join('')
  +tvkey(lab.map((l,i)=>[TVPAL[i%TVPAL.length],tvesc(l)+(multi?'':` <b>${tvnf(rows[0][1][i])}</b> (${tvpc(rows[0][1][i]/(tvsum(rows[0][1])||1),1)})`)]))}

/* cuadrícula de puntos: fracción f de n celdas rellenas (tasas por mil / por cien) */
function tvdots(f,o={}){
 const n=o.n||1000,cols=o.cols||50,k=Math.max(0,Math.min(1,f))*n,full=Math.floor(k),pt=k-full,cw=300/cols,s=cw*.7,rows=Math.ceil(n/cols);

 return`<svg class="tz2" viewBox="0 0 300 ${Math.ceil(rows*cw)}" role="img" aria-label="${tvesc(o.aria||'Rejilla de proporción')}"><path class="d0" d="${B}"/><path class="d1"${o.fill?` style="fill:${o.fill}"`:''} d="${A}"/><path class="d1" style="${o.fill?`fill:${o.fill};`:''}opacity:${pt.toFixed(2)}" d="${C}"/></svg>`}

/* recta numérica con marcadores, referencias y banda; items=[{l,v,c,s}] */
function tvscale(o){
 const its=o.items,rf=o.refs||[],bd=o.band;
 const all=[...its.map(i=>i.v),...rf.map(r=>r.v),...(bd?[bd[0],bd[1]]:[])];

 if(o.min==null||o.max==null){const p=((hi-lo)||Math.abs(hi)||1)*.2;if(o.min==null)lo-=p;if(o.max==null)hi+=p}
 const X=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100)).toFixed(2),f=o.fmt||(v=>tvnf(v));

  +tvkey(its.filter(i=>!i.s).map(i=>[{a:'var(--ac)',c:'var(--info)',b:'var(--c2)',r:'var(--er)',n:'var(--mu)',v:'var(--c3)'}[i.c||'a'],`${tvesc(i.l)} <b>${f(i.v)}</b>`]))}

/* curvas; sr=[{p:[[x,y],…],c:'a'|'b'|'c'}], o.marks=[{x,y,l}], o.ref={y,l}, o.fit → eje y sin forzar el cero */
function tvcurve(sr,o={}){
 const W=300,H=96,pl=6,pr=8,pt=12,pb=16,all=sr.flatMap(s=>s.p);
 let x0=Math.min(...all.map(p=>p[0])),x1=Math.max(...all.map(p=>p[0])),y0=Math.min(...all.map(p=>p[1])),y1=Math.max(...all.map(p=>p[1]));
 if(o.ref){y0=Math.min(y0,o.ref.y);y1=Math.max(y1,o.ref.y)}
 if(!o.fit)y0=Math.min(0,y0);if(y1===y0)y1=y0+1;if(x1===x0)x1=x0+1;
 const X=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr),Y=y=>H-pb-(y-y0)/(y1-y0)*(H-pb-pt),q=v=>v.toFixed(1);
 let s=`<svg class="tz2" viewBox="0 0 ${W} ${H}" role="img" aria-label="${tvesc(o.aria||'Gráfico')}"><line class="ax" x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}"/>`;

 if(o.ref)s+=`<line class="rf" x1="${pl}" x2="${W-pr}" y1="${q(Y(o.ref.y))}" y2="${q(Y(o.ref.y))}"/><text x="${pl+2}" y="${q(Y(o.ref.y)-3)}">${tvesc(o.ref.l)}</text>`;
 sr.forEach(z=>{s+=`<path class="cl ${z.c||'a'}" d="${z.p.map((p,i)=>(i?'L':'M')+q(X(p[0]))+' '+q(Y(p[1]))).join('')}"/>`});
 (o.marks||[]).forEach(m=>{const mx=X(m.x),my=Y(m.y);s+=`<circle class="pt" cx="${q(mx)}" cy="${q(my)}" r="3.6"/>`+(m.l?`<text class="vl" x="${q(mx>W*.6?mx-6:mx+6)}" y="${q(my<pt+8?my+12:my-6)}" text-anchor="${mx>W*.6?'end':'start'}">${tvesc(m.l)}</text>`:'')});

 s+=`<text x="${pl}" y="${H-3}">${f(x0)}</text><text x="${W-pr}" y="${H-3}" text-anchor="end">${f(x1)}</text>`+(o.xt?`<text x="${W/2}" y="${H-3}" text-anchor="middle">${tvesc(o.xt)}</text>`:'');
 return s+'</svg>'}

/* columnas (histograma) con marca vertical opcional; ov=[{ys,cls}] se dibuja encima */
function tvcols(xs,ys,o={}){
 const W=300,H=88,pb=14,pt=10,n=xs.length,bw=(W-8)/n,mx=Math.max(...ys,...(o.ov||[]).flatMap(v=>v.ys),1e-12),Hh=H-pb-pt;

 ys.forEach((v,i)=>{s+=bar(v,i,bw*.8,o.base||'')});(o.ov||[]).forEach(z=>z.ys.forEach((v,i)=>{s+=bar(v,i,bw*.45,z.cls||'o')}));
 const step=n>9?Math.ceil(n/6):1;xs.forEach((x,i)=>{if(i%step===0||i===n-1)s+=`<text x="${(4+i*bw+bw/2).toFixed(1)}" y="${H-3}" text-anchor="middle">${(o.xf||(v=>tvnf(v,1)))(x)}</text>`});
 if(o.mark){const a=xs[0],b=xs[n-1],mxp=4+bw/2+(b===a?0:(o.mark.x-a)/(b-a)*(n-1)*bw);s+=`<line class="mk" x1="${mxp.toFixed(1)}" x2="${mxp.toFixed(1)}" y1="${pt-4}" y2="${H-pb}"/><text class="vl" x="${mxp.toFixed(1)}" y="${pt-5}" text-anchor="${mxp>W*.7?'end':'middle'}">${tvesc(o.mark.l)}</text>`}

/* matriz con color proporcional al valor */
function tvheat(rl,cl,m,o={}){

function tvcombos(N,n){const o=[];(function g(s,c){if(c.length===n){o.push(c.slice());return}for(let i=s;i<=N;i++){c.push(i);g(i+1,c);c.pop()}})(1,[]);return o}

function tvsys(N,k,r,n,P){

 const rs=k<=6?Array.from({length:k},(_,i)=>i+1):[r];
 return rs.map(x=>row(x,x===r)).join('')}

/* ---------- inserción, morfado y refresco en vivo ---------- */
const TVSPEC={};
const tvS=(k,...f)=>{TVSPEC[k]=f};
function tvHtml(){const f=(TVSPEC[cur.tp]||[])[tuI];if(!f)return'';try{return f()}catch(e){if(e===TVBAD)return'<figure class="tv tvn"><figcaption>Escribe valores numéricos en las celdas de este paso para ver el gráfico.</figcaption></figure>';console.error(e);return''}}
function tvMorph(a,b){
 if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
 if(a.nodeType===3){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}

 if(A.length!==B.length){a.innerHTML=b.innerHTML;return}
 A.forEach((x,i)=>tvMorph(x,B[i]))}
function tvHost(){return tuC.querySelector('.rs')}

/* ---------- Pestaña Práctica: comprobador de resultados y hoja para el cuaderno ---------- */
const PR={},prO={tol:.005,hide:true};let prHs=null;

 if(k&&cur&&cur.tp===k&&(s.sd||0)!==(cur.sdv||0)){s.sd=cur.sdv||0;   /* el caso pertenece a la hoja, no a la plantilla */
  if(s.done||Object.keys(s.a).length||Object.keys(s.ok).length||Object.keys(s.v).length){s.a={};s.h={};s.ok={};s.v={};s.q={};s.t={};s.m={};delete s.done;delete s.msg}}
 return s};
const prTx=v=>v instanceof Er?v.e:String(v==null?'':v);
const prAll=r=>tuCells(r).map(a=>{const v=val(a,cur);return typeof v==='number'?tuFm(v):prTx(v)}).join(' · ');
function prChk(i){const T=TUT[cur.tp],s=prS(cur.tp),raw=(s.a[i]||'').trim();if(!raw){delete s.ok[i];return}
 const ex=tuCells(T.p[i][3]).map(a=>val(a,cur)),num=ex.every(v=>typeof v==='number'&&isFinite(v)),
  got=num?raw.split(/[;\s]+/).filter(Boolean).map(x=>+x.replace(/[−–]/g,'-').replace(',','.')):raw.split(';').map(x=>nzU(x.trim()));
 s.ok[i]=got.length===ex.length&&ex.every((v,j)=>num?Math.abs(got[j]-v)<=(v===0?.005:prO.tol*Math.abs(v)):nzU(prTx(v))===got[j])}
function prStep(T,s,i){const[t,f,d,r]=T.p[i],h=s.h[i]||0,n=tuCells(r).length,ok=s.ok[i];
 return`<div class="pq"><h4>Paso ${i+1}${h>0?' · '+t:''}</h4>${h>1?`<code class="fm">${f}</code>`:''}${h>2?`<p class="hn">${d}</p>`:''}<div class="nv"><input data-pq="${i}" value="${tvesc(s.a[i]||'')}" placeholder="${n>1?n+' valores (espacio o ;)':'tu resultado'}" aria-label="Resultado del paso ${i+1}"><button data-pr="c" data-q="${i}">Comprobar</button><button data-pr="h" data-q="${i}">${h<3?'Pista '+(h+1)+'/3':'Ver resultado'}</button></div>${ok===true?'<p class="ok">✓ Correcto</p>':ok===false?'<p class="ko">✗ No coincide: revisa la fórmula o pide una pista.</p>':''}${s.v[i]?`<p class="hn">Resultado: <b>${tvesc(prAll(r))}</b></p>`:''}</div>`}

 ()=>F(B([['1.ª etapa',c('B13'),'b'],['2.ª etapa',c('B14'),'a']],{fmt:fm(0)}),`V̂ = ${nf(c('B15'),0)}; la 1.ª etapa pesa <b>${pc(c('B19'))}</b> del total: ${c('B19')>=.5?'domina la variación entre UPM':'domina la variación de dentro'}.`));

 ()=>F(B(rg('I4:I6').map((v,i)=>['Estrato '+(i+1),v/c('B9'),'b']),{fmt:fm(4)}),`Cada estrato aporta w_h(ȳ_h − ȳ_ds)²/n′: el error de estimar los pesos con una muestra. Suma <b>${nf(c('B13'),4)}</b>.`),
 ()=>F(B([['2.ª fase',c('B12'),'a'],['1.ª fase',c('B13'),'b']],{fmt:fm(4)}),`V̂ = ${nf(c('B14'),4)}; la 1.ª fase pesa <b>${pc(c('B18'))}</b>: ${c('B18')>=.5?'limita más la estimación de los pesos':'limita más la submuestra de la 2.ª fase'}.`));

S('mboot',

const noMas=(t)=>F('',t);

   `Cada grupo suma 5·fx a los hijos acumulados: al acabar la vida fértil una mujer ficticia habría tenido <b>${nf(isf)}</b> hijos (ISF). ${isf<2.1?'Queda por debajo del':'Alcanza el'} nivel de reemplazo (≈ 2,1).`)},
 ()=>{const x=rg('B5:B11'),f=rg('E5:E11'),m=c('B14');
  return F(tvcols(x,f,{mark:{x:m,l:'x̄ = '+nf(m,1)},aria:'Fecundidad por edad con la edad media'}),`La edad media a la maternidad (<b>${nf(m,1)}</b> años) es el centro de gravedad de la curva: cada edad central pesa tanto como su fx.`)},
 ()=>{const t=c('B15');

 ()=>{return F(W([['Población 1 de enero',c('B3'),'t'],['+ Nacimientos',c('B7'),'d'],['− Defunciones',-c('B5'),'d'],['+ Saldo migratorio',c('B14'),'d'],['Población 31 de diciembre',c('B4'),'t']]),

  return F(tvcurve([{p}],{ref:{y:2.1,l:'reemplazo ≈ 2,1'},marks:[{x:p[p.length-1][0],y:p[p.length-1][1],l:nf(isf)+' hijos por mujer'}],xt:'edad de la madre',aria:'Hijos acumulados por mujer'}),`Se acumulan 5·tasa/1.000 en cada grupo: el ISF es el total al final, <b>${nf(isf)}</b> hijos por mujer.`)},
 ()=>{const m=c('B14');
  return F(tvcols(rg('B5:B11'),rg('C5:C11'),{mark:{x:m,l:'x̄ = '+nf(m,1)}}),`Edad media a la maternidad: <b>${nf(m,1)}</b> años, el promedio de los puntos medios ponderado por las tasas.`)},
 ()=>{const isf=c('B13'),t=c('B15');
  return F(tvstack(['Hijas (TBR)','Hijos varones'],[['',[t,isf-t]]]),`De los ${nf(isf)} hijos por mujer, solo <b>${nf(t)}</b> son niñas (100/205 de los nacimientos): la TBR cuenta únicamente hijas.`)},
 ()=>{const t=c('B15'),s=c('B16'),r=c('B17');
  return F(B([['TBR (hijas por mujer)',t,'b'],['TNR = TBR · supervivencia',r,'a']],{ref:1,refl:'1 = reemplazo'}),`Solo el ${pc(s,0)} de las hijas llega a la edad media de maternidad: la TNR es <b>${nf(r)}</b> y la generación ${r<1?'se reduce':'crece'} un ${nf(Math.abs(1-r)*100,1)} %.`)},
 ()=>{const r=c('B19'),T=c('B18'),tn=c('B17');
  const p=Array.from({length:25},(_,i)=>{const t=T*3*i/24;return[t,100*Math.exp(r*t)]});
  return F(tvcurve([{p}],{ref:{y:100,l:'población actual = 100'},marks:[{x:T,y:100*Math.exp(r*T),l:'tras '+nf(T,0)+' años: '+nf(100*tn,1)}],xt:'años',aria:'Evolución con la tasa intrínseca'}),`Con r = ${pc(r,2)} anual, tras una generación (${nf(T,0)} años) la población equivale a <b>${nf(tn*100,1)}</b> si hoy es 100 (= TNR).`)});

S('mig',
 ()=>{return F(W([['Crecimiento natural',c('B11'),'d'],['+ Saldo migratorio residual',c('B12'),'d'],['= Crecimiento total',c('B10'),'t']],{z:1}),`El crecimiento total (<b>${nf(c('B10'),0)}</b>) se descompone en saldo natural y migración.`)},
 ()=>{const tot=c('B10'),nat=c('B11'),r=c('B12');
  return F(W([['Crecimiento total',tot,'t'],['− Crecimiento natural',-nat,'d'],['= Saldo migratorio residual',r,'t']],{z:1}),`Método residual: lo que el saldo natural no explica (<b>${nf(r,0)}</b>) se atribuye a la migración, con todos los errores del censo incluidos.`)},
 ()=>{const a=c('B7'),b=c('B8'),o=c('B13');
  return F(B([['Altas por cambio de residencia',a,'c'],['Bajas',-b,'r'],['Saldo observado',o,'a']]),`Saldo observado = altas − bajas = <b>${nf(o,0)}</b>, medido directamente con los registros de cambios de residencia.`)},
 ()=>{const a=c('B12'),b=c('B13'),d=c('B14');
  return F(B([['Saldo residual',a,'n'],['Saldo observado',b,'a'],['Discrepancia',d,'r']]),`Los dos métodos difieren en <b>${nf(d,0)}</b> personas (error conjunto de los datos): rara vez coinciden.`)},
 ()=>{const i=c('B16'),e=c('B17'),n=c('B18');
  return F(B([['Inmigración (‰)',i,'c'],['Emigración (‰)',-e,'r'],['Migración neta (‰)',n,'a']],{fmt:pm}),`Con población media de ${nf(c('B15'),0)}: entran ${nf(i,1)} y salen ${nf(e,1)} por cada mil habitantes; la tasa neta es <b>${nf(n,1)} ‰</b>.`)},
 ()=>{const v=c('B19');
  return F(tvscale({items:[{l:'Eficacia migratoria',v,c:v<0?'r':'a'}],min:-1,max:1,refs:[{v:0,l:'equilibrio'}],fmt:fm(3)}),`IEM = (altas − bajas) / (altas + bajas) = <b>${nf(v,3)}</b>: el saldo neto equivale a un ${nf(Math.abs(v)*100,1)} % de todos los movimientos (${v>0?'predomina la entrada':v<0?'predomina la salida':'entradas = salidas'}).`)});

S('struc',
 ()=>{const j=c('B3'),a=c('B4'),m=c('B5'),o=c('B6'),ie=c('B12'),so=c('B13');
  return F(tvstack(['Menores de 15','15 a 64','65 a 79','80 y más'],[['',[j,a,m-o,o]]]),`Hay <b>${nf(ie,0)}</b> mayores de 64 por cada 100 menores de 15 (envejecimiento) y los de 80 o más son el <b>${nf(so,1)} %</b> de los mayores (sobreenvejecimiento).`)},
 ()=>{const j=c('B15'),s=c('B16'),t=c('B14');
  return F(B([['Dependencia juvenil (<15)',j,'c'],['Dependencia senil (65+)',s,'b'],['Dependencia total',t,'a']],{fmt:fm(1)}),`Por cada 100 personas de 15 a 64 años hay <b>${nf(t,1)}</b> dependientes: ${nf(j,1)} jóvenes y ${nf(s,1)} mayores.`)},
 ()=>{const p0=c('B7'),pn=c('B8'),T=c('B9'),r=c('B17');
  const e=Array.from({length:21},(_,i)=>{const t=T*i/20;return[t,p0*Math.exp(r*t)]}),l=[[0,p0],[T,pn]];
  return F(tvcurve([{p:e},{p:l,c:'b'}],{fit:1,marks:[{x:T,y:pn,l:nf(pn,0)}],xt:'años',aria:'Crecimiento exponencial'}),`La población pasa de ${nf(p0,0)} a ${nf(pn,0)} en ${nf(T,0)} años: r = ln(Pn/P0)/n = <b>${pc(r,3)}</b> anual (línea continua; discontinua = crecimiento lineal).`)},
 ()=>{const r=c('B17'),T=c('B18');
  if(!(r>0))return noMas('Con r ≤ 0 la población no crece y no llega a duplicarse.');
  const p=Array.from({length:25},(_,i)=>{const t=T*1.3*i/24;return[t,Math.exp(r*t)]});
  return F(tvcurve([{p}],{ref:{y:2,l:'doble de población'},marks:[{x:T,y:2,l:nf(T,0)+' años'}],xt:'años',aria:'Tiempo de duplicación'}),`Con r = ${pc(r,3)} anual la población tardaría <b>${nf(T,1)}</b> años en duplicarse (ln 2 / r).`)},
 ()=>{return F(W([['Población inicial',c('B7'),'t'],['+ Crecimiento natural',c('B10'),'d'],['+ Saldo migratorio',c('B19'),'d'],['Población final',c('B8'),'t']]),`El saldo migratorio del quinquenio es lo que falta para llegar a la población final: <b>${nf(c('B19'),0)}</b>.`)});

S('proy',
 ()=>{const s=c('B11'),a=c('B4'),b=c('B5');
  return F(tvstack(['Sobreviven al siguiente grupo (5L35)','Se pierden por mortalidad'],[['',[b,a-b]]]),`Relación de supervivencia 5S30 = 5L35 / 5L30 = <b>${nf(s,4)}</b>: de cada 100 mujeres del grupo, ${nf(s*100,1)} siguen vivas cinco años después.`)},
 ()=>{const a=c('B3'),s=c('B11'),m=c('B6');
  return F(W([['Mujeres 30-34 al inicio',a,'t'],['× S: pérdida por mortalidad',a*s-a,'d'],['+ saldo migratorio',m,'d'],['Mujeres 35-39 en 5 años',c('B12'),'t']]),`Envejecer la cohorte: ${nf(a,0)} × ${nf(s,4)} + ${nf(m,0)} = <b>${nf(c('B12'),0)}</b> mujeres.`)},
 ()=>{const a=c('B7'),b=c('B8');
  return F(B([['Mujeres 25-29 al inicio',a,'n'],['… al final',b,'n'],['Media del periodo',(a+b)/2,'a']],{fmt:fm(0)}),`Mujeres-año = media × 5 = ${nf(c('B13'),0)}; por la tasa ${nf(c('B9'),3)} salen <b>${nf(c('B14'),0)}</b> nacimientos.`)},
 ()=>{const a=c('B16'),b=c('B17'),t=c('B18'),l=c('B19'),e=c('B20'),r=c('B21');
  const pl=Array.from({length:11},(_,i)=>[i,a+(b-a)*i/10]),pe=Array.from({length:11},(_,i)=>[i,a*Math.exp(r*i)]);
  return F(tvcurve([{p:pl,c:'b'},{p:pe}],{fit:1,marks:[{x:t,y:e,l:'exp. '+nf(e,1)},{x:t,y:l,l:'lin. '+nf(l,1)}],xt:'años',aria:'Interpolación lineal y exponencial'}),`En t = ${nf(t,0)}: lineal = <b>${nf(l,1)}</b> (discontinua) y exponencial = <b>${nf(e,1)}</b>. La exponencial crece a ritmo constante y queda por debajo de la recta entre los dos puntos.`)});

S('hog',
 ()=>{const t=c('B8');
  return F(tvdots(t,{n:100,cols:25,aria:'Tasa de jefatura'}),`De cada 100 personas de este grupo de edad, <b>${nf(t*100,1)}</b> son la persona de referencia de un hogar (tasa de jefatura).`)},
 ()=>{const p=c('B5'),h=c('B9');
  return F(B([['Población proyectada',p,'n'],['Hogares (personas de referencia)',h,'a']],{fmt:fm(0)}),`Hogares proyectados = población × tasa de jefatura: ${nf(p,0)} × ${nf(c('B6'),3)} = <b>${nf(h,0)}</b>.`)},
 ()=>{const a=c('B10')*100,b=c('B11')*100;
  return F(B([['Variación de la población',a,a<0?'r':'c'],['Variación de los hogares',b,b<0?'r':'c']],{fmt:v=>sg(v,2)+' %'}),`La población varía un ${sg(a,2)} % y los hogares un ${sg(b,2)} %: ${Math.abs(a-b)>.01?'no evolucionan igual porque cambia la tasa de jefatura':'evolucionan igual'}.`)},
 ()=>{const a=c('B12'),b=c('B13');
  return F(B([['Tamaño medio actual',a,'n'],['Tamaño medio proyectado',b,'a']],{fmt:v=>nf(v,2)+' pers.'}),`El tamaño medio pasa de <b>${nf(a,2)}</b> a <b>${nf(b,2)}</b> personas por hogar: ${b<a?'hogares más pequeños':'hogares más grandes'}.`)});

S('cen',
 ()=>{return F(W([['Censo',c('B4'),'t'],['+ diferencia',c('B5'),'d'],['Padrón',c('B3'),'t']]),`El padrón supera al censo en <b>${nf(c('B5'),0)}</b> personas.`)},
 ()=>{const a=c('B4'),d=c('B5');
  return F(tvstack(['Población según el censo','Diferencia (exceso del padrón)'],[['',[a,d]]]),`La diferencia es el <b>${pc(c('B6'),2)}</b> del padrón o el <b>${pc(c('B7'),2)}</b> del censo: el porcentaje depende del denominador elegido.`)});

/* ===== Contabilidad nacional ===== */
S('cnpib',null,
 ()=>{return F(W([['VAB total',c('B9'),'t'],['+ Impuestos netos sobre productos',c('B10'),'d'],['= PIB (producción)',c('B11'),'t']],{z:1}),`PIB = Σ VAB + impuestos netos sobre los productos = <b>${nf(c('B11'),0)}</b>.`)},
 ()=>{return F(W([['Consumo final',c('B12'),'t'],['+ Formación bruta de capital',c('B13'),'d'],['+ Exportaciones',c('B14'),'d'],['− Importaciones',-c('B15'),'d'],['= PIB (gasto)',c('B16'),'t']],{z:1}),`PIB = C + FBC + X − M = <b>${nf(c('B16'),0)}</b>.`)},
 ()=>{return F(W([['Remuneración de asalariados',c('B17'),'t'],['+ EEB y renta mixta',c('B18'),'d'],['+ Impuestos netos',c('B19'),'d'],['= PIB (renta)',c('B20'),'t']],{z:1}),`PIB = D.1 + B.2/B.3 + D.2−D.3 = <b>${nf(c('B20'),0)}</b>.`)},
 ()=>{const a=c('B11'),b=c('B16'),r=c('B20');
  return F(B([['Óptica de la producción',a,'a'],['Óptica del gasto',b,'b'],['Óptica de la renta',r,'c']],{fmt:fm(0)}),`${Math.abs(b-a)<1e-9&&Math.abs(r-a)<1e-9?'Las tres ópticas dan el mismo PIB.':`Las ópticas no cuadran: gasto − producción = ${nf(b-a,1)}, renta − producción = ${nf(r-a,1)}. Revisa los datos.`}`)});

S('cnsec',
 ()=>F(W([['PIB',c('B3'),'t'],['+ Rentas primarias netas del resto del mundo',c('B4'),'d'],['= Renta nacional bruta',c('B12'),'t']]),`RNB = PIB + rentas primarias netas = <b>${nf(c('B12'),0)}</b>.`),
 ()=>F(W([['Renta nacional bruta',c('B12'),'t'],['+ Transferencias corrientes netas',c('B5'),'d'],['= Renta disponible bruta',c('B13'),'t']]),`RDB = RNB + transferencias corrientes netas = <b>${nf(c('B13'),0)}</b>.`),
 ()=>F(W([['Renta disponible bruta',c('B13'),'t'],['− Consumo final',-c('B6'),'d'],['= Ahorro bruto',c('B14'),'t']],{z:1}),`Ahorro bruto = RDB − consumo final = <b>${nf(c('B14'),0)}</b> (${pc(c('B14')/c('B13'),1)} de la renta disponible).`),
 ()=>F(W([['Ahorro bruto',c('B14'),'t'],['+ Transferencias de capital netas',c('B7'),'d'],['− Formación bruta de capital',-c('B8'),'d'],['= Capacidad (+) / necesidad (−) de financiación',c('B15'),'t']],{z:1}),`${c('B15')>=0?'Capacidad':'Necesidad'} de financiación: <b>${nf(c('B15'),0)}</b>.`),
 ()=>{const a=c('B15'),b=c('B16');
  return F(B([['Por ahorro e inversión',a,'a'],['Por saldo exterior',b,'b']],{fmt:fm(0)}),`${Math.abs(a-b)<1e-9?'Coinciden: lo que la economía ahorra de más es lo que presta al resto del mundo.':`No coinciden (diferencia ${nf(a-b,1)}): revisa las partidas.`}`)});

S('cnprec',
 ()=>F(W([['Precio básico',c('B3'),'t'],['+ Impuestos netos sobre el producto',c('B4'),'d'],['= Precio de productor',c('B8'),'t']],{z:1}),`Precio de productor = básico + impuestos netos (sin IVA) = <b>${nf(c('B8'),1)}</b>.`),
 ()=>F(W([['Precio de productor',c('B8'),'t'],['+ IVA no deducible',c('B5'),'d'],['+ Márgenes comerciales y de transporte',c('B6'),'d'],['= Precio de adquisición',c('B9'),'t']],{z:1}),`El comprador paga <b>${nf(c('B9'),1)}</b>: ${nf(c('B9')-c('B3'),1)} más que el precio básico.`),
 ()=>F(W([['Producción a precios básicos',c('B11'),'t'],['+ Importaciones',c('B12'),'d'],['+ Impuestos netos sobre productos',c('B13'),'d'],['+ Márgenes comerciales y de transporte',c('B14'),'d'],['= Oferta a precios de adquisición',c('B15'),'t']],{z:1}),`Oferta total = <b>${nf(c('B15'),0)}</b>.`),
 ()=>F(W([['Consumo intermedio',c('B16'),'t'],['+ Consumo final',c('B17'),'d'],['+ Formación bruta de capital',c('B18'),'d'],['+ Exportaciones',c('B19'),'d'],['= Utilización total',c('B20'),'t']],{z:1}),`Utilización total = <b>${nf(c('B20'),0)}</b>.`),
 ()=>{const a=c('B15'),b=c('B20');
  return F(B([['Oferta total',a,'a'],['Utilización total',b,'b']],{fmt:fm(0)}),`${Math.abs(a-b)<1e-9?'Oferta = utilización: el producto está equilibrado.':`Desequilibrio de ${nf(a-b,1)}: la oferta ${a>b?'supera':'queda por debajo de'} la utilización.`}`)});

S('cnidx',
 ()=>{const a=c('B9'),b=c('B10');
  return F(B([['Valor en el año base (Σ p0·q0)',a,'n'],['Valor en el año actual (Σ pt·qt)',b,'a']],{fmt:fm(0)}),`El valor crece un <b>${pc(b/a-1,1)}</b>, pero mezcla subida de precios y cambio de cantidades: por eso hacen falta los índices.`)},
 ()=>{const a=c('B9'),b=dot('C5:C7','D5:D7');
  return F(B([['Cesta base a precios base',a,'n'],['Cesta base a precios actuales',b,'a']],{fmt:fm(0)}),`Laspeyres: ¿cuánto cuesta hoy la cesta de antes? ${nf(b,0)} / ${nf(a,0)} = <b>${nf(c('B11'),4)}</b> (${pc(c('B11')-1,2)} de inflación).`)},
 ()=>{const a=dot('B5:B7','E5:E7'),b=c('B10');
  return F(B([['Cesta actual a precios base',a,'n'],['Cesta actual a precios actuales',b,'a']],{fmt:fm(0)}),`Paasche: ¿cuánto habría costado la cesta de hoy a precios antiguos? ${nf(b,0)} / ${nf(a,0)} = <b>${nf(c('B12'),4)}</b>.`)},
 ()=>{const l=c('B11'),p=c('B12'),f=c('B13');
  return F(tvscale({items:[{l:'Laspeyres',v:l,c:'c'},{l:'Fisher',v:f},{l:'Paasche',v:p,c:'b'}],fmt:fm(4)}),`Fisher es la media geométrica de ambos: queda ${f>=Math.min(l,p)&&f<=Math.max(l,p)?'entre':'fuera de'} Laspeyres y Paasche. Normalmente Laspeyres ≥ Paasche porque la gente sustituye bienes caros.`)},
 ()=>{const n=c('B14')*100,i=(c('B12')-1)*100,r=c('B16')*100;
  return F(B([['Crecimiento nominal',n,'n'],['Inflación (deflactor Paasche)',i,'b'],['Crecimiento real',r,'a']],{fmt:v=>nf(v,2)+' %'}),`Deflactar es dividir: (1 + ${nf(n,2)} %) / (1 + ${nf(i,2)} %) − 1 = <b>${nf(r,2)} %</b>, no ${nf(n,2)} − ${nf(i,2)} = ${nf(n-i,2)}.`)});

S('cnio',null,
 ()=>{const lab=['B9','C9','D9'].map(lb);
  return F(tvheat(['A10','A11','A12'].map(lb),lab,mat('B10:D12',3)),`Cada columna es la «receta» del sector: lo que compra a cada sector por unidad producida. Mayor color = más dependencia (máx. ${nf(Math.max(...rg('B10:D12')),2)}).`)},
 ()=>{const lab=['B14','C14','D14'].map(lb);
  return F(tvheat(['A15','A16','A17'].map(lb),lab,mat('B15:D17',3),{diag:1}),`L = (I − A)⁻¹ recoge efectos <b>directos e indirectos</b>. La diagonal (≥ 1) incluye la propia unidad de demanda final; el resto es el arrastre sobre otros sectores.`)},
 ()=>{const m=rg('B18:D18'),lab=['B14','C14','D14'].map(lb),i=m.indexOf(Math.max(...m));
  return F(B(m.map((v,k)=>[lab[k],v,k===i?'a':'n']),{fmt:fm(2)}),`El multiplicador de ${lab[i]} es el mayor (<b>${nf(m[i],2)}</b>): cada unidad de demanda final en ese sector genera ${nf(m[i],2)} unidades de producción en total.`)},
 ()=>{const rows=[];[0,1,2].forEach(k=>{rows.push([lb('A'+(5+k))+' · hoy',c('F'+(5+k)),'n'],[lb('A'+(5+k))+' · tras el cambio',c('B'+(25+k)),'a'])});
  const d=[0,1,2].map(k=>c('B'+(25+k))-c('F'+(5+k))),i=d.indexOf(Math.max(...d));
  return F(B(rows,{fmt:fm(0)}),`Con la nueva demanda final, el sector que más aumenta su producción es ${lb('A'+(5+i))} (${sg(d[i],0)}), incluyendo el efecto arrastre.`)});

S('cnmed',
 ()=>{const a=c('B4'),b=c('C4');
  return F(B([['Antes',a,'n'],['Después',b,'a']],{fmt:fm(0)}),`${a===b?'La medida no toca la renta primaria (B.5g): actúa después, en la distribución secundaria.':'La renta primaria cambia entre los dos escenarios.'}`)},
 null,null,
 ()=>{const dr=c('C14'),da=c('C15'),dc=c('C10')-c('B10');
  return F(B([['Variación de la renta disponible',dr,'r'],['Variación del consumo final',dc,'b'],['Variación del ahorro bruto',da,'c']],{fmt:fm(1)}),`La renta disponible cae ${nf(Math.abs(dr),1)} y se reparte entre menos consumo (${sg(dc,1)}) y menos ahorro (${sg(da,1)}): con propensión a consumir ${nf(c('B13'),2)}, el ahorro absorbe ${pc(da/dr,0)} de la caída.`)});

S('cnhog',
 ()=>{return F(W([['PIB (gasto)',c('B8'),'t'],['− Impuestos netos sobre los productos',-c('B6'),'d'],['= VAB total',c('B9'),'t']],{z:1})+tvstack(['AA.PP.','Hogares','Sociedades'],[['Reparto del VAB por sector',[c('B10'),c('B11'),c('B12')]]]),`El VAB total (${nf(c('B9'),0)}) se reparte entre sectores; Sociedades sale por diferencia: <b>${nf(c('B12'),0)}</b>.`)},
 ()=>F(W([['VAB de Hogares',c('B11'),'t'],['− Remuneración pagada por Hogares',-c('B18'),'d'],['− Otros impuestos s/ producción',-c('B19'),'d'],['= B.3g Renta mixta',c('B20'),'t']],{z:1}),`La renta mixta es lo que queda del VAB de Hogares tras pagar remuneraciones e impuestos: <b>${nf(c('B20'),0)}</b>.`),
 null,
 ()=>{const a=c('B36'),b=c('B35');
  return F(B([['B.7g − consumo efectivo',a,'a'],['B.8g Ahorro bruto',b,'b']],{fmt:fm(0)}),`${Math.abs(a-b)<1e-9?'La comprobación cuadra: ambas cantidades coinciden.':`No coinciden (${nf(a-b,1)}): revisa transferencias sociales en especie o el consumo.`}`)},
 ()=>F(W([['B.7g AA.PP.',c('B43'),'t'],['− Consumo colectivo',-c('B44'),'d'],['= B.8g Ahorro',c('B47'),'t'],['− FBK',-c('B45'),'d'],['− Transferencias de capital a pagar',-c('B46'),'d'],['= B.9 Capacidad (+) / necesidad (−)',c('B48'),'t']]),`Las AA.PP. ${c('B48')<0?'necesitan financiación':'tienen capacidad de financiación'}: <b>${nf(c('B48'),0)}</b>.`));

S('cndest',

est:{e:'Para comparar la mortalidad de la población A con la de referencia se dispone de una población estándar, de las tasas de mortalidad de referencia por grupo de edad (por mil) y de los efectivos y defunciones observadas de A en cada grupo.',

cnsec:{e:'Partiendo del PIB y de las operaciones con el resto del mundo que figuran en la hoja (rentas primarias y transferencias corrientes netas), junto con el consumo final, las transferencias de capital, la formación bruta de capital y los flujos exteriores, se recorre la secuencia de cuentas hasta el saldo de financiación de la nación.',
